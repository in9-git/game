  header .pill { pointer-events:auto; }
  .pill {

  /* ---------------- hud ---------------- */

    position:absolute; left:0; right:0; z-index:11;

  #courseTag {
    font-size:11px; font-weight:700; letter-spacing:.3px;

  .overlay {

    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    opacity:0; pointer-events:none;

       restarted the course mid-run behind the ending overlay. The 0s delay lets
       the fade finish before the panel is taken out of the page. */
    visibility:hidden;
    transition:opacity .4s ease, visibility 0s linear .4s;

  .cbt { flex:1; min-width:0; }
  /* Name on the first line, one small line under it. The record takes that second
     line rather than adding a third: stacked below the description it cost every
     English card 14px and pushed the course list off a 553px-tall screen, which is
     what an iPhone SE actually shows. Sharing the line instead would have meant
     truncating the description on every English card at the reference size, and a
     course you have already crossed needs no description of what it is like — the
     number you are chasing is the live information. */
  .cbt .n { display:block; font-size:14px; font-weight:800; color:#48596b; letter-spacing:-.2px; }
  .cbt .d { display:block; margin-top:2px; font-size:11px; font-weight:600; color:#93a3b1; }
  /* A locked card has no record and carries a much longer line of text. It keeps
     the original run-on packing: stacking it would cost a third line in English
     and push the list back off that same screen. */
  .card-btn.locked .cbt .n,
  .card-btn.locked .cbt .d { display:inline; }
  .cbk { font-size:15px; color:#a9b7c3; flex:none; }
  .cbdone { font-size:15px; flex:none; }

  .best-note.fresh { color:#b8860f; }
  .foot-note { margin-top:14px; font-size:11px; font-weight:600; color:#a3b1bd; letter-spacing:.2px; }

  @media (max-height:600px) {
    .panel { padding:20px 20px 18px; }

  @media (prefers-reduced-motion: reduce) {

  .ga-vote-btn:active{opacity:1}
  .ga-vote.done .ga-vote-btn{display:none}
</style>

    run: 152,          // ground forward speed (px/s)

    airOpen: 210,      // forward speed, umbrella open (wind push)
    axAir: 700,        // horizontal accel in air

    gOpen: 250,        // gravity, open
    termOpen: 82,      // terminal descent, open

       just 277px of world, and the longest gap is 255px, so the landing platform

  var toastTimer = null;
  var pausedFrom = null;

  function recomputeTotals() {
    var i;
    totalTime = 0; totalDrops = 0;
    for (i = 0; i < 3; i++) { totalTime += courseTime[i]; totalDrops += courseDrops[i]; }
  }
  function resetTotals() {
    courseTime[0] = courseTime[1] = courseTime[2] = 0;
    courseDrops[0] = courseDrops[1] = courseDrops[2] = 0;
    recomputeTotals();
  }

  var player = {
    x: 0, y: 0, vx: 0, vy: 0, grounded: true, plat: null,
    hold: false, canopy: 0, legPhase: 0, tilt: 0, alive: true, drownT: 0, face: 1,
    wallT: 0
  };
  var respawn = { x: 0, y: 0 };
  var parts = [];
  var ripples = [];
  var rainFar = [], rainNear = [];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    var r = cv.getBoundingClientRect();
    CW = Math.max(1, Math.round(r.width));
    CH = Math.max(1, Math.round(r.height));
    cv.width = Math.round(CW * DPR);
    cv.height = Math.round(CH * DPR);
    /* Fit BOTH axes: height gives the designed framing, width guarantees the
       player can actually see where the next platform is. Whichever is tighter
       wins, so a wide screen is unchanged and a narrow one zooms out instead of
       cropping the world horizontally. */
    SCALE = Math.min(CH / PHYS.viewH, CW / PHYS.viewW);
    VW = CW / SCALE;
    VH = CH / SCALE;
    artK = PHYS.viewH / VH;
    /* Zooming out reveals more world height than the art was composed for, and
       where that surplus goes decides the whole composition. Pin the ROOF BAND,
       not the waterline: pinning the water put 100% of the surplus above the
       action, which dropped the player's feet to 84% down the screen under two
       thirds of empty sky. Holding world anchorY at the screen fraction the
       designed framing gives it (455/600 = 75.83% down) reproduces the original
       framing exactly on every device, and the leftover splits itself into a
       little more sky and a readable canal below. */
    camY = PHYS.camY - (VH - PHYS.viewH) * ((PHYS.anchorY - PHYS.camY) / PHYS.viewH);
    buildRain();
  }

  /* The sky, the parallax town and the haze are drawn in SCREEN space but
     composed against the WORLD. While the scale was height-only those two were
     locked together and a plain CH * fraction was a world position by accident;
     once width can win, that accident breaks and the backdrop floats free of the
     playfield. These map a designed fraction of the 600px view back to today's
     screen coordinates — dy for a position, dl for a length. Both reduce to
     CH * f exactly when camY is 45 and SCALE is CH/600, so wide screens are
     untouched. */
  function dy(f) { return (PHYS.camY + f * PHYS.viewH - camY) * SCALE; }
  function dl(f) { return f * PHYS.viewH * SCALE; }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  /* Forward sight is the only thing a phone actually lacks, and buying it with
     zoom costs character size on the very device that needs the character to
     read. Buy it from the anchor instead: hold a constant SIGHT world px ahead of
     the player and slide him left only as far as that requires. A wide screen
     already has more than SIGHT, so it clamps at the designed 34% and is exactly
     as it was. This is an auto-runner — ground speed is always PHYS.run and there
     is no horizontal input — so a constant anchor gives the same look-ahead a
     dynamic camera would, without a frame that slides for no visible reason.
     Snaps and the per-frame follow share one clamp so a course start can't park
     the camera outside the level and pop back on frame two. */
  var SIGHT = 300;      // world px of forward view to hold
  var CAM_LAG = 23;     // how far the follow trails at full glide speed (airOpen / 9)
  /* The floor is what actually binds on a phone: VW is 360 there, so reaching
     SIGHT would want a 0.10 anchor and the clamp caps sight at VW*(1-floor)-LAG.
     Course 3's longest gap is 255, so a 0.18 floor left only 17px of the landing
     perch on screen at the moment you leave the edge — visible, but the whole
     margin is gone the first time a glide lags. 0.15 buys that back to 28px and
     costs nothing anywhere else: character size is set by SCALE, not the anchor.
     The floor cannot go much below this — the only leftward motion in the game is
     the wall push-off (wallBack 95 px/s for wallBackT 0.34s = 32 world px), and
     0.15 keeps 54px of rear view to absorb it. */
  function camAnchor() {
    var a = 1 - (SIGHT + CAM_LAG) / VW;
    return a < 0.15 ? 0.15 : (a > 0.34 ? 0.34 : a);
  }
  function camFollow(x) { return x - VW * camAnchor(); }
  function clampCam(v) {
    var maxCam = course ? Math.max(0, course.endX + 60 - VW) : 0;
    if (v > maxCam) v = maxCam;
    return v < -20 ? -20 : v;
  }

  function buildRain() {
    rainFar = []; rainNear = [];
    var nf = RM ? 30 : 70, nn = RM ? 22 : 52, i;
    for (i = 0; i < nf; i++) rainFar.push({ x: Math.random() * (CW + 120) - 60, y: Math.random() * CH, l: 9 + Math.random() * 9, v: 460 + Math.random() * 160 });
    for (i = 0; i < nn; i++) rainNear.push({ x: Math.random() * (CW + 160) - 80, y: Math.random() * CH, l: 16 + Math.random() * 18, v: 780 + Math.random() * 300 });
  }

  function hsh(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mixc(c1, c2, t) {
    return 'rgb(' + Math.round(lerp(c1[0], c2[0], t)) + ',' + Math.round(lerp(c1[1], c2[1], t)) + ',' + Math.round(lerp(c1[2], c2[2], t)) + ')';
  }

  /* rainy -> sunny sky palettes */
  var SKY_RAIN = [[85, 105, 127], [126, 147, 168], [174, 190, 203]];
  var SKY_SUN  = [[112, 173, 214], [176, 214, 234], [253, 232, 200]];

  var ROOFS = ['#c98b7a', '#7fa8a0', '#9b8aa6', '#b9836f', '#8fa6bd', '#c4a37c'];
  var WALLS = ['#8d99a8', '#96a0ac', '#8492a3', '#9aa3ae'];

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, CH);
    g.addColorStop(0, mixc(SKY_RAIN[0], SKY_SUN[0], sunT));
    /* The pale band is the horizon, so it rides with the world. The endpoints
       stay at 0 and CH — anchoring those too would leave a slab of flat top
       colour above the view instead of a gradient. */
    var mid = dy(0.55) / CH;
    g.addColorStop(mid < 0.08 ? 0.08 : (mid > 0.92 ? 0.92 : mid), mixc(SKY_RAIN[1], SKY_SUN[1], sunT));
    g.addColorStop(1, mixc(SKY_RAIN[2], SKY_SUN[2], sunT));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CW, CH);

    if (sunT > 0.02) {
      var sx = CW * 0.78, sy = dy(0.17), r = dl(0.34);
      var sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
      sg.addColorStop(0, 'rgba(255,244,205,' + (0.62 * sunT).toFixed(3) + ')');
      sg.addColorStop(0.45, 'rgba(255,235,180,' + (0.2 * sunT).toFixed(3) + ')');
      sg.addColorStop(1, 'rgba(255,235,180,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(0, 0, CW, CH);
    }
    /* soft clouds */
    var k, cy = dy(0.14), sp = 300 * artK;
    ctx.save();
    ctx.globalAlpha = 0.2 - 0.09 * sunT;
    ctx.fillStyle = '#ffffff';
    for (k = 0; k < 7; k++) {
      var idx = Math.floor(camX * 0.05 / 300) + k;
      var cxp = (k * sp - (camX * 0.05 * artK) % sp) + hsh(idx) * 90 * artK;
      var rr = dl(0.07 + hsh(idx + 7) * 0.05);
      ctx.beginPath();
      ctx.ellipse(cxp, cy + hsh(idx + 3) * dl(0.09), rr * 2.1, rr, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* one parallax town band drawn in screen space */
  function drawTown(factor, baseYr, hMin, hMax, color, seed, alpha, lit) {
    /* Every length here is authored against the 600px framing, so it all rides
       artK. `off` has to ride it too: shrink the tiles but not the scroll and the
       town swims sideways against the playfield instead of parallaxing with it. */
    var tileW = 190 * artK, off = camX * factor * artK;
    var baseIdx = Math.floor(off / tileW), frac = off - baseIdx * tileW;
    var cols = Math.ceil(CW / tileW) + 2, k;
    var baseY = dy(baseYr);
    ctx.save();
    ctx.globalAlpha = alpha;
    for (k = 0; k < cols; k++) {
      var idx = baseIdx + k + seed;
      var x = -frac + k * tileW;
      var n = 2 + Math.floor(hsh(idx) * 2);
      for (var j = 0; j < n; j++) {
        var h = dl(hMin + hsh(idx * 3 + j) * (hMax - hMin));
        var w = tileW / n * (0.72 + hsh(idx * 5 + j) * 0.3);
        var bx = x + (tileW / n) * j + 4;
        ctx.fillStyle = color;
        ctx.fillRect(bx, baseY - h, w, h + CH);
        /* pitched roof cap */
        ctx.beginPath();
        ctx.moveTo(bx - 4, baseY - h);
        ctx.lineTo(bx + w * 0.5, baseY - h - dl(0.028));
        ctx.lineTo(bx + w + 4, baseY - h);
        ctx.closePath();
        ctx.fill();
        if (lit) {
          ctx.fillStyle = 'rgba(255,224,168,' + (0.5 * (1 - sunT * 0.8)).toFixed(3) + ')';
          for (var wy = 0; wy < 3; wy++) for (var wx = 0; wx < 2; wx++) {
            if (hsh(idx * 11 + j * 7 + wy * 3 + wx) < 0.42) {
              ctx.fillRect(bx + w * (0.22 + wx * 0.4), baseY - h + dl(0.035 + wy * 0.045), w * 0.18, dl(0.026));
            }
          }
        }
      }
    }
    ctx.restore();
  }

  function drawBackdrop() {
    drawTown(0.13, 0.80, 0.10, 0.20, mixc([116, 138, 158], [150, 186, 208], sunT), 0, 0.38, false);
    drawTown(0.30, 0.86, 0.14, 0.26, mixc([94, 116, 137], [124, 158, 182], sunT), 40, 0.55, false);
    drawTown(0.55, 0.93, 0.18, 0.31, mixc([76, 95, 114], [102, 132, 156], sunT), 90, 0.7, true);
    /* haze between backdrop and playfield */
    /* The ramp is an atmospheric depth cue, so it belongs to the world too — screen
       pinned, it ramps over an arbitrary depth and over-applies on a tall phone.
       Canvas clamps a linear gradient to its end colours beyond the span, so it
       stays clear above dy(0.5) and holds below dy(1) without any extra fill. */
    var g = ctx.createLinearGradient(0, dy(0.5), 0, dy(1));
    g.addColorStop(0, 'rgba(196,212,224,0)');
    g.addColorStop(1, 'rgba(196,212,224,' + (0.3 - 0.12 * sunT).toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CW, CH);
  }

  function drawRain(list, w, alpha, slant) {
    if (sunT > 0.85) return;
    ctx.save();
    ctx.globalAlpha = alpha * (1 - sunT);
    ctx.strokeStyle = '#e8f1f7';
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.beginPath();
    /* Rain sits between the camera and the world. Left screen-sized while the
       world shrinks you get giant streaks over a miniature town and the near
       layer stops reading as being in front of the rooftops. Scaled here rather
       than in buildRain so a resize needs no rebuild. */
    for (var i = 0; i < list.length; i++) {
      var d = list[i], L = d.l * artK;
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - slant * L, d.y + L);
    }
    ctx.stroke();
    ctx.restore();
  }

  function updateRain(list, dt, slant) {
    for (var i = 0; i < list.length; i++) {
      var d = list[i], V = d.v * artK;
      d.y += V * dt;
      d.x -= V * dt * slant * 0.34;
      if (d.y > CH + 20) { d.y = -30 - Math.random() * 60; d.x = Math.random() * (CW + 200) - 40; }
      if (d.x < -90) d.x += CW + 180;
    }
  }

  /* ==================== world rendering ==================== */
  function worldTransform() {
    /* shake is authored in screen px of the designed framing but applied as a
       world offset, so the zoom has to be divided back out — otherwise a phone
       gets a two-thirds-strength jolt on the drown that is meant to sell the miss. */
    var amp = shake > 0 ? shake / artK : 0;
    var sx = amp ? (Math.random() - 0.5) * amp : 0;
    var sy = amp ? (Math.random() - 0.5) * amp : 0;
    ctx.setTransform(DPR * SCALE, 0, 0, DPR * SCALE, (-camX + sx) * DPR * SCALE, (-camY + sy) * DPR * SCALE);
  }
  function screenTransform() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }

  function rrect(x, y, w, h, r) {
    var m = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + m, y);
    ctx.arcTo(x + w, y, x + w, y + h, m);
    ctx.arcTo(x + w, y + h, x, y + h, m);
    ctx.arcTo(x, y + h, x, y, m);
    ctx.arcTo(x, y, x + w, y, m);
    ctx.closePath();
  }

  function drawWater(t) {
    var wy = PHYS.waterY, x0 = camX - 40, x1 = camX + VW + 40;
    /* The view can now sit lower than the 600px designed framing, so the canal has
       to reach the bottom of whatever is visible instead of a fixed 100px slab —
       otherwise the sky gradient shows through underneath the water. */
    var depth = Math.max(110, camY + VH - wy + 24);
    var g = ctx.createLinearGradient(0, wy, 0, wy + depth * 0.92);
    g.addColorStop(0, mixc([94, 124, 148], [124, 166, 192], sunT));
    g.addColorStop(1, mixc([58, 82, 104], [78, 116, 142], sunT));
    ctx.fillStyle = g;
    ctx.fillRect(x0, wy, x1 - x0, depth);
    /* shimmer */
    ctx.save();
    ctx.globalAlpha = 0.16 + 0.14 * sunT;
    ctx.strokeStyle = '#eaf4fa';
    ctx.lineWidth = 1.6;
    for (var i = 0; i < 26; i++) {
      var sxp = x0 + ((i * 137.4 + t * 9) % (x1 - x0 + 200)) - 100;
      var sy = wy + 8 + (i % 5) * 13;
      ctx.beginPath();
      ctx.moveTo(sxp, sy);
      ctx.lineTo(sxp + 22 + (i % 3) * 12, sy);
      ctx.stroke();
    }
    ctx.restore();
    /* rain dimples on the water */
    if (sunT < 0.8) {
      ctx.save();
      ctx.globalAlpha = 0.22 * (1 - sunT);
      ctx.strokeStyle = '#dfeef7';
      ctx.lineWidth = 1.3;
      for (var k = 0; k < 16; k++) {
        var ph = (t * 1.4 + k * 0.37) % 1;
        var dx = x0 + hsh(k + Math.floor(t * 1.4 + k * 0.37)) * (x1 - x0);
        var dy = wy + 6 + hsh(k * 3) * 60;
        ctx.beginPath();
        ctx.ellipse(dx, dy, 3 + ph * 13, (3 + ph * 13) * 0.32, 0, 0, Math.PI * 2);
        ctx.globalAlpha = 0.28 * (1 - ph) * (1 - sunT);
        ctx.stroke();
      }
      ctx.restore();
    }
    /* ripple rings from splashes */
    for (var r = 0; r < ripples.length; r++) {
      var rp = ripples[r];
      ctx.save();
      ctx.globalAlpha = Math.max(0, rp.life / rp.max) * 0.6;
      ctx.strokeStyle = '#eef7fc';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.3, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawPlatform(p, t) {
    var wy = PHYS.waterY;
    var roof = ROOFS[Math.floor(hsh(p.i * 7 + courseIdx * 13) * ROOFS.length)];
    var wall = WALLS[Math.floor(hsh(p.i * 5 + 2) * WALLS.length)];

    if (p.t === 0 || p.t === 1) {
      var inset = p.t === 1 ? 16 : 0;
      var bx = p.x + inset, bw = p.w - inset * 2;
      /* building body */
      var g = ctx.createLinearGradient(bx, p.y, bx, wy + 60);
      g.addColorStop(0, wall);
      g.addColorStop(1, mixc([72, 86, 100], [96, 116, 132], sunT));
      ctx.fillStyle = g;
      ctx.fillRect(bx, p.y + 6, bw, wy + 60 - p.y);
      /* wet sheen down the face */
      ctx.save();
      ctx.globalAlpha = 0.13;
      ctx.fillStyle = '#dceaf3';
      ctx.fillRect(bx, p.y + 6, bw * 0.22, wy + 60 - p.y);
      ctx.restore();
      /* windows */
      var rows = Math.floor((wy - p.y) / 46), cols = Math.max(1, Math.floor(bw / 44));
      for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
        var h4 = hsh(p.i * 31 + r * 7 + c * 3);
        if (h4 < 0.28) continue;
        var wx = bx + 12 + c * (bw - 20) / cols, wyy = p.y + 26 + r * 46;
        var lit = h4 > 0.62;
        ctx.fillStyle = lit ? 'rgba(255,220,158,' + (0.85 - 0.35 * sunT) + ')' : 'rgba(70,88,106,.55)';
        rrect(wx, wyy, Math.min(20, (bw - 20) / cols - 6), 24, 4);
        ctx.fill();
        if (lit) {
          ctx.save();
          ctx.globalAlpha = 0.22 * (1 - sunT * 0.6);
          ctx.fillStyle = '#ffd48a';
          ctx.beginPath();
          ctx.ellipse(wx + 10, wyy + 12, 22, 20, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
      if (p.t === 0) {
        /* pitched roof cap — flat top exactly matches the collision surface */
        ctx.fillStyle = roof;
        ctx.beginPath();
        ctx.moveTo(p.x - 13, p.y + 17);
        ctx.lineTo(p.x, p.y);
        ctx.lineTo(p.x + p.w, p.y);
        ctx.lineTo(p.x + p.w + 13, p.y + 17);
        ctx.closePath();
        ctx.fill();
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = '#3f4d5c';
        ctx.lineWidth = 1;
        for (var tl = 26; tl < p.w; tl += 26) {
          ctx.beginPath();
          ctx.moveTo(p.x + tl, p.y + 1);
          ctx.lineTo(p.x + tl, p.y + 15);
          ctx.stroke();
        }
        ctx.restore();
        ctx.fillStyle = 'rgba(255,255,255,.4)';
        ctx.fillRect(p.x, p.y, p.w, 2.5);
      } else {
        /* striped awning */
        var stripes = Math.max(3, Math.round(p.w / 26));
        for (var s = 0; s < stripes; s++) {
          var sw = p.w / stripes, sx0 = p.x + s * sw;
          ctx.fillStyle = (s % 2 === 0) ? roof : '#f6efe0';
          ctx.beginPath();
          ctx.moveTo(sx0, p.y);
          ctx.lineTo(sx0 + sw, p.y);
          ctx.lineTo(sx0 + sw, p.y + 15);
          ctx.quadraticCurveTo(sx0 + sw * 0.5, p.y + 24, sx0, p.y + 15);
          ctx.closePath();
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,255,255,.45)';
        ctx.fillRect(p.x, p.y, p.w, 2.5);
        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = '#2f3d4d';
        ctx.fillRect(p.x, p.y + 20, p.w, 4);
        ctx.restore();
      }
      /* drips off the eave */
      if (sunT < 0.7) {
        ctx.save();
        ctx.globalAlpha = 0.5 * (1 - sunT);
        ctx.strokeStyle = '#dcecf6';
        ctx.lineWidth = 1.6;
        for (var d = 0; d < 3; d++) {
          var dx = p.x + p.w * (0.2 + d * 0.3);
          var dph = ((t * 0.9 + d * 0.33 + p.i * 0.17) % 1);
          var dy = p.y + 20 + dph * 42;
          ctx.beginPath();
          ctx.moveTo(dx, dy);
          ctx.lineTo(dx, dy + 7);
          ctx.stroke();
        }
        ctx.restore();
      }
    } else if (p.t === 2) {
      /* utility poles + power line */
      ctx.fillStyle = mixc([88, 74, 66], [116, 100, 88], sunT);
      ctx.fillRect(p.x + 3, p.y + 3, 9, wy + 40 - p.y);
      ctx.fillRect(p.x + p.w - 12, p.y + 3, 9, wy + 40 - p.y);
      ctx.fillStyle = mixc([102, 86, 76], [128, 112, 98], sunT);
      ctx.fillRect(p.x - 4, p.y + 18, 24, 5);
      ctx.fillRect(p.x + p.w - 20, p.y + 18, 24, 5);
      /* the cable itself */
      ctx.strokeStyle = '#3e4a58';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y + 2);
      ctx.lineTo(p.x + p.w, p.y + 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(226,240,248,.5)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(p.x + 2, p.y + 0.5);
      ctx.lineTo(p.x + p.w - 2, p.y + 0.5);
      ctx.stroke();
      /* droplets hanging from the wire */
      ctx.fillStyle = 'rgba(222,238,248,.75)';
      for (var q = 0; q < 5; q++) {
        var qx = p.x + 14 + q * (p.w - 28) / 4;
        var bob = Math.sin(t * 2 + q + p.i) * 1.2;
        ctx.beginPath();
        ctx.ellipse(qx, p.y + 7 + bob, 2, 3.2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      /* tree branch */
      var leafA = mixc([104, 138, 106], [126, 168, 116], sunT);
      var leafB = mixc([80, 116, 92], [104, 146, 102], sunT);
      ctx.save();
      ctx.globalAlpha = 0.95;
      for (var lf = 0; lf < 7; lf++) {
        var lx = p.x - 6 + hsh(p.i * 9 + lf) * (p.w + 12);
        var ly = p.y + 14 + hsh(p.i * 13 + lf) * 26;
        var lr = 15 + hsh(p.i * 17 + lf) * 15;
        ctx.fillStyle = (lf % 2) ? leafA : leafB;
        ctx.beginPath();
        ctx.ellipse(lx, ly, lr, lr * 0.66, hsh(p.i + lf) * 1.2 - 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      /* limb, flat on top */
      ctx.fillStyle = mixc([112, 88, 70], [138, 112, 88], sunT);
      ctx.beginPath();
      ctx.moveTo(p.x - 10, p.y + 1);
      ctx.lineTo(p.x + p.w + 6, p.y);
      ctx.lineTo(p.x + p.w + 6, p.y + 7);
      ctx.lineTo(p.x - 10, p.y + 12);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,246,228,.3)';
      ctx.fillRect(p.x, p.y, p.w, 2);
      /* a couple of leaves above so it reads as foliage */
      ctx.save();
      ctx.globalAlpha = 0.9;
      for (var lu = 0; lu < 3; lu++) {
        var ux = p.x + 12 + hsh(p.i * 23 + lu) * (p.w - 24);
        ctx.fillStyle = lu % 2 ? leafA : leafB;
        ctx.beginPath();
        ctx.ellipse(ux, p.y - 9 - hsh(p.i + lu * 5) * 7, 13, 8, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    /* checkpoint lantern */
    if (p.cp) {
      var cx = p.x + 26, cy = p.y;
      ctx.strokeStyle = '#5c6b7a';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx, cy - 30);
      ctx.stroke();
      var glow = 0.55 + Math.sin(t * 2.2 + p.i) * 0.16;
      ctx.save();
      ctx.globalAlpha = glow * 0.5;
      ctx.fillStyle = '#ffd98c';
      ctx.beginPath();
      ctx.arc(cx + 7, cy - 30, 17, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#fff0bd';
      rrect(cx + 1, cy - 37, 13, 15, 4);
      ctx.fill();
      ctx.strokeStyle = '#c9a24c';
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  }

  function drawPuddles(t) {
    for (var i = 0; i < course.gaps.length; i++) {
      var g = course.gaps[i];
      if (g.x2 < camX - 80 || g.x1 > camX + VW + 80) continue;
      var cx = (g.x1 + g.x2) / 2, rw = (g.x2 - g.x1) / 2 + 6;
      var grd = ctx.createLinearGradient(0, PHYS.waterY - 4, 0, PHYS.waterY + 22);
      grd.addColorStop(0, mixc([150, 182, 202], [186, 218, 236], sunT));
      grd.addColorStop(1, mixc([96, 128, 152], [128, 172, 198], sunT));
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.ellipse(cx, PHYS.waterY + 6, rw, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = '#f0f8fc';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(cx + Math.sin(t + i) * 5, PHYS.waterY + 3, rw * 0.55, 6, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawDrops(t) {
    for (var i = 0; i < course.drops.length; i++) {
      var d = course.drops[i];
      if (d.got || d.x < camX - 40 || d.x > camX + VW + 40) continue;
      var bob = Math.sin(t * 2.6 + i * 0.9) * 2.6;
      ctx.save();
      ctx.translate(d.x, d.y + bob);
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = '#dff2fb';
      ctx.beginPath();
      ctx.arc(0, 0, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      var dg = ctx.createLinearGradient(0, -9, 0, 7);
      dg.addColorStop(0, '#ffffff');
      dg.addColorStop(0.5, '#cfeaf8');
      dg.addColorStop(1, '#8fc4e0');
      ctx.fillStyle = dg;
      ctx.beginPath();
      ctx.moveTo(0, -9);
      ctx.bezierCurveTo(5.5, -2.5, 6.5, 1.5, 6.5, 3.2);
      ctx.arc(0, 3.2, 6.5, 0, Math.PI);
      ctx.bezierCurveTo(-6.5, 1.5, -5.5, -2.5, 0, -9);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath();
      ctx.ellipse(-2, 1, 1.7, 2.6, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawFlag(t) {
    var fx = course.goalX, last = course.plats[course.plats.length - 1];
    var fy = last.y;
    ctx.strokeStyle = '#efe6d2';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx, fy - 76);
    ctx.stroke();
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath();
    ctx.moveTo(fx + 2, fy - 76);
    for (var i = 0; i <= 8; i++) {
      var f = i / 8;
      ctx.lineTo(fx + 2 + f * 44, fy - 74 + Math.sin(t * 4 + f * 3.4) * 4 * f + f * 8);
    }
    for (var j = 8; j >= 0; j--) {
      var f2 = j / 8;
      ctx.lineTo(fx + 2 + f2 * 44, fy - 74 + Math.sin(t * 4 + f2 * 3.4) * 4 * f2 + f2 * 8 + 26);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff4c9';
    ctx.beginPath();
    ctx.arc(fx, fy - 78, 4.5, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ---------- the character ---------- */
  function drawPlayer(t) {
    var p = player;
    if (!p.alive && p.drownT > 0.45) return;
    var open = p.canopy;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.tilt);
    var bounce = p.grounded ? Math.abs(Math.sin(p.legPhase)) * 1.6 : 0;

    /* legs */
    ctx.strokeStyle = '#2b3546';
    ctx.lineWidth = 4.4;
    ctx.lineCap = 'round';
    var l1, l2;
    if (p.grounded) { l1 = Math.sin(p.legPhase) * 6.5; l2 = -Math.sin(p.legPhase) * 6.5; }
    else if (open > 0.5) { l1 = 2.5 + Math.sin(t * 3) * 1.6; l2 = -1.5 + Math.sin(t * 3 + 1) * 1.6; }
    else { l1 = -3; l2 = 1.5; }
    ctx.beginPath();
    ctx.moveTo(-1.5, -13 - bounce); ctx.lineTo(l1, -1 - bounce);
    ctx.moveTo(1.5, -13 - bounce); ctx.lineTo(l2, -1 - bounce);
    ctx.stroke();
    /* boots */
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.ellipse(l1 + 1, -1 - bounce, 4.2, 2.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(l2 + 1, -1 - bounce, 4.2, 2.8, 0, 0, Math.PI * 2); ctx.fill();

    /* raincoat */
    var cg = ctx.createLinearGradient(0, -34, 0, -10);
    cg.addColorStop(0, '#556c88');
    cg.addColorStop(1, '#3d4e66');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(-6.5, -33 - bounce);
    ctx.quadraticCurveTo(-10.5, -20 - bounce, -9.5, -11 - bounce);
    ctx.quadraticCurveTo(0, -8.5 - bounce, 9.5, -11 - bounce);
    ctx.quadraticCurveTo(10.5, -20 - bounce, 6.5, -33 - bounce);
    ctx.closePath();
    ctx.fill();
    /* coat highlight */
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.beginPath();
    ctx.ellipse(-4, -22 - bounce, 2.6, 8, 0.15, 0, Math.PI * 2);
    ctx.fill();

    /* head + hood */
    ctx.fillStyle = '#f2d3ba';
    ctx.beginPath();
    ctx.arc(1.5, -38 - bounce, 6.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4a5e79';
    ctx.beginPath();
    ctx.arc(0, -39.5 - bounce, 7.6, Math.PI * 0.86, Math.PI * 2.16);
    ctx.closePath();
    ctx.fill();
    /* face */
    ctx.fillStyle = '#3d4a5c';
    ctx.beginPath(); ctx.arc(4.2, -38.4 - bounce, 1.05, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0.4, -38.4 - bounce, 1.05, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#e79a94';
    ctx.beginPath(); ctx.ellipse(5.6, -35.6 - bounce, 2, 1.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    /* arm reaching up to the handle */
    ctx.strokeStyle = '#4a5e79';
    ctx.lineWidth = 3.6;
    ctx.beginPath();
    ctx.moveTo(3, -30 - bounce);
    ctx.lineTo(7 + open * 1.5, -44 - bounce - open * 4);
    ctx.stroke();

    drawUmbrella(open, bounce, t);
    ctx.restore();
  }

  function drawUmbrella(open, bounce, t) {
    var hx = 7, hy = -46 - bounce;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(-0.08 + (1 - open) * 0.5);

    /* shaft */
    ctx.strokeStyle = '#8a6f52';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 12);
    ctx.lineTo(0, -20 - open * 8);
    ctx.stroke();
    /* hook handle */
    ctx.strokeStyle = '#6f5942';
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.arc(-3.2, 12, 3.2, -0.3, Math.PI * 0.95);
    ctx.stroke();

    if (open < 0.06) {
      /* folded */
      ctx.fillStyle = '#f5c518';
      rrect(-2.6, -22, 5.2, 20, 2.6);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      rrect(-1.4, -21, 1.6, 18, 1);
      ctx.fill();
      ctx.restore();
      return;
    }

    var R = 8 + open * 21, H = (12 + open * 18);
    var top = -20 - open * 8;
    /* canopy shadow */
    ctx.save();
    ctx.globalAlpha = 0.16 * open;
    ctx.fillStyle = '#243244';
    ctx.beginPath();
    ctx.ellipse(1.5, top + H + 2, R * 0.96, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    /* scalloped canopy */
    var flap = Math.sin(t * 7) * 1.5 * open;
    var g = ctx.createLinearGradient(-R, top, R, top + H);
    g.addColorStop(0, '#fff0a8');
    g.addColorStop(0.42, '#ffd23f');
    g.addColorStop(1, '#f0b21c');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-R, top + H);
    ctx.bezierCurveTo(-R * 0.95, top + H * 0.1, -R * 0.42, top, 0, top - 1);
    ctx.bezierCurveTo(R * 0.42, top, R * 0.95, top + H * 0.1, R, top + H);
    var seg = 4;
    for (var i = seg; i >= 1; i--) {
      var xa = -R + (2 * R) * (i / seg), xb = -R + (2 * R) * ((i - 1) / seg);
      var mid = (xa + xb) / 2;
      ctx.quadraticCurveTo(mid, top + H + 6 + flap, xb, top + H);
    }
    ctx.closePath();
    ctx.fill();
    /* ribs */
    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = '#b8830c';
    ctx.lineWidth = 1;
    for (var k = 1; k < seg; k++) {
      var rx = -R + (2 * R) * (k / seg);
      ctx.beginPath();
      ctx.moveTo(0, top - 0.5);
      ctx.lineTo(rx, top + H);
      ctx.stroke();
    }
    ctx.restore();
    /* rim highlight + finial */
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-R * 0.9, top + H * 0.35);
    ctx.bezierCurveTo(-R * 0.5, top + 1, -R * 0.2, top - 0.5, 0, top - 0.5);
    ctx.stroke();
    ctx.fillStyle = '#fff6cf';
    ctx.beginPath();
    ctx.arc(0, top - 2.5, 2, 0, Math.PI * 2);
    ctx.fill();

    /* rain bouncing off the canopy */
    if (open > 0.55 && sunT < 0.7 && !RM) {
      ctx.save();
      ctx.globalAlpha = 0.6 * (1 - sunT);
      ctx.strokeStyle = '#eaf6fd';
      ctx.lineWidth = 1.2;
      for (var d = 0; d < 4; d++) {
        var ph = ((t * 2.2 + d * 0.25) % 1);
        var side = d % 2 ? 1 : -1;
        var px = side * (R * 0.75 + ph * 9);
        var py = top + H + ph * 13;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + side * 3, py + 5);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  /* ---------- particles ---------- */
  function spawn(x, y, n, kind) {
    if (RM) n = Math.max(2, Math.round(n * 0.4));
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = Math.random();
      parts.push({
        x: x, y: y, kind: kind,
        vx: kind === 'splash' ? (Math.random() - 0.5) * 240 : Math.cos(a) * 70 * sp + 30,
        vy: kind === 'splash' ? -120 - Math.random() * 220 : -Math.random() * 70 - 10,
        life: 0.5 + Math.random() * 0.5, max: 1,
        r: kind === 'sparkle' ? 2 + Math.random() * 2.5 : 1.8 + Math.random() * 3
      });
      parts[parts.length - 1].max = parts[parts.length - 1].life;
    }
    if (parts.length > 240) parts.splice(0, parts.length - 240);
  }
  function drawParts() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i], a = Math.max(0, p.life / p.max);
      ctx.save();
      ctx.globalAlpha = a;
      if (p.kind === 'sparkle') {
        ctx.fillStyle = '#fff3bd';
        ctx.shadowColor = 'rgba(255,225,140,.9)';
        /* shadowBlur is not transformed by the CTM, so it is a screen quantity
           even though it is set inside the world transform — without artK the
           halo ends up bigger than the drop it belongs to on a zoomed-out phone. */
        ctx.shadowBlur = 8 * artK;
      } else if (p.kind === 'splash') ctx.fillStyle = '#dff0fa';
      else ctx.fillStyle = 'rgba(226,236,244,.9)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.6), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
  function updateParts(dt) {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += (p.kind === 'sparkle' ? 90 : 620) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (var r = ripples.length - 1; r >= 0; r--) {
      var rp = ripples[r];
      rp.life -= dt;
      rp.r += 62 * dt;
      if (rp.life <= 0) ripples.splice(r, 1);
    }
  }

  function drawRainbow(a) {
    if (a <= 0) return;
    /* Anchored to the horizon, not the canvas: screen-pinned, the arc's feet land
       in the middle of the canal once the water is a tenth of the screen. */
    var cx = CW * 0.5, cy = dy(1.02), R0 = Math.min(CW, dl(1)) * 0.62;
    var cols = ['#ff8f8f', '#ffbe72', '#ffe680', '#a8e0a0', '#8fd0e8', '#9aaee8', '#c69ae0'];
    ctx.save();
    ctx.globalAlpha = 0.55 * a;
    ctx.lineWidth = Math.max(7, R0 * 0.055);
    for (var i = 0; i < cols.length; i++) {
      ctx.strokeStyle = cols[i];
      ctx.beginPath();
      ctx.arc(cx, cy, R0 - i * ctx.lineWidth * 0.92, Math.PI * 1.06, Math.PI * 1.94);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ==================== gameplay ==================== */
  function platAt(x) {
    var ps = course.plats, lo = 0, hi = ps.length - 1;
    while (lo <= hi) {
      var m = (lo + hi) >> 1, p = ps[m];
      if (x < p.x) hi = m - 1;
      else if (x > p.x + p.w) lo = m + 1;
      else return p;
    }
    return null;
  }

  function startCourse(idx) {
    courseIdx = idx;
    course = buildCourse(RAW[idx]);
    player.x = course.startX;
    player.y = course.startY;
    player.vx = PHYS.run;
    player.vy = 0;
    player.grounded = true;
    player.plat = course.plats[0];
    player.hold = false;
    player.canopy = 0;
    player.tilt = 0;
    player.alive = true;
    player.drownT = 0;
    player.wallT = 0;
    respawn.x = course.startX;
    respawn.y = course.startY;
    drops = 0; runTime = 0; clearAnim = 0; endAnim = 0;
    parts.length = 0; ripples.length = 0;
    /* Whatever was left in the fixed-step accumulator belongs to the course we
       just left — spending it here would run the new course's first frame with a
       stranger's leftover time. */
    acc = 0;
    camX = clampCam(camFollow(player.x));
    sunT = 0;
    pausedFrom = null;
    mode = 'play';
    /* Wash in from the transition colour so a course change is a beat, not a cut. */
    fade = RM ? 0 : 1;
    $('hud').classList.add('on');
    $('courseTag').textContent = T().cn[idx];
    updateHud();
    showToast('tip', 2600);
    gaRoundStart('course' + (idx + 1));
  }

  function land(p) {
    player.grounded = true;
    player.plat = p;
    player.y = p.y;
    player.vy = 0;
    player.wallT = 0;   // a leftover push-off would shove you backwards off the next edge
    spawn(player.x, player.y, 6, 'dust');
    sndLand();
    if (p.cp && (respawn.x !== p.x + 40 || respawn.y !== p.y)) {
      respawn.x = p.x + 40;
      respawn.y = p.y;
      sndCheck();
      showToast('cpToast', 1500);
      spawn(p.x + 26, p.y - 34, 10, 'sparkle');
    }
  }

  function drown() {
    player.alive = false;
    player.drownT = 0;
    spawn(player.x, PHYS.waterY, 18, 'splash');
    ripples.push({ x: player.x, y: PHYS.waterY + 5, r: 6, life: 0.9, max: 0.9 });
    ripples.push({ x: player.x, y: PHYS.waterY + 5, r: 2, life: 1.2, max: 1.2 });
    if (!RM) shake = 5;
    sndSplash();
  }

  function revive() {
    player.x = respawn.x;
    player.y = respawn.y;
    player.vx = PHYS.run;
    player.vy = 0;
    player.grounded = true;
    player.plat = platAt(respawn.x);
    player.alive = true;
    player.drownT = 0;
    player.wallT = 0;
    player.tilt = 0;
    /* Start the new life on a clean step boundary rather than on the fraction of
       a substep that was still owed when we hit the water. */
    acc = 0;
    camX = clampCam(camFollow(player.x));
    spawn(player.x, player.y, 8, 'dust');
  }

  /* Side collision. Landing alone used to be the whole story, so a jump that came
     up short slid straight through the brickwork and kept gliding inside the
     building until it drowned — with the splash bursting on the wall, where there
     is no water. Three outcomes, in order of kindness:
       · within `grab` of the eave — you catch it and climb up, the run continues.
         The roof cap and the awning cloth both overhang, so standing here reads.
       · still rising — ride the face upward; you may yet clear the top, and a
         push-off would rob you of a jump you were about to make.
       · anything lower — bounce back into the alley. The push-off matters: pinned
         against the wall you would drown on the building's face, and you would
         also grind forward against it forever as the wind kept pushing.
     Returns true when the step is finished (we landed). */
  function hitWall(prevFront) {
    var p = player, front = p.x + PHYS.bodyR;
    var lp = platAt(front);
    if (!lp) return false;
    var b = bodyOf(lp);
    if (!b || front <= b.x1 || prevFront > b.x1) return false;
    if (p.y <= lp.y) return false;                  // above the roofline — open air, not wall
    if (p.y - lp.y <= PHYS.grab) { land(lp); return true; }
    p.x = b.x1 - PHYS.bodyR;                        // never inside the geometry
    if (p.vy < 0) return false;
    p.vx = -PHYS.wallBack;
    p.wallT = PHYS.wallBackT;
    if (!RM) shake = 2.5;
    sndBump();
    return false;
  }

  function physTick(h) {
    var p = player;
    if (!p.alive) return;

    if (p.grounded) {
      var d = PHYS.run - p.vx, a = PHYS.axGround * h;
      p.vx += (d > a) ? a : (d < -a ? -a : d);
      p.x += p.vx * h;
      p.legPhase += p.vx * h * 0.38;
      var pl = p.plat;
      if (!pl || p.x > pl.x + pl.w) {
        p.grounded = false;
        p.plat = null;
        p.vy = -PHYS.hop;
        sndHop();
        spawn(p.x, p.y, 4, 'dust');
      } else {
        p.y = pl.y;
      }
    } else {
      var prevY = p.y, prevFront = p.x + PHYS.bodyR;
      if (p.wallT > 0) {
        /* Hold the push-off for a moment instead of letting the wind win it back
           on the next substep — otherwise you slide down hugging the bricks and
           splash on the wall instead of falling into the alley you missed. */
        p.wallT -= h;
        p.vx = -PHYS.wallBack;
      }
      stepPhys(p, p.hold, h);
      if (p.vy > 0) {
        /* The leading edge counts too, not just the centre. Coming down a hair short
           of the parapet drops you below the roofline with your body already over the
           roof — from there you are past the wall face and nothing can put you back
           on top, so you sailed on through the building. The eave overhangs by more
           than this, so catching it here still reads as standing on the roof. */
        var lp = platAt(p.x) || platAt(p.x + PHYS.bodyR);
        if (lp && prevY <= lp.y && p.y >= lp.y) { land(lp); return; }
      }
      if (hitWall(prevFront)) return;
      if (p.y > PHYS.waterY - 6) { drown(); return; }
    }

    /* raindrop pickup */
    for (var i = 0; i < course.drops.length; i++) {
      var dr = course.drops[i];
      if (dr.got) continue;
      if (Math.abs(dr.x - p.x) < 20 && Math.abs(dr.y - (p.y - 22)) < 26) {
        dr.got = true;
        drops++;
        spawn(dr.x, dr.y, 7, 'sparkle');
        sndDrop(drops);
      }
    }

    if (mode === 'play' && p.x >= course.goalX) reachGoal();
  }

  function reachGoal() {
    mode = 'clear';
    clearAnim = 0;
    courseTime[courseIdx] = runTime;
    courseDrops[courseIdx] = drops;
    recomputeTotals();
    prevBest = best[courseIdx];
    isNewBest = (prevBest === null || runTime < prevBest);
    if (isNewBest) best[courseIdx] = runTime;
    saveUnlock(courseIdx + 2);
    spawn(course.goalX, course.plats[course.plats.length - 1].y - 40, 26, 'sparkle');
    sndClear();
    gaRoundComplete('course' + (courseIdx + 1), 'clear', { drops: drops });
  }

  function update(dt) {
    if (mode === 'play' || mode === 'clear' || mode === 'ending') {
      if (mode === 'play') {
        runTime += dt;
        /* `hold` is a view of the fingers that are down, not a latch that press()
           alone may set. A finger already on the glass sends no second
           pointerdown, so anything that cleared `hold` underneath it — drowning
           and reviving, a course change, coming back from the pause panel — left
           the umbrella folded under a thumb that never lifted, with no way back
           until the player lifted and tapped again. Re-deriving it every frame
           makes those states heal themselves. */
        if (player.alive && (pressIds.length > 0) !== player.hold) {
          player.hold = pressIds.length > 0;
          if (player.hold) sndOpen(); else sndClose();
        }
        if (player.alive) {
          acc += dt;
          if (acc > 0.2) acc = 0.2;
          while (acc >= PHYS.H) { physTick(PHYS.H); acc -= PHYS.H; }
        } else {
          player.drownT += dt;
          if (player.drownT > 0.75) revive();
        }
      } else if (mode === 'clear') {
        clearAnim += dt;
        /* celebratory slowdown */
        if (player.x < course.endX - 30) {
          player.x += Math.max(0, 120 - clearAnim * 90) * dt;
          player.legPhase += dt * 8;
          if (!player.grounded) {
            var lp2 = platAt(player.x);
            if (lp2) { player.grounded = true; player.plat = lp2; player.y = lp2.y; }
          }
        }
        if (clearAnim > 1.5 && !clearShown) {
          clearShown = true;
          if (courseIdx === 2) startEnding();
          else showClearPanel();
        }
      } else if (mode === 'ending') {
        endAnim += dt;
        sunT = Math.min(1, endAnim / 3.2);
        player.hold = false;
        player.legPhase = 0;
        if (endAnim > 1.2 && !RM && Math.random() < dt * 6) {
          spawn(player.x + (Math.random() - 0.5) * 90, player.y - 60 - Math.random() * 60, 1, 'sparkle');
        }
        if (endAnim > 4.2 && !endShown) { endShown = true; showEndPanel(); }
      }

      /* umbrella canopy easing */
      var target = player.hold ? 1 : 0;
      var sp = player.hold ? 11 : 15;
      player.canopy += (target - player.canopy) * Math.min(1, sp * dt);
      /* body tilt */
      var tt = player.grounded ? 0 : (player.hold ? -0.06 : 0.13);
      player.tilt += (tt - player.tilt) * Math.min(1, 7 * dt);

      /* wind streaks while gliding */
      if (player.canopy > 0.7 && !player.grounded && player.alive && !RM && Math.random() < dt * 14) {
        parts.push({
          x: player.x + 30 + Math.random() * 40, y: player.y - 30 - Math.random() * 40,
          vx: -150, vy: 10, life: 0.35, max: 0.35, r: 1.6, kind: 'wind'
        });
      }

      camX += (camFollow(player.x) - camX) * Math.min(1, 9 * dt);
      camX = clampCam(camX);
      updateHud();
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 16);
    updateParts(dt);
    updateRain(rainFar, dt, 0.24);
    updateRain(rainNear, dt, 0.3);
    if (fade > 0) fade = Math.max(0, fade - dt * 2.2);
  }

  function render(t) {
    screenTransform();
    ctx.clearRect(0, 0, CW, CH);
    drawSky();
    /* A paused run still looks like whatever it was paused out of. */
    var vm = mode === 'paused' ? pausedFrom : mode;
    drawRainbow(vm === 'ending' || vm === 'done' ? Math.min(1, Math.max(0, (endAnim - 1.1) / 1.6)) : 0);
    drawBackdrop();
    drawRain(rainFar, 1.1 * artK, 0.3, 0.24);

    if (course) {
      worldTransform();
      drawWater(t);
      drawPuddles(t);
      var i, ps = course.plats;
      for (i = 0; i < ps.length; i++) {
        var p = ps[i];
        if (p.x + p.w < camX - 60 || p.x > camX + VW + 60) continue;
        drawPlatform(p, t);
      }
      drawFlag(t);
      drawDrops(t);
      drawParts();
      drawPlayer(t);
      screenTransform();
    }

    drawRain(rainNear, 1.8 * artK, 0.42, 0.3);

    /* vignette */
    var vg = ctx.createRadialGradient(CW / 2, CH / 2, Math.min(CW, CH) * 0.32, CW / 2, CH / 2, Math.max(CW, CH) * 0.78);
    vg.addColorStop(0, 'rgba(20,32,46,0)');
    vg.addColorStop(1, 'rgba(20,32,46,' + (0.3 - 0.13 * sunT).toFixed(3) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, CW, CH);

    /* drown fade */
    if (!player.alive) {
      ctx.fillStyle = 'rgba(96,132,158,' + Math.min(0.55, player.drownT * 1.1).toFixed(3) + ')';
      ctx.fillRect(0, 0, CW, CH);
    }
    if (fade > 0) {
      ctx.fillStyle = 'rgba(120,150,172,' + fade.toFixed(3) + ')';
      ctx.fillRect(0, 0, CW, CH);
    }
  }

  /* ==================== hud / panels ==================== */
  var clearShown = false, endShown = false, acc = 0;

  function updateHud() {
    if (!course) return;
    var pr = (player.x - course.startX) / (course.goalX - course.startX);
    $('barFill').style.width = (Math.max(0, Math.min(1, pr)) * 100).toFixed(1) + '%';
    $('dropTag').textContent = '💧 ' + drops;
  }
  /* Takes the i18n KEY, not the finished string, so a language switch mid-toast can
     retranslate whatever is currently on screen instead of leaving the old
     language sitting there until it times out. */
  var toastKey = null;
  function showToast(key, ms) {
    var el = $('toast');
    toastKey = key;
    el.textContent = T()[key] || '';
    el.classList.add('on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove('on');
      toastKey = null;
      toastTimer = null;
    }, ms || 1800);
  }
  /* The clear panel's reason to come back: how this run sits against your own
     record. Never a scold — a slower run just quotes the number to beat. */
  /* `named` prefixes the course. The clear panel needs no prefix — every number on
     it belongs to the run that just ended. The ending panel does: the stat above
     this line is the three-course total, so an unlabelled single-course record
     sitting under it reads as a total that does not add up. */
  function renderBestNote(id, named) {
    var el = $(id), t = T(), b = best[courseIdx];
    if (!el) return;
    el.classList.remove('fresh');
    if (b === null) { el.textContent = ''; el.style.display = 'none'; return; }
    el.style.display = '';
    var txt;
    if (isNewBest && prevBest === null) { txt = t.bestFirst; el.classList.add('fresh'); }
    else if (isNewBest) { txt = t.bestNew.replace('{d}', fmtDelta(prevBest, runTime)); el.classList.add('fresh'); }
    else txt = t.bestKeep.replace('{b}', fmtTime(b)).replace('{d}', fmtDelta(runTime, b));
    el.textContent = named ? t.bestOn.replace('{c}', t.cn[courseIdx]).replace('{n}', txt) : txt;
  }
  function showClearPanel() {
    $('statTime').textContent = fmtTime(runTime);
    $('statDrop').textContent = '💧 ' + drops;
    renderBestNote('bestNote');
    $('nextBtn').style.display = courseIdx < 2 ? '' : 'none';
    gaVoteMount('#clearOv .panel');
    $('clearOv').classList.add('active');
    $('hud').classList.remove('on');
    try { $(courseIdx < 2 ? 'nextBtn' : 'retryBtn').focus(); } catch (e) {}
  }
  /* The home pill sits in the same band your thumb reaches for, and it used to be a
     live navigation that threw the run away on contact. Now it lifts the game into
     a held state and asks — the way out is still one obvious tap further, and
     coming back costs nothing: the run is exactly where you left it. */
  function pauseRun() {
    if (mode !== 'play' && mode !== 'ending') return false;
    pausedFrom = mode;
    mode = 'paused';
    /* The tracked fingers are deliberately left alone. pointerup listens on the
       window, so the panel cannot swallow one, and forgetting them here folded
       the canopy of a player who was mid-glide when the home pill was brushed —
       they came back from Resume in free fall through no fault of their own. */
    $('pauseOv').classList.add('active');
    try { $('resumeBtn').focus(); } catch (e) {}
    return true;
  }
  function resumeRun() {
    if (mode !== 'paused') return;
    $('pauseOv').classList.remove('active');
    mode = pausedFrom || 'play';
    pausedFrom = null;
    acc = 0;
    try { $('homeLink').focus(); } catch (e) {}
  }

  function startEnding() {
    mode = 'ending';
    endAnim = 0;
    endShown = false;
    $('hud').classList.remove('on');
    rainLevel(0.008, 3.2);
    sndEnding();
  }
  function showEndPanel() {
    $('eTime').textContent = fmtTime(totalTime);
    $('eDrop').textContent = '💧 ' + totalDrops;
    renderBestNote('bestNoteEnd', true);
    gaVoteMount('#endOv .panel');
    $('endOv').classList.add('active');
    mode = 'done';
    /* Hand the keyboard the button that belongs to this panel, so Enter lands
       where the eye is rather than on whatever was focused two panels ago. */
    try { $('againBtn').focus(); } catch (e) {}
  }
  function backToIntro() {
    mode = 'intro';
    pausedFrom = null;
    course = null;
    $('hud').classList.remove('on');
    $('pauseOv').classList.remove('active');
    $('clearOv').classList.remove('active');
    $('endOv').classList.remove('active');
    $('introOv').classList.add('active');
    sunT = 0;
    rainLevel(0.075, 1.5);
    buildCourseList();
  }

  function buildCourseList() {
    /* Cleared iff `unlocked` reached the value clearing this course writes
       (idx + 2). That now goes up to 4, so course 3 can finally be flagged. */
    var list = $('courseList'), t = T(), icons = ['🏘️', '🔌', '🌿'];
    list.innerHTML = '';
    for (var i = 0; i < 3; i++) {
      (function (idx) {
        var locked = idx + 1 > unlocked;
        var b = document.createElement('button');
        b.className = 'ccard-btn card-btn' + (locked ? ' locked' : '');
        b.innerHTML =
          '<span class="cbi">' + (locked ? '🔒' : icons[idx]) + '</span>' +
          '<span class="cbt"><span class="n"></span><span class="d"></span><span class="cbb"></span></span>' +
          (locked ? '' : (idx + 2 <= unlocked ? '<span class="cbdone">🚩</span>' : '<span class="cbk">▶</span>'));
        b.querySelector('.n').textContent = t.cn[idx];
        b.querySelector('.d').textContent = locked ? t.locked : t.cd[idx];
        /* The reason to come back has to be visible at the door, not only after a run.
           It stands in for the description on a course already crossed — see .cbb. */
        var bb = b.querySelector('.cbb');
        if (!locked && best[idx] !== null) {
          bb.textContent = t.bestL + ' ' + fmtTime(best[idx]);
          b.querySelector('.d').style.display = 'none';
        } else bb.style.display = 'none';
        if (!locked) {
          b.addEventListener('click', function () {
            initAudio(); sndPop();
            /* Starting from the first course means a fresh playthrough; any other
               course just replaces its own entry when it is cleared. */
            if (idx === 0) resetTotals();
            clearShown = false; endShown = false;
            $('introOv').classList.remove('active');
            startCourse(idx);
          });
        }
        list.appendChild(b);
      })(i);
    }
  }

  /* ==================== i18n apply ==================== */
  var NAMES = { ko:'점프 우산', ja:'かさジャンプ', en:'Umbrella Hop' };
  function otherNames() {
    return ['ko','ja','en'].filter(function(l){ return l !== lang; })
      .map(function(l){ return NAMES[l]; }).join(' · ');

  function applyI18n() {

    $('introL2').textContent = t.l2;
    $('introL3').textContent = t.l3;

    $('clearSub').textContent = t.clearSub;
    $('statTimeL').textContent = t.timeL;
    $('statDropL').textContent = t.dropL;
    $('nextBtn').textContent = t.next;
    $('retryBtn').textContent = t.retry;
    $('pickBtn').textContent = t.pickBtn;

    $('endSub').textContent = t.endSub;
    $('endMsg').textContent = t.endMsg;

    $('langBtn').setAttribute('aria-label', t.langLabel);
    $('pauseTitle').textContent = t.pauseTitle;
    $('pauseSub').textContent = t.pauseSub;
    $('resumeBtn').textContent = t.resume;
    $('pauseHome').textContent = t.home2;
    /* A toast that is still on screen is still being read — retranslate it in place. */
    if (toastKey) $('toast').textContent = t[toastKey] || '';
    if (course) $('courseTag').textContent = t.cn[courseIdx];
    if (mode === 'clear') { $('statTime').textContent = fmtTime(runTime); renderBestNote('bestNote'); }
    if (mode === 'done') { $('eTime').textContent = fmtTime(totalTime); renderBestNote('bestNoteEnd', true); }
    /* 언어를 바꾸면 떠 있던 투표 물음도 그 언어로 따라간다 */
    try{ if(gaS.voteShown && !gaS.voted) gaVoteShow(gaS.voteScene); }catch(e){}
    buildCourseList();
  }

  /* ==================== input ==================== */
  /* Every finger and key that is currently down, by id. Kids play two-handed and
     rest a spare thumb on the glass; a single pointerup used to fold the umbrella
     while another finger was still pressing, and the player dove without asking.
     The canopy only closes when the LAST input lets go. Keys share the list so
     Space + ArrowUp behaves the same way. */
  var pressIds = [];

  function press(id, e) {
    initAudio();
    if (pressIds.indexOf(id) < 0) pressIds.push(id);
    /* Bail before preventDefault so Space still works the panel buttons. */
    if (mode !== 'play' || !player.alive) return;
    if (!player.hold) { player.hold = true; sndOpen(); }
    if (e && e.cancelable) e.preventDefault();
  }
  function release(id, e) {
    var k = pressIds.indexOf(id);
    if (k >= 0) pressIds.splice(k, 1);
    if (pressIds.length) return;
    if (player.hold) { player.hold = false; if (mode === 'play') sndClose(); }
    /* Mirror the bail in press(): only swallow the event while we are actually
       playing. Chrome fires a <button>'s Space activation on KEYUP, so cancelling
       here unconditionally defeated the guard above one event later and killed
       Space on every panel button — including the course cards, which left a
       keyboard-only player unable to start the game at all. */
    if (mode === 'play' && e && e.cancelable) e.preventDefault();
  }
  /* Blur and a hidden tab can swallow the matching up-event entirely, which would
     leave a phantom id in the list and jam the umbrella open forever. */
  function releaseAll() {
    pressIds.length = 0;
    if (player.hold) { player.hold = false; if (mode === 'play') sndClose(); }
  }

  cv.addEventListener('pointerdown', function (e) { press(e.pointerId, e); });
  window.addEventListener('pointerup', function (e) { release(e.pointerId, e); });
  window.addEventListener('pointercancel', function (e) { release(e.pointerId, e); });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Escape') {
      if (mode === 'paused') resumeRun();
      else if (pauseRun()) sndPop();
      return;
    }
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') { press('k' + e.code, e); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') { release('k' + e.code, e); }
  });
  /* Losing focus is the one case where the up-event can genuinely go missing, so
     the tracked fingers have to be dropped. On its own that folded the umbrella
     under a thumb that was still pressing and never reopened it — no pointerdown
     ever comes for a finger that never lifted. Holding the run instead of just
     dropping the input is both the safer read and the kinder one: nothing plays
     on while the player is looking elsewhere, and Resume gives a clean start. */
  function onAway() { releaseAll(); pauseRun(); }
  window.addEventListener('blur', onAway);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) onAway();
  });

  /* Works for a tap and for Enter on the focused link — a click event either way. */
  $('homeLink').addEventListener('click', function (e) {
    if (pauseRun()) { e.preventDefault(); initAudio(); sndPop(); }
  });
  $('resumeBtn').addEventListener('click', function () { sndPop(); resumeRun(); });

  $('langBtn').addEventListener('click', function () {
    lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
    try { localStorage.setItem('in9-lang', lang); } catch (e) {}
    applyI18n();
    initAudio(); sndPop();
  });
  $('soundBtn').addEventListener('click', function () {
    initAudio();
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 0.85;
    $('soundBtn').textContent = muted ? '🔇' : '🔊';
    $('soundBtn').setAttribute('aria-label', muted ? T().soundOff : T().soundOn);
    if (!muted) sndPop();
  });
  /* Each panel button only answers while its own panel is the thing on screen.
     A button keeps DOM focus after its overlay is dismissed, and Enter is not a
     key the game intercepts, so a stale 다음 could skip a course in the middle of
     a run — leaving the skipped course's time at zero in the final tally. */
  $('nextBtn').addEventListener('click', function () {
    if (mode !== 'clear') return;
    sndPop();
    clearShown = false;
    $('clearOv').classList.remove('active');
    startCourse(Math.min(2, courseIdx + 1));
  });
  $('retryBtn').addEventListener('click', function () {
    if (mode !== 'clear') return;
    sndPop();
    clearShown = false;
    /* No un-adding any more — the replay simply overwrites this course's entry. */
    $('clearOv').classList.remove('active');
    startCourse(courseIdx);
  });
  $('pickBtn').addEventListener('click', function () {
    if (mode !== 'clear') return;
    sndPop(); backToIntro();
  });
  $('againBtn').addEventListener('click', function () {
    if (mode !== 'done') return;
    sndPop();
    resetTotals();
    backToIntro();
  });

  /* ============ GA4 portal standard v1 (2026-08-19) ============ */
  var GA_GAME='umbrella-hop';
  var gaS={started:false,completed:false,voted:false,voteShown:false,voteScene:'main',t0:0};
  function gaLang(){ try{ return lang||'ko'; }catch(e){ return 'ko'; } }
  function gaSend(name,p){ try{ if(typeof gtag!=='function')return; p=p||{}; p.game_id=GA_GAME; if(!p.lang)p.lang=gaLang(); gtag('event',name,p);}catch(e){} }
  function gaRoundStart(scene){
    gaS.t0=Date.now();
    if(gaS.completed){ gaS.completed=false; gaSend('game_step',{step:'replay',scene:scene||'main'}); return; }
    if(gaS.started)return; gaS.started=true; gaSend('game_step',{step:'start',scene:scene||'main'});
  }
  function gaRoundComplete(scene,result,extra){
    if(gaS.completed)return; gaS.completed=true;
    var p={scene:scene||'main',result:result||'clear',play_sec:gaS.t0?Math.round((Date.now()-gaS.t0)/1000):0};
    if(extra){ for(var k in extra){ if(extra.hasOwnProperty(k))p[k]=extra[k]; } }
    gaSend('game_complete',p);
    gaVoteShow(p.scene);
  }
  /* The two completion panels are different nodes, so the single vote row rides
     along to whichever one is about to open. */
  function gaVoteMount(sel){ try{ var el=document.getElementById('gaVote'); var host=document.querySelector(sel);
    if(el&&host&&el.parentNode!==host)host.appendChild(el); }catch(e){} }
  var GA_VOTE_COPY={ko:{q:'또 할래?',yes:'응',no:'글쎄',thx:'고마워요!'},ja:{q:'また あそぶ？',yes:'うん',no:'うーん',thx:'ありがとう！'},en:{q:'Want another go?',yes:'Yes',no:'Not sure',thx:'Thanks!'}};
  function gaVoteShow(scene){
    var el=document.getElementById('gaVote'); if(!el||gaS.voted)return;
    var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
    el.querySelector('.ga-vote-q').textContent=c.q;
    el.querySelector('[data-choice="yes"]').textContent=c.yes;
    el.querySelector('[data-choice="unsure"]').textContent=c.no;
    gaS.voteScene=scene||'main'; gaS.voteShown=true; el.hidden=false; el.classList.remove('done');
  }
  /* 눌린 채로 있는 Enter 의 오토리핏은 새 조작이 아니다. 투표 뒤 포커스를
     옮겨주고 나면 그 반복이 옮겨간 버튼을 눌러 다음 코스가 저 혼자 시작된다 —
     버튼의 기본 활성화만 막는다. 게임 자신의 키 처리는 그대로 돈다. */
  document.addEventListener("keydown",function(e){
    if(!e.repeat)return;
    var k=e.key||""; if(k!=="Enter"&&k!==" "&&k!=="Spacebar")return;
    var t=e.target; if(t&&t.tagName==="BUTTON")e.preventDefault();
  },true);
  (function(){ var el=document.getElementById('gaVote'); if(!el)return;
    el.addEventListener('click',function(e){
      var b=e.target; while(b&&b!==el&&!(b.getAttribute&&b.getAttribute('data-choice')))b=b.parentNode;
      if(!b||b===el||gaS.voted)return; gaS.voted=true;
      gaSend('game_vote',{scene:gaS.voteScene,choice:b.getAttribute('data-choice')});
      var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
      el.classList.add('done'); el.querySelector('.ga-vote-q').textContent=c.thx;
      /* .done 이 누른 버튼을 그 자리에서 display:none 시키므로 포커스는 지금
         이 순간 BODY 로 떨어진다. 되돌리는 것도 지금이어야 한다 — 1.2초 뒤
         타이머에 미루면 그 사이 스스로 Tab 해 간 사람의 포커스를 빼앗아,
         언어를 바꾸려던 Enter 가 다음 코스를 시작시킨다.
         키보드로 누른 경우(detail 0)에만 움직인다 — 포인터로 누른 사람에게
         링이 뜨면 안 되므로. */
      if(e.detail===0){
        try{
          var ov=el.parentNode; while(ov&&!(ov.classList&&ov.classList.contains('overlay')))ov=ov.parentNode;
          if(ov&&ov.classList.contains('active')){
            /* 화면에 실제로 떠 있는 첫 버튼. 숨은 버튼에 focus() 하면 조용히 실패한다. */
            var bs=ov.querySelectorAll('button.btn');
            for(var i=0;i<bs.length;i++){ if(bs[i].offsetParent!==null){ bs[i].focus(); break; } }
          }
        }catch(er){}
      }
      setTimeout(function(){ el.hidden=true; },1200);
    });
  })();

  /* ==================== loop ==================== */
  var last = 0;
  function frame(ts) {
    if (!last) last = ts;
    var dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.1) dt = 0.1;
    update(dt);
    render(ts / 1000);
    requestAnimationFrame(frame);
  }
