    border:1px solid rgba(255,222,180,.26);

    backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);

    pointer-events:auto; touch-action:none;
  }
  .tbtn.move { width:62px; height:62px; font-size:23px; }
  #btnJump { width:80px; height:80px; font-size:30px; pointer-events:auto; }
  .tbtn.on { transform:scale(.9); background:radial-gradient(circle at 34% 30%, rgba(255,214,140,.55), rgba(120,60,70,.5)); }

  #keyHint {
    position:absolute; z-index:14; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);
    font-size:11.5px; font-weight:600; color:rgba(255,222,182,.5);
    background:rgba(34,20,50,.4); padding:5px 13px; border-radius:999px;
    pointer-events:none; white-space:nowrap;
  }
  #keyHint.hide { display:none; }

  /* ---------------- overlays ---------------- */
  .ov {
    position:absolute; inset:0; z-index:30;
    display:flex; align-items:center; justify-content:center;
    padding:18px; opacity:0; visibility:hidden;
    background:radial-gradient(ellipse at 50% 42%, rgba(58,32,62,.62), rgba(20,12,34,.9));
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);

  .btn-row { display:flex; gap:9px; margin-top:18px; }
  .mbtn {

    background:linear-gradient(160deg,#ffbe74,#ee8a5c);

  .mbtn.ghost {

    background:rgba(46,26,58,.78); color:#ffe2b8;
    border:1px solid rgba(255,206,150,.24);

    white-space:nowrap;

  @media (max-width:360px) {

    *, *::before, *::after {
      animation-duration:.01ms !important; animation-iteration-count:1 !important;

<body>
<div id="app">
  <canvas id="game"></canvas>

  <header>
    <a class="pill" id="homeLink" href="../../index.html">← 홈</a>
    <div class="title-box">
      <h1 id="ttl">고양이 배달</h1>
      <div class="sub" id="ttlSub">ねこ配達 · Cat Post</div>
    </div>

      <button class="pill" id="soundBtn" aria-label="sound">🔊</button>

    </div>
  </header>

  <div id="hud">
    <div class="chip" id="hudStage">🏠 1/8</div>
    <div class="chip" id="hudFish">🐟 <span class="num">0/3</span></div>
  </div>

  <div id="pad" class="hide">
    <div class="dpad">
      <button class="tbtn move" id="btnLeft" aria-label="left">◀</button>
      <button class="tbtn move" id="btnRight" aria-label="right">▶</button>
    </div>
    <button class="tbtn" id="btnJump" aria-label="jump">🐾</button>
  </div>
  <div id="keyHint" class="hide"></div>

  <div id="toast"></div>

  <div class="ov on" id="introOv">
    <div class="panel">
      <div class="big-ico">🐈</div>
      <h2 id="introTitle"></h2>
      <div class="sub2">ねこ配達 · Cat Post</div>
      <div class="lines">
        <p id="introL1"></p>
        <p id="introL2"></p>
        <p id="introL3"></p>
      </div>
      <div class="note" id="introNote"></div>
      <div class="btn-row">
        <button class="mbtn" id="startBtn"></button>
        <button class="mbtn ghost" id="contBtn" style="display:none"></button>
      </div>
    </div>
  </div>

  <div class="ov" id="clearOv">
    <div class="panel">
      <div class="big-ico">📮</div>
      <h2 id="clearTitle"></h2>
      <div class="sub2" id="clearSub"></div>
      <div id="clearFish"><span>🐟</span><span>🐟</span><span>🐟</span></div>
      <div class="btn-row">
        <button class="mbtn" id="nextBtn"></button>
        <a class="mbtn ghost" id="clearHomeBtn" href="../../index.html" style="flex:0 0 34%;display:flex;align-items:center;justify-content:center"></a>
      </div>
      <div class="note" id="clearNote"></div>
    </div>
  </div>

  <div class="ov" id="endOv">
    <div class="panel" id="endPanel">
      <div class="big-ico">💌</div>
      <h2 id="endTitle"></h2>
      <div class="sub2" id="endSub"></div>
      <div id="letters"></div>
      <div id="endFish"></div>
      <div class="note" id="endNote"></div>
      <div class="btn-row">
        <button class="mbtn" id="replayBtn"></button>
        <a class="mbtn ghost" id="endHomeBtn" href="../../index.html" style="display:flex;align-items:center;justify-content:center"></a>
      </div>
    </div>
  </div>
</div>

  function buildLevel(idx) {
    var raw = STAGES[idx];
    var rnd = mulberry(1000 + idx * 77);
    var plats = raw.p.map(function (a, i) {
      var h = 6 + Math.floor(rnd() * 3);         // roof slab thickness in px units
      return {
        x: a[0], y: a[1], w: a[2], slab: h * 2,
        seed: Math.floor(rnd() * 100000),
        style: Math.floor(rnd() * 3),
        deco: rnd(), i: i
      };
    });
    var last = plats[plats.length - 1];
    var levelEnd = last.x + last.w;

    var fish = raw.f.map(function (a) { return { x: a[0], y: a[1], got: false, ph: Math.random() * 6.28 }; });

    // background silhouette layers
    function makeCity(k, baseY, hMin, hMax, colBody, colWin, density) {
      var r2 = mulberry(idx * 313 + Math.floor(k * 1000));
      var arr = [], x = -200, span = levelEnd * k + 900;
      while (x < span) {
        var w = 40 + Math.floor(r2() * 70);
        var h = hMin + Math.floor(r2() * (hMax - hMin));
        var b = { x: x, w: w, h: h, y: baseY - h, win: [] };
        var cols = Math.max(1, Math.floor(w / 18));
        var rowsN = Math.max(1, Math.floor(h / 22));
        for (var cc = 0; cc < cols; cc++) {
          for (var rr = 0; rr < rowsN; rr++) {
            if (r2() < density) {
              b.win.push([b.x + 8 + cc * 18, b.y + 12 + rr * 22, r2() < 0.3 ? 1 : 0]);
            }
          }
        }
        arr.push(b);
        x += w + 6 + Math.floor(r2() * 26);
      }
      return { k: k, col: colBody, winCol: colWin, list: arr };
    }

    // skyline sits ABOVE the playable roof band (y 120..300) so it reads as distance
    var far = makeCity(0.30, 300, 90, 200, '#59386a', '#ffca8a', 0.30);
    var mid = makeCity(0.58, 420, 110, 270, '#3f2750', '#ffbe78', 0.34);
    var fore = makeCity(1.22, 700, 120, 260, '#231631', '#e79a63', 0.16);

    // clouds
    var rc = mulberry(idx * 991 + 5);
    var clouds = [];
    for (var i = 0; i < 16; i++) {
      clouds.push({
        x: -300 + rc() * (levelEnd * 0.14 + 1400),

      birds.push({ x: rc() * (levelEnd * 0.35 + 800), y: -60 + rc() * 160, sp: 14 + rc() * 16, ph: rc() * 6.28 });

  /* ==================================================================
     simulation
  ================================================================== */
  function step(dt) {
    var pl = player, i, p;

    // ---- parachute respawn ----
    if (pl.para > 0) {
      pl.para -= dt;
      pl.vy = 96;
      pl.y += pl.vy * dt;
      pl.x = pl.safe.x + Math.sin(timeNow * 2.4) * 9;
      var landed = false;
      for (i = 0; i < lvl.plats.length; i++) {
        p = lvl.plats[i];
        if (pl.x + PW > p.x && pl.x < p.x + p.w && pl.y + PH >= p.y && pl.y + PH < p.y + 26) {
          pl.y = p.y - PH; landed = true; break;
        }
      }
      if (landed || pl.para <= 0) {
        pl.para = 0; pl.vy = 0; pl.vx = 0; pl.ground = true;
        pl.sq = 0.72;
        puff(pl.x + PW / 2, pl.y + PH, 9);
        sfx.land();
      }
      return;
    }

    // ---- horizontal ----
    var want = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    var acc = pl.ground ? ACCEL : AIR_ACCEL;
    if (want !== 0) {
      pl.vx += want * acc * dt;
      pl.vx = clamp(pl.vx, -SPEED, SPEED);
      pl.dir = want;
      if (pl.ground) pl.walk += Math.abs(pl.vx) * dt;
    } else if (pl.ground) {
      if (pl.vx > 0) pl.vx = Math.max(0, pl.vx - FRICTION * dt);
      else if (pl.vx < 0) pl.vx = Math.min(0, pl.vx + FRICTION * dt);
    }

    // ---- jump ----
    if (pl.buf > 0) pl.buf -= dt;
    if (pl.coyote > 0) pl.coyote -= dt;
    if (pl.buf > 0 && pl.coyote > 0) {
      pl.vy = -JUMP_V;
      pl.ground = false; pl.buf = 0; pl.coyote = 0;
      pl.sq = 1.28;
      puff(pl.x + PW / 2, pl.y + PH, 5);
      sfx.jump();
    }

    // ---- gravity ----
    pl.vy += GRAV * dt;
    if (pl.vy > 1250) pl.vy = 1250;

    // ---- move X + resolve ----
    pl.x += pl.vx * dt;
    for (i = 0; i < lvl.plats.length; i++) {
      p = lvl.plats[i];
      var top = p.y, bot = p.y + p.slab;
      if (pl.x + PW > p.x && pl.x < p.x + p.w && pl.y + PH > top + 3 && pl.y < bot) {
        if (pl.vx > 0) pl.x = p.x - PW;
        else if (pl.vx < 0) pl.x = p.x + p.w;
        pl.vx = 0;
      }
    }
    if (pl.x < -40) { pl.x = -40; pl.vx = 0; }

    // ---- move Y + resolve ----
    var wasGround = pl.ground;
    pl.y += pl.vy * dt;
    pl.ground = false;
    for (i = 0; i < lvl.plats.length; i++) {
      p = lvl.plats[i];
      if (pl.x + PW > p.x + 2 && pl.x < p.x + p.w - 2) {
        if (pl.vy >= 0 && pl.y + PH > p.y && pl.y + PH < p.y + p.slab + Math.max(14, pl.vy * dt + 6)) {
          pl.y = p.y - PH; pl.vy = 0; pl.ground = true;
          pl.safe.x = clamp(pl.x, p.x + 8, p.x + p.w - PW - 8);
          pl.safe.y = p.y - PH;
          if (!wasGround) {
            pl.sq = 0.76;
            puff(pl.x + PW / 2, pl.y + PH, 5);
            sfx.land();
          }
          break;
        }
      }
    }
    if (pl.ground) pl.coyote = COYOTE;
    else if (wasGround) pl.coyote = COYOTE;

    // ---- fell off ----
    if (pl.y > FALL_Y) {
      pl.para = 2.6;
      pl.y = pl.safe.y - 250;
      pl.x = pl.safe.x;
      pl.vy = 0; pl.vx = 0;
      sfx.para();
      toast(T().tsBack);
    }

    // ---- fish ----
    var cx = pl.x + PW / 2, cy = pl.y + PH / 2;
    for (i = 0; i < lvl.fish.length; i++) {
      var f = lvl.fish[i];
      if (f.got) continue;
      var dx = f.x - cx, dy = f.y - cy;
      if (dx * dx + dy * dy < 30 * 30) {
        f.got = true; pl.fishGot++;
        burst(f.x, f.y, 12, '#bfe8f7', 130, 0.55, 3);
        addFloat(f.x, f.y - 10, '+1', '#bfe8f7');
        sfx.fish();
        toast(T().tsFish);
        updateHud();
      }
    }

    // ---- mailbox ----
    var mb = lvl.mailbox;
    if (!mb.done && pl.x + PW > mb.x - 4 && pl.x < mb.x + mb.w + 4 &&
        pl.y + PH > mb.y - 4 && pl.y < mb.y + mb.h + 6) {
      mb.done = true;
      mode = 'deliver';
      deliverT = 0;
      pl.vx = 0;
      sfx.bell();
    }
  }

  function stepDeliver(dt) {
    deliverT += dt;
    var pl = player, mb = lvl.mailbox;
    pl.vx *= 0.82;
    pl.x += pl.vx * dt;
    pl.vy += GRAV * dt;
    pl.y += pl.vy * dt;
    var i, p;
    for (i = 0; i < lvl.plats.length; i++) {
      p = lvl.plats[i];
      if (pl.x + PW > p.x && pl.x < p.x + p.w && pl.vy >= 0 && pl.y + PH > p.y && pl.y + PH < p.y + 30) {
        pl.y = p.y - PH; pl.vy = 0; pl.ground = true;
      }
    }
    pl.dir = (mb.x > pl.x) ? 1 : -1;
    if (deliverT > 0.62 && pl.hasLetter) {
      pl.hasLetter = false;
      mb.flag = 1;
      burst(mb.x + mb.w / 2, mb.y + 6, 16, '#ffd98a', 120, 0.7, 3);
      if (!REDUCED) {
        for (i = 0; i < 5; i++) addFloat(mb.x + 8 + Math.random() * 18, mb.y - 6 - i * 6, '♥', '#ffb3b8');
      }
    }
    if (deliverT > 1.75) finishStage();
  }

  function finishStage() {
    mode = 'clear';
    save.fish[stageIdx] = Math.max(save.fish[stageIdx], player.fishGot);
    save.unlocked = Math.max(save.unlocked, Math.min(8, stageIdx + 2));
    writeSave();
    var t = T();
    $('clearTitle').textContent = t.clearTitle;
    $('clearSub').textContent = t.clearSub.replace('{n}', String(stageIdx + 1));
    var slots = $('clearFish').children;
    for (var i = 0; i < 3; i++) slots[i].className = i < player.fishGot ? 'got' : '';
    $('nextBtn').textContent = stageIdx >= 7 ? t.last : t.next;
    $('clearNote').textContent = t.clearNote;
    $('clearHomeBtn').textContent = t.homeBtn;
    $('clearOv').classList.add('on');
  }

  function showEnding() {
    mode = 'end';
    var t = T();
    $('endTitle').textContent = t.endTitle;
    $('endSub').textContent = t.endSub;
    var total = save.fish.reduce(function (a, b) { return a + b; }, 0);
    $('endFish').textContent = t.endFish.replace('{n}', String(total));
    $('endNote').textContent = t.endNote;
    $('replayBtn').textContent = t.replay;
    $('endHomeBtn').textContent = t.homeBtn;

    var box = $('letters');
    box.innerHTML = '';
    LETTERS.forEach(function (L, i) {
      var d = document.createElement('div');
      d.className = 'letter';
      d.style.setProperty('--rot', ((i % 2 ? 1 : -1) * (0.3 + (i % 3) * 0.25)).toFixed(2) + 'deg');
      var txt = L[lang] || L.ko;
      d.innerHTML = '<div class="lem"></div><div class="ltx"><div class="lfrom"></div><div class="lbody"></div></div>';
      d.querySelector('.lem').textContent = L.em;
      d.querySelector('.lfrom').textContent = txt[0];
      d.querySelector('.lbody').textContent = txt[1];
      box.appendChild(d);
      setTimeout(function () { d.classList.add('in'); }, REDUCED ? 0 : 220 + i * 130);
    });
    $('endOv').classList.add('on');
    sfx.ending();
  }

  /* ==================================================================
     rendering
  ================================================================== */
  function resize() {
    var r = $('app').getBoundingClientRect();
    cssW = Math.max(1, r.width); cssH = Math.max(1, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    scale = clamp(Math.min(cssW / 430, cssH / 340), 0.6, 2.2);
    viewW = cssW / scale;
    viewH = cssH / scale;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 180); });

  function drawSky() {
    var grd = g.createLinearGradient(0, 0, 0, cssH);
    grd.addColorStop(0, '#2b2150');
    grd.addColorStop(0.24, '#4d2f68');
    grd.addColorStop(0.45, '#8b4468');
    grd.addColorStop(0.63, '#cf6a56');
    grd.addColorStop(0.79, '#ef9560');
    grd.addColorStop(1, '#ffc87f');
    g.fillStyle = grd;
    g.fillRect(0, 0, cssW, cssH);
  }

  function drawCity(layer, alphaGlow) {
    var k = layer.k;
    g.save();
    g.translate(-cam.x * k, -cam.y);
    var x0 = cam.x * k - 60, x1 = x0 + viewW + 120;
    var i, b, j, w;
    g.fillStyle = layer.col;
    for (i = 0; i < layer.list.length; i++) {
      b = layer.list[i];
      if (b.x + b.w < x0 || b.x > x1) continue;
      g.fillRect(b.x, b.y, b.w, b.h + 260);
      // roof cap highlight (sun-side)
      g.fillStyle = 'rgba(255,180,120,0.10)';
      g.fillRect(b.x, b.y, b.w, 4);
      g.fillStyle = layer.col;
    }
    for (i = 0; i < layer.list.length; i++) {
      b = layer.list[i];
      if (b.x + b.w < x0 || b.x > x1) continue;
      for (j = 0; j < b.win.length; j++) {
        w = b.win[j];
        g.fillStyle = layer.winCol;
        g.globalAlpha = w[2] ? alphaGlow * 0.55 : alphaGlow;
        g.fillRect(w[0], w[1], 6, 8);
      }
    }
    g.globalAlpha = 1;
    g.restore();
  }

  function drawSun() {
    g.save();
    g.translate(-cam.x * 0.06, -cam.y);
    var sx = cam.x * 0.06 + viewW * 0.74;
    var sy = 140;
    var rg = g.createRadialGradient(sx, sy, 8, sx, sy, 190);
    rg.addColorStop(0, 'rgba(255,226,150,0.55)');
    rg.addColorStop(0.45, 'rgba(255,168,110,0.20)');
    rg.addColorStop(1, 'rgba(255,140,90,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(sx, sy, 190, 0, 6.2832); g.fill();
    g.fillStyle = '#ffdf9a';
    g.beginPath(); g.arc(sx, sy, 46, 0, 6.2832); g.fill();
    g.fillStyle = 'rgba(255,246,214,0.9)';
    g.beginPath(); g.arc(sx, sy - 6, 34, 0, 6.2832); g.fill();
    g.restore();
  }

  function drawClouds() {
    g.save();
    g.translate(-cam.x * 0.13, -cam.y);
    var x0 = cam.x * 0.13 - 200, x1 = x0 + viewW + 300;
    for (var i = 0; i < lvl.clouds.length; i++) {
      var c = lvl.clouds[i];
      var cx = c.x + (REDUCED ? 0 : (timeNow * c.sp) % 900);
      if (cx + c.w < x0 || cx > x1) continue;
      g.globalAlpha = c.a;
      g.fillStyle = '#ffd7a4';
      g.fillRect(cx, c.y, c.w, c.h);
      g.fillRect(cx + c.w * 0.2, c.y - c.h * 0.7, c.w * 0.55, c.h * 0.7);
      g.globalAlpha = c.a * 0.6;
      g.fillStyle = '#ffeccb';
      g.fillRect(cx, c.y, c.w, 3);
    }
    g.globalAlpha = 1;
    g.restore();
  }

  function drawBirds() {
    if (REDUCED) return;
    g.save();
    g.translate(-cam.x * 0.34, -cam.y);
    g.fillStyle = 'rgba(52,30,54,0.55)';
    for (var i = 0; i < lvl.birds.length; i++) {
      var b = lvl.birds[i];
      var bx = b.x + timeNow * b.sp;
      var by = b.y + Math.sin(timeNow * 1.4 + b.ph) * 9;
      var flap = Math.sin(timeNow * 7 + b.ph) > 0 ? 1 : -1;
      g.fillRect(bx, by, 3, 3);
      g.fillRect(bx - 4, by - 2 * flap, 3, 3);
      g.fillRect(bx + 4, by - 2 * flap, 3, 3);
    }
    g.restore();
  }

  // playable roof + house below it
  function drawHouse(p) {
    var rc = mulberry(p.seed);
    var bodyCol = ['#3d2743', '#453048', '#38243f'][p.style];
    var roofCol = ['#8a4f57', '#a05a5c', '#79454f'][p.style];
    var lipCol = ['#ffb173', '#ffc189', '#f5a26b'][p.style];

    var bodyTop = p.y + p.slab;
    var bodyH = 320;
    // house body
    g.fillStyle = bodyCol;
    g.fillRect(p.x + 4, bodyTop, p.w - 8, bodyH);
    // warm windows
    var cols = Math.max(1, Math.floor((p.w - 26) / 34));
    var rowsN = 3;
    for (var cc = 0; cc < cols; cc++) {
      for (var rr = 0; rr < rowsN; rr++) {
        if (rc() < 0.55) {
          var wx = p.x + 16 + cc * 34, wy = bodyTop + 18 + rr * 40;
          g.fillStyle = 'rgba(24,12,26,0.5)';
          g.fillRect(wx - 2, wy - 2, 18, 22);
          var lit = rc() < 0.78;
          g.fillStyle = lit ? '#ffcf85' : '#5d4260';
          g.fillRect(wx, wy, 14, 18);
          if (lit) {
            g.fillStyle = 'rgba(255,226,160,0.16)';
            g.fillRect(wx - 6, wy - 6, 26, 30);
            g.fillStyle = 'rgba(255,240,205,0.55)';
            g.fillRect(wx, wy, 14, 4);
          }
        }
      }
    }
    // roof slab
    g.fillStyle = roofCol;
    g.fillRect(p.x - 5, p.y, p.w + 10, p.slab);
    // sunlit lip
    g.fillStyle = lipCol;
    g.fillRect(p.x - 5, p.y, p.w + 10, 3);
    // shadow under the slab
    g.fillStyle = 'rgba(20,10,24,0.28)';
    g.fillRect(p.x - 5, p.y + p.slab, p.w + 10, 4);
    // tiles
    g.fillStyle = 'rgba(30,16,32,0.16)';
    for (var t = 0; t < p.w; t += 14) g.fillRect(p.x + t, p.y + 3, 2, p.slab - 3);

    // decoration: chimney / antenna / laundry
    if (p.deco < 0.34) {
      var chx = p.x + 18;
      g.fillStyle = roofCol; g.fillRect(chx, p.y - 26, 16, 26);
      g.fillStyle = lipCol; g.fillRect(chx - 2, p.y - 29, 20, 4);
      if (!REDUCED) {
        g.fillStyle = 'rgba(255,224,196,0.16)';
        for (var s = 0; s < 3; s++) {
          var sy = p.y - 34 - s * 13 - (timeNow * 9 % 13);
          g.fillRect(chx + 4 + Math.sin(timeNow * 1.2 + s) * 5, sy, 7, 7);
        }
      }
    } else if (p.deco < 0.6) {
      g.fillStyle = '#2b1a2b';
      g.fillRect(p.x + p.w - 24, p.y - 34, 3, 34);
      g.fillRect(p.x + p.w - 32, p.y - 34, 19, 3);
      g.fillRect(p.x + p.w - 29, p.y - 27, 13, 3);
    } else if (p.deco < 0.78 && p.w > 120) {
      g.strokeStyle = 'rgba(40,22,42,0.7)'; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(p.x + 20, p.y - 22); g.lineTo(p.x + p.w - 20, p.y - 16); g.stroke();
      var cl = ['#ffd3a1', '#e79aa8', '#a8cfe0'];
      for (var q = 0; q < 3; q++) {
        var lx = p.x + 40 + q * ((p.w - 80) / 3);
        var sway = REDUCED ? 0 : Math.sin(timeNow * 1.6 + q) * 2;
        g.fillStyle = cl[q];
        g.fillRect(lx + sway, p.y - 21 + q * 0.6, 13, 17);
      }
    }
  }

  function drawFishSprite(f) {
    var bob = REDUCED ? 0 : Math.sin(timeNow * 2.6 + f.ph) * 5;
    var y = f.y + bob;
    g.save();
    g.globalAlpha = 0.28;
    g.fillStyle = '#bfe8f7';
    g.beginPath(); g.arc(f.x, y, 20 + (REDUCED ? 0 : Math.sin(timeNow * 3 + f.ph) * 2), 0, 6.2832); g.fill();
    g.globalAlpha = 1;
    drawGrid(g, FISH_SP, Math.round(f.x - 13), Math.round(y - 9), FPAL, PX, false);
    g.restore();
  }

  function drawMailbox(mb) {
    var x = Math.round(mb.x), y = Math.round(mb.y);
    // post
    g.fillStyle = '#3a2434'; g.fillRect(x + 12, y + 24, 9, 24);
    // body
    g.fillStyle = '#2b1a2b'; g.fillRect(x - 2, y - 2, mb.w + 4, 30);
    g.fillStyle = '#d4685c'; g.fillRect(x, y, mb.w, 26);
    g.fillStyle = '#e88476'; g.fillRect(x, y, mb.w, 6);
    // slot
    g.fillStyle = '#2b1a2b'; g.fillRect(x + 6, y + 11, mb.w - 12, 5);
    // roof
    g.fillStyle = '#f4dcbb'; g.fillRect(x - 4, y - 7, mb.w + 8, 6);
    // flag
    var fy = mb.flag ? y - 14 : y + 4;
    g.fillStyle = '#3a2434'; g.fillRect(x + mb.w + 2, y - 16, 3, 22);
    g.fillStyle = mb.flag ? '#ffd05c' : '#8d6a55';
    g.fillRect(x + mb.w + 5, fy, 11, 8);
    if (mb.flag && !REDUCED) {
      g.fillStyle = 'rgba(255,214,140,0.18)';
      g.beginPath(); g.arc(x + mb.w / 2, y + 8, 34 + Math.sin(timeNow * 4) * 4, 0, 6.2832); g.fill();
    }
  }

  function drawLetterSprite(x, y, ang) {
    g.save();
    g.translate(x, y);
    g.rotate(ang || 0);
    g.fillStyle = '#2b1a2b'; g.fillRect(-8, -6, 16, 12);
    g.fillStyle = '#fff6e4'; g.fillRect(-6.5, -4.5, 13, 9);
    g.strokeStyle = '#d9a882'; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(-6.5, -4.5); g.lineTo(0, 1); g.lineTo(6.5, -4.5); g.stroke();
    g.restore();
  }

  function drawCat() {
    var pl = player;
    var cx = pl.x + PW / 2, base = pl.y + PH;
    var sq = pl.sq;
    var sx = 1 + (1 - sq) * 0.45, sy = sq;

    g.save();
    // soft shadow on the roof
    var pTop = null, i, p;
    for (i = 0; i < lvl.plats.length; i++) {
      p = lvl.plats[i];
      if (cx > p.x - 10 && cx < p.x + p.w + 10 && p.y >= pl.y + PH - 4) { pTop = p; break; }
    }
    if (pTop) {
      var d = clamp(1 - (pTop.y - (pl.y + PH)) / 220, 0.12, 1);
      g.globalAlpha = 0.26 * d;
      g.fillStyle = '#1b0f22';
      g.fillRect(cx - 14 * d, pTop.y + 1, 28 * d, 5);
      g.globalAlpha = 1;
    }

    g.translate(cx, base);
    g.scale(sx, sy);

    // tail
    var wag = REDUCED ? 0 : Math.sin(timeNow * 6 + pl.walk * 0.05) * 0.35;
    var tdir = -pl.dir;
    g.save();
    g.fillStyle = PAL['1'];
    var tsegs = [[10, -13], [16, -18], [20, -25], [21, -32]];
    for (i = 0; i < tsegs.length; i++) {
      var t = tsegs[i];
      var ang = wag * (i + 1) * 0.35;
      var tx = tdir * (t[0] + Math.sin(ang) * 3);
      var ty = t[1] + Math.cos(ang) * 2 - 0;
      g.fillRect(Math.round(tx - 3), Math.round(ty - 3), 6, 6);
    }
    g.fillStyle = PAL['2'];
    for (i = 0; i < tsegs.length; i++) {
      var t2 = tsegs[i];
      var ang2 = wag * (i + 1) * 0.35;
      var tx2 = tdir * (t2[0] + Math.sin(ang2) * 3);
      var ty2 = t2[1] + Math.cos(ang2) * 2;
      g.fillRect(Math.round(tx2 - 2), Math.round(ty2 - 2), 4, 4);
    }
    g.restore();

    // body sprite
    var flip = pl.dir < 0;
    var ox = Math.round(-16.5), oy = Math.round(-33);
    var bodyRows = CAT_BODY;
    drawGrid(g, bodyRows, ox, oy, PAL, PX, flip);

    // blink: paint over the eye pixels
    if (pl.blink > 0) {
      g.fillStyle = PAL['2'];
      g.fillRect(ox + (flip ? 8 : 2) * PX, oy + 4 * PX, PX, PX);
      g.fillRect(ox + (flip ? 2 : 8) * PX, oy + 4 * PX, PX, PX);
    }

    // legs
    var legs = !pl.ground ? LEGS.air : (Math.abs(pl.vx) > 26 ? (Math.floor(pl.walk / 26) % 2 ? LEGS.run : LEGS.stand) : LEGS.stand);
    drawGrid(g, legs, ox, oy + 9 * PX, PAL, PX, flip);

    // letter in the mouth
    if (pl.hasLetter) {
      var bobL = REDUCED ? 0 : Math.sin(timeNow * 5) * 1.2;
      drawLetterSprite(pl.dir * 15, -17 + bobL, pl.dir * 0.12);
    }
    g.restore();

    // parachute
    if (pl.para > 0) {
      g.save();
      g.translate(cx, pl.y);
      var sway = Math.sin(timeNow * 2.4) * 0.12;
      g.rotate(sway);
      g.strokeStyle = 'rgba(50,28,50,0.8)'; g.lineWidth = 1.4;
      g.beginPath();
      g.moveTo(-9, -2); g.lineTo(-20, -22);
      g.moveTo(9, -2); g.lineTo(20, -22);
      g.stroke();
      g.fillStyle = '#2b1a2b';
      g.beginPath(); g.moveTo(-30, -22); g.lineTo(30, -22); g.lineTo(0, -54); g.closePath(); g.fill();
      g.fillStyle = '#ffd9a6';
      g.beginPath(); g.moveTo(-26, -24); g.lineTo(26, -24); g.lineTo(0, -50); g.closePath(); g.fill();
      g.fillStyle = '#f2a463';
      g.beginPath(); g.moveTo(-9, -24); g.lineTo(9, -24); g.lineTo(0, -50); g.closePath(); g.fill();
      g.restore();
    }
  }

  function drawParts() {
    var i, p;
    for (i = 0; i < parts.length; i++) {
      p = parts[i];
      g.globalAlpha = clamp(p.life / p.max, 0, 1);
      g.fillStyle = p.col;
      g.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz);
    }
    g.globalAlpha = 1;
    g.font = '700 15px -apple-system, sans-serif';
    g.textAlign = 'center';
    for (i = 0; i < floats.length; i++) {
      var f = floats[i];
      g.globalAlpha = clamp(1 - f.t / 1.1, 0, 1);
      g.fillStyle = f.col;
      g.fillText(f.txt, f.x, f.y - f.t * 38);
    }
    g.globalAlpha = 1;
    g.textAlign = 'left';
  }

  function drawHint() {
    if (stageIdx !== 0 || !lvl) return;
    var p = lvl.plats[0];
    var txt = touchSeen ? T().hintTouch : T().hintKey;
    g.save();
    g.font = '700 13px -apple-system, sans-serif';
    g.textAlign = 'center';
    var w = g.measureText(txt).width + 26;
    var x = p.x + 118, y = p.y - 62;
    g.fillStyle = 'rgba(38,22,50,0.55)';
    g.fillRect(x - w / 2, y - 15, w, 24);
    g.fillStyle = 'rgba(255,222,182,0.9)';
    g.fillText(txt, x, y + 2);
    g.restore();
  }

  function render() {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawSky();
    if (!lvl) return;
    g.save();
    g.scale(scale, scale);

    drawSun();
    drawClouds();
    drawCity(lvl.far, 0.85);
    drawBirds();
    drawCity(lvl.mid, 0.95);

    // main world
    g.save();
    g.translate(-Math.round(cam.x), -Math.round(cam.y));
    var x0 = cam.x - 80, x1 = cam.x + viewW + 80, i;
    for (i = 0; i < lvl.plats.length; i++) {
      var p = lvl.plats[i];
      if (p.x + p.w < x0 || p.x > x1) continue;
      drawHouse(p);
    }
    drawMailbox(lvl.mailbox);
    for (i = 0; i < lvl.fish.length; i++) {
      if (!lvl.fish[i].got && lvl.fish[i].x > x0 - 40 && lvl.fish[i].x < x1 + 40) drawFishSprite(lvl.fish[i]);
    }
    drawHint();
    // the delivered letter flying into the slot
    if (mode === 'deliver' && deliverT < 0.66) {
      var t = clamp(deliverT / 0.62, 0, 1);
      var sxp = player.x + PW / 2 + player.dir * 15, syp = player.y + 16;
      var exp2 = lvl.mailbox.x + lvl.mailbox.w / 2, eyp = lvl.mailbox.y + 13;
      var lxp = sxp + (exp2 - sxp) * t;
      var lyp = syp + (eyp - syp) * t - Math.sin(t * Math.PI) * 34;
      drawLetterSprite(lxp, lyp, t * 2.6);
    }
    drawCat();
    drawParts();
    g.restore();

    drawCity(lvl.fore, 0.5);

    // warm vignette
    g.restore();
    var vg = g.createRadialGradient(cssW / 2, cssH * 0.48, cssH * 0.28, cssW / 2, cssH * 0.5, cssH * 0.92);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(38,14,40,0.4)');
    g.fillStyle = vg;
    g.fillRect(0, 0, cssW, cssH);
  }

  /* ==================================================================
     hud / ui
  ================================================================== */
  var toastT = 0;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('on');
    toastT = 1.5;
  }
  function updateHud() {
    var t = T();
    $('hudStage').textContent = '🏠 ' + (stageIdx + 1) + '/8';
    $('hudFish').innerHTML = '🐟 <span class="num">' + (player ? player.fishGot : 0) + '/3</span>';
    var hf = $('hudFish');
    hf.classList.add('pop');
    setTimeout(function () { hf.classList.remove('pop'); }, 300);
  }

  function applyI18n() {
    var t = T();
    document.documentElement.lang = lang;
    $('homeLink').textContent = '← ' + t.home;
    $('langBtn').textContent = FLAGS[lang];
    $('ttl').textContent = t.title;
    $('ttlSub').textContent = ['ko','ja','en'].filter(function(l){ return l !== lang; })
      .map(function(l){ return I18N[l].title; }).join(' · ');
    $('introTitle').textContent = t.introTitle;
    $('introL1').textContent = t.l1;
    $('introL2').textContent = t.l2;
    $('introL3').textContent = t.l3;
    $('introNote').textContent = t.note;
    $('startBtn').textContent = t.start;
    $('contBtn').textContent = t.cont + ' (' + Math.min(save.unlocked, 8) + '/8)';
    $('keyHint').textContent = t.hintKey;
    $('nextBtn').textContent = stageIdx >= 7 ? t.last : t.next;
    $('clearTitle').textContent = t.clearTitle;
    $('clearSub').textContent = t.clearSub.replace('{n}', String(stageIdx + 1));
    $('clearNote').textContent = t.clearNote;
    $('clearHomeBtn').textContent = t.homeBtn;
    $('replayBtn').textContent = t.replay;
    $('endHomeBtn').textContent = t.homeBtn;
    if (mode === 'end') {
      $('endTitle').textContent = t.endTitle;
      $('endSub').textContent = t.endSub;
      var total = save.fish.reduce(function (a, b) { return a + b; }, 0);
      $('endFish').textContent = t.endFish.replace('{n}', String(total));
      $('endNote').textContent = t.endNote;
      var nodes = $('letters').children;
      for (var i = 0; i < nodes.length && i < LETTERS.length; i++) {
        var tx = LETTERS[i][lang] || LETTERS[i].ko;
        nodes[i].querySelector('.lfrom').textContent = tx[0];
        nodes[i].querySelector('.lbody').textContent = tx[1];
      }
    }
    updateHud();
  }

  $('langBtn').addEventListener('click', function () {
    lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
    try { localStorage.setItem('in9-lang', lang); } catch (e) {}
    applyI18n();
    sfx.pop();
  });
  $('soundBtn').addEventListener('click', function () {
    muted = !muted;
    $('soundBtn').textContent = muted ? '🔇' : '🔊';
    if (!muted) { audio(); sfx.pop(); }
  });

  $('startBtn').addEventListener('click', function () {
    audio(); sfx.pop();
    save.unlocked = Math.max(save.unlocked, 1);
    $('introOv').classList.remove('on');
    if (!touchSeen) $('keyHint').classList.remove('hide');
    startStage(0);
  });
  $('contBtn').addEventListener('click', function () {
    audio(); sfx.pop();
    $('introOv').classList.remove('on');
    if (!touchSeen) $('keyHint').classList.remove('hide');
    startStage(clamp(save.unlocked - 1, 0, 7));
  });
  $('nextBtn').addEventListener('click', function () {
    sfx.pop();
    $('clearOv').classList.remove('on');
    if (stageIdx >= 7) {
      setTimeout(showEnding, 220);
    } else {
      startStage(stageIdx + 1);
    }
  });
  $('replayBtn').addEventListener('click', function () {
    sfx.pop();
    $('endOv').classList.remove('on');
    setTimeout(function () { startStage(0); }, 220);
  });

  /* ==================================================================
     main loop
  ================================================================== */
  var last = 0, acc = 0;
  function frame(ts) {
    if (!last) last = ts;
    var dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.25) dt = 0.25;
    timeNow += dt;

    if (toastT > 0) {
      toastT -= dt;
      if (toastT <= 0) $('toast').classList.remove('on');
    }

    if (lvl && player) {
      if (mode === 'play') {
        acc += dt;
        var n = 0;
        while (acc >= STEP && n < 8 && mode === 'play') { step(STEP); acc -= STEP; n++; }
        if (acc > STEP) acc = 0;
      } else if (mode === 'deliver') {
        stepDeliver(dt);
      }

      // squash easing + blink timer
      player.sq += (1 - player.sq) * Math.min(1, dt * 13);
      player.blinkT -= dt;
      if (player.blinkT <= 0) { player.blink = 0.12; player.blinkT = 2.4 + Math.random() * 3.6; }
      if (player.blink > 0) player.blink -= dt;

      // particles
      var i;
      for (i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];
        p.life -= dt;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        p.vy += p.gv * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
      }
      for (i = floats.length - 1; i >= 0; i--) {
        floats[i].t += dt;
        if (floats[i].t > 1.1) floats.splice(i, 1);
      }

      // camera
      var tx = player.x + PW / 2 - viewW * 0.44 + player.dir * 34;
      var maxX = Math.max(-60, lvl.levelEnd + 240 - viewW);
      tx = clamp(tx, -60, maxX);
      cam.x += (tx - cam.x) * Math.min(1, dt * 6.5);
      var ty = player.y - viewH * 0.52;
      var span = 780;
      if (viewH >= span) ty = -180 + (span - viewH) / 2;
      else ty = clamp(ty, -180, 600 - viewH);
      cam.y += (ty - cam.y) * Math.min(1, dt * 4.2);
    }

    render();
    requestAnimationFrame(frame);
  }

  /* ==================================================================
     boot
  ================================================================== */
  lang = detectLang();
  loadSave();
  resize();
  applyI18n();
  if (save.unlocked > 1) $('contBtn').style.display = '';
  // idle backdrop behind the intro overlay
  lvl = buildLevel(0);
  player = {
    x: lvl.plats[0].x + 60, y: lvl.plats[0].y - PH, vx: 0, vy: 0, dir: 1,
    ground: true, coyote: 0, buf: 0, jumpHeld: false,
    safe: { x: lvl.plats[0].x + 60, y: lvl.plats[0].y - PH },
    sq: 1, blink: 0, blinkT: 2, para: 0, walk: 0, fishGot: 0, hasLetter: true
  };
  cam.x = player.x - viewW * 0.44;
  cam.y = player.y - viewH * 0.52;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
