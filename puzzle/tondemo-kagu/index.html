<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>엉뚱가구 공방 · トンデモ家具工房 · Tondemo Furniture</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪑%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --green-deep:#122923;
    --green-0:#102621;
    --green-1:#1a3a32;
    --green-2:#255145;
    --green-3:#3a7362;
    --wood-l:#e2b479;
    --wood:#c98f52;
    --wood-d:#8f5f31;
    --paper:#f5e9cd;
    --paper-2:#e7d6b0;
    --ink:#3b3026;
    --ink-soft:#7a6a55;
    --amber:#f2b544;
    --amber-d:#d99420;
    --red:#e2725b;
    --cream:#fff6e6;
    --shadow-s:0 2px 8px rgba(0,0,0,.22);
    --shadow-m:0 10px 26px rgba(0,0,0,.30);
    --shadow-l:0 18px 48px rgba(0,0,0,.42);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
    color:var(--cream);
    background:
      radial-gradient(120% 80% at 50% -10%, #2b5a4c 0%, #1a3a32 45%, #102621 100%),
      #102621;
    background-attachment:fixed;
    overflow-x:hidden;
    padding:0 0 28px;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.030) 0 2px, rgba(0,0,0,0) 2px 9px);
    opacity:.6;
  }
  .wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 12px;}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 2px 6px;
  }
  .hbtn{
    border:1px solid rgba(255,255,255,.20);
    background:rgba(255,255,255,.09);
    color:var(--cream);
    font-size:13px;font-weight:700;
    padding:8px 11px;border-radius:12px;cursor:pointer;
    text-decoration:none;white-space:nowrap;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1), background .2s;
    backdrop-filter:blur(6px);
  }
  .hbtn:hover{background:rgba(255,255,255,.17);}
  .hbtn:active{transform:scale(.93);}
  .htitle{flex:1;text-align:center;line-height:1.05;min-width:0;}
  .htitle h1{
    font-size:clamp(19px,5.4vw,28px);font-weight:900;letter-spacing:-.5px;
    background:linear-gradient(180deg,#ffe9bd,#f2b544 70%,#dc9a2c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 0 rgba(0,0,0,.12);
  }
  .htitle p{font-size:10.5px;color:rgba(255,246,230,.58);margin-top:2px;letter-spacing:.3px;}

  /* ---------- day progress ---------- */
  .daybar{display:flex;align-items:center;justify-content:center;gap:7px;margin:4px 0 10px;}
  .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.16);transition:all .35s cubic-bezier(.34,1.56,.64,1);}
  .dot.done{background:var(--amber);box-shadow:0 0 10px rgba(242,181,68,.6);}
  .dot.now{background:var(--cream);transform:scale(1.45);box-shadow:0 0 12px rgba(255,255,255,.5);}
  .daytxt{font-size:11px;color:rgba(255,246,230,.55);margin-left:4px;font-weight:700;}

  /* ---------- layout ---------- */
  .stage{display:grid;gap:12px;}
  @media(min-width:880px){
    .stage{grid-template-columns:300px 1fr;align-items:start;}
    .col-r{display:grid;gap:12px;}
  }

  /* ---------- order note ---------- */
  .note{
    position:relative;
    background:linear-gradient(160deg,var(--paper) 0%,var(--paper-2) 100%);
    color:var(--ink);
    border-radius:6px 6px 12px 12px;
    padding:16px 14px 14px;
    box-shadow:var(--shadow-m);
    transform:rotate(-.6deg);
  }
  .note::before{
    content:"";position:absolute;inset:6px;border:1.5px dashed rgba(122,106,85,.34);border-radius:5px;pointer-events:none;
  }
  .note::after{
    content:"📌";position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:20px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));
  }
  .note .tag{
    display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.4px;
    color:#8a5a30;border:1.5px solid rgba(138,90,48,.45);border-radius:20px;padding:2px 9px;margin-bottom:8px;
  }
  .note h2{font-size:17px;font-weight:900;line-height:1.3;margin-bottom:5px;letter-spacing:-.3px;}
  .note .who{font-size:22px;position:absolute;top:12px;right:12px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));}
  .note .quote{font-size:12.5px;color:var(--ink-soft);line-height:1.5;font-style:italic;margin-bottom:11px;}
  .checks{display:grid;gap:5px;}
  .chk{
    display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
    background:rgba(255,255,255,.42);border-radius:9px;padding:6px 8px;
    color:var(--ink-soft);transition:all .3s ease;
  }
  .chk .box{
    width:17px;height:17px;flex:none;border-radius:5px;border:2px solid rgba(122,106,85,.4);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
  }
  .chk.on{background:rgba(74,133,112,.20);color:#2c5a49;}
  .chk.on .box{background:linear-gradient(160deg,#6fb894,#3f7d68);border-color:#3f7d68;}
  .chk.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}

  /* ---------- workbench ---------- */
  .bench{
    position:relative;border-radius:16px;overflow:hidden;
    background:#0d211d;
    box-shadow:var(--shadow-m), inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .bench canvas{display:block;width:100%;height:auto;touch-action:none;}
  .benchhint{
    position:absolute;left:0;right:0;bottom:6px;text-align:center;
    font-size:10.5px;color:rgba(59,48,38,.5);font-weight:700;pointer-events:none;
    transition:opacity .4s;
  }

  /* ---------- palette ---------- */
  .pal{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.11);
    border-radius:16px;padding:9px;
    box-shadow:var(--shadow-s);
  }
  .tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:7px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:1 0 auto;border:none;cursor:pointer;white-space:nowrap;
    background:rgba(255,255,255,.07);color:rgba(255,246,230,.66);
    font-size:12px;font-weight:800;padding:7px 12px;border-radius:11px;
    transition:all .22s cubic-bezier(.34,1.56,.64,1);font-family:inherit;
  }
  .tab.on{background:linear-gradient(160deg,var(--amber),var(--amber-d));color:#3a2a08;box-shadow:0 4px 12px rgba(242,181,68,.32);}
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:7px;}
  .item{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:linear-gradient(165deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
    border:1.5px solid rgba(255,255,255,.10);
    border-radius:13px;padding:7px 4px 6px;cursor:grab;touch-action:none;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .2s;
  }
  .item:hover{border-color:rgba(242,181,68,.5);transform:translateY(-2px);}
  .item.sel{border-color:var(--amber);box-shadow:0 0 0 2px rgba(242,181,68,.28),0 6px 16px rgba(0,0,0,.28);background:linear-gradient(165deg,rgba(242,181,68,.22),rgba(242,181,68,.06));}
  .item canvas{width:46px;height:46px;pointer-events:none;}
  .item span{font-size:10px;font-weight:700;color:rgba(255,246,230,.78);text-align:center;line-height:1.15;}
  .ghost{
    position:fixed;z-index:90;pointer-events:none;width:64px;height:64px;
    transform:translate(-50%,-50%) scale(1.1);filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));
    opacity:.95;
  }

  /* ---------- actions ---------- */
  .acts{display:flex;gap:8px;align-items:stretch;}
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-weight:900;
    border-radius:14px;transition:transform .16s cubic-bezier(.34,1.56,.64,1),filter .2s,box-shadow .2s;
  }
  .btn:active{transform:scale(.95);}
  .btn-main{
    flex:1;font-size:16px;padding:15px 10px;color:#3a2a08;
    background:linear-gradient(165deg,#ffd97a,var(--amber) 55%,var(--amber-d));
    box-shadow:0 7px 0 #a8720f, 0 12px 24px rgba(0,0,0,.34);
  }
  .btn-main:active{box-shadow:0 3px 0 #a8720f, 0 6px 14px rgba(0,0,0,.34);transform:translateY(4px) scale(.99);}
  .btn-sub{
    font-size:12.5px;padding:0 14px;color:rgba(255,246,230,.8);
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
  }

  /* ---------- overlay ---------- */
  .ov{
    position:fixed;inset:0;z-index:100;display:none;
    align-items:center;justify-content:center;padding:16px;
    background:rgba(8,22,19,.80);backdrop-filter:blur(9px);
    animation:fade .3s ease;
  }
  .ov.show{display:flex;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .panel{
    width:100%;max-width:420px;max-height:92vh;overflow-y:auto;
    background:linear-gradient(170deg,#22483e,#153029);
    border:1px solid rgba(255,255,255,.13);
    border-radius:22px;padding:18px 16px 16px;
    box-shadow:var(--shadow-l);text-align:center;
    animation:rise .42s cubic-bezier(.22,1.2,.4,1);
  }
  @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
  .panel h3{font-size:19px;font-weight:900;margin-bottom:3px;letter-spacing:-.3px;}
  .panel .sub{font-size:12px;color:rgba(255,246,230,.6);margin-bottom:12px;}
  .scene{width:100%;border-radius:16px;overflow:hidden;background:#f7efe0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
  .scene canvas{display:block;width:100%;height:auto;}
  .stars{font-size:27px;letter-spacing:3px;margin:11px 0 3px;min-height:34px;}
  .star{display:inline-block;opacity:0;transform:scale(.3) rotate(-40deg);}
  .star.in{animation:starin .5s cubic-bezier(.34,1.56,.64,1) forwards;}
  @keyframes starin{to{opacity:1;transform:none}}
  .say{
    background:rgba(255,255,255,.09);border-radius:14px;padding:11px 13px;
    font-size:13.5px;line-height:1.55;font-weight:600;color:#fff6e6;margin:8px 0 14px;
    border:1px solid rgba(255,255,255,.10);min-height:44px;
  }
  .say b{display:block;font-size:10.5px;color:var(--amber);margin-bottom:3px;letter-spacing:.5px;}

  /* ---------- end / gallery ---------- */
  .shelf{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 14px;}
  .work{
    background:linear-gradient(170deg,#f7efe0,#eadfc8);border-radius:13px;padding:7px 6px 8px;
    box-shadow:0 6px 14px rgba(0,0,0,.28);
  }
  .work canvas{display:block;width:100%;height:auto;border-radius:8px;}
  .work .wn{font-size:10px;font-weight:800;color:#5b4a34;margin-top:4px;line-height:1.2;}
  .work .ws{font-size:11px;color:#d99420;letter-spacing:1px;}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:6px 0 12px;}
  .empty{font-size:12.5px;color:rgba(255,246,230,.55);padding:26px 0;}
  .btnrow{display:flex;gap:8px;}
  .btnrow .btn{flex:1;padding:13px 8px;font-size:14px;}
  .btn-ghost{background:rgba(255,255,255,.10);color:var(--cream);border:1px solid rgba(255,255,255,.17);}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:rgba(16,38,33,.94);border:1px solid rgba(242,181,68,.4);color:var(--cream);
    font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:120;
    opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.34,1.56,.64,1);
    box-shadow:var(--shadow-m);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
  }
  .ga-vote{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 2px;font-size:14px;line-height:1.2;opacity:.92}
  .ga-vote[hidden]{display:none}
  .ga-vote-btn{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.85;-webkit-tap-highlight-color:transparent}
  .ga-vote-btn:active{opacity:1}
  .ga-vote.done .ga-vote-btn{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="hbtn" href="../../index.html" id="homeBtn">← 홈</a>
    <div class="htitle">
      <h1 id="tTitle">엉뚱가구 공방</h1>
      <p id="tSub">トンデモ家具工房 · Tondemo Furniture</p>
    </div>
    <button class="hbtn" id="soundBtn" aria-label="sound">🔊</button>
    <button class="hbtn" id="langBtn">🇰🇷 KO</button>
  </header>

  <div class="daybar">
    <span class="dot" data-i="0"></span><span class="dot" data-i="1"></span>
    <span class="dot" data-i="2"></span><span class="dot" data-i="3"></span>
    <span class="daytxt" id="dayTxt"></span>
  </div>

  <div class="stage">
    <div class="note" id="note">
      <span class="tag" id="tagTxt">ORDER</span>
      <span class="who" id="who">🙂</span>
      <h2 id="oName"></h2>
      <p class="quote" id="oNote"></p>
      <div class="checks" id="checks"></div>
    </div>

    <div class="col-r">
      <div class="bench">
        <canvas id="bench"></canvas>
        <div class="benchhint" id="hint"></div>
      </div>

      <div class="pal">
        <div class="tabs" id="tabs"></div>
        <div class="items" id="items"></div>
      </div>

      <div class="acts">
        <button class="btn btn-main" id="deliver">납품!</button>
        <button class="btn btn-sub" id="clearBtn">🧹</button>
        <button class="btn btn-sub" id="galBtn">🖼️</button>
      </div>
    </div>
  </div>
</div>

<!-- reaction overlay -->
<div class="ov" id="ovReact"><div class="panel">
  <h3 id="rTitle"></h3>
  <p class="sub" id="rSub"></p>
  <div class="scene"><canvas id="rCanvas"></canvas></div>
  <div class="stars" id="rStars"></div>
  <div class="say" id="rSay"></div>
  <button class="btn btn-main" id="rNext" style="width:100%"></button>
</div></div>

<!-- end of day -->
<div class="ov" id="ovEnd"><div class="panel">
  <h3 id="eTitle"></h3>
  <p class="sub" id="eSub"></p>
  <div class="shelf" id="shelf"></div>
  <p class="sub" id="eMsg" style="margin-bottom:14px;"></p>
  <div class="ga-vote" id="gaVote" hidden>
    <span class="ga-vote-q">또 할래?</span>
    <button type="button" class="ga-vote-btn" data-choice="yes">응</button>
    <button type="button" class="ga-vote-btn" data-choice="unsure">글쎄</button>
  </div>
  <div class="btnrow">
    <button class="btn btn-main" id="eAgain"></button>
    <a class="btn btn-ghost" href="../../index.html" id="eHome" style="display:flex;align-items:center;justify-content:center;text-decoration:none;"></a>
  </div>
</div></div>

<!-- gallery -->
<div class="ov" id="ovGal"><div class="panel">
  <h3 id="gTitle"></h3>
  <p class="sub" id="gSub"></p>
  <div class="gal" id="galGrid"></div>
  <p class="empty" id="galEmpty" style="display:none"></p>
  <div class="btnrow"><button class="btn btn-ghost" id="gClose"></button></div>
</div></div>

<div class="toast" id="toast"></div>

function drawPartAt(c,id,x,y,sc,alpha){
  c.save(); c.translate(x,y); if(sc&&sc!==1) c.scale(sc,sc);
  if(alpha!==undefined) c.globalAlpha=alpha;
  DRAW[id](c);
  c.restore();
}

/* draw a whole build in virtual space */
function drawBuild(c,build,tm,wob){
  var i,s,id;
  /* soft ground shadow */
  c.save();
  c.globalAlpha=.15; c.fillStyle='#1e3a2f';
  c.beginPath(); c.ellipse(200,FLOOR+4,140,13,0,0,7); c.fill();
  c.restore();
  var sh = wob? Math.sin(tm*2.1)*1.4 : 0;
  var rot = wob? Math.sin(tm*1.5)*0.008 : 0;
  c.save(); c.translate(200,FLOOR); c.rotate(rot); c.translate(-200,-FLOOR+sh);
  if(build.back) drawPartAt(c,build.back,200,118,1);
  for(i=0;i<6;i++){ id=build['lg'+i]; if(id){ var sl=slotById('lg'+i); drawPartAt(c,id,sl.x,sl.y,1); } }
  if(build.top) drawPartAt(c,build.top,200,TOPY,1);
  for(i=0;i<3;i++){ id=build['cu'+i]; if(id) drawPartAt(c,id,200,slotById('cu'+i).y,1); }
  for(i=0;i<4;i++){ id=build['dc'+i]; if(id){ var d=slotById('dc'+i); drawPartAt(c,id,d.x,d.y,1); } }
  c.restore();
}

/* fit VW×VH into a canvas element and run a draw callback */
function fitDraw(cv,w,h,cb,bg){
  var dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.height=h+'px';
  var c=cv.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,w,h);
  if(bg){ c.fillStyle=bg; c.fillRect(0,0,w,h); }
  var s=Math.min(w/VW,h/VH);
  c.save(); c.translate((w-VW*s)/2,(h-VH*s)/2); c.scale(s,s);
  cb(c,s);
  c.restore();
  return c;
}

/* blueprint paper background inside virtual space */
function paper(c){
  var M=260; /* overscan so no gutters appear at any aspect ratio */
  c.fillStyle='#f7efe0'; c.fillRect(-M,-M,VW+M*2,VH+M*2);
  c.save(); c.globalAlpha=.55; c.strokeStyle='#c9d6c6'; c.lineWidth=.8;
  for(var x=-M;x<=VW+M;x+=20){ c.beginPath(); c.moveTo(x,-M); c.lineTo(x,VH+M); c.stroke(); }
  for(var y=-M;y<=VH+M;y+=20){ c.beginPath(); c.moveTo(-M,y); c.lineTo(VW+M,y); c.stroke(); }
  c.globalAlpha=.75; c.strokeStyle='#aec3ac'; c.lineWidth=1;
  for(var x2=0;x2<=VW+M;x2+=100){ c.beginPath(); c.moveTo(x2,-M); c.lineTo(x2,VH+M); c.stroke(); }
  for(var x3=-100;x3>=-M;x3-=100){ c.beginPath(); c.moveTo(x3,-M); c.lineTo(x3,VH+M); c.stroke(); }
  for(var y2=0;y2<=VH+M;y2+=100){ c.beginPath(); c.moveTo(-M,y2); c.lineTo(VW+M,y2); c.stroke(); }
  for(var y3=-100;y3>=-M;y3-=100){ c.beginPath(); c.moveTo(-M,y3); c.lineTo(VW+M,y3); c.stroke(); }
  c.restore();
  /* bench surface */
  c.save();
  c.fillStyle='rgba(160,120,70,.16)'; c.fillRect(-M,FLOOR,VW+M*2,VH-FLOOR+M);
  c.strokeStyle='rgba(122,77,38,.35)'; c.lineWidth=2;
  c.beginPath(); c.moveTo(-M,FLOOR); c.lineTo(VW+M,FLOOR); c.stroke();
  c.restore();
  /* tape corners */
  c.save(); c.globalAlpha=.5; c.fillStyle='#e6dcc2';
  c.translate(20,16); c.rotate(-.5); c.fillRect(-24,-8,48,16); c.restore();
  c.save(); c.globalAlpha=.5; c.fillStyle='#e6dcc2';
  c.translate(VW-20,16); c.rotate(.5); c.fillRect(-24,-8,48,16); c.restore();
}

function makeIcon(id,size){
  var cv=document.createElement('canvas');
  var dpr=Math.min(window.devicePixelRatio||1,2.5);

  var bb=PARTS[id].bb, w=bb[2]-bb[0], h=bb[3]-bb[1];

}

/* ============================ drag & place ============================ */
var ghostEl=null;
function startDrag(ev,id,el){
  ac();
  ev.preventDefault();
  dragging={id:id, moved:false, x:ev.clientX, y:ev.clientY};
  selPart=id;
  /* never re-render the palette mid-drag: it would destroy the capturing node */
  var sib=el.parentNode.children;
  for(var i=0;i<sib.length;i++) sib[i].classList.toggle('sel', sib[i]===el);
  var g=makeIcon(id,64);
  ghostEl=g; g.className='ghost';
  g.style.left=ev.clientX+'px'; g.style.top=ev.clientY+'px';
  document.body.appendChild(g);
  try{ el.setPointerCapture(ev.pointerId); }catch(e){}
  el.addEventListener('pointermove',onDragMove);
  el.addEventListener('pointerup',onDragEnd);
  el.addEventListener('pointercancel',onDragEnd);
  dragging.el=el;
}
function onDragMove(ev){
  if(!dragging) return;
  if(Math.abs(ev.clientX-dragging.x)>4||Math.abs(ev.clientY-dragging.y)>4) dragging.moved=true;
  if(ghostEl){ ghostEl.style.left=ev.clientX+'px'; ghostEl.style.top=ev.clientY+'px'; }
  var p=toVirtual(ev.clientX,ev.clientY);
  hoverSlot=p? nearestSlot(p.x,p.y,PARTS[dragging.id].cat,64) : null;
}
function onDragEnd(ev){
  if(!dragging) return;
  var d=dragging;
  if(d.el){ d.el.removeEventListener('pointermove',onDragMove); d.el.removeEventListener('pointerup',onDragEnd); d.el.removeEventListener('pointercancel',onDragEnd); }
  if(ghostEl&&ghostEl.parentNode) ghostEl.parentNode.removeChild(ghostEl);
  ghostEl=null; dragging=null; hoverSlot=null;
  if(d.moved){
    var p=toVirtual(ev.clientX,ev.clientY);
    if(p){ var s=nearestSlot(p.x,p.y,PARTS[d.id].cat,90); if(s) place(s,d.id); }
  }
}
function toVirtual(cx,cy){
  var r=benchCv.getBoundingClientRect();
  if(cx<r.left-30||cx>r.right+30||cy<r.top-30||cy>r.bottom+30) return null;
  var s=Math.min(r.width/VW,r.height/VH);
  var ox=(r.width-VW*s)/2, oy=(r.height-VH*s)/2;
  return {x:(cx-r.left-ox)/s, y:(cy-r.top-oy)/s};
}
function nearestSlot(x,y,cat,maxd){
  var best=null,bd=1e9;
  for(var i=0;i<SLOTS.length;i++){
    var s=SLOTS[i]; if(s.cat!==cat) continue;
    var a=slotAnchor(s);
    var dx=a.x-x, dy=a.y-y;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(build[s.id]) d+=26; /* prefer empty slots */
    if(d<bd){ bd=d; best=s; }
  }
  return bd<=maxd? best : (cat==='leg'||cat==='decor'? null : best);
}
function place(slot,id){
  gaFirstMove();
  build[slot.id]=id;
  sHammer();
  if(!reduce) puff(slotAnchor(slot));
  renderChecks(false);
}
function removeAt(vx,vy){
  var order=['dc0','dc1','dc2','dc3','cu2','cu1','cu0','lg0','lg1','lg2','lg3','lg4','lg5','top','back'];
  for(var i=0;i<order.length;i++){
    var sid=order[i], id=build[sid]; if(!id) continue;
    var s=slotById(sid), bb=PARTS[id].bb;
    var x0=s.x+bb[0], x1=s.x+bb[2], y0=s.y+bb[1], y1=s.y+bb[3];
    if(vx>=x0-4&&vx<=x1+4&&vy>=y0-4&&vy<=y1+4){
      delete build[sid]; sPop(); if(!reduce) puff(slotAnchor(s)); renderChecks(false); return true;
    }
  }
  return false;
}
function puff(p){
  for(var i=0;i<12;i++){
    var a=Math.random()*Math.PI*2, sp=.6+Math.random()*2.2;
    dust.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.1,life:1,r:1.2+Math.random()*2.4});
  }
}

benchCv.addEventListener('pointerdown',function(ev){
  ac();
  var p=toVirtual(ev.clientX,ev.clientY); if(!p) return;
  if(removeAt(p.x,p.y)) return;
  if(selPart){
    var s=nearestSlot(p.x,p.y,PARTS[selPart].cat,999);
    if(s) place(s,selPart);
  }
});

/* ============================ bench loop ============================ */
var t0=performance.now();
function benchFrame(now){
  var tm=(now-t0)/1000;
  var w=benchWrap.clientWidth||340;
  var h=Math.round(w*VH/VW);
  h=Math.max(200,Math.min(h,420));
  fitDraw(benchCv,w,h,function(c,sc){
    paper(c);
    /* empty slot markers */
    c.save();
    for(var i=0;i<SLOTS.length;i++){
      var s=SLOTS[i];
      var interesting = dragging? (PARTS[dragging.id].cat===s.cat) : (selPart? PARTS[selPart].cat===s.cat : false);
      if(build[s.id]&&!interesting) continue;
      var a=slotAnchor(s);
      if(interesting){
        var on = hoverSlot&&hoverSlot.id===s.id;
        c.globalAlpha= on? .95 : .45;
        c.setLineDash(on?[]:[4,4]);
        c.lineWidth= on? 2.6 : 1.6;
        c.strokeStyle= on? '#e08a2a' : '#8aa08c';
        c.beginPath(); c.arc(a.x,a.y, on?15:10, 0, 7); c.stroke();
        if(on){ c.globalAlpha=.18; c.fillStyle='#f2b544'; c.fill(); }
      }else if(!build[s.id]){
        c.globalAlpha=.16; c.setLineDash([3,4]); c.lineWidth=1.2; c.strokeStyle='#7f9280';
        c.beginPath(); c.arc(a.x,a.y,6,0,7); c.stroke();
      }
    }
    c.setLineDash([]); c.restore();
    drawBuild(c,build,tm,!reduce);
    /* dust */
    for(var d=dust.length-1;d>=0;d--){
      var p=dust[d];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.14; p.life-=0.026;
      if(p.life<=0){ dust.splice(d,1); continue; }
      c.globalAlpha=Math.max(0,p.life)*.85;
      c.fillStyle='#c79a5e';
      c.beginPath(); c.arc(p.x,p.y,p.r,0,7); c.fill();
    }
    c.globalAlpha=1;
  });
  var hn=$('#hint');
  hn.style.opacity = summarize(build).n>1? '0':'1';
  requestAnimationFrame(benchFrame);
}
requestAnimationFrame(benchFrame);

  }
  cancelAnimationFrame(rAnim);
  function frame(now){
    if(!$('#ovReact').classList.contains('show')) return;
    var tm=(now-start)/1000;
    var w=$('#rCanvas').parentNode.clientWidth||320;
    var h=Math.round(w*VH/VW);
    fitDraw($('#rCanvas'),w,h,function(c){
      paper(c);
      var bounce = reduce?0:Math.abs(Math.sin(tm*3.4))*10;
      drawBuild(c,snap,tm*2.4,!reduce);
      /* customer */
      c.save();
      c.font='54px serif'; c.textAlign='center'; c.textBaseline='alphabetic';
      var cx = 336, cy = FLOOR-6-bounce;
      c.globalAlpha=.16; c.fillStyle='#1e3a2f';
      c.beginPath(); c.ellipse(cx,FLOOR+3,24,6,0,0,7); c.fill(); c.globalAlpha=1;
      c.translate(cx,cy); c.rotate(reduce?0:Math.sin(tm*3.4)*0.10);
      c.fillText(o.who,0,0);
      c.restore();
      for(var i=0;i<conf.length;i++){
        var p=conf[i]; p.y+=p.vy; p.x+=p.vx; if(p.y>VH+20){ p.y=-20; p.x=200+(Math.random()-.5)*220; }
        c.save(); c.translate(p.x,p.y); c.rotate(p.r+tm*3); c.fillStyle=p.c;
        c.fillRect(-3,-2,6,4); c.restore();
      }
    });
    rAnim=requestAnimationFrame(frame);
  }
  rAnim=requestAnimationFrame(frame);
}
$('#rNext').addEventListener('click',function(){
  sTick();
  $('#ovReact').classList.remove('show');
  cancelAnimationFrame(rAnim);
  if(idx>=3){ showEnd(); }
  else{ idx++; build={}; prevMet=[false,false,false]; sSaw(); renderOrder(); renderDay(); renderChecks(true); }
});

/* ============================ storage ============================ */
var GKEY='in9-tondemo-gallery';
function loadGallery(){
  try{ var r=localStorage.getItem(GKEY); return r? JSON.parse(r):[]; }catch(e){ return []; }
}
function saveWork(w){
  try{
    var g=loadGallery(); g.unshift(w); if(g.length>30) g=g.slice(0,30);
    localStorage.setItem(GKEY,JSON.stringify(g));
  }catch(e){}
}
function miniCanvas(b,w){
  var cv=document.createElement('canvas');
  cv.style.width='100%';
  var h=Math.round(w*VH/VW);
  fitDraw(cv,w,h,function(c){ paper(c); drawBuild(c,b,0,false); });
  cv.style.width='100%'; cv.style.height='auto';
  return cv;
}

/* ============================ end of day ============================ */
function showEnd(quiet){
  var tot=0; results.forEach(function(r){ tot+=r.s; });
  $('#eTitle').textContent=T().eTitle;
  $('#eSub').textContent=T().eSub;
  $('#eMsg').textContent=fmt(T().total,{n:tot})+' · '+T().eMsg;
  $('#eAgain').textContent=T().again;
  $('#eHome').textContent=T().goHome;
  var sh=$('#shelf'); sh.innerHTML='';
  results.forEach(function(r){
    var d=document.createElement('div'); d.className='work';
    d.appendChild(miniCanvas(r.b,150));
    var n=document.createElement('div'); n.className='wn'; n.textContent=T().orders[r.o].n; d.appendChild(n);
    var s=document.createElement('div'); s.className='ws';
    s.textContent=new Array(r.s+1).join('★')+new Array(5-r.s+1).join('☆'); d.appendChild(s);
    sh.appendChild(d);
  });
  $('#ovEnd').classList.add('show');
  if(!quiet) sFan();
  gaRoundComplete('day','clear',{stars_total:tot});
}
$('#eAgain').addEventListener('click',function(){
  sTick(); $('#ovEnd').classList.remove('show'); sSaw(); newDay();
  /* replay 이벤트는 여기서 보내지 않는다 — gaFirstMove 가 첫 조작에서 보낸다 */
});

/* ============================ gallery ============================ */
function showGallery(){
  var g=loadGallery();
  $('#gTitle').textContent=T().gTitle;
  $('#gSub').textContent=fmt(T().gSub,{n:g.length});
  $('#gClose').textContent=T().close;
  var grid=$('#galGrid'); grid.innerHTML='';
  $('#galEmpty').style.display= g.length? 'none':'block';
  $('#galEmpty').textContent=T().gEmpty;
  g.forEach(function(w){
    var d=document.createElement('div'); d.className='work';
    d.appendChild(miniCanvas(w.b,120));
    var n=document.createElement('div'); n.className='wn'; n.textContent=(T().orders[w.o]||{n:'?'}).n; d.appendChild(n);
    var s=document.createElement('div'); s.className='ws';
    s.textContent=new Array(w.s+1).join('★'); d.appendChild(s);
    grid.appendChild(d);
  });
  $('#ovGal').classList.add('show');
}
$('#galBtn').addEventListener('click',function(){ ac(); sTick(); showGallery(); });
$('#gClose').addEventListener('click',function(){ sTick(); $('#ovGal').classList.remove('show'); });
$('#ovGal').addEventListener('click',function(e){ if(e.target===this){ $('#ovGal').classList.remove('show'); } });

/* ============================ toast ============================ */
var toastT=null;
function toast(msg){
  var el=$('#toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove('show'); },1900);
}

/* ============================ buttons ============================ */
$('#deliver').addEventListener('click',function(){
  ac();
  var wasEmpty = summarize(build).n===0;
  deliver();
  toast(wasEmpty? T().empty : T().saved);
});
$('#clearBtn').addEventListener('click',function(){
  ac(); build={}; sSaw();
  if(!reduce){ for(var i=0;i<4;i++) puff({x:120+i*55,y:FLOOR-40}); }
  renderChecks(false);
});
$('#soundBtn').addEventListener('click',function(){
  sndOn=!sndOn; this.textContent= sndOn? '🔊':'🔈';
  if(sndOn){ ac(); sTick(); }
});
$('#langBtn').addEventListener('click',function(){
  lang=LANGS[(LANGS.indexOf(lang)+1)%3];
  try{ localStorage.setItem('in9-lang',lang); }catch(e){}
  sTick(); applyLang();
});
function applyLang(){
  document.documentElement.lang=lang;
  $('#langBtn').textContent=LBTN[lang];
  $('#tTitle').textContent=NAMES[lang];
  $('#tSub').textContent=['ko','ja','en'].filter(function(l){return l!==lang;}).map(function(l){return NAMES[l];}).join(' · ');
  $('#homeBtn').textContent=T().home;
  $('#deliver').textContent=T().deliver;
  $('#hint').textContent=T().hint;
  renderTabs(); renderItems(); renderOrder(); renderDay(); renderChecks(true);
  if($('#ovGal').classList.contains('show')) showGallery();
  if($('#ovEnd').classList.contains('show')) showEnd(true);
  try{ if($('#ovEnd').classList.contains('show') && gaS.voteShown && !gaS.voted) gaVoteShow(gaS.voteScene); }catch(e){}
}

/* ---- GA4 portal standard v1 (2026-08-19) ---- */
var GA_GAME='tondemo-kagu';
var gaS={started:false,completed:false,voted:false,voteShown:false,voteScene:'main',t0:0};
function gaLang(){ try{ return lang||'ko'; }catch(e){ return 'ko'; } }
function gaSend(name,p){ try{ if(typeof gtag!=='function')return; p=p||{}; p.game_id=GA_GAME; if(!p.lang)p.lang=gaLang(); gtag('event',name,p);}catch(e){} }
function gaRoundStart(scene){
  gaS.t0=Date.now();
  if(gaS.completed){ gaS.completed=false; gaSend('game_step',{step:'replay',scene:scene||'main'}); return; }
  if(gaS.started)return; gaS.started=true; gaSend('game_step',{step:'start',scene:scene||'main'});
}
/* 시작도 재시작도 '첫 조작' 시점에 잡는다 — 주문을 읽는 시간은 play_sec 에서 빠진다 */
function gaFirstMove(){ if(!gaS.started||gaS.completed) gaRoundStart('day'); }
function gaRoundComplete(scene,result,extra){
  if(gaS.completed)return; gaS.completed=true;
  var p={scene:scene||'main',result:result||'clear',play_sec:gaS.t0?Math.round((Date.now()-gaS.t0)/1000):0};
  if(extra){ for(var k in extra){ if(extra.hasOwnProperty(k))p[k]=extra[k]; } }
  gaSend('game_complete',p);
  gaVoteShow(p.scene);
}
var GA_VOTE_COPY={ko:{q:'또 할래?',yes:'응',no:'글쎄',thx:'고마워요!'},ja:{q:'また あそぶ？',yes:'うん',no:'うーん',thx:'ありがとう！'},en:{q:'Want another go?',yes:'Yes',no:'Not sure',thx:'Thanks!'}};
function gaVoteShow(scene){
  var el=document.getElementById('gaVote'); if(!el||gaS.voted)return;
  var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
  el.querySelector('.ga-vote-q').textContent=c.q;
  el.querySelector('[data-choice="yes"]').textContent=c.yes;
  el.querySelector('[data-choice="unsure"]').textContent=c.no;
  gaS.voteScene=scene||'main'; gaS.voteShown=true; el.hidden=false; el.classList.remove('done');
}
(function(){ var el=document.getElementById('gaVote'); if(!el)return;
  el.addEventListener('click',function(e){
    var b=e.target; while(b&&b!==el&&!(b.getAttribute&&b.getAttribute('data-choice')))b=b.parentNode;
    if(!b||b===el||gaS.voted)return; gaS.voted=true;
    gaSend('game_vote',{scene:gaS.voteScene,choice:b.getAttribute('data-choice')});
    var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
    el.classList.add('done'); el.querySelector('.ga-vote-q').textContent=c.thx;
    setTimeout(function(){ el.hidden=true; },1200);
  });
})();

/* ============================ boot ============================ */
newDay();
applyLang();
document.addEventListener('pointerdown',function once(){ ac(); document.removeEventListener('pointerdown',once); });
window.addEventListener('resize',function(){ /* canvas resizes each frame */ });
})();
