<html lang="ko">

<title>빛 접기 · 光おり · Fold the Light</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --night0:#05071c; --night1:#0b1030; --night2:#141a46; --night3:#1d2560;
  --panel:rgba(16,21,60,.72); --panel2:rgba(28,34,84,.62);
  --line:rgba(150,165,255,.16); --line2:rgba(150,165,255,.30);
  --gold0:#fff6d8; --gold1:#ffe3a8; --gold2:#ffcf7a; --gold3:#ffb347; --gold4:#e08a2c;
  --red0:#ff9a7a; --red1:#f2604a; --red2:#c9302c; --red3:#8b1a1f;
  --ink:#e8ecff; --ink-soft:#a8b2e0; --ink-faint:rgba(168,178,224,.66);
  --jade:#7fe3c4;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(120% 80% at 50% -18%, #23306e 0%, #131a48 42%, #080b26 78%, #04061a 100%) fixed;
  min-height:100dvh; -webkit-tap-highlight-color:transparent;
  touch-action:manipulation; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,240,200,.85), transparent 60%),
    radial-gradient(1.2px 1.2px at 78% 12%, rgba(210,225,255,.7), transparent 60%),
    radial-gradient(1.6px 1.6px at 34% 62%, rgba(255,235,190,.55), transparent 60%),
    radial-gradient(1.1px 1.1px at 88% 48%, rgba(255,245,220,.6), transparent 60%),
    radial-gradient(1.3px 1.3px at 58% 82%, rgba(200,215,255,.5), transparent 60%),
    radial-gradient(1px 1px at 22% 88%, rgba(255,240,210,.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 68% 32%, rgba(255,230,180,.5), transparent 60%),
    radial-gradient(1px 1px at 6% 52%, rgba(220,230,255,.4), transparent 60%);
}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;
  padding:12px 15px calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}

/* ---------- header ---------- */
header{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.titles{flex:1;text-align:center;min-width:0;padding:2px 0}
h1{font-size:clamp(1.34rem,5.6vw,1.82rem);font-weight:800;letter-spacing:.01em;line-height:1.16;
  background:linear-gradient(180deg,#fff4d2,#ffca6e 62%,#e79a34);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,180,80,.34))}
.sub{font-size:.68rem;color:var(--ink-faint);letter-spacing:.07em;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid var(--line2);background:linear-gradient(180deg,rgba(48,58,124,.62),rgba(24,30,74,.62));
  border-radius:999px;padding:8px 11px;font-size:.74rem;font-weight:700;color:var(--ink-soft);
  box-shadow:0 2px 10px rgba(0,0,0,.34), inset 0 1px 0 rgba(180,195,255,.16);
  transition:transform .16s cubic-bezier(.34,1.56,.64,1),border-color .2s,color .2s;
  text-decoration:none;white-space:nowrap;line-height:1}
.chip:hover{border-color:rgba(255,200,120,.44);color:var(--gold1)}
.chip:active{transform:scale(.9)}
.top-btns{display:flex;gap:6px;flex-shrink:0}
.chip.sq{padding:8px 9px}

/* ---------- screens ---------- */
.screen{display:none;animation:fadeUp .42s cubic-bezier(.22,.9,.3,1)}
.screen.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- menu ---------- */
.menu-head{text-align:center;margin:6px 0 14px}
.menu-head .mh-t{font-size:.95rem;font-weight:700;color:var(--gold1);letter-spacing:.04em}
.menu-head .mh-s{font-size:.74rem;color:var(--ink-faint);margin-top:5px}
.progbar{height:5px;border-radius:99px;background:rgba(255,255,255,.08);margin:11px auto 0;max-width:230px;overflow:hidden}
.progbar i{display:block;height:100%;border-radius:99px;width:0%;
  background:linear-gradient(90deg,var(--gold4),var(--gold2),var(--gold0));
  box-shadow:0 0 12px rgba(255,190,90,.65);transition:width .7s cubic-bezier(.22,.9,.3,1)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px 9px;margin-top:4px}
@media(min-width:430px){.grid{grid-template-columns:repeat(6,1fr);gap:13px 11px}}
.cellbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:3px 0 5px;
  border-radius:14px;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.cellbtn:active{transform:scale(.9)}
.cellbtn:disabled{cursor:default;opacity:.5}
.lant{position:relative;width:100%;max-width:46px;aspect-ratio:4/5;border-radius:44% 44% 40% 40%/32% 32% 28% 28%;
  background:linear-gradient(180deg,#2a3068,#161b45);
  border:1px solid rgba(150,165,255,.2);
  box-shadow:inset 0 -4px 10px rgba(0,0,0,.4);transition:all .45s cubic-bezier(.22,.9,.3,1)}
.lant::before{content:"";position:absolute;left:22%;right:22%;top:-4px;height:4px;border-radius:2px;
  background:linear-gradient(180deg,#5a4a34,#33291c)}
.lant::after{content:"";position:absolute;inset:14% 12%;border-radius:inherit;opacity:.32;
  background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.28) 3px 4px)}
.cellbtn.open .lant{background:linear-gradient(180deg,#6d2b2c,#3c1519);border-color:rgba(255,140,110,.3)}
.cellbtn.done .lant{background:radial-gradient(circle at 50% 38%,#fff6d4,#ffcb70 46%,#e08a2c 82%);
  border-color:rgba(255,220,150,.6);
  box-shadow:0 0 18px rgba(255,180,80,.5),0 0 40px rgba(255,150,50,.24),inset 0 -4px 10px rgba(160,80,10,.35)}
.cellbtn .num{font-size:.7rem;font-weight:800;color:var(--ink-faint);letter-spacing:.02em}
.cellbtn.open .num{color:var(--red0)}
.cellbtn.done .num{color:var(--gold1)}
.menu-foot{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:9px}

/* ---------- game ---------- */
.statusbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:2px 0 10px;padding:0 3px}
.stage-lab{font-size:.86rem;font-weight:800;color:var(--gold1);letter-spacing:.03em}
.lamp-count{display:flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;color:var(--ink-soft)}
.lamp-count b{color:var(--gold2);font-size:.86rem}
.boardwrap{position:relative;border-radius:20px;overflow:hidden;
  background:linear-gradient(165deg,rgba(30,38,96,.5),rgba(10,14,42,.72));
  border:1px solid var(--line);
  box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,200,120,.05) inset}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.hint{text-align:center;font-size:.73rem;color:var(--ink-faint);margin-top:11px;line-height:1.6;min-height:2.2em}
.gamebtns{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:22px;
  background:radial-gradient(90% 70% at 50% 40%,rgba(20,14,40,.6),rgba(4,6,22,.86));
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.ov.on{display:flex;animation:ovIn .38s ease}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.card{width:100%;max-width:330px;text-align:center;padding:26px 22px 22px;border-radius:22px;
  background:linear-gradient(170deg,rgba(46,40,92,.94),rgba(20,18,52,.96));
  border:1px solid rgba(255,206,140,.26);
  box-shadow:0 22px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,225,170,.16);
  animation:cardIn .5s cubic-bezier(.22,1.1,.34,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
.card .glyph{font-size:2.5rem;line-height:1;filter:drop-shadow(0 0 18px rgba(255,180,80,.6))}
.card h2{font-size:1.18rem;font-weight:800;margin-top:12px;letter-spacing:.01em;
  background:linear-gradient(180deg,#fff4d2,#ffc366);-webkit-background-clip:text;background-clip:text;color:transparent}
.card .msg{font-size:.83rem;color:var(--ink-soft);margin-top:9px;line-height:1.65}
.card .soft{font-size:.72rem;color:var(--ink-faint);margin-top:12px;line-height:1.6}
.card .btns{display:flex;flex-direction:column;gap:8px;margin-top:19px}
.btn{padding:12px 16px;border-radius:13px;font-size:.85rem;font-weight:700;
  border:1px solid var(--line2);background:linear-gradient(180deg,rgba(52,62,132,.66),rgba(26,32,80,.66));
  color:var(--ink-soft);transition:transform .16s cubic-bezier(.34,1.56,.64,1),border-color .2s}
.btn:active{transform:scale(.95)}
.btn.pri{border-color:rgba(255,206,140,.5);color:#2a1c06;
  background:linear-gradient(180deg,#ffe1a4,#ffbe63 62%,#f0a340);
  box-shadow:0 6px 20px rgba(255,170,60,.3)}
.rules{text-align:left;font-size:.78rem;color:var(--ink-soft);line-height:1.85;margin-top:14px}
.rules li{list-style:none;display:flex;gap:9px;align-items:flex-start}
.rules .ic{width:22px;flex-shrink:0;text-align:center;font-size:.95rem;color:var(--gold2)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  z-index:60;padding:10px 17px;border-radius:999px;font-size:.78rem;font-weight:700;color:var(--gold1);
  background:linear-gradient(180deg,rgba(52,44,96,.95),rgba(26,22,62,.95));
  border:1px solid rgba(255,206,140,.3);box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s cubic-bezier(.22,.9,.3,1);white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- ending ---------- */
#endCanvas{display:block;width:100%;height:auto;border-radius:20px;
  border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.end-txt{text-align:center;margin-top:16px}
.end-txt h2{font-size:1.3rem;font-weight:800;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff6d8,#ffc76c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(255,180,80,.4))}
.end-txt .es{font-size:.8rem;color:var(--ink-soft);margin-top:10px;line-height:1.7}
.end-txt .ef{font-size:.72rem;color:var(--ink-faint);margin-top:12px;line-height:1.6}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
}

/* ---------- GA vote row ---------- */
.ga-vote{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 2px;font-size:14px;line-height:1.2;opacity:.92;color:var(--ink-soft)}
.ga-vote[hidden]{display:none}
.ga-vote-btn{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.85;-webkit-tap-highlight-color:transparent}
.ga-vote-btn:active{opacity:1}
.ga-vote.done .ga-vote-btn{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="chip" href="../../index.html" id="homeBtn">← <span data-i18n="home">홈</span></a>
    <div class="titles">
      <h1 id="mainTitle">빛 접기</h1>
      <div class="sub" id="subTitle">光おり · Fold the Light</div>
    </div>
    <div class="top-btns">
      <button class="chip sq" id="helpBtn" aria-label="help">?</button>
      <button class="chip sq" id="soundBtn" aria-label="sound">🔊</button>
      <button class="chip sq" id="langBtn" aria-label="language">🇰🇷</button>
    </div>
  </header>

  <!-- menu -->
  <section class="screen on" id="scMenu">
    <div class="menu-head">
      <div class="mh-t" data-i18n="menuTitle">등롱을 고르세요</div>

  </section>

  <!-- game -->
  <section class="screen" id="scGame">
    <div class="statusbar">
      <div class="stage-lab" id="stageLab">스테이지 1</div>
      <div class="lamp-count">🏮 <b id="lampNow">0</b><span>/</span><span id="lampAll">1</span></div>
    </div>
    <div class="boardwrap"><canvas id="board"></canvas></div>
    <div class="hint" id="hintText"></div>
    <div class="gamebtns">
      <button class="chip" id="listBtn">☰ <span data-i18n="list">목록</span></button>
      <button class="chip" id="resetBtn">↺ <span data-i18n="reset">처음으로</span></button>
      <button class="chip" id="skipBtn">↷ <span data-i18n="skip">건너뛰기</span></button>
    </div>
  </section>

  <!-- ending -->
  <section class="screen" id="scEnd">
    <canvas id="endCanvas"></canvas>
    <div class="end-txt">
      <h2 data-i18n="endTitle">모든 등불을 켰어요</h2>
      <div class="es" data-i18n="endSub">— 완결 —</div>
      <div class="ef" data-i18n="endBody">밤이 환해졌습니다. 오늘은 여기까지.</div>
      <div class="card" style="max-width:300px;margin:18px auto 0;padding:16px;background:none;border:none;box-shadow:none;animation:none">
        <div class="btns">
          <button class="btn pri" id="endAgain" data-i18n="playAgain">다시 하기</button>
          <a class="btn" href="../../index.html" style="display:block;text-decoration:none" data-i18n="toHome">홈으로</a>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- clear overlay -->
<div class="ov" id="ovClear">
  <div class="card">
    <div class="glyph">🏮</div>
    <h2 data-i18n="clearTitle">등불이 켜졌어요</h2>
    <div class="msg" id="clearMsg"></div>
    <div class="soft" data-i18n="clearSoft">오늘은 여기까지 해도 좋아요.</div>
    <div class="btns">
      <button class="btn pri" id="nextBtn" data-i18n="nextStage">다음 스테이지</button>
      <button class="btn" id="backBtn" data-i18n="toList">스테이지 선택</button>
    </div>
    <div class="ga-vote" id="gaVote" hidden>
      <span class="ga-vote-q">또 할래?</span>
      <button type="button" class="ga-vote-btn" data-choice="yes">응</button>
      <button type="button" class="ga-vote-btn" data-choice="unsure">글쎄</button>
    </div>
  </div>
</div>

<!-- help overlay -->
<div class="ov" id="ovHelp">
  <div class="card">
    <div class="glyph">✦</div>
    <h2 data-i18n="helpTitle">빛을 접는 법</h2>
    <ul class="rules" id="rulesList"></ul>
    <div class="btns"><button class="btn pri" id="helpClose" data-i18n="gotIt">알겠어요</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.72)"; ctx.lineWidth = Math.max(1, cellPx * 0.028); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.lineWidth = Math.max(.8, cellPx * 0.016);
  ctx.beginPath(); ctx.moveTo(0, -r * 0.72); ctx.lineTo(0, r * 0.5); ctx.stroke();
  ctx.restore();
}

function drawLantern(l, glow) {
  var cxx = cxp(l.x), cyy = cxp(l.y), r = cellPx * 0.3;
  var fl = reduceMotion ? 1 : 0.92 + 0.08 * Math.sin(tsec * 5.5 + l.x * 2 + l.y);

  if (glow > 0.01) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var gr = r * (2.4 + glow * 1.9) * fl;
    var gg = ctx.createRadialGradient(cxx, cyy, 0, cxx, cyy, gr);
    gg.addColorStop(0, "rgba(255,240,190," + (0.5 * glow) + ")");
    gg.addColorStop(0.4, "rgba(255,190,90," + (0.24 * glow) + ")");
    gg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(cxx, cyy, gr, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(cxx, cyy);
  var bg = ctx.createLinearGradient(0, -r, 0, r);
  if (glow > 0.02) {
    bg.addColorStop(0, "rgba(255,250,224," + (0.55 + 0.45 * glow) + ")");
    bg.addColorStop(0.5, "rgba(255," + Math.round(200 + 40 * glow) + "," + Math.round(110 + 60 * glow) + ",1)");
    bg.addColorStop(1, "rgba(" + Math.round(210 + 30 * glow) + ",130,40,1)");
  } else {
    bg.addColorStop(0, "#39406f"); bg.addColorStop(1, "#1b2049");
  }
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.84, r, 0, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = glow > 0.02 ? "rgba(255,232,175,.9)" : "rgba(150,165,255,.36)";
  ctx.lineWidth = Math.max(1, cellPx * 0.026); ctx.stroke();
  // ribs
  ctx.strokeStyle = glow > 0.02 ? "rgba(180,90,20,.3)" : "rgba(120,135,210,.24)";
  ctx.lineWidth = Math.max(0.7, cellPx * 0.02);
  for (var i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.84 * (1 - Math.abs(i) * 0.1), r, 0, 0, 6.2832);
    ctx.stroke();
  }
  ctx.fillStyle = glow > 0.02 ? "#7a5320" : "#3d4470";
  ctx.fillRect(-r * 0.32, -r * 1.1, r * 0.64, r * 0.17);
  ctx.fillRect(-r * 0.32, r * 0.93, r * 0.64, r * 0.17);
  // inner flame
  if (glow > 0.05) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgba(255,252,230," + (0.85 * glow) + ")";
    ctx.beginPath(); ctx.ellipse(0, r * 0.06, r * 0.22 * fl, r * 0.34 * fl, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

var BEAM_PASSES = [
  { w: 0.44, a: 0.055, c: "255,150,60" },
  { w: 0.26, a: 0.10, c: "255,186,96" },
  { w: 0.13, a: 0.22, c: "255,214,140" },
  { w: 0.055, a: 0.95, c: "255,247,214" }
];

function drawBeams(R) {
  var segs = beams.segs, i, p, s;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (p = 0; p < BEAM_PASSES.length; p++) {
    var pass = BEAM_PASSES[p];
    ctx.lineWidth = Math.max(1, cellPx * pass.w);
    ctx.strokeStyle = "rgba(" + pass.c + "," + pass.a + ")";
    ctx.beginPath();
    for (i = 0; i < segs.length; i++) {
      s = segs[i];
      if (R <= s.d0) continue;
      var f = Math.min(1, (R - s.d0) / s.len);
      ctx.moveTo(cxp(s.x1), cxp(s.y1));
      ctx.lineTo(cxp(s.x1 + (s.x2 - s.x1) * f), cxp(s.y1 + (s.y2 - s.y1) * f));
    }
    ctx.stroke();
  }
  // travelling head sparkle
  if (!reduceMotion) {
    for (i = 0; i < segs.length; i++) {
      s = segs[i];
      if (R <= s.d0 || R >= s.d0 + s.len) continue;
      var ff = (R - s.d0) / s.len;
      var hx = cxp(s.x1 + (s.x2 - s.x1) * ff), hy = cxp(s.y1 + (s.y2 - s.y1) * ff);
      var hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, cellPx * 0.42);
      hg.addColorStop(0, "rgba(255,252,232,.85)"); hg.addColorStop(1, "rgba(255,180,80,0)");
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.arc(hx, hy, cellPx * 0.42, 0, 6.2832); ctx.fill();
    }
  }
  ctx.restore();
}

function drawEndGlows(R) {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (var i = 0; i < beams.ends.length; i++) {
    var e = beams.ends[i];
    if (R < e.at) continue;
    var px = cxp(e.x), py = cxp(e.y);
    var pulse = reduceMotion ? 1 : 0.75 + 0.25 * Math.sin(tsec * 4 + i);
    var g = ctx.createRadialGradient(px, py, 0, px, py, cellPx * 0.6 * pulse);
    g.addColorStop(0, "rgba(255,238,190,.5)"); g.addColorStop(1, "rgba(255,150,50,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, cellPx * 0.6 * pulse, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}

function spawnParts(R, dt) {
  if (reduceMotion) return;
  if (parts.length > 90) return;
  for (var i = 0; i < beams.ends.length; i++) {
    var e = beams.ends[i];
    if (R < e.at) continue;
    if (Math.random() > dt * 9) continue;
    var a = Math.random() * 6.2832, sp = (0.25 + Math.random() * 0.5) * cellPx;
    parts.push({
      x: cxp(e.x), y: cxp(e.y),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - cellPx * 0.35,
      life: 0, max: 0.7 + Math.random() * 0.6, r: cellPx * (0.02 + Math.random() * 0.035)
    });
  }
}
function drawParts(dt) {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += cellPx * 0.5 * dt; p.vx *= 0.98;
    var a = 1 - p.life / p.max;
    ctx.fillStyle = "rgba(255,226,160," + (a * 0.85) + ")";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.5 + a), 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}

function render(dt) {
  if (!L) return;
  drawBackdrop();
  var R = reveal * beams.maxDist + 0.0001;

  drawBeams(R);
  drawEndGlows(R);

  var x, y, c;
  for (y = 0; y < L.h; y++) {
    for (x = 0; x < L.w; x++) {
      c = L.cells[y * L.w + x];
      if (c.t === "wall") drawWall(x, y);
      else if (c.t === "src") drawSource(x, y, c.k);
      else if (c.t === "prism") drawPrism(x, y);
      else if (c.t === "fix") drawMirror({ x: x, y: y }, true, c.k);
    }
  }
  for (var i = 0; i < L.mirrors.length; i++) drawMirror(L.mirrors[i], false, 0);

  var nowLit = 0;
  for (var j = 0; j < L.lanterns.length; j++) {
    var l = L.lanterns[j];
    var key = l.y * L.w + l.x;
    var on = beams.lit[key] !== undefined && R >= beams.lit[key];
    if (on) nowLit++;
    var target = on ? 1 : 0;
    var sp = reduceMotion ? 1 : dt * (on ? 3.2 : 6);
    l.glow += (target - l.glow) * Math.min(1, sp);
    drawLantern(l, l.glow);
  }

  spawnParts(R, dt);
  drawParts(dt);

  var lampEl = document.getElementById("lampNow");
  if (lampEl.textContent !== String(nowLit)) lampEl.textContent = String(nowLit);
  return nowLit;
}

/* ==========================================================================
   Loop
   ========================================================================== */
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  var dt = Math.min(0.05, (ts - lastT) / 1000);
  lastT = ts; tsec += dt;

  if (!L || !document.getElementById("scGame").classList.contains("on")) {
    if (document.getElementById("scEnd").classList.contains("on")) renderEnding(dt);
    return;
  }

  // ease mirror rotation
  for (var i = 0; i < L.mirrors.length; i++) {
    var m = L.mirrors[i];
    var d = m.target - m.ang;
    m.ang += d * Math.min(1, dt * (reduceMotion ? 60 : 13));
    if (Math.abs(d) < 0.0008) m.ang = m.target;
  }

  if (reveal < 1) reveal = Math.min(1, reveal + dt / revealDur);

  var nowLit = render(dt);

  if (!won && reveal >= 1 && nowLit === L.lanterns.length && L.lanterns.length > 0) {
    won = true; winT = 0; locked = true;
    SFX.clear();
  }
  if (won && !clearShown) {
    winT += dt;
    if (winT > 1.15) { clearShown = true; onCleared(); }
  }
}

/* ==========================================================================
   Interaction
   ========================================================================== */
function boardHit(ev) {
  if (!L || locked) return;
  var r = cv.getBoundingClientRect();
  var px = (ev.clientX - r.left) / r.width * boardPx;
  var py = (ev.clientY - r.top) / r.height * boardPx;
  var gx = Math.floor(px / cellPx), gy = Math.floor(py / cellPx);
  if (gx < 0 || gy < 0 || gx >= L.w || gy >= L.h) return;
  var c = L.cells[gy * L.w + gx];
  if (c.t !== "mir") return;
  var m = L.mirrors[c.mi];
  m.turns++; m.target += Math.PI / 2;
  if (reduceMotion) m.ang = m.target;
  SFX.turn();
  recompute();
}
cv.addEventListener("pointerdown", function (ev) {
  ev.preventDefault();
  audio();
  boardHit(ev);
}, { passive: false });

/* ==========================================================================
   Screens / flow
   ========================================================================== */
function show(id) {
  var names = ["scMenu", "scGame", "scEnd"];
  for (var i = 0; i < names.length; i++)
    document.getElementById(names[i]).classList.toggle("on", names[i] === id);
  window.scrollTo(0, 0);
  /* 숨은 동안에는 boardwrap 폭이 0이라 layout()이 최소값 200px로 굳는다.
     ResizeObserver 는 display 전환에서 안 도는 브라우저가 있어 여기서 직접 맞춘다. */
  if (id === "scGame") layout();
}
function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(el._tm);
  el._tm = setTimeout(function () { el.classList.remove("on"); }, 1900);
}

function buildGrid() {
  var g = document.getElementById("stageGrid");
  g.innerHTML = "";
  for (var i = 0; i < TOTAL; i++) {
    (function (i) {
      var open = i < save.unlocked, done = isCleared(i);
      var b = document.createElement("button");
      b.className = "cellbtn" + (done ? " done" : open ? " open" : "");
      b.disabled = !open;
      b.setAttribute("aria-label", t("stage", { n: i + 1 }));
      var lan = document.createElement("div"); lan.className = "lant";
      var num = document.createElement("div"); num.className = "num"; num.textContent = i + 1;
      b.appendChild(lan); b.appendChild(num);
      b.addEventListener("click", function () {
        audio();
        if (!open) { toast(t("tLocked")); return; }
        SFX.click();
        loadLevel(i); show("scGame");
        gaRoundStart("stage-" + (i + 1));
      });
      g.appendChild(b);
    })(i);
  }
  var n = save.cleared.length;
  document.getElementById("progText").textContent = n + " / " + TOTAL;
  document.getElementById("progFill").style.width = (n / TOTAL * 100) + "%";
  document.getElementById("festivalBtn").style.display = allDone() ? "" : "none";
}

var GA_GAME = "fold-the-light";

function gaLang() { try { return lang || "ko"; } catch (e) { return "ko"; } }
function gaSend(name, p) { try { if (typeof gtag !== "function") return; p = p || {}; p.game_id = GA_GAME; if (!p.lang) p.lang = gaLang(); gtag("event", name, p); } catch (e) {} }
function gaRoundStart(scene) {
  gaS.t0 = Date.now();
  if (gaS.completed) { gaS.completed = false; gaSend("game_step", { step: "replay", scene: scene || "main" }); return; }
  if (gaS.started) return; gaS.started = true; gaSend("game_step", { step: "start", scene: scene || "main" });
}
function gaRoundComplete(scene, result, extra) {
  if (gaS.completed) return; gaS.completed = true;
  var p = { scene: scene || "main", result: result || "clear", play_sec: gaS.t0 ? Math.round((Date.now() - gaS.t0) / 1000) : 0 };
  if (extra) { for (var k in extra) { if (extra.hasOwnProperty(k)) p[k] = extra[k]; } }

var GA_VOTE_COPY = { ko: { q: "또 할래?", yes: "응", no: "글쎄", thx: "고마워요!" }, ja: { q: "また あそぶ？", yes: "うん", no: "うーん", thx: "ありがとう！" }, en: { q: "Want another go?", yes: "Yes", no: "Not sure", thx: "Thanks!" } };

}

}

/* ==========================================================================
   Ending scene — lantern festival
   ========================================================================== */
var ecv = document.getElementById("endCanvas"), ectx = ecv.getContext("2d");
var flying = [], eW = 340, eH = 300, endStars = [];

function startEnding() {
  show("scEnd");
  layoutEnd();
  flying = [];
  for (var i = 0; i < 26; i++) flying.push(newFly(true));
  endStars = [];
  for (var s = 0; s < 60; s++)
    endStars.push({ x: Math.random(), y: Math.random() * 0.8, r: Math.random() * 1.3 + 0.3, p: Math.random() * 6.28, sp: 0.5 + Math.random() });
  SFX.end();
}
function newFly(spread) {
  return {
    x: 0.04 + Math.random() * 0.92,
    y: spread ? Math.random() * 1.15 : 1.12 + Math.random() * 0.2,
    sp: 0.018 + Math.random() * 0.032,
    sc: 0.55 + Math.random() * 0.75,
    sw: Math.random() * 6.28,
    sa: 0.4 + Math.random() * 0.6
  };
}
function layoutEnd() {
  var wrap = ecv.parentElement;
  var w = Math.max(200, Math.min(wrap.clientWidth, 490));
  eW = w; eH = Math.round(w * 0.86);
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  ecv.style.width = w + "px"; ecv.style.height = eH + "px";
  ecv.width = Math.round(w * dpr); ecv.height = Math.round(eH * dpr);
  ectx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function renderEnding(dt) {
  var g = ectx.createLinearGradient(0, 0, 0, eH);
  g.addColorStop(0, "#060a24"); g.addColorStop(0.5, "#111a4c"); g.addColorStop(1, "#2a1f52");
  ectx.fillStyle = g; ectx.fillRect(0, 0, eW, eH);

  for (var s = 0; s < endStars.length; s++) {
    var st = endStars[s];
    ectx.globalAlpha = (reduceMotion ? 0.6 : 0.35 + 0.4 * Math.sin(tsec * st.sp + st.p)) * 0.8;
    ectx.fillStyle = "#e6ecff";
    ectx.beginPath(); ectx.arc(st.x * eW, st.y * eH, st.r, 0, 6.2832); ectx.fill();
  }
  ectx.globalAlpha = 1;

  // moon
  var mx = eW * 0.8, my = eH * 0.19, mr = eW * 0.055;
  ectx.save();
  ectx.globalCompositeOperation = "lighter";
  var mg = ectx.createRadialGradient(mx, my, 0, mx, my, mr * 4);
  mg.addColorStop(0, "rgba(230,238,255,.3)"); mg.addColorStop(1, "rgba(0,0,0,0)");
  ectx.fillStyle = mg; ectx.beginPath(); ectx.arc(mx, my, mr * 4, 0, 6.2832); ectx.fill();
  ectx.restore();
  ectx.fillStyle = "#f2f5ff";
  ectx.beginPath(); ectx.arc(mx, my, mr, 0, 6.2832); ectx.fill();

  // horizon
  ectx.fillStyle = "rgba(10,8,32,.85)";
  ectx.beginPath();
  ectx.moveTo(0, eH);
  ectx.lineTo(0, eH * 0.88);
  for (var hx = 0; hx <= eW; hx += eW / 8)
    ectx.lineTo(hx, eH * 0.88 + Math.sin(hx * 0.03) * eH * 0.018);
  ectx.lineTo(eW, eH); ectx.closePath(); ectx.fill();

  // lanterns
  for (var i = 0; i < flying.length; i++) {
    var f = flying[i];
    if (!reduceMotion) { f.y -= f.sp * dt; f.sw += dt * 0.8; }
    if (f.y < -0.16) { flying[i] = newFly(false); continue; }
    var px = (f.x + Math.sin(f.sw) * 0.012) * eW;
    var py = f.y * eH;
    var r = eW * 0.026 * f.sc;
    ectx.save();
    ectx.globalCompositeOperation = "lighter";
    var gg = ectx.createRadialGradient(px, py, 0, px, py, r * 6);
    gg.addColorStop(0, "rgba(255,215,140," + (0.42 * f.sa) + ")");
    gg.addColorStop(0.42, "rgba(255,150,60," + (0.14 * f.sa) + ")");
    gg.addColorStop(1, "rgba(0,0,0,0)");
    ectx.fillStyle = gg; ectx.beginPath(); ectx.arc(px, py, r * 6, 0, 6.2832); ectx.fill();
    ectx.restore();

    ectx.save();
    ectx.translate(px, py);
    ectx.globalAlpha = f.sa;
    var bg = ectx.createLinearGradient(0, -r, 0, r * 1.2);
    bg.addColorStop(0, "#fff6d6"); bg.addColorStop(0.45, "#ffc069"); bg.addColorStop(1, "#d9541f");
    ectx.fillStyle = bg;
    ectx.beginPath(); ectx.ellipse(0, 0, r * 0.8, r * 1.05, 0, 0, 6.2832); ectx.fill();
    ectx.fillStyle = "rgba(120,60,15,.6)";
    ectx.fillRect(-r * 0.3, r * 0.95, r * 0.6, r * 0.16);
    ectx.restore();
  }
  ectx.globalAlpha = 1;
}

/* ==========================================================================
   Language
   ========================================================================== */
function applyLang() {
  document.documentElement.lang = lang;
  document.getElementById("mainTitle").textContent = t("_title");
  document.getElementById("subTitle").textContent = t("_sub");
  document.getElementById("langBtn").textContent = FLAG[lang];
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < nodes.length; i++) {
    var k = nodes[i].getAttribute("data-i18n");
    nodes[i].textContent = t(k);
  }
  if (L) {
    document.getElementById("stageLab").textContent = t("stage", { n: idx + 1 });
    document.getElementById("hintText").textContent = idx === 0 ? t("hint1") : t("hint2");
  }
  document.getElementById("clearMsg").textContent = t("clearMsg", { n: idx + 1 });
  buildRules();
  buildGrid();
  if (gaS && gaS.voteShown && !gaS.voted) gaVoteShow(gaS.voteScene);
}
document.getElementById("langBtn").addEventListener("click", function () {
  audio(); SFX.click();
  lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
  try { localStorage.setItem("in9-lang", lang); } catch (e) {}
  applyLang();
});
document.getElementById("soundBtn").addEventListener("click", function () {
  soundOn = !soundOn;
  try { localStorage.setItem("fold-the-light-sound", soundOn ? "1" : "0"); } catch (e) {}
  document.getElementById("soundBtn").textContent = soundOn ? "🔊" : "🔇";
  if (soundOn) { audio(); SFX.click(); }
  toast(t(soundOn ? "tSoundOn" : "tSoundOff"));
});

/* ==========================================================================
   Boot
   ========================================================================== */
window.addEventListener("resize", function () {
  layout();
  if (document.getElementById("scEnd").classList.contains("on")) layoutEnd();
});

/* 보드가 숨겨진 상태에서 layout()이 돌면 wrap.clientWidth가 0이라 최소값 200px로 굳는다.
   화면 전환·언어 전환으로 폭이 잡히는 순간 다시 맞춘다. */
if (window.ResizeObserver) {
  new ResizeObserver(function () { layout(); }).observe(cv.parentElement);
}

loadSave();
lang = detectLang();
document.getElementById("soundBtn").textContent = soundOn ? "🔊" : "🔇";
loadLevel(Math.min(save.unlocked - 1, TOTAL - 1));
show("scMenu");
applyLang();
requestAnimationFrame(loop);

})();
</script>
