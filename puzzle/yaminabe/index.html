<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    background:#0b0818;
    overscroll-behavior:none;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR",
                "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
    -webkit-text-size-adjust:100%;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    color:#f6ead6;
  }
  button { font-family:inherit; color:inherit; border:0; background:none; cursor:pointer; }

  :root {
    --bg0:#0b0818;
    --bg1:#170f33;
    --bg2:#241748;
    --plum:#3a2260;
    --warm:#ffb765;
    --warm2:#ff8f45;
    --glow:#ffd9a0;
    --gold:#f3c67e;
    --cream:#f6ead6;
    --muted:#a596c6;
    --iron:#241d33;
    --iron2:#4b3d63;
    --line:rgba(243,198,126,.16);
    --card:rgba(255,255,255,.045);
    --ease:cubic-bezier(.22,.9,.3,1);
  }

  /* ================= shell ================= */
  #app {
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    background:
      radial-gradient(ellipse 120% 70% at 50% 46%, rgba(90,50,120,.42), transparent 62%),
      radial-gradient(ellipse 80% 50% at 50% 62%, rgba(255,150,70,.13), transparent 66%),
      linear-gradient(175deg, #0d0a20 0%, #171034 38%, #1d1240 62%, #0d0920 100%);
  }
  #app::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 78% 60% at 50% 48%, transparent 40%, rgba(6,4,16,.72) 100%);
  }

  /* ================= header ================= */
  header {
    position:relative; z-index:6;
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    padding:calc(env(safe-area-inset-top,0px) + 9px) 12px 9px;
  }
  .hbtn {
    flex:0 0 auto;
    display:inline-flex; align-items:center; justify-content:center;
    min-width:38px; height:34px; padding:0 10px;
    font-size:13px; font-weight:600; letter-spacing:.02em;
    color:var(--cream);
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
    border-radius:11px;
    transition:transform .18s var(--ease), background .2s, border-color .2s;
  }
  .hbtn:hover { background:rgba(255,255,255,.11); border-color:rgba(243,198,126,.34); }
  .hbtn:active { transform:scale(.93); }
  .titles { flex:1 1 auto; text-align:center; min-width:0; line-height:1.12; }
  .titles h1 {
    font-size:clamp(17px, 5.2vw, 23px); font-weight:800;
    letter-spacing:.02em;
    background:linear-gradient(180deg, #fff3dc, var(--gold) 62%, #d99f5a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 26px rgba(255,180,100,.22);
  }
  .titles p {
    margin-top:2px; font-size:10px; font-weight:500;
    color:var(--muted); letter-spacing:.06em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .hgroup { display:flex; gap:6px; flex:0 0 auto; }

  /* ================= scene ================= */
  #scene {
    position:relative; z-index:4;
    flex:0 0 auto;
    height:clamp(190px, 31vh, 290px);
    overflow:hidden;
  }
  #potWrap { position:absolute; inset:0; display:block; }
  #potSvg { position:absolute; inset:0; width:100%; height:100%; }
  #fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  .candle { position:absolute; bottom:14%; width:16px; }
  .candle.l { left:9%; } .candle.r { right:9%; }
  .cbody {
    height:38px; border-radius:4px 4px 3px 3px;
    background:linear-gradient(180deg,#f2e2c4,#d8bf98 55%,#b99b71);
    box-shadow:0 0 18px rgba(255,180,110,.3), inset -3px 0 5px rgba(0,0,0,.18);
  }
  .cflame {
    position:absolute; left:50%; top:-17px; width:11px; height:20px;
    margin-left:-5.5px; border-radius:50% 50% 46% 46%;
    background:radial-gradient(ellipse at 50% 78%, #fff6d8 8%, var(--warm) 42%, rgba(255,110,40,.72) 74%, transparent 100%);
    filter:blur(.4px);
    transform-origin:50% 100%;
    animation:flick 1.7s ease-in-out infinite alternate;
    box-shadow:0 0 22px 7px rgba(255,158,72,.36);
  }
  .candle.r .cflame { animation-duration:2.2s; animation-delay:-.7s; }
  @keyframes flick {
    0%   { transform:scale(1,1) rotate(-2.5deg); opacity:.92; }
    50%  { transform:scale(1.07,.92) rotate(1.5deg); opacity:1; }
    100% { transform:scale(.94,1.09) rotate(2.5deg); opacity:.86; }
  }

  #toast {
    position:absolute; left:50%; top:12%;
    transform:translate(-50%,-8px) scale(.86);
    z-index:5;
    padding:9px 18px; border-radius:999px;
    font-size:15px; font-weight:800; white-space:nowrap;
    color:#2a1608;
    background:linear-gradient(180deg,#ffe6bb,var(--warm));
    box-shadow:0 10px 30px rgba(255,150,70,.34), 0 0 0 1px rgba(255,255,255,.35) inset;
    opacity:0; pointer-events:none;
    transition:opacity .3s var(--ease), transform .42s var(--ease);
  }
  #toast.show { opacity:1; transform:translate(-50%,0) scale(1); }
  #toast.zero { background:linear-gradient(180deg,#cfc3e8,#9d8dc0); color:#231636; box-shadow:0 10px 26px rgba(90,60,140,.4); }
  #toast.all  { background:linear-gradient(180deg,#e8ffd8,#8fd97a); color:#12300a; box-shadow:0 10px 30px rgba(120,200,100,.36); }

  /* ================= panel ================= */
  #panel {
    position:relative; z-index:5;
    flex:1 1 auto; min-height:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:4px 12px calc(env(safe-area-inset-bottom,0px) + 14px);
  }
  .wrap { max-width:460px; margin:0 auto; }

  .statusbar {
    display:flex; align-items:center; gap:9px;
    padding:8px 2px 10px;
  }
  .roundtxt { font-size:12px; font-weight:700; color:var(--gold); letter-spacing:.04em; white-space:nowrap; }
  .dots { display:flex; gap:5px; flex:1 1 auto; }
  .dot {
    flex:1 1 auto; height:5px; max-width:32px; border-radius:99px;
    background:rgba(255,255,255,.12);
    transition:background .35s var(--ease), box-shadow .35s var(--ease);
  }
  .dot.used { background:linear-gradient(90deg, var(--warm2), var(--warm)); box-shadow:0 0 9px rgba(255,150,70,.45); }
  .dot.now  { background:rgba(243,198,126,.42); box-shadow:0 0 8px rgba(243,198,126,.4); }

  .card {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:11px 12px;
    margin-bottom:10px;
    box-shadow:0 6px 22px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .card h2 {
    font-size:11px; font-weight:700; letter-spacing:.09em;
    color:var(--muted); text-transform:uppercase;
    margin-bottom:8px;
    display:flex; align-items:center; gap:6px;
  }
  .card h2 .n { color:var(--gold); font-size:10px; letter-spacing:0; }

  /* hints */
  #hintList { display:flex; flex-direction:column; gap:6px; }
  .hint {
    display:flex; align-items:flex-start; gap:8px;
    padding:8px 10px; border-radius:11px;
    font-size:13px; line-height:1.42; color:var(--cream);
    background:linear-gradient(100deg, rgba(255,183,101,.11), rgba(255,183,101,.03));
    border:1px solid rgba(255,183,101,.16);
    animation:hintIn .5s var(--ease) both;
  }
  .hint .hi { flex:0 0 auto; font-size:14px; line-height:1.3; filter:saturate(.9); }
  .hint.fresh { border-color:rgba(255,183,101,.44); box-shadow:0 0 20px rgba(255,150,70,.16); }
  @keyframes hintIn { from { opacity:0; transform:translateY(-7px); } to { opacity:1; transform:none; } }
  .empty { font-size:12px; color:var(--muted); padding:4px 2px; line-height:1.5; }

  /* history */
  #histList { display:flex; flex-direction:column; gap:5px; }
  .hrow {
    display:flex; align-items:center; gap:8px;
    padding:5px 8px; border-radius:10px;
    background:rgba(255,255,255,.035);
    animation:hintIn .4s var(--ease) both;
  }
  .hrow .rn { font-size:10px; font-weight:700; color:var(--muted); width:16px; flex:0 0 auto; }
  .hrow .items { flex:1 1 auto; font-size:18px; letter-spacing:2px; line-height:1.2; }
  .badge {
    flex:0 0 auto; min-width:38px; text-align:center;
    padding:3px 8px; border-radius:99px;
    font-size:11px; font-weight:800;
    background:rgba(255,255,255,.09); color:var(--muted);
  }
  .badge.bpart { background:linear-gradient(180deg,#ffd9a0,var(--warm)); color:#3a2005; }
  .badge.bfull { background:linear-gradient(180deg,#e0ffcd,#8ed877); color:#123006; }

  /* tray */
  #tray {
    display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px;
  }
  .chip {
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    padding:8px 2px 6px;
    border-radius:13px;
    background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
    border:1.5px solid rgba(255,255,255,.09);
    transition:transform .2s var(--ease), border-color .2s, background .25s, box-shadow .25s;
  }
  .chip .em { font-size:23px; line-height:1.1; filter:drop-shadow(0 2px 5px rgba(0,0,0,.45)); }
  .chip .nm { font-size:9px; font-weight:600; color:#b6a9d4; letter-spacing:-.02em;
              max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 12칩(어려움)은 4열×3행 — 칩이 77px 로 넓어 이름을 11px 로 온전히 보여 준다 */
  #tray.dense .chip { padding:6px 2px 5px; }
  #tray.dense .chip .em { font-size:20px; }
  #tray.dense .chip .nm { font-size:11px; white-space:normal; line-height:1.2; overflow-wrap:anywhere; }
  .chip:active { transform:scale(.92); }
  .chip.on {
    background:linear-gradient(180deg, rgba(255,183,101,.28), rgba(255,140,66,.12));
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(243,198,126,.14), 0 6px 18px rgba(255,150,70,.26);
    transform:translateY(-3px);
  }
  .chip.on .nm { color:var(--cream); }
  .chip.on::after {
    content:""; position:absolute; top:4px; right:5px;
    width:6px; height:6px; border-radius:50%;
    background:var(--gold); box-shadow:0 0 8px var(--gold);
  }
  .chip.dim { opacity:.42; }

  #ladleBtn {
    width:100%; margin-top:11px;
    padding:15px 12px; border-radius:16px;
    font-size:16px; font-weight:800; letter-spacing:.02em;
    color:#3a1f04;
    background:linear-gradient(180deg,#ffdca8,var(--warm) 55%,#f08c3c);
    box-shadow:0 8px 24px rgba(255,140,60,.3), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .18s var(--ease), opacity .25s, box-shadow .25s;
  }
  #ladleBtn:active { transform:scale(.975); }
  #ladleBtn:disabled {
    cursor:default; opacity:.42;
    background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
    color:var(--muted); box-shadow:none;
  }

  /* ================= difficulty ================= */
  .diffPick { margin-top:12px; text-align:left; }
  .diffRow { display:flex; gap:6px; }
  .dbtn {
    flex:1 1 0; min-width:0;
    padding:9px 4px; border-radius:13px;
    font-size:12.5px; font-weight:700; color:var(--cream);
    background:rgba(255,255,255,.06);
    border:1.5px solid rgba(255,255,255,.1);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:transform .18s var(--ease), background .2s, border-color .2s;
  }
  .dbtn:active { transform:scale(.96); }
  .dbtn.on {
    background:linear-gradient(180deg, rgba(255,183,101,.28), rgba(255,140,66,.12));
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(243,198,126,.13);
  }
  .diffMeta { margin-top:7px; font-size:11px; line-height:1.45; color:var(--muted); }
  .bestLine { margin-top:4px; font-size:11px; font-weight:700; line-height:1.45; color:var(--gold); }
  .bestLine[hidden] { display:none; }
  #endBest { margin-top:9px; font-size:12.5px; font-weight:700; color:var(--gold); }
  #endBest[hidden] { display:none; }
  #endDiffBtn {
    display:block; margin:9px auto 0;
    padding:8px 15px; border-radius:12px;
    font-size:12px; font-weight:700; color:var(--muted);
    background:transparent;
    border:1.5px solid rgba(255,255,255,.14);
    transition:transform .18s var(--ease), border-color .2s, color .2s;
  }
  #endDiffBtn:active { transform:scale(.96); }

  /* ================= overlays ================= */
  .ov {
    position:fixed; inset:0; z-index:40;
    display:flex; align-items:center; justify-content:center;
    padding:18px;
    background:rgba(8,5,20,.82);
    -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px);
    opacity:0; pointer-events:none;
    transition:opacity .38s var(--ease);
  }
  .ov.show { opacity:1; pointer-events:auto; }
  .sheet {
    width:100%; max-width:420px;
    max-height:calc(100% - 12px); overflow-y:auto;
    padding:22px 20px 20px;
    border-radius:24px;
    background:linear-gradient(170deg, #2b1c50, #1a1136 58%, #150e2b);
    border:1px solid rgba(243,198,126,.2);
    box-shadow:0 26px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.09);
    transform:translateY(16px) scale(.97);
    transition:transform .44s var(--ease);
    text-align:center;
  }
  .ov.show .sheet { transform:none; }
  .sheet .bigemo { font-size:44px; line-height:1; filter:drop-shadow(0 6px 16px rgba(255,150,70,.4)); }
  .sheet h2 { margin-top:10px; font-size:22px; font-weight:800; color:var(--cream); letter-spacing:.01em; }
  .sheet .sub { margin-top:4px; font-size:11px; color:var(--muted); letter-spacing:.08em; }

  .explain {
    margin-top:16px; text-align:left;
    padding:14px 15px; border-radius:16px;
    background:linear-gradient(140deg, rgba(255,183,101,.13), rgba(255,183,101,.035));
    border:1px solid rgba(255,183,101,.24);
  }
  .explain h3 {
    font-size:13px; font-weight:800; color:var(--gold);
    margin-bottom:7px; display:flex; align-items:center; gap:6px;
  }
  .explain p { font-size:12.5px; line-height:1.68; color:#e8dcc9; }

  .rules { margin-top:14px; text-align:left; }
  .rules h3 { font-size:11px; font-weight:700; letter-spacing:.09em; color:var(--muted); text-transform:uppercase; margin-bottom:7px; }
  .rules li { list-style:none; display:flex; gap:8px; font-size:12.5px; line-height:1.55; color:#ded2c2; margin-bottom:5px; }
  .rules li b { flex:0 0 auto; color:var(--warm); font-weight:800; font-size:11px; padding-top:2px; }

  .btnrow { display:flex; gap:9px; margin-top:18px; }
  /* 인트로는 규칙 5줄 + 난이도 + 기록까지 얹혀 375x667 에서 시트가 스크롤된다.
     시작 CTA 는 시트 바닥에 붙여 두어 스크롤 위치와 무관하게 늘 보이게 한다. */
  #introOv .sheet { padding-bottom:0; }   /* 아래 여백은 sticky 한 .btnrow 가 대신 낸다 */
  #introOv .btnrow {
    position:sticky; bottom:0; z-index:2;
    margin-top:6px; padding:12px 0 20px;
    background:linear-gradient(180deg, rgba(21,14,43,0), #170f2d 46%, #160f2c);
  }
  .pbtn {
    flex:1 1 0;
    padding:14px 10px; border-radius:15px;
    font-size:15px; font-weight:800;
    color:#3a1f04;
    background:linear-gradient(180deg,#ffdca8,var(--warm) 55%,#f08c3c);
    box-shadow:0 8px 22px rgba(255,140,60,.28), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .18s var(--ease);
  }
  .pbtn:active { transform:scale(.97); }
  .sbtn {
    flex:1 1 0;
    padding:14px 10px; border-radius:15px;
    font-size:15px; font-weight:700; color:var(--cream);
    background:rgba(255,255,255,.07);
    border:1px solid var(--line);
    transition:transform .18s var(--ease), background .2s;
  }
  .sbtn:active { transform:scale(.97); }
  .sbtn:hover { background:rgba(255,255,255,.12); }

  .answerRow { display:flex; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .ansCard {
    width:78px; padding:10px 4px 8px; border-radius:14px;
    background:linear-gradient(180deg, rgba(255,183,101,.2), rgba(255,183,101,.05));
    border:1px solid rgba(243,198,126,.3);
    animation:popIn .5s var(--ease) both;
  }
  .ansCard .e { font-size:28px; line-height:1.15; filter:drop-shadow(0 3px 8px rgba(0,0,0,.4)); }
  .ansCard .n { font-size:10px; font-weight:700; color:var(--cream); margin-top:3px; }
  .ansCard:nth-child(2) { animation-delay:.11s; }
  .ansCard:nth-child(3) { animation-delay:.22s; }
  .ansCard:nth-child(4) { animation-delay:.33s; }
  .answerRow.n4 .ansCard { width:66px; }
  @keyframes popIn { from { opacity:0; transform:translateY(10px) scale(.85); } to { opacity:1; transform:none; } }

  #bowlSvg { width:158px; height:112px; margin:12px auto 0; display:block; }
  .closing { margin-top:14px; font-size:12px; color:var(--muted); line-height:1.6; font-style:italic; }

  /* wide screens */
  @media (min-width:880px) {
    #scene { height:min(46vh, 360px); }
    #panel { padding-top:6px; }
    .wrap {
      max-width:840px;
      display:grid; grid-template-columns:1fr 1fr; gap:0 14px;
      align-items:start; align-content:start;
    }
    .statusbar { grid-column:1 / -1; grid-row:1; }
    .cTray  { grid-column:1; grid-row:2 / span 2; }
    .cHints { grid-column:2; grid-row:2; }
    .cHist  { grid-column:2; grid-row:3; }
    .titles h1 { font-size:25px; }
    #tray { gap:8px; }
    .chip .em { font-size:27px; }
    .chip .nm { font-size:10px; }
    #tray.dense .chip .em { font-size:25px; }
    #tray.dense .chip .nm { font-size:11px; }
  }
  @media (max-height:620px) {
    #scene { height:clamp(150px, 26vh, 200px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.08s !important;
    }
  }
  .ga-vote{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 2px;font-size:14px;line-height:1.2;opacity:.92}
  .ga-vote[hidden]{display:none}
  .ga-vote-btn{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.85;-webkit-tap-highlight-color:transparent}
  .ga-vote-btn:active{opacity:1}
  .ga-vote.done .ga-vote-btn{display:none}

    if (muted) return;
    var c = ac(); if (!c) return;
    var t0 = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);

    g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.03, dur * 0.3));

               (8 + Math.random() * 9) * p.s, 2.4 + Math.random() * 1.4, lidOpen);

  function buildHintQueue() {
    var counts = {}, k, v, i, ing;
    for (i = 0; i < AXES.length; i++) {
      for (k = 0; k < AXES[i].values.length; k++) counts[AXES[i].values[k]] = 0;
    }
    for (i = 0; i < secret.length; i++) {
      ing = byId(secret[i]);
      counts[ing.taste]++; counts[ing.texture]++; counts[ing.sound]++;

    for (v in counts) {
      if (!Object.prototype.hasOwnProperty.call(counts, v)) continue;
      if (counts[v] > 0) soft.push({ kind:'on', v:v });

    ladleBtn.disabled = !full || busy;
    var t = T();
    $('pickHint').textContent = full ? t.pickReady : fmt(t.pickMore, { n: SECRET_N - picked.length });
  }

  function renderDots() {
    dotsEl.innerHTML = '';
    var i, d;
    for (i = 1; i <= MAX_ROUNDS; i++) {
      d = document.createElement('div');
      d.className = 'dot' + (i < round ? ' used' : (i === round && state === 'play' ? ' now' : ''));
      dotsEl.appendChild(d);
    }
    var t = T();
    $('roundTxt').textContent = (state === 'play' && round === MAX_ROUNDS)
      ? t.lastRound : fmt(t.round, { r: Math.min(round, MAX_ROUNDS), m: MAX_ROUNDS });
  }

  function renderHints() {
    hintListEl.innerHTML = '';
    var t = T(), i;
    if (!shownHints.length) {
      var e = document.createElement('div');
      e.className = 'empty'; e.textContent = t.noHint;
      hintListEl.appendChild(e);
      return;
    }
    for (i = 0; i < shownHints.length; i++) {
      var h = shownHints[i];
      var row = document.createElement('div');
      row.className = 'hint' + (i === shownHints.length - 1 ? ' fresh' : '');
      row.style.animationDelay = (RM ? 0 : Math.min(i, 5) * 0.03) + 's';
      var ic = h.kind === 'first' ? '🍲' : ICON_OF[AXIS_OF[h.v]];
      row.innerHTML = '<span class="hi"></span><span class="tx"></span>';
      row.querySelector('.hi').textContent = ic;
      row.querySelector('.tx').textContent = (h.kind === 'first') ? t.firstSniff : hintText(h);
      hintListEl.appendChild(row);
    }
  }

  function renderHistory() {
    histListEl.innerHTML = '';
    var t = T(), i;
    if (!history.length) {
      var e = document.createElement('div');
      e.className = 'empty'; e.textContent = t.noHist;
      histListEl.appendChild(e);
      return;
    }
    for (i = 0; i < history.length; i++) {
      var h = history[i];
      var row = document.createElement('div');
      row.className = 'hrow';
      var emo = '', j;
      for (j = 0; j < h.ids.length; j++) emo += byId(h.ids[j]).emo;
      row.innerHTML = '<span class="rn"></span><span class="items"></span><span class="badge"></span>';
      row.querySelector('.rn').textContent = h.round;
      row.querySelector('.items').textContent = emo;
      var bd = row.querySelector('.badge');
      bd.textContent = h.hit + ' / ' + (h.n || SECRET_N);
      bd.className = 'badge' + (h.hit === 0 ? '' : (h.hit >= (h.n || SECRET_N) ? ' bfull' : ' bpart'));
      histListEl.appendChild(row);
    }
  }

  function showToast(text, cls) {
    toastEl.textContent = text;
    toastEl.className = 'show' + (cls ? ' ' + cls : '');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toastEl.className = ''; }, 2100);
  }

  /* ===================== flow ===================== */
  function newGame() {
    var pool = POOL.map(function (x) { return x.id; });
    shuffle(pool);
    secret = pool.slice(0, SECRET_N);
    round = 1;
    picked = [];
    history = [];
    shownHints = [{ kind:'first' }];
    hintQueue = buildHintQueue();
    busy = false;
    lidOpen = false;
    state = 'play';
    running = true;

    $('lidG').style.transition = 'none';
    $('lidG').style.transform = 'none';
    $('lidG').style.opacity = '1';
    $('brothG').style.transition = 'none';
    $('brothG').setAttribute('opacity', '0');
    setTimeout(function () {
      $('lidG').style.transition = '';
      $('brothG').style.transition = '';
    }, 30);
    setRevealEmoji('');

    renderPick(); renderDots(); renderHints(); renderHistory();
    startAmbient();
    /* 이 판의 start/replay 는 시작·다시하기 버튼이 아니라 첫 조작(재료 고르기·국자)에서 나간다 —
       인트로나 엔딩 카드를 읽고 머뭇거린 시간이 play_sec 에 섞이지 않게 */
    gaBindFirst(DIFF.id);
  }

  function setRevealEmoji(mode) {
    var n = secret.length || SECRET_N;
    var rp = REV_POS[n] || REV_POS[3], bp = BOWL_POS[n] || BOWL_POS[3];
    var i, r, w, ing;
    for (i = 0; i < 4; i++) {
      r = $('rv' + i); w = $('bw' + i);
      if (!r || !w) continue;
      if (rp[i]) { r.setAttribute('x', rp[i][0]); r.setAttribute('y', rp[i][1]); }
      if (bp[i]) { w.setAttribute('x', bp[i][0]); w.setAttribute('y', bp[i][1]); }
      ing = (mode === 'show' && i < n && secret[i]) ? byId(secret[i]) : null;
      r.textContent = ing ? ing.emo : '';
      w.textContent = ing ? ing.emo : '';
    }
  }

  function doLadle() {
    if (busy || state !== 'play' || picked.length !== SECRET_N) return;
    unlock();
    busy = true;
    ladleBtn.disabled = true;
    sndLadle();

    var ids = picked.slice(0);
    var hit = 0, i;
    for (i = 0; i < ids.length; i++) if (secret.indexOf(ids[i]) >= 0) hit++;

    history.unshift({ round: round, ids: ids, hit: hit, n: SECRET_N });
    renderHistory();

    setTimeout(function () {
      var t = T();
      sndResult(hit);
      if (hit === SECRET_N) {
        showToast(fmt(t.resAll, { n: SECRET_N }), 'all');
        setTimeout(function () { finish(true); }, 900);
        return;
      }
      showToast(hit === 0 ? t.resZero : fmt(t.resHit, { n: hit }), hit === 0 ? 'zero' : '');

      if (round >= MAX_ROUNDS) {
        setTimeout(function () { finish(false); }, 1500);
        return;
      }
      // next round: reveal a fresh hint
      if (hintQueue.length) shownHints.push(hintQueue.shift());
      round++;
      picked = [];
      busy = false;
      renderHints(); renderDots(); renderPick();
    }, 620);
  }

  function finish(win) {
    state = 'reveal';
    busy = true;
    stopAmbient();
    renderDots();

    // reveal remaining hints so the player sees the full picture
    while (hintQueue.length && shownHints.length < 9) shownHints.push(hintQueue.shift());
    renderHints();

    setRevealEmoji('show');
    sndLid();
    lidOpen = true;

    var lid = $('lidG');
    lid.style.transition = RM ? 'opacity .2s linear'
      : 'transform 1s cubic-bezier(.3,-0.2,.25,1), opacity .8s ease .35s';
    lid.style.transform = 'translate(46px,-84px) rotate(-16deg)';
    lid.style.opacity = '0';

    setTimeout(function () { burst(); }, RM ? 0 : 190);

    var broth = $('brothG');
    broth.style.transition = 'opacity .8s ease';
    setTimeout(function () { broth.setAttribute('opacity', '1'); }, RM ? 0 : 260);

    setTimeout(function () {
      showEnd(win);
    }, RM ? 500 : 1700);
  }

  function showEnd(win) {
    state = 'end';
    running = false;
    lastWin = !!win;
    lastBestNew = false;
    if (win) {
      var prev = save.best[DIFF.id];
      if (typeof prev !== 'number' || round < prev) {
        save.best[DIFF.id] = round;   // 원값: 클리어에 쓴 라운드 수
        lastBestNew = true;
      }
      persist();
    }
    var t = T();
    $('endEmo').textContent = win ? '🍲' : '🥢';
    $('endTitle').textContent = win ? t.winTitle : t.loseTitle;
    $('endMsg').textContent = win ? fmt(t.winMsg, { n: round, es: (round === 1 ? '' : 's') }) : t.loseMsg;
    $('endClosing').textContent = t.closing;
    $('againBtn').textContent = t.again;
    $('endHomeBtn').textContent = t.homeBtn;
    $('endDiffBtn').textContent = t.diffChange;

    renderEndBest();

    var row = $('answerRow');
    row.className = 'answerRow' + (secret.length > 3 ? ' n4' : '');
    row.innerHTML = '';
    var i;
    for (i = 0; i < secret.length; i++) {
      var ing = byId(secret[i]);
      var c = document.createElement('div');
      c.className = 'ansCard';
      c.innerHTML = '<div class="e"></div><div class="n"></div>';
      c.querySelector('.e').textContent = ing.emo;
      c.querySelector('.n').textContent = ing.name[lang];
      row.appendChild(c);
    }
    setRevealEmoji('show');
    $('endOv').classList.add('show');
    sndFinale(win);
    gaRoundComplete(DIFF.id, win ? 'clear' : 'fail', { rounds_used: round });
  }

  /* ===================== 기록 표기 ===================== */
  function renderEndBest() {
    var el = $('endBest'), t = T(), b = save.best[DIFF.id];
    if (typeof b !== 'number') { el.textContent = ''; el.hidden = true; return; }
    el.textContent = fmt(lastBestNew ? t.bestNew : t.bestKeep, { n: b, es: (b === 1 ? '' : 's') });
    el.hidden = false;
  }
  function renderDiffPick() {
    var t = T(), btns = $('diffRow').children, i, b, id;
    $('diffRow').setAttribute('aria-label', t.diffT);
    for (i = 0; i < btns.length; i++) {
      b = btns[i]; id = b.getAttribute('data-diff');
      b.textContent = t.diffName[id] || id;
      b.className = 'dbtn' + (id === DIFF.id ? ' on' : '');
      b.setAttribute('aria-pressed', id === DIFF.id ? 'true' : 'false');
    }
    $('iDiffMeta').textContent = fmt(t.diffMeta, { p: DIFF.pool, s: DIFF.secret, m: DIFF.rounds });
    var best = save.best[DIFF.id];
    if (typeof best === 'number') {
      // 1번은 최소값 — 더 줄이라고 권하면 깰 수 없는 목표가 된다
      $('iBest').textContent = fmt(best === 1 ? t.bestPerfect : t.bestGoal,
                                   { n: best, es: (best === 1 ? '' : 's') });
      $('iBest').hidden = false;
    } else {
      // 기록이 없으면 조용히 — 빈 줄을 강조하지 않는다
      $('iBest').textContent = '';
      $('iBest').hidden = true;
    }
  }

  /* ===================== i18n apply ===================== */
  function applyI18n() {
    var t = T();
    document.documentElement.lang = lang;
    try { if ($('endOv').classList.contains('show') && gaS.voteShown && !gaS.voted) gaVoteShow(gaS.voteScene); } catch (e) {}
    $('homeLink').textContent = '← ' + t.home;
    $('langBtn').textContent = FLAGS[lang];
    $('mainTitle').textContent = NAMES[lang];
    var others = LANGS.filter(function (l) { return l !== lang; }).map(function (l) { return NAMES[l]; });
    $('subTitle').textContent = others.join(' · ');
    $('soundBtn').setAttribute('aria-label', muted ? t.soundOff : t.soundOn);
    $('infoBtn').setAttribute('aria-label', t.info);

    $('trayTitle').textContent = t.trayTitle;
    $('hintsTitle').textContent = t.hintsTitle;
    $('histTitle').textContent = t.histTitle;
    ladleBtn.textContent = t.ladle;

    $('iTitle').textContent = NAMES[lang];
    $('iSub').textContent = others.join(' · ');
    $('iWhatT').textContent = t.whatT;  $('iWhatB').textContent = t.whatB;
    $('iRulesT').textContent = t.rulesT;
    $('fWhatT').textContent = t.whatT;  $('fWhatB').textContent = t.whatB;
    $('fRulesT').textContent = t.rulesT;
    var i, rtxt;
    for (i = 1; i <= 5; i++) {
      rtxt = fmt(t['r' + i], { s: SECRET_N, m: MAX_ROUNDS });
      $('iR' + i).textContent = rtxt;
      $('fR' + i).textContent = rtxt;
    }
    $('startBtn').textContent = t.start;
    $('infoCloseBtn').textContent = t.close;
    $('againBtn').textContent = t.again;
    $('endHomeBtn').textContent = t.homeBtn;
    $('endDiffBtn').textContent = t.diffChange;

    renderTrayNames();
    renderDiffPick();
    renderPick();
    renderDots();
    renderHints();
    renderHistory();

    if (state === 'end') {
      $('endTitle').textContent = lastWin ? t.winTitle : t.loseTitle;
      $('endMsg').textContent = lastWin ? fmt(t.winMsg, { n: round, es: (round === 1 ? '' : 's') }) : t.loseMsg;
      $('endClosing').textContent = t.closing;
      renderEndBest();
      var cards = $('answerRow').children;
      for (i = 0; i < cards.length && i < secret.length; i++) {
        cards[i].querySelector('.n').textContent = byId(secret[i]).name[lang];
      }
    }
  }

  /* ---- GA4 portal standard v1 (2026-08-19) ---- */
  var GA_GAME='yaminabe';
  var gaS={started:false,completed:false,voted:false,voteShown:false,voteScene:'main',t0:0};
  function gaLang(){ try{ return lang||'ko'; }catch(e){ return 'ko'; } }
  function gaSend(name,p){ try{ if(typeof gtag!=='function')return; p=p||{}; p.game_id=GA_GAME; if(!p.lang)p.lang=gaLang(); gtag('event',name,p);}catch(e){} }
  function gaRoundStart(scene){
    gaS.t0=Date.now();
    if(gaS.completed){ gaS.completed=false; gaSend('game_step',{step:'replay',scene:scene||'main'}); return; }
    if(gaS.started)return; gaS.started=true; gaSend('game_step',{step:'start',scene:scene||'main'});
  }
  function gaRoundComplete(scene,result,extra){
    if(gaS.completed)return; gaS.completed=true;
    var p={scene:scene||'main',result:result||'clear',play_sec:gaS.t0?Math.round((Date.now()-gaS.t0)/1000):0};
    if(extra){ for(var k in extra){ if(extra.hasOwnProperty(k))p[k]=extra[k]; } }
    gaSend('game_complete',p);
    gaVoteShow(p.scene);
  }
  var GA_VOTE_COPY={ko:{q:'또 할래?',yes:'응',no:'글쎄',thx:'고마워요!'},ja:{q:'また あそぶ？',yes:'うん',no:'うーん',thx:'ありがとう！'},en:{q:'Want another go?',yes:'Yes',no:'Not sure',thx:'Thanks!'}};
  function gaVoteShow(scene){
    var el=document.getElementById('gaVote'); if(!el||gaS.voted)return;
    var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
    el.querySelector('.ga-vote-q').textContent=c.q;
    el.querySelector('[data-choice="yes"]').textContent=c.yes;
    el.querySelector('[data-choice="unsure"]').textContent=c.no;
    gaS.voteScene=scene||'main'; gaS.voteShown=true; el.hidden=false; el.classList.remove('done');
  }
  (function(){ var el=document.getElementById('gaVote'); if(!el)return;
    el.addEventListener('click',function(e){
      var b=e.target; while(b&&b!==el&&!(b.getAttribute&&b.getAttribute('data-choice')))b=b.parentNode;
      if(!b||b===el||gaS.voted)return; gaS.voted=true;
      gaSend('game_vote',{scene:gaS.voteScene,choice:b.getAttribute('data-choice')});
      var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
      el.classList.add('done'); el.querySelector('.ga-vote-q').textContent=c.thx;
      setTimeout(function(){ el.hidden=true; },1200);
    });
  })();
  /* first real play action of a round = round start (replay for every round after the first) */
  var gaBindFirst=(function(){
    var zones=['tray','ladleBtn'], pendingScene='main';
    function unbind(){
      for(var k=0;k<zones.length;k++){ var z=document.getElementById(zones[k]); if(!z)continue;
        z.removeEventListener('pointerdown',onFirst,true); z.removeEventListener('click',onFirst,true); }
    }
    function onFirst(){ unbind(); gaRoundStart(pendingScene); }
    return function(scene){
      /* scene 은 판이 열릴 때의 난이도로 못 박는다 — 판 도중에는 난이도를 바꿀 수 없다 */
      pendingScene=scene||'main';
      for(var i=0;i<zones.length;i++){ var n=document.getElementById(zones[i]); if(!n){continue;}
        n.addEventListener('pointerdown',onFirst,true); n.addEventListener('click',onFirst,true); }
    };
  })();

  /* ===================== wiring ===================== */
  $('langBtn').addEventListener('click', function () {
    lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
    try { localStorage.setItem('in9-lang', lang); } catch (e) {}
    applyI18n();
    unlock(); sndTap();
  });

  $('soundBtn').addEventListener('click', function () {
    muted = !muted;
    $('soundBtn').textContent = muted ? '🔇' : '🔊';
    $('soundBtn').setAttribute('aria-label', muted ? T().soundOff : T().soundOn);
    if (!muted) { unlock(); sndTap(); }
  });

  $('infoBtn').addEventListener('click', function () {
    unlock(); sndTap();
    $('infoOv').classList.add('show');
  });
  $('infoCloseBtn').addEventListener('click', function () {
    $('infoOv').classList.remove('show');
    sndUntap();
  });
  $('infoOv').addEventListener('click', function (e) {
    if (e.target === $('infoOv')) $('infoOv').classList.remove('show');
  });

  $('diffRow').addEventListener('click', function (e) {
    var b = e.target, id;
    while (b && b !== this && !(b.getAttribute && b.getAttribute('data-diff'))) b = b.parentNode;
    if (!b || b === this || state !== 'intro') return;
    id = b.getAttribute('data-diff');
    if (id === DIFF.id) return;
    unlock(); sndTap();
    setDiff(id);
    persist();
    buildTray();
    applyI18n();
  });

  $('startBtn').addEventListener('click', function () {
    unlock(); sndTap();
    $('introOv').classList.remove('show');
    newGame();
  });

  ladleBtn.addEventListener('click', doLadle);

  $('againBtn').addEventListener('click', function () {
    unlock(); sndTap();
    $('endOv').classList.remove('show');
    newGame();
  });
  $('endDiffBtn').addEventListener('click', function () {
    unlock(); sndTap();
    // 엔딩 -> 인트로. 난이도 피커는 state === 'intro' 에서만 먹는다.
    $('endOv').classList.remove('show');
    state = 'intro';
    running = true;          // 부팅 때와 같은 대기 김
    picked = [];             // 직전 판의 선택/흐린 칩이 트레이에 남지 않게
    renderPick();
    renderDiffPick();
    $('introOv').classList.add('show');
    // 난이도를 바꾸러 온 사람이니 난이도 행이 보이는 위치에서 연다
    var isheet = $('introOv').querySelector('.sheet');
    if (isheet) isheet.scrollTop = 0;
  });
  $('endHomeBtn').addEventListener('click', function () {
    window.location.href = '../../index.html';
  });

  document.addEventListener('pointerdown', unlock, { passive: true });
  document.addEventListener('touchstart', unlock, { passive: true });

  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', function () {
    setTimeout(resizeCanvas, 220);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopAmbient();
    else if (state === 'play') startAmbient();
  });

  /* ===================== boot ===================== */
  lang = detectLang();
  loadSave();
  setDiff(save.diff);
  buildTray();
  applyI18n();
  resizeCanvas();
  // idle steam before the game starts, so the intro scene breathes
  running = true;
  rafId = requestAnimationFrame(tick);
})();
</script>
</body>
</html>
