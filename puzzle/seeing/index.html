/* =========================================================================
   §10 p3_trap — 함정 라운드
   ========================================================================= */
function trapItem(){
  var p = curP(), id = p.extra.item_id, i;
  for(i=0;i<CONFIG.trap_pool.length;i++) if(CONFIG.trap_pool[i].id===id) return CONFIG.trap_pool[i];
  return CONFIG.trap_pool[0];
}
function trapPickUnseen(seenIds){
  var pool = [], i;
  for(i=0;i<CONFIG.trap_pool.length;i++){
    if(seenIds.indexOf(CONFIG.trap_pool[i].id)<0) pool.push(CONFIG.trap_pool[i]);
  }
  return pool.length ? pickOne(pool) : null;
}
function enterP3(){
  var p = curP();
  if(!p.extra || !p.extra.item_id){
    /* 첫 출제는 풀에서 균등 랜덤 (trap_first: "random") */
    var first = (CONFIG.trap_first==='random') ? pickOne(CONFIG.trap_pool) : CONFIG.trap_pool[0];
    p.extra = {item_id:first.id, swapped:false, swap_from:null, answer_raw:null, discarded:null};
  }
  var item = trapItem();
  txt($('#p3Text'), item.text);
  txt($('#p3Unit'), item.unit);
  R.trapVal = '';
  p3Paint();
  buildKeypad();
  $('#p3Give').hidden = true;
  R.box.bar = $('#tb3 i'); R.box.bar.style.transform = 'scaleX(1)';
  show('p3', stepId('solve'));
}
function p3Paint(){
  var v = $('#p3Val');
  if(R.trapVal===''){ v.textContent = '—'; v.className = 'empty'; }
  else { v.textContent = R.trapVal; v.className = ''; }
  $('#p3Go').disabled = (R.trapVal==='');
}
function buildKeypad(){
  var kp = $('#p3Kp');
  if(kp.childNodes.length) return;                 // 1회만 만든다
  var keys = ['1','2','3','4','5','6','7','8','9','지움','0',''];
  for(var i=0;i<keys.length;i++){
    var k = keys[i], b = document.createElement('button');
    b.type = 'button';
    b.textContent = k;
    if(k==='지움') b.className = 'fn';
    if(k===''){ b.className = 'void'; b.disabled = true; }
    b.setAttribute('data-k', k);
    kp.appendChild(b);
  }
  kp.addEventListener('click', function(e){
    var t = e.target;
    if(!t || t.tagName!=='BUTTON' || R.screen!=='p3') return;
    var k = t.getAttribute('data-k');
    if(k==='') return;
    logEvent('key', true);
    if(k==='지움') R.trapVal = R.trapVal.slice(0,-1);
    else if(R.trapVal.length < 6) R.trapVal += k;
    p3Paint();
  });
}
$('#p3Go').addEventListener('click', function(){
  if(R.screen!=='p3' || R.trapVal==='') return;
  var p = curP();
  logEvent('submit', true);
  p.attempts.push({t:now(), input:String(R.trapVal)});
  p.extra.answer_raw = String(R.trapVal);
  p.solved = true;
  p.correct = (Number(R.trapVal) === trapItem().answer);
  p.t_solve_end = now();
  stopBox();
  save();
  p3Flow('submit');
});
$('#p3Give').addEventListener('click', function(){ p3End('giveup'); });
function p3End(kind){
  var p = curP();
  if(p.t_solve_end!=null) return;
  p.t_solve_end = now();
  if(kind==='timeout') p.timeout = true; else p.gave_up = true;
  p.extra.answer_raw = null;
  p.correct = false;
  p.revealed = true;
  stopBox();
  save();
  p3Flow('reveal');
}
/* 어떤 경로로도 확신도 → 기지 확인 → 아하 → 공개 순서를 반드시 통과한다 */
function p3Flow(kind){
  R.queue = [ stepConf(kind==='submit' ? 'submit' : 'reveal'),
              stepKnownTrap(), stepAha('self_solved'), stepRevealP3() ];
  nextStep();
}
function stepKnownTrap(){
  return function(){
    var p = curP();
    txt($('#knownStage'), stageLabel());
    txt($('#knownQ'), CONFIG.m1_copy.known.q_trap);
    txt($('#knownSub'), CONFIG.m1_copy.known.sub);
    R.known = function(yes){
      if(!yes){ p.known_before = false; save(); nextStep(); return; }
      var canSwap = !p.extra.swapped && (CONFIG.trap_max_swap>0);
      var nextItem = canSwap ? trapPickUnseen([p.extra.item_id, p.extra.swap_from]) : null;
      if(nextItem){ trapSwap(nextItem); return; }
      /* 스왑 소진·교체본 없음 → 라운드를 건너뛰지 않고 그대로 진행 */
      p.known_before = true; save(); nextStep();
    };
    show('known', stepId('known'));
  };
}
function trapSwap(nextItem){
  var p = curP(), t = now();
  /* 폐기되는 1회차 라운드는 **원값을 통째로** extra.discarded 에 옮긴 뒤(스펙 §4 P3),
     퍼즐의 타이밍 창을 새로 연다. t_start 를 그대로 두면 교체본의 pre_input_gap_ms 와
     stall 창에 폐기 라운드 전체(문제 읽기·키패드·확신도·기지 확인)가 섞이고,
     타임박스의 idle_grace 게이트도 이미 만족돼 카운트다운이 즉시 시작된다. */
  p.extra.discarded = {
    item_id: p.extra.item_id,
    conf: {v:p.conf.v, touched:p.conf.touched, t:p.conf.t},
    answer_raw: p.extra.answer_raw,
    aha: null,
    t_start: p.t_start, t_first_input: p.t_first_input, t_solve_end: p.t_solve_end,
    pre_input_gap_ms: p.pre_input_gap_ms,
    attempts: p.attempts, events: p.events,
    hidden_ms: p.hidden_ms, hidden_spans: p.hidden_spans,
    blocked_ms: p.blocked_ms, blocked_spans: p.blocked_spans
  };
  p.extra.swap_from = p.extra.item_id;
  p.extra.swapped = true;
  p.extra.item_id = nextItem.id;
  p.extra.answer_raw = null;
  p.conf = {v:null, touched:false, t:0};
  p.solved = false; p.correct = false; p.revealed = false; p.timeout = false; p.gave_up = false;
  p.known_before = null;
  /* ── 교체본 기준으로 타이밍·시도 기록 초기화 (원값은 discarded 에 남아 있다) ── */
  p.t_start = t;
  p.t_first_input = null; p.pre_input_gap_ms = null; p.t_solve_end = null;
  p.attempts = [];
  p.events = [{t:t, kind:'enter'}];
  p.hidden_ms = 0; p.hidden_spans = [];
  p.blocked_ms = 0; p.blocked_spans = [];
  p.hints = []; p.assisted = false; p.assist_level = 0;
  R.confPrompted[p.id] = false;
  R.queue = [];
  R.trapVal = '';
  startBox(p.id);
  save();
  enterP3();
}
function stepRevealP3(){
  return function(){
    var p = curP(), item = trapItem(), C = CONFIG.m1_copy.p3;
    if(p.revealed) logEvent('reveal', false);     // 스펙 §5-1 kind — 만료·포기로 해답을 열람
    revealReset();
    var b = $('#revBody');
    var touched = p.conf.touched, cv = p.conf.v;
    function fill(s){ return String(s).replace('{conf}', String(cv)); }
    /* 분기 우선순위: 기지자 > 무응답자 > 정답자/오답자 */
    var branch;
    if(p.known_before === true) branch = 'known';
    else if(p.extra.answer_raw == null) branch = 'none';
    else if(p.correct) branch = 'right';
    else branch = 'wrong';

    if(branch==='known'){
      b.appendChild(verdict('◎','이미 아는 문제'));
      b.appendChild(el('p','p', C.known));
    } else if(branch==='none'){
      b.appendChild(verdict('○','답을 정하지 않고 지나감'));
      b.appendChild(el('p','p', touched ? fill(C.none) : C.none_untouched));
    } else if(branch==='right'){
      b.appendChild(verdict('✓','갈림을 그대로 지나옴'));
      b.appendChild(el('p','p', touched ? fill(C.right) : C.right_untouched));
    } else {
      b.appendChild(verdict('◇','확신 vs 진실'));
      if(touched) b.appendChild(el('p','p', fill(C.wrong1)));
      else b.appendChild(el('p','p', C.wrong1_untouched));
      b.appendChild(el('p','p', C.wrong2));
    }
    var b2 = $('#revBody2');
    var ans = el('div','answer', String(item.answer)+item.unit);
    if(p.extra.answer_raw!=null){
      ans.appendChild(el('small',null,'적어 주신 답: '+p.extra.answer_raw+item.unit));
    }
    b2.appendChild(ans);
    b2.appendChild(el('p','p', item.explain));
    show('reveal', stepId('reveal'));
  };
}

/* =========================================================================
   §11 p4_ninedot — 아홉 개의 점
   좌표: 격자 인덱스 (x,y ∈ {−1..3}, y 위쪽 +) ↔ units = 인덱스 × spacing_units.
   판정은 units 공간에서만(스펙 §4 P4), 렌더는 units→px 스케일만 적용한다.
   ========================================================================= */
var MARGIN_U = 30;    // 앵커 격자 바깥 여백(units) — 판정에는 영향 없음
/* 탭 히트 반경의 CSS px 하한(반지름). 지름 44px = 최소 터치 타깃.
   **판정 반경(hit_radius_units 22)은 건드리지 않는다** — 이건 손가락으로 앵커를 집는
   히트테스트에만 적용된다. 카드 폭이 460px 를 넘지 못해 22 units 를 px 로 환산하면
   어떤 뷰포트에서도 44px 에 미달하기 때문(390px 화면에서 지름 31.4px). */
var TAP_MIN_R_PX = 22;
function makeNineView(cv){
  return {
    cv:cv, ctx:cv.getContext('2d'), size:0, dpr:1, scale:1, uMin:0, span:0,
    fit:function(maxPx){
      var wrapW = cv.parentNode.clientWidth || 320;
      var size = Math.max(220, Math.min(wrapW, maxPx||400));
      var step = CONFIG.ninedot.anchor_step_units;
      var rings = CONFIG.ninedot.outer_anchor_rings;    // 바깥 앵커 링 수 — 뷰 범위도 따라간다
      var lo = -rings*step - MARGIN_U, hi = (CONFIG.ninedot.grid.n-1+rings)*step + MARGIN_U;
      this.uMin = lo; this.span = hi - lo;
      this.size = size;
      this.scale = size / this.span;
      this.dpr = Math.min(window.devicePixelRatio||1, 3);
      cv.style.width = size+'px'; cv.style.height = size+'px';
      cv.width = Math.floor(size*this.dpr); cv.height = Math.floor(size*this.dpr);
      this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    },
    ux:function(gx){ return (gx*CONFIG.ninedot.anchor_step_units - this.uMin)*this.scale; },
    uy:function(gy){ return this.size - (gy*CONFIG.ninedot.anchor_step_units - this.uMin)*this.scale; },
    px2u:function(x,y){
      return { x:(x/this.scale + this.uMin)/CONFIG.ninedot.anchor_step_units,
               y:((this.size - y)/this.scale + this.uMin)/CONFIG.ninedot.anchor_step_units };
    }
  };
}
function anchorList(){
  var out = [], gx, gy;
  var n = CONFIG.ninedot.grid.n, r = CONFIG.ninedot.outer_anchor_rings;  // 스펙 §7-1
  for(gy=-r; gy<=n-1+r; gy++)
    for(gx=-r; gx<=n-1+r; gx++)
      out.push({x:gx, y:gy, real:(gx>=0 && gx<n && gy>=0 && gy<n)});
  return out;
}
function enterP4(){
  var p = curP();
  p.extra = {strokes:[], vertices_tapped:0, out_of_box_first_t:null,
             disconnected:false, hit_radius_px:0};
  R.nine = {view:makeNineView($('#nine')), anchors:anchorList(), start:null,
            strokes:[], preview:null, undoLeft:0, showHint:false, locked:false};
  R.nine.view.fit(400);
  recordHitRadius(p);
  txt($('#p4Cnt'), '0 / '+CONFIG.ninedot.max_strokes+'획');
  $('#p4Undo').disabled = true;
  $('#p4H1').disabled = true; $('#p4H2').disabled = true;
  $('#p4Give').hidden = true;
  $('#p4Hb').innerHTML = '';
  R.box.bar = $('#tb4 i'); R.box.bar.style.transform = 'scaleX(1)';
  show('p4', stepId('solve'));
  R.nine.view.fit(400);
  recordHitRadius(p);
  nineDraw();
}
/* 실제 탭 히트 반경 (units). 판정 반경(22 units)을 쓰되 화면상 반지름이 TAP_MIN_R_PX 아래로
   내려가지 않게 올린다. 불변식 hit_radius < anchor_step/2 를 넘지 않도록 0.49×step 로 상한을 건다
   (최소 캔버스 220px 에서도 46 units 이므로 실제로는 걸리지 않는 안전판). */
function tapRadiusUnits(v){
  var stepU = CONFIG.ninedot.anchor_step_units;
  var minU = (v && v.scale>0) ? (TAP_MIN_R_PX / v.scale) : CONFIG.ninedot.hit_radius_units;
  return Math.min(Math.max(CONFIG.ninedot.hit_radius_units, minU), stepU*0.49);
}
/* extra.hit_radius_px 는 스펙 §4 P4 "실제 사용된 px 반경" — 판정 상수의 환산값이 아니라 탭 히트에 쓴 값 */
function recordHitRadius(p){
  var v = R.nine && R.nine.view;
  if(p && v && v.scale>0) p.extra.hit_radius_px = Math.round(tapRadiusUnits(v) * v.scale * 10) / 10;
}
function nineHit(px, py){
  var v = R.nine.view, u = v.px2u(px,py), best=null, bd=1e9;
  var stepU = CONFIG.ninedot.anchor_step_units;
  var Ru = tapRadiusUnits(v) / stepU;   // 인덱스 단위
  for(var i=0;i<R.nine.anchors.length;i++){
    var a = R.nine.anchors[i];
    var d = Math.sqrt((u.x-a.x)*(u.x-a.x) + (u.y-a.y)*(u.y-a.y));
    if(d<bd){ bd=d; best=a; }
  }
  return (best && bd<=Ru) ? best : null;
}
function nineDraw(){
  var N = R.nine; if(!N) return;
  var v = N.view, ctx = v.ctx, i, j;
  ctx.clearRect(0,0,v.size,v.size);
  /* 배경 */
  ctx.fillStyle = '#0b0f1c';
  ctx.fillRect(0,0,v.size,v.size);
  /* 3×3 상자(연출용 옅은 테두리) */
  ctx.strokeStyle = 'rgba(255,255,255,.06)';
  ctx.lineWidth = 1;
  ctx.strokeRect(v.ux(0), v.uy(2), v.ux(2)-v.ux(0), v.uy(0)-v.uy(2));
  /* 힌트 ② — 상자 밖으로 나간 예시 1획 */
  if(N.showHint){
    ctx.save();
    ctx.strokeStyle = 'rgba(232,185,58,.28)';
    ctx.lineWidth = 3; ctx.setLineDash([6,6]); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(v.ux(-1), v.uy(-1)); ctx.lineTo(v.ux(2), v.uy(2)); ctx.stroke();
    ctx.restore();
  }
  /* 확정된 획 */
  ctx.strokeStyle = '#e8b93a'; ctx.lineWidth = 4; ctx.lineCap='round'; ctx.lineJoin='round';
  for(i=0;i<N.strokes.length;i++){
    var st = N.strokes[i];
    ctx.beginPath();
    ctx.moveTo(v.ux(st[0].x), v.uy(st[0].y));
    for(j=1;j<st.length;j++) ctx.lineTo(v.ux(st[j].x), v.uy(st[j].y));
    ctx.stroke();
  }
  /* 고무줄 미리보기 */
  var last = nineLastAnchor();
  if(last && N.preview && !N.locked && N.strokes.length < CONFIG.ninedot.max_strokes){
    ctx.save();
    ctx.strokeStyle = 'rgba(232,185,58,.45)'; ctx.lineWidth = 2; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(v.ux(last.x), v.uy(last.y));
    ctx.lineTo(N.preview.x, N.preview.y); ctx.stroke();
    ctx.restore();
  }
  /* 앵커 — 실점 9개는 선명, 바깥 16개는 옅게 */
  for(i=0;i<N.anchors.length;i++){
    var a = N.anchors[i], x=v.ux(a.x), y=v.uy(a.y);
    ctx.beginPath();
    ctx.arc(x, y, a.real ? 6.5 : 3.4, 0, Math.PI*2);
    ctx.fillStyle = a.real ? '#e9ecf6' : 'rgba(233,236,246,.24)';
    ctx.fill();
  }
  /* 현재 펜 끝 강조 */
  if(last){
    ctx.beginPath();
    ctx.arc(v.ux(last.x), v.uy(last.y), 10, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(232,185,58,.75)'; ctx.lineWidth = 2; ctx.stroke();
  }
}
function nineLastAnchor(){
  var N = R.nine;
  if(N.strokes.length) { var st = N.strokes[N.strokes.length-1]; return st[st.length-1]; }
  return N.start;
}
function nineLocal(e){
  var r = R.nine.view.cv.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function nineConfirm(a){
  var N = R.nine, p = curP();
  var last = nineLastAnchor();
  if(last && last.x===a.x && last.y===a.y) return;      // 같은 앵커 연속 탭은 무시
  logEvent('tap', true);
  p.extra.vertices_tapped++;
  if(p.extra.out_of_box_first_t==null &&
     (a.x<0 || a.y<0 || a.x>=CONFIG.ninedot.grid.n || a.y>=CONFIG.ninedot.grid.n)){
    p.extra.out_of_box_first_t = now();
  }
  if(!last){ N.start = {x:a.x, y:a.y}; }
  else {
    if(N.strokes.length >= CONFIG.ninedot.max_strokes) return;
    N.strokes.push([{x:last.x,y:last.y},{x:a.x,y:a.y}]);
    p.extra.strokes = N.strokes.slice();
    p.attempts.push({t:now(), input:'stroke:'+last.x+','+last.y+'->'+a.x+','+a.y});
  }
  /* undo 크레딧 — 탭 한 번마다 CONFIG.ninedot.undo_depth 만큼 되돌릴 수 있게 채운다.
     depth 1 이면 종전(한 번 되돌리면 새 탭 전까지 비활성)과 완전히 같다. */
  N.undoLeft = CONFIG.ninedot.undo_depth;
  $('#p4Undo').disabled = !(N.undoLeft > 0);
  txt($('#p4Cnt'), N.strokes.length+' / '+CONFIG.ninedot.max_strokes+'획');
  save();
  nineDraw();
  if(N.strokes.length >= CONFIG.ninedot.max_strokes) p4Complete();
}
(function(){
  var cv = $('#nine');
  cv.addEventListener('pointerdown', function(e){
    if(R.screen!=='p4' || R.nine.locked) return;
    e.preventDefault();
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    R.nine.down = true;
    R.nine.preview = nineLocal(e);
    nineDraw();
  });
  cv.addEventListener('pointermove', function(e){
    if(R.screen!=='p4' || !R.nine || R.nine.locked) return;
    R.nine.preview = nineLocal(e);           // 마우스 hover 에서도 미리보기
    nineDraw();
  });
  cv.addEventListener('pointerleave', function(){
    if(!R.nine) return;
    R.nine.preview = null; R.nine.down = false; nineDraw();
  });
  function up(e){
    if(R.screen!=='p4' || !R.nine || R.nine.locked) return;
    R.nine.down = false;
    var pt = nineLocal(e), a = nineHit(pt.x, pt.y);
    R.nine.preview = null;
    if(a) nineConfirm(a); else nineDraw();
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', function(){ if(R.nine){ R.nine.down=false; R.nine.preview=null; nineDraw(); } });
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();
$('#p4Undo').addEventListener('click', function(){
  var N = R.nine, p = curP();
  if(!N || !(N.undoLeft > 0) || N.locked) return;
  if(!N.strokes.length && N.start==null) return;
  if(N.strokes.length) N.strokes.pop(); else N.start = null;
  p.extra.strokes = N.strokes.slice();
  N.undoLeft--;                               // 크레딧 소진 시 새 탭 전까지 비활성
  $('#p4Undo').disabled = !(N.undoLeft > 0 && (N.strokes.length || N.start!=null));
  txt($('#p4Cnt'), N.strokes.length+' / '+CONFIG.ninedot.max_strokes+'획');
  save(); nineDraw();
});
$('#p4Give').addEventListener('click', function(){ p4End('giveup'); });

function p4Complete(){
  var p = curP();
  if(p.t_solve_end!=null) return;
  p.solved = true;                            // 4획 완성 = 확정
  p.t_solve_end = now();
  stopBox();
  R.nine.locked = true;
  save();
  /* 판정 공개 전 확신도 1탭 */
  R.queue = [ stepConf('nine'), stepJudgeP4(), stepAha(function(){
                return curP().correct ? 'self_solved' : 'after_reveal'; }), stepKnown() ];
  nextStep();
}
function p4End(kind){
  var p = curP();
  if(p.t_solve_end!=null) return;
  p.t_solve_end = now();
  if(kind==='timeout') p.timeout = true; else p.gave_up = true;
  p.revealed = true; p.correct = false;
  stopBox();
  R.nine.locked = true;
  save();
  R.queue = [ stepConf('nine'), stepJudgeP4(), stepAha('after_reveal'), stepKnown() ];
  nextStep();
}
function stepJudgeP4(){
  return function(){
    var p = curP(), C = CONFIG.m1_copy.p4;
    if(p.revealed) logEvent('reveal', false);     // 스펙 §5-1 kind — 만료·포기로 해답을 열람
    var jr = judgeNinedot(p.extra.strokes, CONFIG.ninedot);
    p.extra.disconnected = jr.disconnected;
    /* 불변식: revealed=true → correct=false. 확정 제출 이후의 자동 판정은 revealed 가 아니다 */
    p.correct = p.revealed ? false : !!jr.correct;
    save();
    revealReset();
    var b = $('#revBody');
    if(p.correct){
      b.appendChild(verdict('✓','아홉 점 모두 지남'));
      b.appendChild(el('p','p', C.win));
    } else {
      b.appendChild(verdict('○', p.revealed ? (p.timeout ? '시간이 다 되어 해답을 봄' : '해답을 열어 봄')
                                            : '지나지 못한 점이 남음'));
      b.appendChild(el('p','p', C.lose));
      /* 아무것도 긋지 않은 채 넘어간 경우엔 '떨어져 있었다'는 지적이 성립하지 않는다 */
      if(jr.disconnected && jr.strokes>=2) b.appendChild(el('p','p dim', C.disconnected));
    }
    $('#revCvWrap').hidden = false;
    /* '못 푸는 쪽이 기본'이라는 위로는 못 푼 사람에게만 필요하다 */
    if(!p.correct) $('#revBody2').appendChild(el('p','p dim', C.note));
    $('#revNext').disabled = true;
    show('reveal', stepId('reveal'));
    /* 캔버스 fit 은 화면이 **보이게 된 뒤에** — 섹션이 hidden 인 동안은 부모 clientWidth 가
       0 이라 폴백 320px 로 고정되고, 좁은 화면에서 카드 밖으로 넘쳐 가로 스크롤이 생긴다. */
    R.sol = makeNineView($('#nineSol'));
    R.sol.fit(360);
    runSolutionAnim(function(){ $('#revNext').disabled = false; });
  };
}
/* 해답 애니메이션.
   NOTE: 스펙 §4 P4 카피는 "마지막 획이 상자 밖으로"이지만, 스펙이 확정한 표준해
   (0,0)→(3,0)→(0,3)→(0,0)→(2,2) 에서 펜이 **처음** 상자를 벗어나는 구간은 1획의
   (2,0)→(3,0) 이다. 좌표열은 스펙 확정값이므로 임의로 바꾸지 않고,
   0.8초 정지·강조만 그 구간에 둔다. */
function runSolutionAnim(done){
  var v = R.sol, sp = CONFIG.ninedot.anchor_step_units;
  var pts = CONFIG.ninedot.solution.map(function(a){ return {x:a[0], y:a[1]}; });
  var boxMax = (CONFIG.ninedot.grid.n-1);
  var exit = findBoxExit(pts, boxMax);
  var reduce = reduceMotion();
  var SEG_MS = 700, PAUSE_MS = 800;
  var t0 = now(), pausedUntil = 0, pausedDone = false;

  function drawBase(){
    var ctx = v.ctx, i, j;
    ctx.clearRect(0,0,v.size,v.size);
    ctx.fillStyle = '#0b0f1c'; ctx.fillRect(0,0,v.size,v.size);
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
    ctx.strokeRect(v.ux(0), v.uy(2), v.ux(2)-v.ux(0), v.uy(0)-v.uy(2));
    /* 사용자가 그은 획을 옅게 */
    var mine = curP().extra.strokes || [];
    ctx.save(); ctx.strokeStyle = 'rgba(233,236,246,.18)'; ctx.lineWidth = 3; ctx.lineCap='round';
    for(i=0;i<mine.length;i++){
      ctx.beginPath(); ctx.moveTo(v.ux(mine[i][0].x), v.uy(mine[i][0].y));
      for(j=1;j<mine[i].length;j++) ctx.lineTo(v.ux(mine[i][j].x), v.uy(mine[i][j].y));
      ctx.stroke();
    }
    ctx.restore();
    var A = anchorList();
    for(i=0;i<A.length;i++){
      ctx.beginPath(); ctx.arc(v.ux(A[i].x), v.uy(A[i].y), A[i].real?6.5:3.4, 0, Math.PI*2);
      ctx.fillStyle = A[i].real ? '#e9ecf6' : 'rgba(233,236,246,.24)';
      ctx.fill();
    }
  }
  function drawUpto(seg, frac, highlight){
    drawBase();
    var ctx = v.ctx, i;
    ctx.save();
    ctx.strokeStyle = '#e8b93a'; ctx.lineWidth = 4; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(v.ux(pts[0].x), v.uy(pts[0].y));
    for(i=1; i<=Math.min(seg, pts.length-1); i++) ctx.lineTo(v.ux(pts[i].x), v.uy(pts[i].y));
    ctx.stroke();
    if(seg < pts.length-1){
      var a = pts[seg], b = pts[seg+1];
      ctx.beginPath();
      ctx.moveTo(v.ux(a.x), v.uy(a.y));
      ctx.lineTo(v.ux(a.x + (b.x-a.x)*frac), v.uy(a.y + (b.y-a.y)*frac));
      ctx.stroke();
    }
    ctx.restore();
    if(highlight && exit){
      ctx.save();
      ctx.beginPath();
      ctx.arc(v.ux(exit.gx), v.uy(exit.gy), 15, 0, Math.PI*2);
      ctx.strokeStyle = '#f6dc93'; ctx.lineWidth = 3; ctx.stroke();
      ctx.restore();
    }
  }
  /* 회전·창 크기 변경 후 다시 그릴 수 있게 마지막 프레임 그리기를 노출해 둔다 */
  R.solRedraw = function(){ drawUpto(pts.length-1, 0, true); };
  if(reduce){
    drawUpto(pts.length-1, 0, true);
    if(done) done();
    return;
  }
  beginBlock();
  var tok = ++R.token, finished = false, safety = 0;
  /* 스케줄러는 setTimeout 기반. rAF 는 탭이 백그라운드로 가면 아예 멈추기 때문에,
     그 사이 '계속' 버튼이 영영 잠기는 소프트락이 생긴다. setTimeout 은 스로틀링만
     걸리므로 반드시 끝난다. 그래도 못 끝나면 safety 타이머가 마지막 프레임을 그린다. */
  function schedule(){ setTimeout(frame, 16); }
  function finish(){
    if(finished || tok!==R.token) return;
    finished = true;
    clearTimeout(safety);
    drawUpto(pts.length-1, 0, true);
    endBlock();
    if(done) done();
  }
  function frame(){
    if(tok!==R.token || finished) return;
    var t = now() - t0;
    if(pausedUntil && t < pausedUntil){ drawUpto(exit.seg, exit.frac, true); schedule(); return; }
    if(pausedUntil && t >= pausedUntil){ t0 += (pausedUntil - exit.tAt); pausedUntil = 0; t = now()-t0; }
    var seg = Math.floor(t / SEG_MS), frac = (t % SEG_MS)/SEG_MS;
    if(exit && !pausedDone && (seg > exit.seg || (seg===exit.seg && frac>=exit.frac))){
      pausedDone = true;
      exit.tAt = exit.seg*SEG_MS + exit.frac*SEG_MS;
      pausedUntil = exit.tAt + PAUSE_MS;
      drawUpto(exit.seg, exit.frac, true);
      schedule(); return;
    }
    if(seg >= pts.length-1){ finish(); return; }
    drawUpto(seg, frac, false);
    schedule();
  }
  safety = setTimeout(finish, (pts.length-1)*SEG_MS + PAUSE_MS + 3000);
  schedule();
}
/* 펜이 처음으로 3×3 상자를 벗어나는 지점(격자 인덱스 좌표) */
function findBoxExit(pts, boxMax){
  var eps = 1e-6;
  for(var i=0;i<pts.length-1;i++){
    var a=pts[i], b=pts[i+1];
    for(var s=1;s<=240;s++){
      var f = s/240, x = a.x+(b.x-a.x)*f, y = a.y+(b.y-a.y)*f;
      if(x > boxMax+eps || x < -eps || y > boxMax+eps || y < -eps){
        return {seg:i, frac:f, gx:x, gy:y, tAt:0};
      }
    }
  }
  return null;
}

/* 타임박스 만료 — 만료 동작은 전역 규칙이 아니라 **config.timeout_action[퍼즐 id]** 다.
   퍼즐 id 로 분기를 하드코딩하면 config 를 고쳐도 동작이 안 바뀐다(스펙 §11).
   여기서 id → 종료 함수만 등록하고, 어떤 종료 동작을 태울지는 config 가 정한다. */
var TIMEOUT_END = {};   // 각 퍼즐 정의부 뒤에서 채운다(함수 선언은 호이스팅되지만 의도를 남긴다)
TIMEOUT_END['p1_rat'] = function(){ p1End('timeout'); };
TIMEOUT_END['p3_trap'] = function(){ p3End('timeout'); };
TIMEOUT_END['p4_ninedot'] = function(){ p4End('timeout'); };
function onTimeout(p){
  /* 만료는 제출이 아니다. 가짜 submit 을 찍으면 attempts[] 에 없는 제출이 남고,
     stall 창 맨 끝에 이벤트가 들어가 tail_cap_ms 절단이 무력화된다(스펙 §5-1). */
  logEvent('timeout', false);
  var act = CONFIG.timeout_action[p.id];
  var end = TIMEOUT_END[p.id];
  if(!end) return;
  /* M1 에 있는 세 퍼즐의 만료 동작은 reveal · reveal_via_conf 뿐이다.
     advance(p2) · skip(p5) 는 해당 퍼즐이 들어오는 M2 에서 각자의 종료 함수를 등록한다. */
  if(act==='reveal' || act==='reveal_via_conf'){ end(); return; }
  /* 알 수 없는 값(설정 오타 등)이라도 화면이 멎지 않게 종료는 시킨다 */
  end();
}

/* =========================================================================
   §12 결과 화면 (M1 간이) — 유형·시야각은 표기하지 않는다
   ========================================================================= */
/* 문구는 전부 CONFIG.m1_copy.result 에서 읽는다(결과 화면과 공유 카드가 같은 소스를 소비) */
function statusOf(p){
  var ST = CONFIG.m1_copy.result.status;
  if(!p.presented) return {icon:'—', label:ST.unreached};
  if(p.id==='p3_trap'){
    /* §9: 함정 오답을 '실패'로 표기하지 않는다 (§6-1 어휘를 그대로 쓴다) */
    if(p.known_before===true) return {icon:'◎', label:ST.known};
    if(p.extra.answer_raw==null) return {icon:'○', label:ST.none};
    return p.correct ? {icon:'✓', label:ST.pass} : {icon:'◇', label:ST.learn};
  }
  if(p.correct) return {icon:'✓', label:ST.correct};
  if(p.revealed) return {icon:'○', label: p.timeout ? ST.revealed_timeout : ST.revealed};
  return {icon:'·', label:ST.logged};
}
function nameOf(id){
  var N = CONFIG.m1_copy.result.names;
  return (N && N.hasOwnProperty(id) && N[id]) ? N[id] : id;
}
/* 힌트 표기는 '몇 개 열었나'가 아니라 '몇 단계까지 갔나'다. ②만 연 경우
   hints.length 는 1 이지만 사용자가 본 것은 2단계이므로 최대 level 로 말한다. */
function hintLabel(p){
  var mx = 0, KV = CONFIG.m1_copy.result.kv;
  for(var i=0;i<p.hints.length;i++) mx = Math.max(mx, p.hints[i].level);
  return mx ? (mx+KV.hint_upto) : KV.hint_none;
}
function kv(box, k, v){
  var r = el('div','kv');
  r.appendChild(el('span',null,k));
  r.appendChild(el('span',null,v));
  box.appendChild(r);
}
function renderResult(){
  var RC = CONFIG.m1_copy.result, KV = RC.kv;
  txt($('#resBanner'), RC.banner);
  var list = $('#resList'); list.innerHTML = '';
  for(var i=0;i<S.puzzles.length;i++){
    var p = S.puzzles[i], st = statusOf(p);
    var row = el('div','rrow');
    var h = el('h3', null, p.order_index+'. '+nameOf(p.id));
    h.appendChild(el('em', null, st.icon+' '+st.label));
    row.appendChild(h);
    if(p.presented){
      kv(row, KV.conf, p.conf.touched ? (p.conf.v+KV.conf_of) : KV.skipped);
      if(CONFIG.aha.collect_on.indexOf(p.id)>=0){
        kv(row, KV.aha, p.aha.touched
          ? (KV.aha_sudden+p.aha.sudden+KV.aha_pleasure+p.aha.pleasure)
          : KV.skipped);
      }
      kv(row, KV.time, fmtDur(puzzleActiveMs(p)));
      kv(row, KV.hint, hintLabel(p));
      if(p.id==='p3_trap' && p.extra.swapped) kv(row, KV.item, KV.swapped);
    } else {
      kv(row, KV.record, KV.not_presented);
    }
    list.appendChild(row);
  }
  var tail = el('p','p dim', RC.tail);
  tail.style.marginTop = '12px';
  list.appendChild(tail);
  txt($('#resDisc'), CONFIG.m1_copy.disclaimer);
  txt($('#resAgain'), RC.btn_again);
  buildDownload();
  /* 스펙 §8-3 ①: 결과 진입 시 선렌더 + File 선생성. 공유 카드의 어떤 실패도 결과 화면
     진입(goResult 의 show → fireComplete → archivePush → R.done)을 막으면 안 된다(§8-4 원칙과 동일) */
  try{ prepareShareCard(); }
  catch(e){ try{ shareFinalize(null, null); }catch(e2){} }
}
function buildDownload(){
  var a = $('#resDl');
  try{
    if(R.dlUrl){ URL.revokeObjectURL(R.dlUrl); R.dlUrl = null; }
    var blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
    R.dlUrl = URL.createObjectURL(blob);
    a.href = R.dlUrl;
    a.download = 'seeing-'+String(S.session_id).slice(0,8)+'.json';
    txt(a, CONFIG.m1_copy.result.btn_json);
  }catch(e){
    a.removeAttribute('href');
    txt(a, CONFIG.m1_copy.result.json_unavailable);
  }
}
function goResult(){
  /* 이미 완료된 세션(테스트 훅 goto('result') 재호출 등)은 S 를 건드리지 않고 화면만 다시 그린다 —
     archive 에 같은 session_id 가 두 번 들어가지 않게 */
  if(R.done){ renderResult(); show('result', 'result'); return; }
  S.ts_end = now();
  S.active_total_ms = (now() - S.ts_start) - S.hidden_ms - S.blocked_ms;
  R.pidx = S.puzzles.length;      // 진행 표시 전부 완료
  renderProg();
  save();
  renderResult();
  show('result', 'result');
  fireComplete();
  /* 완주 세션은 archive 로 옮기고 진행 중 키는 비운다.
     이후 pagehide·pushSpan 이 save() 를 불러도 진행 키가 되살아나지 않게 R.done 으로 막는다 */
  archivePush(S);
  LS.del(K_SESSION);
  R.done = true;
}
$('#resAgain').addEventListener('click', function(){
  try{ if(R.dlUrl) URL.revokeObjectURL(R.dlUrl); }catch(e){}
  shareRelease();                                    // R.shareUrl revoke — dlUrl 과 같은 자리
  LS.del(K_SESSION);
  try{ location.reload(); }catch(e){}
});

/* =========================================================================
   §12-b 공유 카드 (M1.5 스파이크) — 스펙 §8-3 ①~⑤
   · ① 결과 진입 시 canvas 선렌더 + toBlob → File 을 R.shareFile 에 미리 둔다.
       탭 시점에는 렌더도 인코딩도 하지 않는다.
   · ② 탭 핸들러(onShareTap)는 canShare 동기 검사 → navigator.share 를 대기 없이 호출,
       반환 프라미스는 catch 로만 처리한다(제스처 컨텍스트 보존).
   · ③ 미지원·거부·예외 → 폴백 패널(카드 이미지 + a[download]). 프로그램적 클릭 X.
   · ④ 인앱 웹뷰(CONFIG.share.inapp_ua) → ② 생략, 이미지 + '길게 눌러 저장' 안내.
   · ⑤ 카드 이미지 안에 URL 텍스트(CONFIG.share.url).
   세션 불변 해석: 공유는 goResult() 이후(archivePush → K_SESSION 삭제 → R.done)에만
   일어난다. 세션은 이미 종료·보관됐으므로 S 를 변형하지 않고, 공유 시트·인코딩 대기를
   blocked_spans 에도 적재하지 않는다(§8-1 의 blocked 는 진행 중 세션의 활성 시간 보정용).
   저장본뿐 아니라 인메모리 S 도 불변이다 — pushSpanAt 이 R.done 이면 즉시 반환하므로 결과 화면
   에서의 hidden 전환(iOS 공유 시트 포함)이 hidden_spans 를 더 쌓지 않는다.
   GA4: 공유 탭은 game_step(step:'share', method) 로 남긴다. 스펙 §8-2 표에는 share 행·method
   파라미터가 아직 없다 — M1.5 임시 확장이며 스펙 개정(§8-2 share 행 추가 또는 별도 이벤트명)
   전까지의 잠정 표기다. 3중 가드는 gaStep 이 그대로 적용한다.
   렌더러는 cardModel() 이 만든 데이터 객체만 그린다 — M2-a 에서 모델만 갈아 끼운다.
   ========================================================================= */

/* ── 순수 함수 ── */
/* 인앱 웹뷰 감지 — UA 부분 문자열, 대소문자 구분(스펙 §7-1 inapp_ua 표기 그대로) */
function detectInApp(ua, list){
  var s = String(ua==null?'':ua), L = list || CONFIG.share.inapp_ua, i;
  for(i=0;i<L.length;i++){ if(s.indexOf(L[i])>=0) return true; }
  return false;
}
/* 공유 모드 결정 — 'inapp' | 'share' | 'download'. o.force('inapp'|'download')는 감지보다 우선(테스트 훅) */
function shareMode(o){
  o = o || {};
  if(o.force==='inapp' || o.force==='download') return o.force;
  if(o.inApp) return 'inapp';
  if(o.hasFile && o.canShareFiles) return 'share';
  return 'download';
}
/* measureText 기반 줄바꿈. 한국어는 공백이 드무니 글자 단위로 폭을 누적하고,
   줄 안에 공백이 있으면 그 자리에서 먼저 끊는다. '\n' 은 강제 개행. 글자는 잃지 않는다.
   글자 단위는 **코드포인트**다 — 서로게이트 쌍(이모지 등)을 charAt 로 반쪽씩 다루면 줄 경계에서
   쪼개져 깨진 글리프가 찍힌다. config 문구는 편집 대상이므로 여기서 막는다. */
function wrapText(ctx, text, maxW){
  var s = String(text==null?'':text), out = [], line = '', i, ch, cu, cand, sp, head, tail;
  for(i=0;i<s.length;i++){
    cu = s.charCodeAt(i);
    if(cu>=0xD800 && cu<=0xDBFF && i+1<s.length){ ch = s.substr(i,2); i++; }   // 상위+하위 서로게이트 = 한 글자
    else ch = s.charAt(i);
    if(ch==='\n'){ out.push(line); line=''; continue; }
    cand = line + ch;
    if(line==='' || ctx.measureText(cand).width <= maxW){ line = cand; continue; }
    sp = line.lastIndexOf(' ');
    if(sp>0){
      head = line.slice(0,sp); tail = line.slice(sp+1) + ch;
      if(ctx.measureText(tail).width <= maxW){ out.push(head); line = tail; continue; }
    }
    out.push(line);
    line = (ch===' ') ? '' : ch;
  }
  if(line!=='') out.push(line);
  return out;
}
/* 카드 모델 — 세션(sess)과 CONFIG(cfg)에서만 만든다. 렌더러는 이 객체만 그린다.
   §6-1 일괄 규칙: 소스 값이 없으면 줄 단위 생략(null). presented=false 인 퍼즐 행은 넣지 않는다
   (§6-1 ④ '미도달'은 문구를 쓰지 않고 줄 자체를 생략). */
function cardModel(sess, cfg){
  cfg = cfg || CONFIG;
  var sh = cfg.share, cc = sh.card, rows = [], i, p, st;
  var pz = (sess && sess.puzzles) ? sess.puzzles : [];
  for(i=0;i<pz.length;i++){
    p = pz[i];
    if(!p || !p.presented) continue;
    st = statusOf(p);
    rows.push({icon:st.icon, name:p.order_index+'. '+nameOf(p.id), status:st.label});
  }
  var act = sess ? sess.active_total_ms : null;
  var meta = (typeof act==='number' && isFinite(act) && act>0)
           ? String(cc.meta).replace('{dur}', fmtDur(act)) : null;
  return {
    brand: cc.brand || null,
    title: sh.title,
    subtitle: cc.subtitle || null,
    rows: rows,
    meta: meta,
    tail: cfg.m1_copy.result.tail || null,      // 스펙 §6-1: 어떤 폴백 카드에도 '여기까지 잰 것만 더했어요' 1줄
    note: sh.copy.provisional || null,          // 스펙 §10: M2-b 이전 버전은 잠정 판정 각주
    disclaimer: cfg.m1_copy.disclaimer,         // 스펙 §6-1 ⑥ 하단 고지 1줄
    url: sh.url                                 // 스펙 §8-3 ⑤
  };
}

/* ── 렌더러 — 모델만 그린다 ── */
function rrect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}
/* model → canvas (CSS px 좌표계, 백킹은 dpr 배). 실패 시 null. */
function buildShareCard(model, cc){
  cc = cc || CONFIG.share.card;
  var W = cc.w, H = cc.h, dpr = cc.dpr || 1, pad = cc.pad, fs = cc.fs, col = cc.colors, fam = cc.font;
  var cv = document.createElement('canvas');
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  var ctx = cv.getContext('2d'); if(!ctx) return null;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var cw = W - pad*2, i, j, lines, y;
  function F(size, weight){ ctx.font = (weight||400)+' '+size+'px '+fam; }
  function para(text, size, weight, color, lh, x, yy, maxW){
    if(text==null || text==='') return yy;
    F(size, weight); ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    var L = wrapText(ctx, text, maxW==null?cw:maxW);
    for(var k=0;k<L.length;k++){ ctx.fillText(L[k], x==null?pad:x, yy); yy += size*lh; }
    return yy;
  }
  /* 배경 — 짙은 남색 그라데이션 + 아래쪽 금색 글로우 + 얇은 금색 프레임.
     그라데이션은 **세로 방향만** 쓴다(각 행이 균일 → PNG 필터가 잘 먹어 1.3MB → 0.2MB 대.
     대각선·방사형 글로우는 같은 그림에서 파일이 6~7배 커진다) */
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, col.bg0); g.addColorStop(1, col.bg1);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  var g2 = ctx.createLinearGradient(0, H*(cc.glow_from==null?0.55:cc.glow_from), 0, H);
  g2.addColorStop(0, col.glow0); g2.addColorStop(1, col.glow);
  ctx.fillStyle = g2; ctx.fillRect(0,0,W,H);
  rrect(ctx, 14, 14, W-28, H-28, 18);
  ctx.strokeStyle = col.frame; ctx.lineWidth = 1.5; ctx.stroke();

  /* 머리 — 금색 짧은 바 · 브랜드 · 제목 · 부제 */
  y = pad;
  ctx.fillStyle = col.acc; ctx.fillRect(pad, y, 44, 4);
  y += 18;
  y = para(model.brand, fs.brand, 600, col.dim, 1.4, pad, y);
  y += 6;
  y = para(model.title, fs.title, 700, col.acc2, 1.15, pad, y);
  y += 8;
  y = para(model.subtitle, fs.sub, 400, col.ink2, 1.55, pad, y);
  y += 12;
  ctx.fillStyle = col.line; ctx.fillRect(pad, y, cw, 1);
  y += 20;

  /* 바닥 블록은 아래에서 위로 고정 배치 — 행 수와 무관하게 URL·고지 위치가 흔들리지 않게 */
  var bottomY = H - pad - fs.url*1.2;                       // URL 줄 상단
  F(fs.disc, 400);
  var discLines = model.disclaimer ? wrapText(ctx, model.disclaimer, cw) : [];
  var discTop = bottomY - 10 - discLines.length*fs.disc*1.5;
  var noteH = model.note ? (fs.note*1.5 + 20) : 0;
  var noteTop = discTop - 14 - noteH;
  var tailH = model.tail ? fs.meta*1.6 : 0;                 // §6-1 '여기까지 잰 것만 더했어요' — 각주 바로 위
  var tailTop = noteTop - 10 - tailH;
  var metaH = model.meta ? fs.meta*1.6 : 0;
  var metaTop = tailTop - (model.tail ? 2 : 0) - metaH;

  /* 퍼즐 행 — 아이콘(금색 원) · 이름 · 상태(오른쪽 정렬, 안 들어가면 다음 줄) */
  var rows = model.rows || [], iconR = 15, nameX = pad + iconR*2 + 14, rowGap = 14;
  var availH = metaTop - y - 8, rowsH = 0, plan = [];
  for(i=0;i<rows.length;i++){
    F(fs.row, 600); var nw = ctx.measureText(rows[i].name).width;
    F(fs.status, 500); var sw = ctx.measureText(rows[i].status).width;
    var inline = (nameX - pad) + nw + 16 + sw <= cw;
    var h = fs.row*1.35 + (inline ? 0 : fs.status*1.5);
    plan.push({inline:inline, h:h});
    rowsH += h + (i<rows.length-1 ? rowGap : 0);
  }
  var scale = (rowsH > availH && rowsH>0) ? Math.max(0.6, availH/rowsH) : 1;   // 안전판: 넘치면 촘촘히
  var slack = availH - rowsH;                                                     // 여유가 있으면 행 사이를 조금 벌린다
  if(slack > 0 && rows.length){ var extra = Math.min(slack/(rows.length+1), fs.row*1.2); y += extra; rowGap += extra; }
  for(i=0;i<rows.length;i++){
    var r = rows[i], cy = y + fs.row*0.62;
    ctx.beginPath(); ctx.arc(pad+iconR, cy, iconR, 0, Math.PI*2);
    ctx.fillStyle = col.acc3; ctx.fill();
    F(fs.row-2, 700); ctx.fillStyle = col.acc2; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(r.icon, pad+iconR, cy+1);
    F(fs.row, 600); ctx.fillStyle = col.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(r.name, nameX, y);
    F(fs.status, 500); ctx.fillStyle = col.acc2;
    if(plan[i].inline){ ctx.textAlign = 'right'; ctx.fillText(r.status, W-pad, y + (fs.row-fs.status)*0.6); }
    else { ctx.textAlign = 'left'; ctx.fillText(r.status, nameX, y + fs.row*1.35); }
    ctx.textAlign = 'left';
    y += (plan[i].h + rowGap) * scale;
  }

  /* 메타(활성 시간) · 폴백 한 줄(§6-1) · 잠정 판정 각주 · 고지 · URL */
  if(model.meta){ para(model.meta, fs.meta, 500, col.ink2, 1.6, pad, metaTop); }
  if(model.tail){ para(model.tail, fs.meta, 400, col.ink2, 1.6, pad, tailTop); }
  if(model.note){
    rrect(ctx, pad, noteTop, cw, noteH, 10);
    ctx.fillStyle = col.notebg; ctx.fill();
    ctx.strokeStyle = col.line; ctx.lineWidth = 1; ctx.stroke();
    para(model.note, fs.note, 500, col.dim, 1.5, pad+12, noteTop+10, cw-24);
  }
  F(fs.disc, 400); ctx.fillStyle = col.dim; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  for(j=0;j<discLines.length;j++){ ctx.fillText(discLines[j], pad, discTop + j*fs.disc*1.5); }
  ctx.fillStyle = col.acc; ctx.fillRect(pad, bottomY-6, 22, 2);
  F(fs.url, 700); ctx.fillStyle = col.acc; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(model.url || '', pad+30, bottomY);
  return cv;
}

/* ── 준비 · UI ── */
function shareRelease(){
  R.shareToken++;                                     // 늦게 도착하는 toBlob 콜백·안전 타이머 무효화
  try{ if(R.shareUrl) URL.revokeObjectURL(R.shareUrl); }catch(e){}
  R.shareUrl = null; R.shareFile = null; R.canShareFiles = false; R.shareData = null;
  R.shareReady = false; R.shareMode = null; R.shareLastErr = null; R.sharing = false;
}
function forcedShareMode(){
  var f = qparam('share');
  return (f==='inapp' || f==='download') ? f : null;
}
/* 인앱(④)이 될 것인지는 toBlob 전에 알 수 있다(UA 감지 또는 ?share=inapp) — canShare 와 무관 */
function willBeInApp(){ return forcedShareMode()==='inapp' || (forcedShareMode()==null && R.inApp); }
function prepareShareCard(){
  shareRelease();
  R.shareModel = cardModel(S, CONFIG);
  renderShareUI();                                    // '카드 준비 중…' 상태
  var cv = null;
  try{ cv = buildShareCard(R.shareModel, CONFIG.share.card); }catch(e){ cv = null; }
  if(!cv || typeof cv.toBlob!=='function' || !window.URL || typeof URL.createObjectURL!=='function'){
    shareFinalize(null, null); return;
  }
  /* 인앱 전용 data: URL — 웹뷰의 '이미지 저장'·DownloadListener 는 blob: 을 앱 프로세스에서 열 수 없다.
     동기 1회(≈0.5MB 문자열). share/download 모드는 blob 을 그대로 쓴다 */
  if(CONFIG.share.inapp_img==='data' && willBeInApp()){
    try{ R.shareData = cv.toDataURL('image/png'); }catch(e){ R.shareData = null; }
    if(R.shareData && String(R.shareData).indexOf('data:image/png')!==0) R.shareData = null;
  }
  var tok = R.shareToken;
  /* 안전 타이머 — toBlob 콜백이 영영 오지 않는 환경(구형 웹뷰)에서 '카드 준비 중…' 에 남지 않게.
     시간 안에 못 오면 토큰을 올려 늦은 콜백을 버리고 '카드 없음' 분기로 확정한다 */
  var to = CONFIG.share.prepare_timeout_ms;
  if(to>0){
    setTimeout(function(){
      if(tok!==R.shareToken || R.shareReady) return;
      R.shareToken++;
      shareFinalize(null, null);
    }, to);
  }
  try{
    cv.toBlob(function(b){
      if(tok!==R.shareToken) return;                  // 그 사이 다시 시작/재렌더됨 · 안전 타이머 경과
      if(!b){ shareFinalize(null, null); return; }
      var f = null;
      try{ if(typeof File==='function') f = new File([b], CONFIG.share.file_name, {type:'image/png'}); }
      catch(e){ f = null; }                           // File 생성자 없음 → 폴백 모드(다운로드만)
      shareFinalize(f, b);
    }, 'image/png');
  }catch(e){ shareFinalize(null, null); }
}
/* 파일 준비 완료 콜백 — canShare 를 여기서 미리 계산해 둔다(탭 시점엔 동기 재확인만) */
function shareFinalize(file, blob){
  R.shareFile = file || null;
  R.shareUrl = null;
  if(blob){ try{ R.shareUrl = URL.createObjectURL(blob); }catch(e){ R.shareUrl = null; } }
  R.canShareFiles = false;
  if(file){
    try{ R.canShareFiles = !!(navigator.share && navigator.canShare && navigator.canShare({files:[file]})); }
    catch(e){ R.canShareFiles = false; }
  }
  R.shareReady = true;
  R.shareMode = shareMode({inApp:R.inApp, hasFile:!!R.shareFile, canShareFiles:R.canShareFiles, force:forcedShareMode()});
  renderShareUI();
}
function renderShareUI(){
  var C = CONFIG.share.copy;
  var wrap = $('#resCard'), img = $('#resCardImg'), btn = $('#resShare'), dl = $('#resShareDl');
  var hint = $('#resShareHint'), fb = $('#resShareFb'), fbdl = $('#resShareFbDl');
  fb.hidden = true;
  img.alt = C.img_alt || '';
  if(!R.shareReady){
    wrap.hidden = true; dl.hidden = true; hint.hidden = true;
    btn.hidden = false; btn.disabled = true; txt(btn, C.preparing);
    return;
  }
  /* 인앱(④)은 data: URL 우선(CONFIG.share.inapp_img), 그 외는 blob: */
  var inapp = (R.shareMode==='inapp');
  var src = (inapp && R.shareData) ? R.shareData : R.shareUrl;
  if(!src){                                           // 이미지 자체를 못 만든 환경
    wrap.hidden = true; btn.hidden = true; dl.hidden = true;
    hint.hidden = false; txt(hint, C.unavailable);
    return;
  }
  img.src = src; wrap.hidden = false;
  dl.href = src; dl.download = CONFIG.share.file_name; txt(dl, C.btn_download);
  fbdl.href = R.shareUrl || src; fbdl.download = CONFIG.share.file_name; txt(fbdl, C.btn_download);
  txt($('#resShareFbTitle'), C.fb_title); txt($('#resShareFbHint'), C.fb_hint);
  /* 인앱 a[download] 는 새 컨텍스트로 — download 를 무시하는 웹뷰(iOS WKWebView)가 현재 문서를
     이미지로 갈아치우면 K_SESSION 이 이미 비어 있어 복귀 시 인트로로 떨어진다 */
  if(inapp){ dl.setAttribute('target','_blank'); dl.setAttribute('rel','noopener'); }
  else { dl.removeAttribute('target'); dl.removeAttribute('rel'); }
  if(R.shareMode==='share'){
    btn.hidden = false; btn.disabled = !!R.sharing; txt(btn, C.btn_share);
    dl.hidden = true; hint.hidden = true;
  } else if(inapp){
    /* ④ 인앱: 공유 시트를 시도하지 않는다. 이미지 + 길게 눌러 저장 + 보조 a[download] */
    btn.hidden = true;
    dl.hidden = false; dl.className = 'ghost dl';
    hint.hidden = false; txt(hint, C.inapp_hint);
  } else {
    /* ③ download: 주 버튼 자체가 a[download] — 제스처 안에서 동기 다운로드.
       blob: a[download] 는 파일 앱으로 가거나(iOS 13~14) 무시되기도(iOS 12↓) 하므로
       미리보기를 길게 눌러 저장하는 경로도 함께 안내한다(문구는 inapp_hint 재사용) */
    btn.hidden = true;
    dl.hidden = false; dl.className = 'btn dl';
    hint.hidden = false; txt(hint, C.inapp_hint);
  }
}
function shareFallback(reason){
  R.shareLastErr = reason || null;
  if(!R.shareUrl) return;
  $('#resShareFb').hidden = false;
}
/* navigator.share 거부 중 폴백 패널을 열지 않을 것 — 사용자 취소(AbortError)와, 시트가 이미 떠 있는
   동안의 재호출(InvalidStateError: 시트는 정상 동작 중). 목록은 CONFIG.share.ignore_errors */
function shareErrIgnored(name, list){
  var L = list || CONFIG.share.ignore_errors || [];
  return !!name && L.indexOf(name)>=0;
}
/* 재탭 잠금 — 프라미스 미해결 동안 두 번째 navigator.share 는 InvalidStateError 로 거부되므로
   버튼 자체를 잠근다. 해제는 finally(있으면) / 없으면 retap_guard_ms 뒤 */
function shareLock(on){
  R.sharing = !!on;
  var btn = $('#resShare');
  if(btn && !btn.hidden) btn.disabled = !!on;
}
/* ② 탭 핸들러 — 동기 경로에 비동기 대기가 없다(DoD: 정적 검사는 셀프테스트).
   canShare 동기 사전 검사 → navigator.share 즉시 호출 → 반환 프라미스는 catch 로만.
   catch 시점은 제스처 밖이므로 a[download].click() 을 프로그램으로 부르지 않고 폴백 패널만 연다. */
function onShareTap(){
  var f = R.shareFile;
  if(R.sharing) return;                               // 시트가 떠 있는 동안의 재탭 — 무시
  gaStep('share', {method:R.shareMode});
  if(!f){ shareFallback('nofile'); return; }
  var can = false;
  try{ can = !!(navigator.share && navigator.canShare && navigator.canShare({files:[f]})); }catch(e){ can = false; }
  if(!can){ shareFallback('cannot_share'); return; }
  var pr;
  shareLock(true);
  try{ pr = navigator.share({files:[f], title:CONFIG.share.title, text:CONFIG.share.text}); }
  catch(e){ shareLock(false); shareFallback(e && e.name || 'throw'); return; }
  var unlock = function(){ shareLock(false); }, p2 = null;
  if(pr && typeof pr['catch']==='function'){
    p2 = pr['catch'](function(err){
      if(shareErrIgnored(err && err.name)) return;    // 사용자 취소 등 — 아무것도 하지 않는다
      shareFallback((err && err.name) || 'rejected');
    });
  }
  /* 잠금 해제는 catch 뒤에 이어 붙인다(원 프라미스에 직접 finally 를 걸면 거부가 처리되지 않은 채 남는다) */
  if(p2 && typeof p2['finally']==='function') p2['finally'](unlock);
  else setTimeout(unlock, CONFIG.share.retap_guard_ms || 0);
}
$('#resShare').addEventListener('click', function(){ if(!R.shareReady || R.sharing || $('#resShare').disabled) return; onShareTap(); });
$('#resShareDl').addEventListener('click', function(){ gaStep('share', {method:R.shareMode}); });

/* =========================================================================
   §13 셀프테스트 (?selftest=1)
   ========================================================================= */
function runSelftest(){
  var T = [];
  function ok(name, pass, detail){ T.push({name:name, pass:!!pass, detail:detail||''}); }
  function eq(name, got, want){ ok(name, got===want, 'got='+JSON.stringify(got)+' want='+JSON.stringify(want)); }

  /* p1 정규화 */
  eq('normRat("길") → "길"', normRat('길'), '길');
  eq('normRat(" 길이요 ") → "길"', normRat(' 길이요 '), '길');
  eq('normRat("빛") → "빛"', normRat('빛'), '빛');
  ok('대체정답: "빛" 입력 → correct=true', ratCorrect('빛')===true);
  ok('"길이요" 입력 → correct=true', ratCorrect(' 길이요 ')===true);
  ok('"물" 입력 → correct=false', ratCorrect('물')===false);

  /* RAT 어휘 규약 — cues ∪ accept 전 문항 교집합 = 0 */
  (function(){
    var pool = CONFIG.rat_pool, bad = [], i, j, k;
    for(i=0;i<pool.length;i++){
      var si = pool[i].cues.concat(pool[i].accept);
      for(k=0;k<pool[i].cues.length;k++)
        if(pool[i].accept.indexOf(pool[i].cues[k])>=0) bad.push(pool[i].id+':자기교집합 '+pool[i].cues[k]);
      for(j=i+1;j<pool.length;j++){
        var sj = pool[j].cues.concat(pool[j].accept);
        for(k=0;k<si.length;k++) if(sj.indexOf(si[k])>=0) bad.push(pool[i].id+'∩'+pool[j].id+':'+si[k]);
      }
    }
    ok('rat_pool cues ∪ accept 교집합 = 0', bad.length===0, bad.join(', '));
  })();

  /* 9점 — 표준해 */
  var sol = solutionStrokes();
  (function(){
    var r = judgeNinedot(sol, CONFIG.ninedot);
    ok('judgeNinedot(표준해) → correct', r.correct===true, 'covered='+r.covered+'/'+r.total);
    ok('judgeNinedot(표준해) → disconnected=false', r.disconnected===false);
  })();
  /* 9점 — 끊어진 선분 4개 */
  (function(){
    var broken = [
      [{x:0,y:0},{x:3,y:0}],
      [{x:0,y:3},{x:2,y:1}],      // 시작점이 앞 획의 끝(3,0)과 다르다
      [{x:0,y:3},{x:0,y:0}],
      [{x:0,y:0},{x:2,y:2}]
    ];
    var r = judgeNinedot(broken, CONFIG.ninedot);
    ok('judgeNinedot(끊어진 4선분) → disconnected=true', r.disconnected===true);
    ok('judgeNinedot(끊어진 4선분) → correct=false', r.correct===false);
  })();
  /* 9점 — 빈 입력(한 획도 긋지 않고 만료) */
  (function(){
    var r = judgeNinedot([], CONFIG.ninedot);
    ok('judgeNinedot([]) → disconnected=false', r.disconnected===false);
    ok('judgeNinedot([]) → correct=false', r.correct===false, 'covered='+r.covered+'/'+r.total);
  })();
  /* 9점 — 3획 */
  (function(){
    var three = sol.slice(0,3);
    var r = judgeNinedot(three, CONFIG.ninedot);
    ok('judgeNinedot(3획) → correct=false', r.correct===false, 'covered='+r.covered+'/'+r.total);
  })();
  /* 9점 — 5획(최대 초과) */
  (function(){
    var five = sol.concat([[{x:2,y:2},{x:2,y:3}]]);
    var r = judgeNinedot(five, CONFIG.ninedot);
    ok('judgeNinedot(5획) → over_max → correct=false', r.correct===false && r.over_max===true);
  })();
  /* 불변식 · 히트 반경 경계 */
  ok('hit_radius_units < anchor_step_units / 2',
     CONFIG.ninedot.hit_radius_units < CONFIG.ninedot.anchor_step_units/2,
     CONFIG.ninedot.hit_radius_units+' < '+(CONFIG.ninedot.anchor_step_units/2));
  (function(){
    var a={x:0,y:0}, b={x:200,y:0};
    var d22 = segPointDist(a,b,{x:100,y:22}), d23 = segPointDist(a,b,{x:100,y:23});
    ok('거리 22 → 히트 반경 안(통과)', d22 <= CONFIG.ninedot.hit_radius_units, 'd='+d22);
    ok('거리 23 → 히트 반경 밖(미통과)', d23 > CONFIG.ninedot.hit_radius_units, 'd='+d23);
  })();
  (function(){
    /* 판정 경계를 judgeNinedot 로도 확인한다. 표준해를 units 로 dU 만큼 **평행이동**하면
       아래 줄(y=0)의 점들과 마지막 획 끝점(2,2)이 정확히 dU 만큼 떨어진다.
       dU = R  → 아홉 점 전부 경계 위(≤R) 통과, dU = R+1 → 세 점을 놓친다.
       (판정은 `<= R` 이므로 경계값이 통과 쪽에 들어가는지가 이 테스트의 요점) */
    var sp = CONFIG.ninedot.grid.spacing_units, R = CONFIG.ninedot.hit_radius_units;
    function shiftDown(dU){
      var s = solutionStrokes(), out = [], i;
      for(i=0;i<s.length;i++)
        out.push([{x:s[i][0].x, y:s[i][0].y - dU/sp}, {x:s[i][1].x, y:s[i][1].y - dU/sp}]);
      return out;

    ok('표준해를 '+R+' units 내려도 covered=9 (경계 포함)',
       rIn.covered===9 && rIn.correct===true, 'covered='+rIn.covered);
    ok('표준해를 '+(R+1)+' units 내리면 점을 놓친다',
       rOut.covered<9 && rOut.correct===false,
       'covered='+rOut.covered+' missing='+JSON.stringify(rOut.missing));
  })();

  /* 함정 풀 */
  (function(){
    var ids = {}, bad = [], i;
    for(i=0;i<CONFIG.trap_pool.length;i++){
      var it = CONFIG.trap_pool[i];
      if(ids[it.id]) bad.push('중복 id '+it.id);
      ids[it.id] = true;
      if(it.answer === it.intuitive) bad.push(it.id+': answer === intuitive');
      if(typeof it.explain !== 'string' || !it.explain) bad.push(it.id+': explain 없음');
    }
    ok('trap_pool 3문항', CONFIG.trap_pool.length===3, '길이='+CONFIG.trap_pool.length);
    ok('trap_pool id 유일 · answer ≠ intuitive', bad.length===0, bad.join(', '));
  })();

  /* 설정 무결성 */
  ok('config_version = 0.2.1-m1', CONFIG.config_version==='0.2.1-m1', CONFIG.config_version);
  ok('M1 제시 순서 = p1_rat → p3_trap → p4_ninedot',
     PUZZLE_ORDER.join(',')==='p1_rat,p3_trap,p4_ninedot', PUZZLE_ORDER.join(','));
  (function(){
    var r = shapeCheck();
    ok('세션 루트 키 = 스펙 §7-2', r.session.ok, r.session.msg);
    ok('puzzles[] 키 = 스펙 §7-2', r.puzzle.ok, r.puzzle.msg);
  })();

  /* ── 공유 카드 (M1.5, 스펙 §8-3) ── */
  /* wrapText: 공백 없는 한국어 장문이 2줄 이상으로 나뉘고 각 줄이 maxW 이하, 글자 손실 0 */

    ok('wrapText 각 줄 폭 ≤ maxW · 글자 손실 0', over===0 && L.join('')===s, 'over='+over);
    var L2 = wrapText(ctx, '짧은 문장', 1000);

  /* detectInApp */

    ok('cardModel: 퍼즐 3행 (제시된 퍼즐만)', m.rows.length===3, 'rows='+m.rows.length);
    ok('cardModel: 활성 시간 메타 1줄', typeof m.meta==='string' && m.meta.indexOf('2분 5초')>=0, String(m.meta));
    /* 하드캡 절단 등으로 미제시된 퍼즐 → 줄 자체를 생략(§6-1) */
    s.puzzles[2].presented = false;
    var m2 = cardModel(s, CONFIG);
    ok('cardModel: presented=false 행 생략', m2.rows.length===2, 'rows='+m2.rows.length);
    /* 렌더러 스모크 — 백킹 크기 = w·h × dpr */
    var cv = null; try{ cv = buildShareCard(m, CONFIG.share.card); }catch(e){ cv = null; }
    var cc = CONFIG.share.card;
    ok('buildShareCard → canvas '+(cc.w*cc.dpr)+'×'+(cc.h*cc.dpr),
       !!cv && cv.width===cc.w*cc.dpr && cv.height===cc.h*cc.dpr, cv ? (cv.width+'×'+cv.height) : 'null');
  })();
  /* DoD ②: 탭 핸들러 동기 경로에 await 0개 · .then( 0개 (정적 검사) */
  (function(){
    var src = String(onShareTap);
    ok('onShareTap 에 "await" 없음', src.indexOf('await')<0);
    ok('onShareTap 에 ".then(" 없음', src.indexOf('.then(')<0);
  })();
  /* wrapText: 서로게이트 쌍(이모지)을 줄 경계에서 쪼개지 않는다 */
  (function(){
    var cv = document.createElement('canvas'), ctx = cv.getContext('2d');
    if(!ctx){ ok('wrapText(이모지)', false, 'canvas 2d 없음'); return; }
    ctx.font = '18px '+CONFIG.share.card.font;
    var s = '가😀나😀다😀라😀마😀', L = wrapText(ctx, s, 40), lone = 0, i, a, b;
    for(i=0;i<L.length;i++){
      if(!L[i].length) continue;
      a = L[i].charCodeAt(L[i].length-1); b = L[i].charCodeAt(0);
      if(a>=0xD800 && a<=0xDBFF) lone++;             // 줄 끝 상위 서로게이트 홀로
      if(b>=0xDC00 && b<=0xDFFF) lone++;             // 줄 앞 하위 서로게이트 홀로
    }
    ok('wrapText(이모지 포함, maxW=40) → 글자 손실 0', L.join('')===s, JSON.stringify(L));
    ok('wrapText(이모지 포함) → 줄 경계 lone surrogate 0', L.length>=2 && lone===0, 'lines='+L.length+' lone='+lone);
  })();
  /* 결과 문구가 CONFIG 에서 나오는지 (§8-3 ⑥ 코드 상수 금지) */
  (function(){
    var RC = CONFIG.m1_copy.result;
    ok('nameOf(p1_rat) = CONFIG.m1_copy.result.names.p1_rat', nameOf('p1_rat')===RC.names.p1_rat && !!RC.names.p1_rat);
    ok('nameOf(미등록 id) = id 그대로', nameOf('p9_x')==='p9_x');
    var p = newPuzzle('p3_trap', 2); p.presented = true; p.extra = {answer_raw:'50'}; p.correct = false;
    ok('statusOf(함정 오답) = status.learn ("배움")', statusOf(p).label===RC.status.learn && RC.status.learn==='배움');
    ok('fmtDur(125000) = "2"+dur.min+" 5"+dur.sec', fmtDur(125000)===('2'+RC.dur.min+' 5'+RC.dur.sec));
    var m = cardModel(blankSession(), CONFIG);
    ok('cardModel: §6-1 폴백 한 줄(tail) 포함', m.tail===RC.tail && !!RC.tail, String(m.tail));
  })();
  /* 공유 거부 무시 목록 · 인앱 img src 종류 */
  (function(){
    ok('shareErrIgnored(AbortError) = true', shareErrIgnored('AbortError', CONFIG.share.ignore_errors)===true);
    ok('shareErrIgnored(InvalidStateError) = true', shareErrIgnored('InvalidStateError', CONFIG.share.ignore_errors)===true);
    ok('shareErrIgnored(NotAllowedError) = false', shareErrIgnored('NotAllowedError', CONFIG.share.ignore_errors)===false);
    ok('shareErrIgnored(undefined) = false', shareErrIgnored(undefined, CONFIG.share.ignore_errors)===false);
    ok('CONFIG.share.inapp_img ∈ {data, blob}', CONFIG.share.inapp_img==='data' || CONFIG.share.inapp_img==='blob', String(CONFIG.share.inapp_img));
  })();

  var pass = 0, i;
  for(i=0;i<T.length;i++) if(T[i].pass) pass++;
  var list = $('#stList'); list.innerHTML = '';
  for(i=0;i<T.length;i++){
    var l = el('div','l');
    var m = el('span','m '+(T[i].pass?'p':'f'), T[i].pass?'✓ PASS':'✗ FAIL');
    var n = el('span','n', T[i].name);
    if(T[i].detail){ n.appendChild(document.createElement('br')); n.appendChild(el('span','d', T[i].detail)); }
    l.appendChild(m); l.appendChild(n);
    list.appendChild(l);
  }
  txt($('#stSum'), pass+' / '+T.length+' 통과 · config_version '+CONFIG.config_version);
  show('selftest', null);
}
function solutionStrokes(){
  var s = CONFIG.ninedot.solution, out = [];
  for(var i=1;i<s.length;i++) out.push([{x:s[i-1][0],y:s[i-1][1]},{x:s[i][0],y:s[i][1]}]);
  return out;
}
/* 실제 생성기(blankSession/newPuzzle)의 키 집합이 스펙 §7-2 와 정확히 일치하는지(여분·누락 0) */
function shapeCheck(){
  var wantS = ['schema','config_version','session_id','ts_start','ts_last','ts_end','play_index',
    'dropped_at','hidden_ms','hidden_spans','blocked_ms','blocked_spans','active_total_ms',
    'skipped','cap_soft','cap_truncated','resumed_discard','pre','puzzles','result','consent'];
  var wantP = ['id','order_index','config_version','presented','skipped',
    't_start','t_first_input','t_solve_end','t_end','pre_input_gap_ms',
    'solved','correct','revealed','timeout','gave_up','assisted','assist_level',
    'hidden_ms','hidden_spans','blocked_ms','blocked_spans',
    'events','stall_rule_version','stall_excluded_reason','attempts','hints',
    'conf','aha','known_before','extra'];
  function diff(obj, want){
    var got = [], k, miss = [], extra = [];
    for(k in obj) if(obj.hasOwnProperty(k)) got.push(k);
    for(k=0;k<want.length;k++) if(got.indexOf(want[k])<0) miss.push(want[k]);
    for(k=0;k<got.length;k++) if(want.indexOf(got[k])<0) extra.push(got[k]);
    return {ok:(miss.length===0 && extra.length===0),
            msg:(miss.length||extra.length) ? ('누락='+miss.join('|')+' 여분='+extra.join('|'))
                                            : (got.length+'개 키 일치')};
  }
  return {session: diff(blankSession(), wantS), puzzle: diff(newPuzzle('p1_rat',1), wantP)};
}

/* =========================================================================
   §14 부트 · 테스트 훅
   ========================================================================= */
function qparam(name){
  try{
    var m = new RegExp('[?&]'+name+'=([^&#]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }catch(e){ return null; }
}
/* ?tb=<초> — **테스트 전용**. 모든 타임박스를 그 값으로, 부속 대기시간을 비례로 줄인다. */
function applyTestParams(){
  var tb = qparam('tb');
  if(tb==null) return;
  var v = Number(tb);
  if(!isFinite(v) || v<=0) return;
  for(var k in CONFIG.timebox_s){
    if(!CONFIG.timebox_s.hasOwnProperty(k)) continue;
    CONFIG.timebox_s[k].s = v;
    if(CONFIG.timebox_s[k].choice_s!=null) CONFIG.timebox_s[k].choice_s = v;
  }
  CONFIG.session.idle_grace_s        = Math.max(1, Math.round(v*20/60));
  CONFIG.session.manual_reveal_after_s = Math.max(1, Math.round(v*15/60));
  CONFIG.session.scale_idle_timeout_s  = Math.max(1, Math.round(v*25/60));
}
function fillIntro(){
  var I = CONFIG.m1_copy.intro;
  txt($('#inTitle'), I.title);
  txt($('#inLead'), I.lead);
  txt($('#inLead2'), I.lead2);
  txt($('#inNote'), I.note);
  txt($('#inGo'), I.go);
  txt($('#inDisc'), CONFIG.m1_copy.disclaimer);
}
function goIntro(){
  R.pidx = -1; renderProg();
  show('intro', 'intro');
}
$('#inGo').addEventListener('click', function(){ startPuzzle(0); });

/* 이어하기 — 퍼즐 경계에서만 재개, 퍼즐 도중이면 그 퍼즐은 폐기 후 재제시 */
function resumeInto(sess){
  S = sess;
  /* 페이지가 닫혀 있던 구간은 **활성 시간이 아니다**(§8-1 "캡의 시계는 활성 시간").
     pagehide~다음 boot 사이는 visibilitychange 가 잡지 못해 어디에도 남지 않으므로,
     여기서 hidden 으로 적재한다. 이게 없으면 자리를 8분 이상 비운 모든 재개가
     하드캡에 걸려 곧바로 결과 화면으로 튕긴다. */
  var away = now() - (S.ts_last || now());
  if(away > 0) pushSpanAt('hidden', S.ts_last, now());   // 스칼라는 span 에서 재계산된다
  var i, p;
  for(i=0;i<S.puzzles.length;i++){
    p = S.puzzles[i];
    if(p.presented && p.t_end==null){
      S.resumed_discard = true;
      S.puzzles[i] = newPuzzle(p.id, p.order_index);
      save();
      startPuzzle(i);
      return;
    }
  }
  for(i=0;i<S.puzzles.length;i++){
    p = S.puzzles[i];
    if(!p.presented && S.skipped.indexOf(p.id)<0){ startPuzzle(i); return; }
  }
  goResult();
}
function boot(){
  applyTestParams();
  fillIntro();
  try{ R.inApp = detectInApp(navigator.userAgent, CONFIG.share.inapp_ua); }catch(e){ R.inApp = false; }
  R.lastTick = now();
  /* 배경 탭에서 로드된 경우(링크를 새 탭으로 열어 두고 나중에 보는 경로) visibilitychange 는
     '변화'에만 발생하므로 hidden→visible 로 돌아와도 R.hiddenAt 이 0 이라 그 구간이 어디에도
     안 남는다 → 안 보고 있던 시간이 통째로 활성 시간·타임박스에 들어간다. 초기 상태를 직접 읽어
     둔다(§5 visibility). */
  try{ if(document.hidden) R.hiddenAt = R.lastTick; }catch(e){}
  R.timer = setInterval(tick, 100);

  if(qparam('selftest')==='1'){ runSelftest(); return; }

  var prev = LS.get(K_SESSION);
  var prevOk = !!(prev && prev.schema===3 && !prev.ts_end && prev.puzzles && prev.puzzles.length);
  /* 아직 한 퍼즐도 제시되지 않은 세션은 '이어하기' 대상이 아니다 — 인트로에서 새로고침한
     사용자가 설명도 못 보고 p1 타임박스를 만나는 것을 막는다. 세션 자체는 그대로 이어 써서
     play_index 가 중복으로 올라가지 않게 한다. */
  var prevStarted = false;
  if(prevOk){
    for(var pi=0; pi<prev.puzzles.length; pi++) if(prev.puzzles[pi].presented) prevStarted = true;
  }
  if(prevOk && !prevStarted){
    if((now() - (prev.ts_last||0))/1000 > CONFIG.session.resume_expire_s){
      prev.dropped_at = now(); archivePush(prev); LS.del(K_SESSION);
    } else {
      S = prev; save(); goIntro(); return;
    }
  } else if(prevOk){
    var gap = (now() - (prev.ts_last||0))/1000;
    if(gap > CONFIG.session.resume_expire_s){
      prev.dropped_at = now();
      archivePush(prev);
      LS.del(K_SESSION);
    } else if(gap > CONFIG.session.resume_ask_after_s){
      R.pendingResume = prev;
      txt($('#rsInfo'), '마지막 기록이 '+fmtGap(gap*1000)+' 전이에요. 이어서 하거나, 새로 시작할 수 있습니다.');
      show('resume', 'resume');
      return;
    } else {
      resumeInto(prev);
      return;
    }
  } else if(prev){
    LS.del(K_SESSION);
  }
  S = newSession();
  save();
  goIntro();
}
$('#rsCont').addEventListener('click', function(){
  var prev = R.pendingResume; R.pendingResume = null;
  if(prev) resumeInto(prev); else { S = newSession(); save(); goIntro(); }
});
$('#rsNew').addEventListener('click', function(){
  var prev = R.pendingResume; R.pendingResume = null;
  if(prev){ prev.dropped_at = now(); archivePush(prev); }
  LS.del(K_SESSION);
  S = newSession(); save(); goIntro();
});

function refitCanvases(){
  if(R.screen==='p4' && R.nine){
    R.nine.view.fit(400);
    recordHitRadius(curP());
    nineDraw();
  }
  if(R.screen==='reveal' && R.sol && !$('#revCvWrap').hidden){
    R.sol.fit(360);
    if(R.solRedraw) R.solRedraw();
  }
}
window.addEventListener('resize', refitCanvases);
window.addEventListener('orientationchange', refitCanvases);

/* 테스트 훅 */
window.SEEING = {
  config: CONFIG,
  session: function(){ return S; },
  runtime: function(){ return R; },
  pure: { normRat:normRat, judgeNinedot:judgeNinedot, segPointDist:segPointDist,
          ratCorrect:ratCorrect, solutionStrokes:solutionStrokes,
          wrapText:wrapText, detectInApp:detectInApp, shareMode:shareMode, cardModel:cardModel,
          buildShareCard:buildShareCard, shareErrIgnored:shareErrIgnored },
  /* 공유 상태 조회 (M1.5) */
  share: function(){
    return {mode:R.shareMode, hasFile:!!R.shareFile, inApp:R.inApp, ready:R.shareReady,
            canShareFiles:R.canShareFiles, url:R.shareUrl, hasData:!!R.shareData, sharing:R.sharing,
            lastErr:R.shareLastErr, forced:forcedShareMode()};
  },
  goto: function(id){
    if(id==='intro') return goIntro();
    if(id==='result') return goResult();
    if(id==='selftest') return runSelftest();
    if(id==='p1' || id==='p1_rat') return startPuzzle(0);
    if(id==='p3' || id==='p3_trap') return startPuzzle(1);
    if(id==='p4' || id==='p4_ninedot') return startPuzzle(2);
    return show(id, null);
  }
};

boot();
})();
</script>
