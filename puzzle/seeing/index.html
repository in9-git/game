<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1120">
<title>시야각 · Seeing</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👁️%3C/text%3E%3C/svg%3E">
<meta name="description" content="퍼즐 셋을 풀며 답에 어떻게 도착하는지와 그때의 확신을 기록하는 실험. M1 코어 루프.">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SF7BJ4211L"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-SF7BJ4211L');</script>
<style>
/* =========================================================================
   시야각 (Seeing) M1 — 스타일
   어두운 배경 + 섬광 옐로 포인트. 심리테스트가 아니라 실험실 톤.
   기준 뷰포트 390px, 데스크톱은 중앙 카드(max 460px).
   ========================================================================= */
:root{
  --bg:#0e1120; --bg2:#151a2c; --bg3:#1d2440;
  --line:rgba(232,185,58,.16); --line2:rgba(232,185,58,.34); --line3:rgba(255,255,255,.09);
  --ink:#e9ecf6; --ink2:#a8afc6; --ink3:#6f7794;
  --acc:#e8b93a; --acc2:#f6dc93; --acc3:rgba(232,185,58,.12);
  --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}   /* .cvwrap{display:flex} 같은 클래스 규칙이 hidden 속성을 이기지 못하게 */
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(120% 60% at 50% -10%, #1a2039 0%, #0e1120 62%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.62; letter-spacing:.005em;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  min-height:100dvh;
}
.wrap{max-width:460px;margin:0 auto;padding:0 14px 40px}

/* ---------------- 머리 ---------------- */
.top{
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 2px 10px;
}
.home{
  font-size:.76rem;color:var(--ink3);text-decoration:none;
  border:1px solid var(--line3);border-radius:999px;padding:5px 10px;white-space:nowrap;
}
.home:hover{color:var(--ink2);border-color:var(--line2)}
.brand{flex:1;min-width:0;text-align:center;font-weight:700;font-size:.98rem;letter-spacing:.03em}
.brand span{display:block;font-weight:400;font-size:.6rem;color:var(--ink3);letter-spacing:.28em;margin-top:1px}
.prog{display:flex;gap:5px}
.prog i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14);display:block}
.prog i.on{background:var(--acc)}
.prog i.done{background:rgba(232,185,58,.42)}

/* ---------------- 화면 ---------------- */
.screen{padding:2px 0 24px;animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stage{font-size:.66rem;letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;margin:2px 0 8px}
.card{
  background:linear-gradient(178deg,var(--bg2),#12172a);
  border:1px solid var(--line3);border-radius:var(--r);
  padding:16px 16px 17px;
  box-shadow:0 10px 26px rgba(0,0,0,.28);
}
.card + .card{margin-top:12px}
h1.t{font-size:1.42rem;line-height:1.32;margin:2px 0 10px;letter-spacing:-.01em}
.q{font-size:1.04rem;line-height:1.7;margin:0 0 12px;font-weight:600}
.q.sm{font-size:.96rem;font-weight:500}
.p{font-size:.92rem;color:var(--ink2);margin:0 0 .7em}
.p:last-child{margin-bottom:0}
.p.dim{color:var(--ink3);font-size:.82rem}
.note{font-size:.78rem;color:var(--ink3);line-height:1.66;margin-top:14px}
.hr{height:1px;background:var(--line3);margin:14px 0}

/* ---------------- 버튼 ---------------- */
.btn{
  display:block;width:100%;font:inherit;font-weight:700;font-size:.98rem;
  color:#191408;background:linear-gradient(180deg,var(--acc2),var(--acc));
  border:0;border-radius:12px;padding:14px 16px;cursor:pointer;
  transition:transform .12s ease,opacity .18s ease;
}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.32;cursor:default}
.ghost{
  font:inherit;font-size:.84rem;color:var(--ink2);background:rgba(255,255,255,.04);
  border:1px solid var(--line3);border-radius:11px;padding:10px 13px;cursor:pointer;
}
.ghost:active{transform:scale(.98)}
.ghost[disabled]{opacity:.3;cursor:default}
.ghost.warm{color:var(--acc2);border-color:var(--line2)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row.end{justify-content:flex-end}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tools .ghost{flex:0 0 auto}
.spacer{flex:1}
.mt{margin-top:14px}
.mt8{margin-top:8px}

/* ---------------- 타임박스 막대(숫자 없음) ---------------- */
.tbar{height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;margin:0 0 14px}
.tbar i{display:block;height:100%;width:100%;transform-origin:left center;
  background:linear-gradient(90deg,rgba(232,185,58,.75),rgba(232,185,58,.3));
  transition:transform .25s linear}

/* ---------------- p1 ---------------- */
.cues{display:flex;gap:8px;margin:0 0 14px}
.cue{
  flex:1;text-align:center;padding:13px 0;border-radius:12px;
  background:var(--acc3);border:1px solid var(--line);font-size:1.16rem;font-weight:700;
}
.cue b{color:var(--acc2)}
.cue span{color:var(--ink3);font-weight:400}
input.tx{
  flex:1;min-width:0;font:inherit;font-size:1.06rem;color:var(--ink);
  background:#0b0f1c;border:1px solid var(--line3);border-radius:11px;padding:13px 14px;
}
input.tx:focus{outline:none;border-color:var(--line2)}
.fb{font-size:.88rem;margin:12px 0 0;color:var(--ink2)}
.fb.good{color:var(--acc2);font-weight:600}
.hintbox{margin-top:12px}
.hintbox .h{
  font-size:.86rem;color:var(--ink2);background:rgba(255,255,255,.035);
  border-left:2px solid var(--line2);border-radius:0 8px 8px 0;padding:9px 12px;margin-top:8px;
}
.hintbox .h b{color:var(--acc2);font-weight:700;margin-right:6px}

/* ---------------- p3 숫자 키패드 ---------------- */
.ansbox{
  display:flex;align-items:baseline;justify-content:center;gap:4px;
  margin:14px 0 2px;padding:12px;border-radius:12px;background:#0b0f1c;border:1px solid var(--line3);
}
.ansbox b{font-size:1.7rem;font-weight:700;letter-spacing:.02em;min-width:1ch}
.ansbox b.empty{color:var(--ink3)}
.ansbox span{font-size:.95rem;color:var(--ink2)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kp button{
  font:inherit;font-size:1.28rem;font-weight:600;color:var(--ink);
  background:var(--bg3);border:1px solid var(--line3);border-radius:12px;
  padding:15px 0;cursor:pointer;
}
.kp button:active{background:#28304f}
.kp button.fn{font-size:.92rem;color:var(--ink2)}
.kp button.void{visibility:hidden}

/* ---------------- p4 캔버스 ---------------- */
.cvwrap{display:flex;justify-content:center;margin:6px 0 4px;max-width:100%}
canvas{display:block;touch-action:none;cursor:pointer;border-radius:10px;max-width:100%}
.cnt{font-size:.82rem;color:var(--ink3)}

/* ---------------- 확신도 탭바 ---------------- */
.bar{
  position:relative;height:46px;border-radius:12px;margin:16px 0 6px;
  background:linear-gradient(90deg,#141a2e,#232c4c);border:1px solid var(--line3);
  cursor:pointer;touch-action:none;overflow:hidden;
}
.bar:focus{outline:2px solid var(--line2);outline-offset:2px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(232,185,58,.22),rgba(232,185,58,.5))}
.bar .knob{position:absolute;top:-1px;bottom:-1px;width:3px;background:var(--acc2);box-shadow:0 0 10px rgba(232,185,58,.7)}
.bar .grid{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.12)}
.ticks{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink3)}
.axlab{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink2);margin-top:6px}
.val{text-align:center;font-size:1.5rem;font-weight:700;color:var(--acc2);margin:14px 0 2px;min-height:1.6em}
.val small{display:block;font-size:.74rem;font-weight:400;color:var(--ink3);letter-spacing:.06em}

/* ---------------- 아하 2D 탭패드 ---------------- */
.padrow{display:flex;gap:9px;align-items:stretch;margin-top:14px}
.ylab{
  width:19px;flex:0 0 19px;font-size:.72rem;color:var(--ink2);
  writing-mode:vertical-rl;text-orientation:mixed;   /* 한글은 세로쓰기에서 글자가 바로 선다. rotate(180) 를 걸면 뒤집힌다 */
  display:flex;align-items:center;justify-content:center;text-align:center;letter-spacing:.02em;
}
.pad2d{
  position:relative;flex:1;aspect-ratio:1/1;border-radius:12px;cursor:pointer;touch-action:none;
  background:radial-gradient(120% 120% at 0% 100%, #141a2e 0%, #232c4c 100%);
  border:1px solid var(--line3);overflow:hidden;
}
.pad2d .gl{position:absolute;background:rgba(255,255,255,.07)}
.pad2d .gl.h{left:0;right:0;height:1px}
.pad2d .gl.v{top:0;bottom:0;width:1px}
.pad2d .dot{position:absolute;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;
  background:var(--acc2);box-shadow:0 0 14px rgba(232,185,58,.8)}
.padfoot{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink3);margin:6px 0 0 28px}
.xlab{font-size:.78rem;color:var(--ink2);text-align:center;margin-top:4px}

/* ---------------- 예/아니오 ---------------- */
.yn{display:flex;gap:10px;margin-top:16px}
.yn button{
  flex:1;font:inherit;font-size:1rem;font-weight:600;color:var(--ink);
  background:var(--bg3);border:1px solid var(--line3);border-radius:12px;padding:16px 0;cursor:pointer;
}
.yn button:active{background:#28304f}
.yn button[disabled]{opacity:.5;cursor:default}
/* 응답한 쪽을 그대로 남겨 둔다(색에만 의존하지 않도록 체크 표식은 ::before) */
.yn button.sel{opacity:1;color:var(--acc2);background:var(--acc3);border-color:var(--line2)}
.yn button.sel::before{content:"✓ ";font-weight:700}

/* ---------------- 공개 화면 ---------------- */
.verdict{
  display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:700;letter-spacing:.04em;
  border:1px solid var(--line2);border-radius:999px;padding:5px 12px;color:var(--acc2);margin-bottom:12px;
}
.verdict i{font-style:normal;font-size:.92rem}
.answer{
  font-size:1.24rem;font-weight:700;color:var(--acc2);
  padding:12px 14px;border-radius:12px;background:var(--acc3);border:1px solid var(--line);margin:2px 0 12px;
}
.answer small{display:block;font-size:.8rem;font-weight:400;color:var(--ink2);margin-top:4px;letter-spacing:0}
.knownbox{margin-top:16px;padding-top:14px;border-top:1px solid var(--line3)}

/* ---------------- 결과 ---------------- */
.banner{
  font-size:.8rem;color:var(--ink2);background:rgba(232,185,58,.07);
  border:1px dashed var(--line2);border-radius:12px;padding:11px 13px;margin-bottom:12px;
}
.rrow{padding:12px 0;border-top:1px solid var(--line3)}
.rrow:first-child{border-top:0;padding-top:2px}
.rrow h3{margin:0 0 6px;font-size:.95rem;font-weight:700}
.rrow h3 em{font-style:normal;color:var(--acc2);font-size:.78rem;font-weight:600;margin-left:7px;letter-spacing:.02em}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:.83rem;color:var(--ink2);padding:2px 0}
.kv span:first-child{color:var(--ink3);flex:0 0 auto}
.kv span:last-child{text-align:right}
a.dl{display:block;text-decoration:none;text-align:center}
a.dl.ghost{width:100%}

/* ---------------- 공유 카드 (M1.5 §8-3) ---------------- */
.cardwrap{margin-top:14px;display:flex;justify-content:center}
/* 인앱 웹뷰의 '길게 눌러 저장'이 되도록 pointer-events / -webkit-touch-callout 을 걸지 않는다 */
.cardimg{
  display:block;width:100%;max-width:360px;height:auto;border-radius:14px;
  border:1px solid var(--line3);box-shadow:0 12px 30px rgba(0,0,0,.36);
}
.sharehint{font-size:.8rem;color:var(--ink3);text-align:center;margin:8px 0 0;line-height:1.55}
.fbpanel{
  margin-top:10px;padding:12px 13px 13px;border:1px dashed var(--line2);border-radius:12px;
  background:rgba(232,185,58,.06);
}
.fbpanel h4{margin:0 0 4px;font-size:.9rem;font-weight:700;color:var(--acc2)}
.fbpanel p{margin:0 0 10px;font-size:.82rem;color:var(--ink2);line-height:1.6}

/* ---------------- 셀프테스트 ---------------- */
.st{font-size:.84rem}
.st .l{display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--line3);align-items:baseline}
.st .l:first-child{border-top:0}
.st .m{flex:0 0 auto;font-weight:700;font-size:.74rem;letter-spacing:.04em}
.st .m.p{color:#9fdcb8}
.st .m.f{color:#f0a58a}
.st .n{flex:1;min-width:0;word-break:break-all;color:var(--ink2)}
.st .d{color:var(--ink3);font-size:.76rem}

@media (min-width:520px){ .wrap{padding-bottom:56px} }
@media (prefers-reduced-motion: reduce){
  .screen{animation:none}
  .tbar i{transition:none}
  .btn{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="home" href="../../index.html">← 게임 홈</a>
    <div class="brand">시야각<span>SEEING</span></div>
    <div class="prog" id="prog"><i></i><i></i><i></i></div>
  </header>

  <main id="app">

    <!-- ============ 인트로 ============ -->
    <section class="screen" id="scrIntro">
      <div class="card">
        <h1 class="t" id="inTitle"></h1>
        <p class="p" id="inLead"></p>
        <p class="p" id="inLead2"></p>
        <div class="hr"></div>
        <p class="p dim" id="inNote"></p>
      </div>
      <div class="mt"><button class="btn" id="inGo">시작하기</button></div>
      <p class="note" id="inDisc"></p>
    </section>

    <!-- ============ 이어하기 ============ -->
    <section class="screen" id="scrResume" hidden>
      <div class="card">
        <p class="q">하던 판이 남아 있어요.</p>
        <p class="p" id="rsInfo"></p>
      </div>
      <div class="mt"><button class="btn" id="rsCont">이어하기</button></div>
      <div class="mt8"><button class="ghost" id="rsNew" style="width:100%">새로 시작</button></div>
    </section>

    <!-- ============ p1_rat ============ -->
    <section class="screen" id="scrP1" hidden>
      <div class="stage">퍼즐 1 / 3</div>
      <div class="tbar" id="tb1"><i></i></div>
      <div class="card">
        <p class="q" id="p1Q"></p>
        <div class="cues" id="p1Cues"></div>
        <div class="row">
          <input class="tx" id="p1In" type="text" inputmode="text" enterkeyhint="done"
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                 maxlength="8" aria-label="답 입력">
          <button class="ghost warm" id="p1Go">제출</button>
        </div>
        <p class="fb" id="p1Fb" hidden></p>
      </div>
      <div class="tools">
        <button class="ghost" id="p1H1" disabled>힌트 ①</button>
        <button class="ghost" id="p1H2" disabled>힌트 ②</button>
        <span class="spacer"></span>
        <button class="ghost" id="p1Give" hidden>답 보기</button>
      </div>
      <div class="hintbox" id="p1Hb"></div>
    </section>

    <!-- ============ p3_trap ============ -->
    <section class="screen" id="scrP3" hidden>
      <div class="stage">퍼즐 2 / 3</div>
      <div class="tbar" id="tb3"><i></i></div>
      <div class="card">
        <p class="q sm" id="p3Text"></p>
        <div class="ansbox"><b id="p3Val" class="empty">—</b><span id="p3Unit"></span></div>
        <div class="kp" id="p3Kp"></div>
      </div>
      <div class="mt"><button class="btn" id="p3Go" disabled>제출</button></div>
      <div class="tools">
        <span class="spacer"></span>
        <button class="ghost" id="p3Give" hidden>모르겠어요 / 대충 찍어볼게요</button>
      </div>
    </section>

    <!-- ============ p4_ninedot ============ -->
    <section class="screen" id="scrP4" hidden>
      <div class="stage">퍼즐 3 / 3</div>
      <div class="tbar" id="tb4"><i></i></div>
      <div class="card">
        <p class="q sm">아홉 개의 점을 <b>직선 네 개</b>로, 펜을 떼지 않고 모두 지나가 보세요.</p>
        <div class="cvwrap"><canvas id="nine"></canvas></div>
        <div class="row mt8">
          <span class="cnt" id="p4Cnt">0 / 4획</span>
          <span class="spacer"></span>
          <button class="ghost" id="p4Undo" disabled>되돌리기</button>
        </div>
        <p class="p dim mt8">점을 탭하면 그 점끼리 직선으로 이어집니다. 바깥의 옅은 점도 탭할 수 있어요.</p>
      </div>
      <div class="tools">
        <button class="ghost" id="p4H1" disabled>힌트 ①</button>
        <button class="ghost" id="p4H2" disabled>힌트 ②</button>
        <span class="spacer"></span>
        <button class="ghost" id="p4Give" hidden>답 보기</button>
      </div>
      <div class="hintbox" id="p4Hb"></div>
    </section>

    <!-- ============ 확신도 탭바 ============ -->
    <section class="screen" id="scrConf" hidden>
      <div class="stage" id="confStage"></div>
      <div class="card">
        <p class="q" id="confQ"></p>
        <p class="p dim" id="confSub"></p>
        <div class="bar" id="confBar" role="slider" tabindex="0"
             aria-label="확신도" aria-valuemin="0" aria-valuemax="100">
          <i class="fill"></i><span class="grid" style="left:25%"></span>
          <span class="grid" style="left:50%"></span><span class="grid" style="left:75%"></span>
          <b class="knob" hidden></b>
        </div>
        <div class="ticks"><span>0</span><span>50</span><span>100</span></div>
        <div class="axlab"><span id="confLo"></span><span id="confHi"></span></div>
        <div class="val" id="confVal"><small>막대를 한 번 탭해 주세요</small></div>
      </div>
      <div class="mt"><button class="btn" id="confNext" disabled>다음</button></div>
      <div class="mt8"><button class="ghost" id="confSkip" hidden style="width:100%">건너뛰기</button></div>
    </section>

    <!-- ============ 아하 2D 탭패드 ============ -->
    <section class="screen" id="scrAha" hidden>
      <div class="stage" id="ahaStage"></div>
      <div class="card">
        <p class="q" id="ahaQ"></p>
        <div class="padrow">
          <div class="ylab" id="ahaY">갑작스러움 · 위로 갈수록 갑자기</div>
          <div class="pad2d" id="ahaPad">
            <span class="gl h" style="top:50%"></span><span class="gl v" style="left:50%"></span>
            <b class="dot" hidden></b>
          </div>
        </div>
        <div class="padfoot"><span id="ahaXLo"></span><span id="ahaXHi"></span></div>
        <div class="xlab" id="ahaX"></div>
        <div class="val" id="ahaVal"><small>패드를 한 번 탭해 주세요</small></div>
      </div>
      <div class="mt"><button class="btn" id="ahaNext" disabled>다음</button></div>
      <div class="mt8"><button class="ghost" id="ahaSkip" hidden style="width:100%">건너뛰기</button></div>
    </section>

    <!-- ============ 기지 확인 ============ -->
    <section class="screen" id="scrKnown" hidden>
      <div class="stage" id="knownStage"></div>
      <div class="card">
        <p class="q" id="knownQ"></p>
        <p class="p dim" id="knownSub"></p>
        <div class="yn"><button id="knownYes">예</button><button id="knownNo">아니오</button></div>
      </div>
    </section>

    <!-- ============ 공개 화면 ============ -->
    <section class="screen" id="scrReveal" hidden>

function uuid(){
  try{ if(window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID(); }catch(e){}
  try{
    if(window.crypto && crypto.getRandomValues){
      var b = new Uint8Array(16); crypto.getRandomValues(b);
      b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
      var h=[],i; for(i=0;i<16;i++) h.push(('0'+b[i].toString(16)).slice(-2));
      return h.slice(0,4).join('')+'-'+h.slice(4,6).join('')+'-'+h.slice(6,8).join('')+
             '-'+h.slice(8,10).join('')+'-'+h.slice(10,16).join('');
    }
  }catch(e2){}
  var s='', k;
  for(k=0;k<32;k++) s += Math.floor(Math.random()*16).toString(16);
  return s.slice(0,8)+'-'+s.slice(8,12)+'-4'+s.slice(13,16)+'-a'+s.slice(17,20)+'-'+s.slice(20,32);
}
function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function fmtDur(ms){
  if(!isFinite(ms) || ms<0) ms=0;
  var s = Math.round(ms/1000), D = CONFIG.m1_copy.result.dur;
  if(s<60) return s+D.sec;
  return Math.floor(s/60)+D.min+' '+(s%60)+D.sec;
}
/* 경과 시간(이어하기 안내용). fmtDur 는 '푸는 데 쓴 시간'용 초단위 표기라
   반나절 자리에서 '431분 12초' 같은 문구가 된다. 여기서는 눈금을 올린다. */
function fmtGap(ms){
  if(!isFinite(ms) || ms<0) ms=0;
  var m = Math.floor(ms/60000);       // 반올림하면 30초가 '1분 전'이 된다
  if(m<1)  return '방금';
  if(m<60) return m+'분';
  var h = Math.floor(m/60);
  if(h<24) return h+'시간';
  return '하루쯤';
}

/* localStorage — 사파리 프라이빗 모드 등에서 던지는 예외를 전부 삼킨다 */
var LS = {
  get:function(k){ try{ var v=localStorage.getItem(k); return v==null?null:JSON.parse(v); }catch(e){ return null; } },
  set:function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del:function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
/* seeing-archive: 완주 세션 FIFO. QuotaExceededError → 오래된 것부터 버리고 재시도 3회 */
var ARCHIVE_MAX = 20;   // 스펙 미규정 상한. 세션당 수십 KB 이므로 20건이면 1MB 안쪽 — 진행 키 저장을 굶기지 않게
function archivePush(sess){
  var arr = LS.get(K_ARCHIVE);
  if(!arr || Object.prototype.toString.call(arr)!=='[object Array]') arr = [];
  arr.push(sess);
  while(arr.length > ARCHIVE_MAX) arr.shift();
  for(var i=0;i<3;i++){
    if(LS.set(K_ARCHIVE, arr)) return true;
    if(arr.length<=1) break;
    arr.shift();
  }
  return false;   // 3회 실패 → 아카이브 포기 (진행은 막지 않는다)
}

/* =========================================================================
   §3 순수 함수 — 셀프테스트가 이 셋만 직접 호출한다
   ========================================================================= */
var JOSA = ['이','가','은','는','요'];

/* 스펙 §4 P1: trim → 공백 전량 제거 → 후행 조사 제거 → NFC.
   NFC는 멱등이므로, 분해형(NFD) 입력에서 종성 판정이 깨지는 것을 막기 위해
   조사 제거 앞에도 한 번 적용한다(결과는 스펙과 동일). */
function normRat(s){
  var t = String(s==null?'':s).trim().replace(/\s+/g,'');
  if(t.normalize) t = t.normalize('NFC');
  while(t.length>1 && JOSA.indexOf(t.charAt(t.length-1))>=0) t = t.slice(0,-1);
  if(t.normalize) t = t.normalize('NFC');
  return t;
}
function ratItem(){
  var pool = CONFIG.rat_pool, i;
  for(i=0;i<pool.length;i++) if(pool[i].id===CONFIG.rat_default) return pool[i];
  return pool[0];
}
function ratCorrect(raw, item){
  var it = item || ratItem();
  return it.accept.indexOf(normRat(raw)) >= 0;
}

/* 선분(a,b)와 점 p 사이 거리. 좌표계 무관(9점은 units 공간에서 호출) */
function segPointDist(a,b,p){
  var vx=b.x-a.x, vy=b.y-a.y, wx=p.x-a.x, wy=p.y-a.y;
  var L2 = vx*vx+vy*vy;
  var t = L2===0 ? 0 : (wx*vx+wy*vy)/L2;
  t = clamp(t,0,1);
  var dx = a.x+vx*t-p.x, dy = a.y+vy*t-p.y;
  return Math.sqrt(dx*dx+dy*dy);
}

/* strokes: [[{x,y},{x,y}], ...] — **격자 인덱스** 좌표(y 위쪽 +).
   판정은 units 공간(인덱스 × spacing_units)에서 수행한다(스펙 §4 P4). */
function judgeNinedot(strokes, cfg){
  cfg = cfg || CONFIG.ninedot;
  var sp = cfg.grid.spacing_units, n = cfg.grid.n, R = cfg.hit_radius_units;
  var out = {correct:false, connected:true, disconnected:false, covered:0, total:n*n,
             strokes:(strokes?strokes.length:0), over_max:false, missing:[]};
  /* 획이 0개면 '한붓그리기 연결성 위반'이 아니다 — 스펙 §4 P4 ①의 disconnected 는
     stroke[i].start ≠ stroke[i-1].end 인 경우에만 정의된다. covered=0 으로 자연 탈락시킨다. */
  if(!strokes || !strokes.length){ out.connected=false; out.disconnected=false; return out; }
  var i,j;
  /* ① 연결성 — stroke[i].start === stroke[i-1].end */
  for(i=1;i<strokes.length;i++){
    var prev = strokes[i-1][strokes[i-1].length-1], cur = strokes[i][0];
    if(!prev || !cur || prev.x!==cur.x || prev.y!==cur.y){ out.connected=false; }
  }
  out.disconnected = !out.connected;
  /* ② 통과 — 각 실점에 대해 어떤 선분과의 거리 ≤ hit_radius_units */
  for(var gy=0; gy<n; gy++) for(var gx=0; gx<n; gx++){
    var pt = {x:gx*sp, y:gy*sp}, hit=false;
    for(i=0;i<strokes.length && !hit;i++){
      var st = strokes[i];
      for(j=1;j<st.length && !hit;j++){
        var A={x:st[j-1].x*sp, y:st[j-1].y*sp}, B={x:st[j].x*sp, y:st[j].y*sp};
        if(segPointDist(A,B,pt) <= R) hit=true;
      }
    }
    if(hit) out.covered++; else out.missing.push({x:gx,y:gy});
  }
  /* ③ 4획 이하 && 9점 전량 && 연결성 */
  out.over_max = strokes.length > cfg.max_strokes;
  /* require_connected:false 면 연결성은 계산만 하고 정오 판정에서 뺀다(스펙 §7-1 CONFIG) */
  out.correct = (!out.over_max) && (cfg.require_connected===false || out.connected)
                && (out.covered === out.total);
  return out;
}

/* =========================================================================
   §5 타이밍 — visibility / blocked / 타임박스 / 세션 캡
   ========================================================================= */
/* 창 [t0,t1] 안에서 span 집합들이 실제로 덮은 총 시간. 겹치는 구간은 **한 번만** 센다.
   숨김과 강제 대기가 겹치면(연출 중 앱 전환) 단순 합산은 이중 차감이 되어 active 가
   음수까지 내려간다. 파생값을 저장하지 않고 원값 span 에서 매번 재계산한다(§7-2). */
function coveredMs(spanSets, t0, t1){
  var all = [], i, j, s, a, b;
  if(!(t1>t0)) return 0;
  for(i=0;i<spanSets.length;i++){
    s = spanSets[i] || [];
    for(j=0;j<s.length;j++){
      a = Math.max(s[j].t0, t0); b = Math.min(s[j].t1, t1);
      if(b>a) all.push({t0:a, t1:b});
    }
  }
  all.sort(function(x,y){ return x.t0-y.t0; });
  var sum = 0, curA = null, curB = null;
  for(i=0;i<all.length;i++){
    if(curA===null){ curA = all[i].t0; curB = all[i].t1; continue; }
    if(all[i].t0 > curB){ sum += curB-curA; curA = all[i].t0; curB = all[i].t1; }
    else if(all[i].t1 > curB){ curB = all[i].t1; }
  }
  if(curA!==null) sum += curB-curA;
  return sum;
}
/* 스펙 §5-1 active_ms_i = (t_solve_end − t_start) − hidden_ms_i − blocked_ms_i.
   퍼즐 span 은 이미 창으로 잘려 있으므로(pushSpan), 여기서는 겹침만 한 번 더 정리한다. */
function puzzleActiveMs(p){
  var t0 = p.t_start;
  var t1 = (p.t_solve_end!=null) ? p.t_solve_end : (p.t_end!=null ? p.t_end : now());
  var d = (t1-t0) - coveredMs([p.hidden_spans, p.blocked_spans], t0, t1);
  return d>0 ? d : 0;
}
/* hidden_ms · blocked_ms 는 **누산하지 않고 스팬 배열에서 매번 재계산**한다.
   += 로 각각 누산하면 두 종류가 겹칠 때(연출 중 앱 전환) 같은 시간이 두 번 더해져
   스펙 §5-1·§8-1 의 (t1−t0) − hidden_ms − blocked_ms 가 음수까지 내려간다.
   재계산 규약: hidden 이 우선, blocked 는 **합집합에서 hidden 을 뺀 잔여분**.
   따라서 항상 hidden_ms + blocked_ms === coveredMs(합집합) 이고 두 필드는 서로소다. */
function recalcSpanScalars(o, t0, t1){
  var h = coveredMs([o.hidden_spans], t0, t1);
  var u = coveredMs([o.hidden_spans, o.blocked_spans], t0, t1);
  o.hidden_ms = h;
  o.blocked_ms = (u - h) > 0 ? (u - h) : 0;
}
/* scope: 'session'(기본, 세션+퍼즐 양쪽) | 'puzzle'(퍼즐에만 적재)
   'puzzle' 은 stall 창 오염만 막고 세션 캡 시계에서는 사용자 시간이 정상 소모되게 한다
   — 확신도 탭처럼 **사용자 입력을 기다리는** 구간은 스펙 §2-1 캡 예산에 포함돼 있다. */
function pushSpanAt(kind, t0, t1, scope){
  if(!S) return;
  /* 완료 세션(R.done)은 인메모리 S 도 더 이상 바꾸지 않는다 — 결과 화면에서의 앱 전환·
     공유 시트(iOS 는 hidden 전환을 일으킨다)가 보관본(archive)과 어긋난 hidden_ms 를 만들지 않게.
     save() 차단만으로는 SEEING.session() 이 보관본과 달라진다(§12-b 세션 불변 해석). */
  if(R.done) return;
  if(!(t1>t0)) return;
  if(scope!=='puzzle'){
    if(kind==='hidden') S.hidden_spans.push({t0:t0, t1:t1});
    else                S.blocked_spans.push({t0:t0, t1:t1});
    recalcSpanScalars(S, S.ts_start, Math.max(t1, now()));
  }
  /* 퍼즐 누산기는 stall 계산 창 [t_start, t_solve_end] 로 **잘라서** 적재한다(§5-1).
     자르지 않으면 해답 애니메이션·아하·공개 화면처럼 t_solve_end 이후에 생긴 구간이
     active_ms_i = (t_solve_end − t_start) − hidden_ms − blocked_ms 에서 이중으로 빠져
     active 가 음수까지 내려가고 stall 표본이 short_active 로 잘못 배제된다. */
  var p = curP();
  if(p && p.presented && p.t_end==null){
    var lo = p.t_start, hi = (p.t_solve_end!=null ? p.t_solve_end : t1);
    var a = Math.max(t0, lo), b = Math.min(t1, hi);
    if(b>a){
      if(kind==='hidden') p.hidden_spans.push({t0:a, t1:b});
      else                p.blocked_spans.push({t0:a, t1:b});
      recalcSpanScalars(p, lo, hi);
    }
  }
  save();
}
function pushSpan(kind, t0, scope){ pushSpanAt(kind, t0, now(), scope); }
/* 시스템이 강제로 대기시키는 구간(해답 애니메이션·판정 연출) + 퍼즐 스코프 확신 구간 */
function beginBlock(scope){ if(!R.blockedAt){ R.blockedAt = now(); R.blockedScope = scope||'session'; } }
function endBlock(){
  if(R.blockedAt){
    pushSpan('blocked', R.blockedAt, R.blockedScope);
    R.blockedAt=0; R.blockedScope=null; R.lastTick=now();
  }
}

document.addEventListener('visibilitychange', function(){
  if(document.hidden){ if(!R.hiddenAt) R.hiddenAt = now(); }
  else if(R.hiddenAt){ pushSpan('hidden', R.hiddenAt); R.hiddenAt=0; R.lastTick=now(); }
});
window.addEventListener('pagehide', function(){
  if(R.hiddenAt){ pushSpan('hidden', R.hiddenAt); R.hiddenAt=0; }
  save();
});
/* bfcache 복귀 — pagehide 에서 hidden 스팬을 닫고 R.hiddenAt 을 비웠으므로
   visibilitychange(visible) 분기는 아무것도 적재하지 못한다. 얼어 있던 구간
   (마지막 저장 ~ 지금)을 여기서 hidden 으로 적재하지 않으면 그 시간이 통째로
   활성 시간이 되어 복귀 직후 하드캡 절단이 난다(resumeInto 의 away 처리와 동일). */
window.addEventListener('pageshow', function(e){
  if(!e || !e.persisted || !S) return;
  var t0 = S.ts_last || now();
  R.hiddenAt = 0;
  pushSpanAt('hidden', t0, now());
  R.lastTick = now();
});

function boxSeconds(id){
  var c = CONFIG.timebox_s[id];
  var s = c ? c.s : 60;
  if(S && S.cap_soft) s = s * CONFIG.session.soft_cap_shrink;   // 소프트캡 압축
  return s;
}
function startBox(id){
  R.box = {id:id, limitMs:boxSeconds(id)*1000, elapsed:0, graceMs:0, started:false,
           running:true, expired:false, bar:null, giveShown:false, h1:false, h2:false};
}
function pauseBox(){ if(R.box) R.box.running = false; }
function resumeBox(){ if(R.box && !R.box.expired){ R.box.running = true; R.lastTick = now(); } }
function stopBox(){ if(R.box) { R.box.running=false; R.box.expired=true; } }

function tick(){
  var t = now(), dt = t - R.lastTick; R.lastTick = t;
  if(dt<0) dt = 0;
  if(dt>2000) dt = 2000;                 // 백그라운드 복귀 등 큰 점프는 잘라 낸다
  var frozen = (R.hiddenAt!==0 || R.blockedAt!==0);
  var b = R.box, p = curP();

  /* ── 타임박스 카운트다운: t_first_input 부터, 첫 입력이 없으면 t_start + idle_grace 부터 */
  if(b && b.running && !b.expired && !frozen && p){
    var add = dt;                        // 이번 tick 에 elapsed 로 넘길 양
    if(!b.started){
      /* 유예시간도 **활성 시간**으로 잰다. 벽시계(t − t_start)로 재면 퍼즐 진입 직후
         앱을 전환한 시간이 유예를 소모해 복귀 즉시 카운트다운이 시작된다.
         이 블록은 !frozen && b.running 아래에 있으므로 hidden·blocked·일시정지
         구간에서는 graceMs 가 늘지 않는다.
         개시 tick 에서는 개시 시점 이후의 잔여분만 elapsed 로 넘긴다 (tick 폭 250ms 를
         통째로 더하면 백그라운드 탭의 1s 스로틀에서 최대 1초를 과대 계상). */
      if(p.t_first_input!=null){ b.started = true; add = clamp(t - p.t_first_input, 0, dt); }
      else {
        b.graceMs += dt;
        var gl = CONFIG.session.idle_grace_s*1000;
        if(b.graceMs >= gl){ b.started = true; add = clamp(b.graceMs - gl, 0, dt); }
      }
    }
    if(b.started){
      b.elapsed += add;
      var ratio = b.limitMs>0 ? b.elapsed/b.limitMs : 1;
      if(b.bar) b.bar.style.transform = 'scaleX('+clamp(1-ratio,0,1).toFixed(3)+')';
      if(!b.giveShown && b.elapsed >= CONFIG.session.manual_reveal_after_s*1000){
        b.giveShown = true; showGiveButton(p.id);
      }
      if(CONFIG.hints.enabled_on.indexOf(p.id)>=0){
        if(!b.h1 && ratio >= CONFIG.hints.auto_offer_at_ratio[0]){ b.h1=true; enableHint(p.id,1); }
        if(!b.h2 && ratio >= CONFIG.hints.auto_offer_at_ratio[1]){ b.h2=true; enableHint(p.id,2); }
      }
      if(b.elapsed >= b.limitMs){ b.expired=true; b.running=false; onTimeout(p); }
    }
  }

  /* ── 척도 화면 무반응 타임아웃 → '건너뛰기' 노출 (스펙 §2-2 정상 경로)
     확신 구간 자체가 blocked 로 잡히는 경로(p1)가 있으므로 blocked 로는 멈추지 않는다.
     여기서 blocked 로 멈추면 '건너뛰기'가 영영 안 나와 척도 화면에서 갇힌다. */
  if(R.scale && R.hiddenAt===0){
    R.scale.idle += dt;
    if(!R.scale.shown && !R.scale.touched && R.scale.idle >= CONFIG.session.scale_idle_timeout_s*1000){
      R.scale.shown = true;
      var sk = $(R.scale.skipSel); if(sk) sk.hidden = false;
    }
  }
}

/* 세션 캡 — 화면 전환(퍼즐 경계) 시점에만 검사한다(스펙 §2-1: 진행 중인 화면은 끊지 않는다).
   캡 시계의 기준은 스펙 §8-1 그대로 **세션 시작(ts_start)** 이다. 첫 퍼즐 t_start 를 기준으로
   삼으면 인트로 체류가 캡에서 빠지고 이어하기마다 캡이 사실상 리셋된다(스펙 "이어하기 시
   리셋하지 않고 이어서 누산한다" 위반). 인트로 체류를 예산에서 빼야 한다는 판단은 §2-1
   개정 사안이므로 코드가 아니라 스펙에서 결정한다. */
function capCheck(){
  if(!S) return false;
  var t = now();
  /* hidden_ms + blocked_ms 는 recalcSpanScalars 로 서로소가 보장되므로 스펙 수식을 그대로 쓴다 */
  S.active_total_ms = (t - S.ts_start) - S.hidden_ms - S.blocked_ms;   // 스펙 §8-1 수식
  var act = S.active_total_ms;
  if(act > CONFIG.session.hard_cap_s*1000){ capTruncate(); return true; }
  if(act > CONFIG.session.soft_cap_s*1000 && !S.cap_soft){ S.cap_soft = true; save(); }
  return false;
}
function capTruncate(){
  var order = CONFIG.session.cap_skip_order, i, j;
  for(i=0;i<order.length;i++){
    var id = order[i];
    if(CONFIG.session.cap_exempt.indexOf(id)>=0) continue;
    for(j=0;j<S.puzzles.length;j++){
      var p = S.puzzles[j];
      if(p.id===id && !p.presented && p.t_end==null){
        p.presented = false; p.skipped = false;          // 미제시: 항 제외 대상
        p.stall_excluded_reason = 'not_presented';
        if(S.skipped.indexOf(id)<0) S.skipped.push(id);
      }
    }
  }
  S.dropped_at = now();
  S.cap_truncated = true;
  save();
  goResult();
}

/* =========================================================================
   §6 GA4 — 3중 가드(중복 플래그 + typeof gtag 검사 + try/catch).
   gtag 부재·예외가 흐름을 절대 막지 않는다.
   ========================================================================= */
/* extra: 선택 — 추가 파라미터(예: 공유 탭의 method). 기존 호출부는 인자 하나로 그대로 동작한다 */
function gaStep(step, extra){
  if(R.gaSteps[step]) return;          // 같은 화면 재진입(재시도 루프·스왑)은 1회만
  R.gaSteps[step] = true;
  try{
    if(typeof gtag === 'function'){
      /* 이어하기 화면은 S 로드 전에 뜬다 — 후보 세션(R.pendingResume)의 play_index 를 쓴다 */
      var src = S || R.pendingResume;
      var params = {game_id:'seeing', step:step, play_index:(src?src.play_index:0), lang:LANG};
      if(extra){ for(var k in extra){ if(extra.hasOwnProperty(k)) params[k] = extra[k]; } }
      gtag('event','game_step',params);
    }
  }catch(e){}
}
function fireComplete(){
  if(R.completeFired) return;
  R.completeFired = true;
  try{
    if(typeof gtag === 'function'){
      gtag('event','game_complete',{game_id:'seeing', scene:'result', result:'m1', lang:LANG});
    }
  }catch(e){}
}

/* =========================================================================
   §7 라우터 — 한 방향 전진만(뒤로가기 없음)
   ========================================================================= */
var SCREENS = {
  intro:'#scrIntro', resume:'#scrResume', p1:'#scrP1', p3:'#scrP3', p4:'#scrP4',
  conf:'#scrConf', aha:'#scrAha', known:'#scrKnown', reveal:'#scrReveal',
  result:'#scrResult', selftest:'#scrSelftest'
};
function show(name, stepId){
  for(var k in SCREENS){ if(SCREENS.hasOwnProperty(k)){ var n=$(SCREENS[k]); if(n) n.hidden = (k!==name); } }
  R.screen = name;
  try{ window.scrollTo(0,0); }catch(e){}
  if(stepId) gaStep(stepId);
}
function stepId(kind){
  var p = curP();
  return (p ? p.id + '_' : '') + kind;
}
function renderProg(){
  var dots = $('#prog').children, i;
  for(i=0;i<dots.length;i++){
    dots[i].className = (i<R.pidx) ? 'done' : (i===R.pidx ? 'on' : '');
  }
}

/* 퍼즐 진행 큐 — 각 단계는 함수 하나, 끝나면 nextStep() 을 부른다 */
function nextStep(){
  var f = R.queue.shift();
  if(f) f(); else endPuzzle();
}
function startPuzzle(idx){
  if(!S) return;
  if(capCheck()) return;                       // 하드캡 → 절단 후 결과 화면
  R.pidx = idx;
  var p = S.puzzles[idx];
  if(S.skipped.indexOf(p.id)>=0){              // 이미 절단된 퍼즐은 건너뛴다
    return (idx+1 < S.puzzles.length) ? startPuzzle(idx+1) : goResult();
  }
  /* 이미 끝난 기록으로 재진입하면(테스트 훅 goto 등) 기록을 새로 만든다 */
  if(p.t_solve_end!=null || p.t_end!=null){ p = S.puzzles[idx] = newPuzzle(p.id, p.order_index); }
  p.presented = true;
  p.config_version = CONFIG.config_version;
  p.t_start = now();
  p.events.push({t:p.t_start, kind:'enter'});  // §5-1: 첫 공백이 계수되도록 가상 enter
  R.confPrompted[p.id] = false;
  R.ahaPrompted[p.id] = false;
  R.knownPrompted[p.id] = false;
  R.queue = [];
  startBox(p.id);
  renderProg();
  save();
  if(p.id==='p1_rat') enterP1();
  else if(p.id==='p3_trap') enterP3();
  else enterP4();
}
function endPuzzle(){
  var p = curP();
  if(p){
    p.t_end = now();
    if(p.t_solve_end==null) p.t_solve_end = p.t_end;
    p.skipped = !!(p.presented && !p.solved && !p.revealed);
    /* stall 표본 유효 조건(§5-1)을 여기서 한 번 계산해 로깅만 해 둔다 */
    var act = puzzleActiveMs(p);
    var activity = (p.attempts.length>=2) || p.correct || (p.hints.length>=1) ||
                   (p.id==='p4_ninedot' && ((p.extra.strokes||[]).length>=2));
    if(!p.presented) p.stall_excluded_reason = 'not_presented';
    else if(act < CONFIG.stall.min_active_ms) p.stall_excluded_reason = 'short_active';
    else if(!activity) p.stall_excluded_reason = 'no_activity';
    else p.stall_excluded_reason = null;
  }
  R.box = null;
  save();
  var nx = R.pidx + 1;
  if(nx < S.puzzles.length) startPuzzle(nx); else goResult();
}

/* =========================================================================
   §8 공통 위젯
   ========================================================================= */

/* ── 8-1 확신도 탭바 (0~100, 핸들 없이 시작, 최초 터치 전 다음 비활성) ── */
var confBar = $('#confBar'), confKnob = $('.knob', confBar), confFill = $('.fill', confBar);
function stepConf(kind){
  return function(){
    var p = curP();
    /* 확신도는 경로 무관 1회만 (스펙 §4 공통 규칙) */
    if(R.confPrompted[p.id]){ nextStep(); return; }
    R.confPrompted[p.id] = true;
    var C = CONFIG.m1_copy.conf;
    txt($('#confStage'), stageLabel());
    if(kind==='nine'){ txt($('#confQ'), C.nine_q); txt($('#confSub'), C.nine_sub); }
    else if(kind==='reveal'){ txt($('#confQ'), C.reveal_q); txt($('#confSub'), C.reveal_sub); }
    else { txt($('#confQ'), C.submit_q); txt($('#confSub'), C.submit_sub); }
    txt($('#confLo'), C.lo); txt($('#confHi'), C.hi);
    confFill.style.width = '0'; confKnob.hidden = true;
    $('#confVal').innerHTML = '';
    var sm = document.createElement('small'); sm.textContent = C.hint;
    $('#confVal').appendChild(sm);
    $('#confNext').disabled = true;
    $('#confSkip').hidden = true;
    R.conf = {v:null, touched:false};
    R.scale = {idle:0, touched:false, shown:false, skipSel:'#confSkip'};
    confBar.removeAttribute('aria-valuenow');   // role=slider 에 빈 문자열은 유효하지 않다(미설정으로 둔다)
    show('conf', stepId('conf'));
  };
}
function confSet(v){
  var p = curP(); if(!p) return;
  v = quant(clamp(v,0,100));
  R.conf.v = v; R.conf.touched = true;
  if(R.scale) R.scale.touched = true;
  confFill.style.width = v+'%';
  confKnob.hidden = false; confKnob.style.left = 'calc('+v+'% - 1px)';
  $('#confVal').textContent = v;
  confBar.setAttribute('aria-valuenow', String(v));
  $('#confNext').disabled = false;
}
/* 'pad' 이벤트는 **입력 1회당 1개**만 남긴다. pointermove 마다 쌓으면 §5-1 최장 공백
   재계산이 드래그 궤적 때문에 달라진다(값 자체는 confSet 이 갱신한다). */
function confFromX(clientX){
  var r = confBar.getBoundingClientRect();
  if(r.width<=0) return;
  confSet((clientX - r.left)/r.width*100);
}
confBar.addEventListener('pointerdown', function(e){
  e.preventDefault();
  try{ confBar.setPointerCapture(e.pointerId); }catch(err){}
  confBar._down = true; logEvent('pad', false); confFromX(e.clientX);
});
confBar.addEventListener('pointermove', function(e){ if(confBar._down) confFromX(e.clientX); });
confBar.addEventListener('pointerup', function(){ confBar._down = false; });
confBar.addEventListener('pointercancel', function(){ confBar._down = false; });
confBar.addEventListener('keydown', function(e){
  var q = CONFIG.session.pad_quantize, base = (R.conf && R.conf.v!=null) ? R.conf.v : 50;
  if(e.key==='ArrowLeft' || e.key==='ArrowDown'){ e.preventDefault(); logEvent('pad',false); confSet(base-q); }
  else if(e.key==='ArrowRight' || e.key==='ArrowUp'){ e.preventDefault(); logEvent('pad',false); confSet(base+q); }
  else if(e.key==='Home'){ e.preventDefault(); logEvent('pad',false); confSet(0); }
  else if(e.key==='End'){ e.preventDefault(); logEvent('pad',false); confSet(100); }
});
function confCommit(touched){
  var p = curP();
  if(!p || !R.conf || R.screen!=='conf') return;   // 화면을 떠난 뒤의 늦은 클릭 방지
  p.conf = {v: touched ? R.conf.v : null, touched: !!touched, t: now()};
  R.scale = null; R.conf = null;
  save();
  nextStep();
}
$('#confNext').addEventListener('click', function(){ if(R.conf && R.conf.touched) confCommit(true); });
$('#confSkip').addEventListener('click', function(){ confCommit(false); });

/* ── 8-2 아하 2D 탭패드 (x=쾌감, y=갑작스러움, 1탭, 양자화 5) ── */
var ahaPad = $('#ahaPad'), ahaDot = $('.dot', ahaPad);
function stepAha(ctxOrFn){
  return function(){
    var p = curP();
    if(CONFIG.aha.collect_on.indexOf(p.id)<0 || R.ahaPrompted[p.id]){ nextStep(); return; }
    R.ahaPrompted[p.id] = true;
    var ctx = (typeof ctxOrFn==='function') ? ctxOrFn() : ctxOrFn;
    var A = CONFIG.m1_copy.aha;
    txt($('#ahaStage'), stageLabel());
    txt($('#ahaQ'), p.id==='p3_trap' ? A.q_trap : (ctx==='after_reveal' ? A.q_reveal : A.q_self));
    /* 축 라벨도 전부 config 에서 — HTML 에 상수로 박으면 m1_copy.aha.x/x_lo/x_hi 가
       고쳐도 화면이 안 바뀌는 죽은 키가 된다(confLo/confHi 와 같은 규약). */
    txt($('#ahaY'), A.y); txt($('#ahaX'), A.x);
    txt($('#ahaXLo'), A.x_lo); txt($('#ahaXHi'), A.x_hi);
    txt($('#ahaVal'), '');
    var sm = document.createElement('small'); sm.textContent = A.hint;
    $('#ahaVal').innerHTML=''; $('#ahaVal').appendChild(sm);
    ahaDot.hidden = true;
    $('#ahaNext').disabled = true; $('#ahaSkip').hidden = true;
    R.aha = {sudden:null, pleasure:null, touched:false, context:ctx};
    R.scale = {idle:0, touched:false, shown:false, skipSel:'#ahaSkip'};
    show('aha', stepId('aha'));
  };
}
function ahaFromPoint(clientX, clientY){
  var r = ahaPad.getBoundingClientRect();
  if(r.width<=0||r.height<=0) return;
  var px = quant(clamp((clientX-r.left)/r.width*100, 0, 100));
  var py = quant(clamp((1-(clientY-r.top)/r.height)*100, 0, 100));
  R.aha.pleasure = px; R.aha.sudden = py; R.aha.touched = true;
  if(R.scale) R.scale.touched = true;
  ahaDot.hidden = false;
  ahaDot.style.left = px+'%'; ahaDot.style.top = (100-py)+'%';
  $('#ahaVal').textContent = '갑작스러움 '+py+' · 시원함 '+px;
  $('#ahaNext').disabled = false;
}

function p1Submit(){
  if(R.screen!=='p1') return;
  var p = curP(), raw = $('#p1In').value;
  if(!String(raw).trim()) return;
  logEvent('submit', true);
  /* 최초 제출 직전 확신도 1회 — 확신을 받고 나서 채점한다 */
  if(!R.confPrompted[p.id]){
    R.pendingSubmit = raw;
    /* p1 만 t_solve_end 가 확신 화면 **뒤**(정답 판정 시점)에 찍히므로, 확신 체류가
       stall 창 [t_start, t_solve_end] 안에 그대로 남는다. 스펙 §0-1·§5-1 이 요구하는
       '확신 구간 전면 차감'을 지키려면 이 구간을 blocked_spans 로 빼야 한다. */
    pauseBox(); beginBlock('puzzle');
    R.queue = [function(){ endBlock(); resumeBox(); show('p1', stepId('solve')); p1Judge(R.pendingSubmit); R.pendingSubmit=null; }];
    stepConf('submit')();
    return;
  }
  p1Judge(raw);
}
function p1Judge(raw){
  var p = curP(), item = ratItem();
  p.attempts.push({t:now(), input:String(raw)});
  var ok = ratCorrect(raw, item);
  var fb = $('#p1Fb'); fb.hidden = false;
  if(!ok){
    fb.className = 'fb';
    fb.textContent = CONFIG.m1_copy.p1.wrong;
    /* 스펙 §4: solved 는 '확정 제출/완성(정오 무관)'이다. 오답 제출도 확정 제출이므로
       여기서 solved 를 세운다 — 안 세우면 5회 제출하고 만료한 사용자와 아무것도 하지
       않고 만료한 사용자가 같은 플래그 조합으로 남고, p3(제출 즉시 solved=true)와
       같은 필드가 퍼즐마다 다른 뜻이 된다. correct 는 '재시도 중 하나라도 정답'이므로
       여기서는 올리지 않는다. */
    p.solved = true;
    save();
    return;                                   // 타임박스 내 재시도 무제한
  }
  /* 정답 — 확정 제출로 풀이 구간 종료 */
  fb.className = 'fb good';
  fb.textContent = CONFIG.m1_copy.p1.right;
  p.solved = true; p.correct = true; p.t_solve_end = now();
  stopBox();
  $('#p1Go').disabled = true; $('#p1In').disabled = true;
  save();
  /* 짧은 연출 — 시스템 강제 대기이므로 blocked_spans 에 적재 */
  beginBlock();
  var tok = ++R.token, wait = reduceMotion() ? 350 : 800;
  setTimeout(function(){
    if(tok!==R.token) return;
    endBlock();
    R.queue = [ stepAha('self_solved'), stepRevealP1(true) ];
    nextStep();
  }, wait);
}
function p1End(kind){                            // kind: 'timeout' | 'giveup'
  var p = curP();
  if(p.t_solve_end!=null) return;
  p.t_solve_end = now();
  if(kind==='timeout') p.timeout = true; else p.gave_up = true;
  p.revealed = true; p.correct = false;          // 풀이를 끝내기 전 해답 열람
  stopBox();
  $('#p1Go').disabled = true; $('#p1In').disabled = true;
  save();
  R.queue = [ stepConf('reveal'), stepRevealP1(false), stepAha('after_reveal'), stepKnown() ];
  nextStep();
}
$('#p1Give').addEventListener('click', function(){ p1End('giveup'); });

function stepRevealP1(knownInline){
  return function(){
    var p = curP(), item = ratItem();
    if(p.revealed) logEvent('reveal', false);     // 풀이를 끝내기 전 해답 열람(스펙 §5-1 kind)
    revealReset();
    var b = $('#revBody');
    b.appendChild(verdict(p.correct ? '✓' : '○',
      p.correct ? CONFIG.m1_copy.p1.head_solved : CONFIG.m1_copy.p1.head_revealed));
    /* 정답·예시 낱말은 **전부 config 에서** 만든다(스펙 §4 P1·§7-1: 문항·정답을 코드에
       상수로 박지 않는다). rat_pool 을 갈아 끼우면 이 화면도 함께 바뀐다.
       예시 낱말은 rat_pool[].examples[정답] 이 있으면 그것을, 없으면 cues+정답 조합을 쓴다. */
    for(var ai=0; ai<item.accept.length; ai++){
      var ans = item.accept[ai];
      var ex = (item.examples && item.examples[ans]) ? item.examples[ans]
             : item.cues.map(function(c){ return c+ans; });
      var row = el('div','answer', ans);
      row.appendChild(el('small', null, ex.join(' · ')));
      b.appendChild(row);
    }
    b.appendChild(el('p','p',item.explain));
    if(knownInline){
      $('#revKnown').hidden = false;
      txt($('#revKnownQ'), CONFIG.m1_copy.known.q);
      R.knownPrompted[p.id] = true;
      /* 응답을 받으면 '계속'을 켜 줄 뿐, 전진은 사용자가 직접 누른다(revNext 리스너).
         여기서 곧장 nextStep() 하면 해답·해설이 한 프레임만 보이고 사라진다. */
      $('#revNext').disabled = true;
      R.known = function(yes){ p.known_before = !!yes; save(); $('#revNext').disabled = false; };
      revKnownArm();
    }
    show('reveal', stepId('reveal'));
  };
}
