<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="성냥을 옮겨 식을 완성하는 6단계 퍼즐">
<title>성냥개비 수수께끼</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔥%3C/text%3E%3C/svg%3E">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SF7BJ4211L"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-SF7BJ4211L');</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#f5ecd9; --card1:#fbf5e6; --card2:#f5ebd3;
  /* --ink-faint 는 .sub/.note/.movecount/.st-txt i 가 쓴다. 반투명일 때 대비가
     2.9:1 밖에 안 나와 작은 글씨가 AA(4.5:1) 에 걸렸다 → 불투명 값으로 고정 */
  --ink:#4a3527; --ink-soft:#7d6448; --ink-faint:#6f5940;
  --line:rgba(146,108,63,.30);
  --wood1:#ecc98f; --wood2:#d3a05e; --wood3:#b47c41;
  --head1:#f08054; --head2:#c33f22; --head3:#8d2717;
  --amber1:#f4b558; --amber2:#e0912a;
  --accent:#b3401f;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(130% 90% at 50% -10%, #faf3e2 0%, #f4e9d0 55%, #ecdcbb 100%) fixed;
  min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  overflow-x:hidden;
}
.grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.05;z-index:0}
.wrap{position:relative;z-index:1;max-width:580px;margin:0 auto;padding:14px 16px calc(26px + env(safe-area-inset-bottom))}
/* ---------- header ---------- */
header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.titles{flex:1;text-align:center;min-width:0;padding:2px 0}
h1{font-size:clamp(1.32rem,5.4vw,1.78rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;
   background:linear-gradient(180deg,#5b402a,#3e2c1c);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:.7rem;color:var(--ink-faint);letter-spacing:.05em;margin-top:3px}
/* 좁은 화면에서는 3개국어 병기 부제가 항상 잘렸다 — 줄바꿈을 허용한다 */
@media (max-width:430px){.sub{line-height:1.35}}
@media (min-width:431px){.sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
:focus-visible{outline:3px solid #8a4a12;outline-offset:2px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:44px;
  border:1px solid var(--line);background:rgba(255,252,242,.78);
  border-radius:999px;padding:7px 11px;font-size:.76rem;font-weight:700;color:var(--ink-soft);
  box-shadow:0 1px 3px rgba(120,84,40,.14), inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .15s ease;text-decoration:none;white-space:nowrap}
.chip:active{transform:scale(.93)}
.top-btns{display:flex;gap:6px}
/* ---------- progress ---------- */
.progress{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 12px}
.dots{display:flex;gap:10px;align-items:flex-end}
.pm{position:relative;width:10px;height:40px;opacity:.42;transition:opacity .4s ease,transform .4s ease}
.pm:nth-child(1){transform:rotate(-7deg)}
.pm:nth-child(2){transform:rotate(2deg)}
.pm:nth-child(3){transform:rotate(8deg)}
.pm:nth-child(4){transform:rotate(-4deg)}
.pm:nth-child(5){transform:rotate(6deg)}
.pm-stick{position:absolute;left:2.6px;top:9px;width:4.8px;height:30px;border-radius:2.4px;
  background:linear-gradient(90deg,var(--wood1),var(--wood2) 60%,var(--wood3))}
.pm-head{position:absolute;left:.7px;top:0;width:8.4px;height:10.5px;border-radius:50% 50% 46% 46%;
  background:radial-gradient(circle at 36% 28%,var(--head1),var(--head2) 62%,var(--head3))}
.pm-flame{position:absolute;left:-1.6px;top:-10px;width:12.5px;height:13px;
  border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  background:radial-gradient(circle at 50% 68%,#fff6cf,#ffcf5e 45%,#ff9430 76%,rgba(255,110,30,0));
  opacity:0;transform:scale(.3);transform-origin:50% 90%;transition:opacity .35s,transform .35s}
/* 상태를 투명도로만 주면 회색조에서 cur 와 lit 이 구별되지 않는다 —
   cur 에는 밑줄, lit 에는 굵은 몸통이라는 형태 단서를 함께 준다 */
.pm.cur{opacity:.85}
.pm.cur::after{content:'';position:absolute;left:-2px;right:-2px;bottom:-5px;height:2.5px;
  border-radius:2px;background:var(--ink-soft)}
.pm.lit{opacity:1}
.pm.lit .pm-stick{left:1.4px;width:7.2px}
.pm.off{display:none}
.pm.lit .pm-flame{opacity:1;transform:scale(1);animation:pmflick .24s infinite alternate ease-in-out}
@keyframes pmflick{to{transform:scale(.88) translateY(.6px)}}
#probLabel{font-size:.86rem;font-weight:700;color:var(--ink-soft);letter-spacing:.02em}
/* ---------- stage bar / stage select ---------- */
.stagebar{display:flex;align-items:center;gap:8px;margin:10px 0 0}
.stagebar .chip{padding:6px 10px;font-size:.72rem}
.sb-gap{flex:none;width:58px}
.stagename{flex:1;min-width:0;text-align:center;font-size:.84rem;font-weight:800;
  color:var(--ink-soft);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stages{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.stage-btn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;
  background:rgba(255,252,242,.82);box-shadow:0 2px 7px rgba(120,84,40,.1);
  transition:transform .15s ease,box-shadow .2s ease}
.stage-btn:active{transform:scale(.98)}
.st-no{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:.85rem;color:#fff9ec;
  background:linear-gradient(180deg,var(--amber1),var(--amber2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.st-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.st-txt b{font-size:.95rem;font-weight:800}
.st-txt i{font-style:normal;font-size:.75rem;color:var(--ink-faint);line-height:1.35}
.st-mark{flex:none;font-size:1rem}
.stage-btn.locked{opacity:.55;cursor:default;box-shadow:none;background:rgba(238,229,209,.6)}
.stage-btn.locked .st-no{background:#cbb99b;color:#f4ede1;box-shadow:none}
.stage-btn.done .st-no{background:linear-gradient(180deg,#f5aa4d,#c8541f)}
/* ---------- card ---------- */
.card{position:relative;background:linear-gradient(180deg,var(--card1),var(--card2));
  border:1px solid var(--line);border-radius:24px;padding:18px 12px 18px;
  box-shadow:0 18px 44px rgba(120,84,40,.17), inset 0 2px 0 rgba(255,255,255,.65)}
.inst{text-align:center;font-size:.92rem;color:var(--ink-soft);margin-bottom:2px}
.inst b{color:var(--accent)}
.note{text-align:center;font-size:.76rem;color:var(--ink-faint);margin-bottom:2px}
.movecount{text-align:center;font-size:.78rem;font-weight:700;color:var(--ink-faint);
  margin-top:6px;letter-spacing:.02em}
.board-wrap{position:relative;max-width:474px;margin:0 auto}
#board{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.stick-layer{filter:drop-shadow(0 2.5px 1.8px rgba(96,60,22,.28))}
.stick{transform-box:view-box;transform-origin:0 0;cursor:pointer;
  transition:transform .3s cubic-bezier(.3,1.45,.55,1),filter .18s ease}
.stick.lifted{filter:drop-shadow(0 0 4px rgba(255,176,64,.95)) drop-shadow(0 6px 5px rgba(96,58,16,.4))}
.stick.static{cursor:default}
.stick.hintblink{animation:hintb .55s ease-in-out 4}
@keyframes hintb{50%{filter:drop-shadow(0 0 3px rgba(255,220,120,1)) drop-shadow(0 0 9px rgba(255,150,40,.95))}}
/* .ring — 색·빛이 아닌 '테두리 모양'으로 상태를 알린다.
   회색조에서도, 모션을 끈 환경에서도 남는 유일한 단서라 애니메이션 밖에 둔다.
   힌트 > 집음 > 옮김 순으로 뒤 규칙이 이긴다. */
.ring{opacity:0;transition:opacity .18s ease}
.stick.moved .ring{opacity:1;stroke-dasharray:3.5 3}
.stick.lifted .ring{opacity:1;stroke-dasharray:none;stroke-width:2.6}
.stick.hintblink .ring{opacity:1;stroke-dasharray:none;stroke-width:3;stroke:#7a3208}
.stick:focus-visible{outline:none}
.stick:focus-visible .ring{opacity:1;stroke-dasharray:none;stroke-width:3.4;stroke:#2f1f12}
.slot{transform-box:view-box;transform-origin:0 0;opacity:0;pointer-events:none;transition:opacity .22s ease}
/* 옮긴 성냥이 떠나온 자리는 흐리게 남겨 둔다 — 무엇을 건드렸는지 되짚을 수 있게 */
.slot.ghost{opacity:.45}
.slot.show{opacity:1;pointer-events:auto;cursor:pointer}
.slot.show .slot-dash{animation:slotpulse 1.15s ease-in-out infinite}
/* 점선 테두리는 흐려지지 않게 둔다 — 굽이의 바닥값이 비텍스트 3:1 에 아슬아슬했다.
   숨쉬는 느낌은 안쪽 채움만으로 낸다 */
@keyframes slotpulse{50%{fill-opacity:.045}}
.slot:focus-visible{outline:none}
.slot:focus-visible .slot-dash{stroke:#2f1f12;stroke-width:3.2;stroke-dasharray:none}
.flamedot{pointer-events:none;transform-box:fill-box;transform-origin:center;animation:fdflick .13s infinite alternate ease-in-out}
@keyframes fdflick{to{opacity:.55;transform:scale(.82)}}
#eqG.eqshake{animation:eqsh .4s ease}
@keyframes eqsh{25%{transform:translateX(2.5px)}50%{transform:translateX(-2px)}75%{transform:translateX(1.2px)}}
.wiggle{animation:wig .5s ease}
@keyframes wig{18%{transform:translateX(-6px) rotate(-.5deg)}38%{transform:translateX(5px) rotate(.4deg)}
  58%{transform:translateX(-3px)}78%{transform:translateX(2px)}}
/* correct banner */
.bang{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.bang span{font-size:clamp(2rem,9vw,2.7rem);font-weight:900;letter-spacing:-.01em;
  background:linear-gradient(180deg,#ffab4a,#dd4a1a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.55)) drop-shadow(0 7px 16px rgba(226,87,31,.4));
  opacity:0;transform:scale(.4)}
.bang.show span{animation:bangpop .55s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes bangpop{to{opacity:1;transform:scale(1)}}
/* message + controls */
.msg{min-height:1.5em;text-align:center;font-size:.9rem;font-weight:700;color:#a2542a;
  opacity:0;transition:opacity .25s;margin-top:8px}
.msg.show{opacity:1}
.controls{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
  border-radius:999px;padding:12px 22px;font-weight:800;font-size:.98rem;
  transition:transform .15s ease,box-shadow .2s ease}
.btn:active{transform:scale(.94)}
/* 힌트는 오답 3회째에 나타난다. display:none 으로 숨기면 그때 검사 버튼이
   옆으로 밀려 방금 누른 자리가 힌트 버튼이 된다 → 자리를 미리 잡아 둔다 */
.btn.invis{visibility:hidden;pointer-events:none}
.btn-primary{background:linear-gradient(180deg,var(--amber1),var(--amber2));color:#fff9ec;padding:12px 32px;
  box-shadow:0 7px 16px rgba(204,130,30,.38), inset 0 1.5px 0 rgba(255,255,255,.55);
  text-shadow:0 1px 1px rgba(140,80,10,.35)}
.btn-ghost{background:rgba(255,251,240,.72);border:1.5px solid var(--line);color:var(--ink-soft);
  font-size:.9rem;padding:11px 18px;box-shadow:0 2px 6px rgba(120,84,40,.1)}
.hidden{display:none !important}
.pop-in{animation:popin .45s cubic-bezier(.3,1.5,.6,1)}
@keyframes popin{from{opacity:0;transform:scale(.6)}}
.foot{text-align:center;font-size:.74rem;color:var(--ink-faint);margin-top:15px;letter-spacing:.02em}
/* ---------- done overlay ---------- */
/* align-items:center + overflow 없음 이면 가로 화면에서 카드 위아래가 잘리고
   스크롤도 안 됐다. flex-start + margin:auto 면 들어갈 땐 가운데, 넘칠 땐 스크롤 */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(56,38,20,.46);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:22px;
  overflow-y:auto;overscroll-behavior:contain;
  opacity:0;pointer-events:none;transition:opacity .45s ease}
.overlay.show{opacity:1;pointer-events:auto}
.done-card{margin:auto 0;background:linear-gradient(180deg,#fcf6e8,#f4e9d1);border:1px solid var(--line);
  border-radius:28px;padding:26px 24px 26px;max-width:350px;width:100%;text-align:center;
  box-shadow:0 26px 64px rgba(40,24,8,.42), inset 0 2px 0 rgba(255,255,255,.7);
  transform:translateY(16px) scale(.95);transition:transform .45s cubic-bezier(.3,1.4,.6,1)}
.overlay.show .done-card{transform:none}
.scene{position:relative;height:158px;display:flex;justify-content:center;align-items:flex-end;margin-bottom:4px}
.big-match{position:relative;width:16px;height:122px}
.bm-stick{position:absolute;left:1.5px;bottom:0;width:13px;height:96px;border-radius:6px;
  background:linear-gradient(90deg,var(--wood1),#cf9c5b 55%,#ae783c);
  box-shadow:inset -2px 0 3px rgba(120,70,20,.28), inset 2px 0 2px rgba(255,240,210,.5)}
.bm-head{position:absolute;left:-3.5px;top:0;width:23px;height:30px;border-radius:50% 50% 46% 46%;
  background:radial-gradient(circle at 35% 26%,var(--head1),var(--head2) 58%,var(--head3));z-index:2;
  transition:filter 1.2s ease}
.scene.blown .bm-head{filter:brightness(.42) saturate(.45)}
.bm-flame{position:absolute;left:-9px;top:-36px;width:34px;height:46px;z-index:1;
  transform-origin:50% 92%;animation:bflick .16s infinite alternate ease-in-out}
.bm-flame::before{content:'';position:absolute;inset:0;
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;filter:blur(1.2px);
  background:radial-gradient(circle at 50% 72%,#fff7d0,#ffd35f 40%,#ff9930 70%,rgba(255,100,20,.04))}
.bm-flame::after{content:'';position:absolute;left:10px;top:17px;width:14px;height:23px;
  border-radius:50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%,#fffbe8,#ffe9a8 58%,rgba(255,200,90,0))}
@keyframes bflick{from{transform:scaleY(1) skewX(-2.5deg)}to{transform:scaleY(.9) scaleX(.95) skewX(3deg)}}
.scene.blown .bm-flame{animation:fout .5s ease forwards}
@keyframes fout{35%{opacity:1;transform:scale(1.18,.72)}100%{opacity:0;transform:scale(.12,.3) translateY(12px)}}
.smoke{position:absolute;left:50%;top:2px;width:17px;height:17px;margin-left:-8px;border-radius:50%;
  background:rgba(128,118,105,.55);filter:blur(5.5px);opacity:0}
.scene.blown .smoke{animation:rise 1.6s ease-out forwards}
.scene.blown .s2{animation-delay:.17s;width:12px}
.scene.blown .s3{animation-delay:.34s;width:9px}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.55)}22%{opacity:.55}
  100%{opacity:0;transform:translate(8px,-68px) scale(2)}}
.blow-x{position:absolute;left:calc(50% + 24px);top:6px;font-size:1.35rem;font-weight:800;color:#8b6a4a;opacity:0}
.scene.blown .blow-x{animation:puff 1.05s ease .08s forwards}
@keyframes puff{18%{opacity:1;transform:translateX(-7px)}100%{opacity:0;transform:translateX(-20px)}}
.scene.instant .bm-flame,.scene.instant .smoke,.scene.instant .blow-x{animation:none;opacity:0}
.scene.instant .bm-head{transition:none;filter:brightness(.42) saturate(.45)}
.done-t{font-size:1.32rem;font-weight:800;margin-bottom:7px;opacity:0;transform:translateY(9px);transition:opacity .5s,transform .5s}
.done-s{font-size:.88rem;color:var(--ink-soft);line-height:1.5;margin-bottom:19px;opacity:0;transform:translateY(9px);
  transition:opacity .5s .08s,transform .5s .08s}
.done-btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;opacity:0;transform:translateY(9px);
  transition:opacity .5s .16s,transform .5s .16s}
.done-btns .btn{padding:11px 18px;font-size:.92rem}
.done-btns .btn-primary{padding:11px 24px}
.done-card.reveal .done-t,.done-card.reveal .done-s,.done-card.reveal .done-btns{opacity:1;transform:none}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
@media (min-width:700px){
  .wrap{padding-top:40px}
  .card{padding:24px 22px 22px}
  .inst{font-size:1rem;margin-bottom:8px}
}
/* 가로로 눕히면 판과 검사 버튼이 한 화면에 안 들어왔다(버튼이 뷰포트 밖 523px).
   남는 가로 폭을 써서 판 | 글·버튼 2열로 접는다 */
@media (orientation:landscape) and (max-height:460px){
  .wrap{max-width:940px;padding:6px 16px calc(8px + env(safe-area-inset-bottom))}
  h1{font-size:1.06rem}
  .sub{display:none}
  header{margin-bottom:0}
  .stagebar{margin:4px 0 0}
  .progress{margin:3px 0 4px;gap:10px}
  .pm{height:28px}
  .pm-stick{top:7px;height:20px}
  .card{display:grid;align-content:center;column-gap:16px;padding:10px 14px;
    grid-template-columns:minmax(0,1fr) minmax(0,290px);
    grid-template-areas:"board inst" "board note" "board count" "board msg" "board ctrl"}
  .board-wrap{grid-area:board;align-self:center;max-width:430px}
  .inst{grid-area:inst}.note{grid-area:note}.movecount{grid-area:count}
  .msg{grid-area:msg}.controls{grid-area:ctrl;margin-top:8px}
  .foot{margin-top:7px}
  .stages{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .stage-btn{padding:9px 12px}
  .scene{height:104px}.big-match{height:80px}.bm-stick{height:62px}
}
/* 엔딩의 「또 할래?」 한 줄 — 재시작 CTA 가 아니라 계측용 작은 물음 */
.ga-vote{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 2px;font-size:14px;line-height:1.2;opacity:.92;color:var(--ink-soft)}
.ga-vote[hidden]{display:none}
.ga-vote-btn{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.85;-webkit-tap-highlight-color:transparent}
.ga-vote-btn:active{opacity:1}
.ga-vote.done .ga-vote-btn{display:none}
.done-card .ga-vote{opacity:0;transform:translateY(9px);transition:opacity .5s .24s,transform .5s .24s}
.done-card.reveal .ga-vote{opacity:.92;transform:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  /* 힌트 반짝임은 keyframes 안에만 있어 위 규칙에 통째로 죽는다.
     .ring 은 애니메이션과 무관한 정적 표시라 여기서도 그대로 남는다 */
  .stick.hintblink .ring{opacity:1}
}
</style>
</head>
<body>
<svg class="grain" aria-hidden="true" preserveAspectRatio="none">

/* ROUND 은 한 판의 문제 수. 6단계만 3문제인 이유:
   기대 시도(e) 평균이 L1~L5 는 2.1~5.5 인데 L6 만 9.96 이라
   5문제면 한 판 50시도(12~17분)로 3~10분 목표를 크게 넘긴다.
   3문제면 30시도 ≈ 8~10분으로 다른 단계와 비슷해진다. */
var STAGES=6,ROUND=5,ROUNDS=[5,5,5,5,5,3];
function roundOf(lv){return ROUNDS[lv-1]||ROUND}
/* 은행의 a(정답 목록)와 게임 로직의 a(첫째 항)가 이름이 겹쳐 ans 로 옮겨 담는다 */
function parseProb(o){
  var m=o.s.match(/^(\d)([+\-])(\d)=(\d)$/);
  return{str:o.s,a:+m[1],op:m[2],b:+m[3],c:+m[4],m:o.m,ans:o.a,stage:o.L};
}
function probByStr(s){
  for(var i=0;i<BANK.length;i++)if(BANK[i].s===s)return parseProb(BANK[i]);
  return null;
}
function bankOf(lv){var a=[],i;for(i=0;i<BANK.length;i++)if(BANK[i].L===lv)a.push(BANK[i]);return a}

/* ============================== 판 짜기 ============================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr){
  var i,j,t;
  for(i=arr.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=arr[i];arr[i]=arr[j];arr[j]=t}
  return arr;
}
/* 문제 문자열에서 시드를 뽑는다 — 날짜와 무관하게, 같은 문제는 늘 같은 모양으로 흔들린다 */
function seedOf(s){
  var h=2166136261,i;
  for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return h>>>0;
}

/* ============================== persistence ============================== */
var SAVEKEY='in9-matchstick',SAVEV=2;
function freshState(){return{v:SAVEV,cleared:[false,false,false,false,false,false],seen:{},cur:null}}
function loadState(){
  var raw=lsGet(SAVEKEY),o=null,i;
  try{o=JSON.parse(raw)}catch(e){o=null}
  /* 옛 포맷(날짜 시드 하루 3문제)은 마이그레이션하지 않고 조용히 버린다 — 하루치라 남길 값이 없다 */
  if(!o||o.v!==SAVEV||!Array.isArray(o.cleared)||o.cleared.length!==STAGES)return freshState();
  if(!o.seen||typeof o.seen!=='object')o.seen={};
  if(o.cur){
    /* 저장본이 상하거나 은행이 바뀌었을 수 있으니 판 정보는 매번 검증한다.
       판 길이가 단계마다 다르므로 roundOf 로 대조한다 */
    var rn=(o.cur.L>=1&&o.cur.L<=STAGES)?roundOf(o.cur.L):-1;
    if(rn<0||!Array.isArray(o.cur.qs)||o.cur.qs.length!==rn||
       !(o.cur.i>=0&&o.cur.i<rn))o.cur=null;
    else for(i=0;i<rn;i++)if(!probByStr(o.cur.qs[i])){o.cur=null;break}
  }
  return o;
}
var state=loadState();
function saveState(){lsSet(SAVEKEY,JSON.stringify(state))}
function allCleared(){
  for(var i=0;i<STAGES;i++)if(!state.cleared[i])return false;
  return true;
}
/* 클리어한 단계 + 바로 다음 한 단계까지 열린다 */
function maxOpen(){
  var n=1,i;
  for(i=0;i<STAGES;i++)if(state.cleared[i]&&i+2>n)n=i+2;
  return n>STAGES?STAGES:n;
}
function markSeen(lv,s){
  var k=''+lv;
  if(!state.seen[k])state.seen[k]=[];
  if(state.seen[k].indexOf(s)<0)state.seen[k].push(s);
}
/* 안 본 문제를 먼저 뽑는다 — 같은 단계를 다시 해도 2~3판은 새 문제가 나온다 */
function pickRound(lv){
  var pool=bankOf(lv),seen=state.seen[''+lv]||[],unseen=[],rest=[],out,qs=[],i,rn=roundOf(lv);
  for(i=0;i<pool.length;i++){
    if(seen.indexOf(pool[i].s)<0)unseen.push(pool[i]);else rest.push(pool[i]);
  }
  shuffle(unseen);shuffle(rest);
  out=unseen.slice(0,rn);
  if(out.length<rn){
    /* 안 본 문제가 바닥나면 기록을 비워 다음 판부터 다시 한 바퀴 돈다 */
    state.seen[''+lv]=[];
    for(i=0;i<rest.length&&out.length<rn;i++)out.push(rest[i]);
  }
  for(i=0;i<out.length;i++)qs.push(out[i].s);
  return qs;
}

var AC=null,master=null,noiseBuf=null;
var sndOn=lsGet('in9-matchstick-snd')!=='0';
function ensureAC(){
  if(!sndOn)return null;
  var Ctor=window.AudioContext||window.webkitAudioContext;
  if(!Ctor)return null;
  if(!AC){AC=new Ctor();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f0,f1,dur,type,vol,when){
  var c=ensureAC();if(!c)return;
  var t=c.currentTime+(when||0);
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||'triangle';
  o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);
  o.start(t);o.stop(t+dur+.06);
}
function noiseHit(dur,freq,q,vol,when,type){
  var c=ensureAC();if(!c)return;
  if(!noiseBuf){noiseBuf=c.createBuffer(1,c.sampleRate,c.sampleRate);
    var d=noiseBuf.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  var t=c.currentTime+(when||0);
  var s=c.createBufferSource();s.buffer=noiseBuf;
  var f=c.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;
  var g=c.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.015);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);
  s.start(t);s.stop(t+dur+.06);
}
function blowSound(when){
  var c=ensureAC();if(!c)return;
  if(!noiseBuf){noiseHit(0.01,500,1,0.001,0)}
  var t=c.currentTime+(when||0);
  var s=c.createBufferSource();s.buffer=noiseBuf;
  var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=760;f.Q.value=.6;
  var g=c.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.24,t+.28);
  g.gain.exponentialRampToValueAtTime(.0001,t+.95);
  s.connect(f);f.connect(g);g.connect(master);
  s.start(t);s.stop(t+1);
}

function mk(tag,attrs,parent){
  var e=document.createElementNS(NS,tag);
  if(attrs)for(var k in attrs)e.setAttribute(k,attrs[k]);
  if(parent)parent.appendChild(e);
  return e;
}

defs.innerHTML=
 '<linearGradient id="woodG" gradientUnits="userSpaceOnUse" x1="0" y1="-3.2" x2="0" y2="3.4">'+

mk('rect',{x:8,y:10,width:376,height:158,rx:18,fill:'rgba(151,109,58,.055)'},board);
var slotLayer=mk('g',{'class':'slot-layer'},board);
var eqLayer=mk('g',{id:'eqG'},board);
var stickLayer=mk('g',{'class':'stick-layer'},board);
var fxLayer=mk('g',{'class':'fx-layer','pointer-events':'none'},board);

function stickBody(g,flip){
  var inner=mk('g',{transform:'scale('+flip+',1)'},g);
  mk('rect',{x:-22,y:-3.1,width:39.5,height:6.2,rx:2.6,fill:'url(#woodG)'},inner);
  mk('rect',{x:-20,y:-.6,width:34,height:1.1,rx:.55,fill:'rgba(120,75,30,.16)'},inner);
  mk('ellipse',{cx:17.5,cy:0,rx:6.1,ry:4.8,fill:'url(#headG)','class':'head'},inner);
  mk('ellipse',{cx:15.6,cy:-1.6,rx:2.1,ry:1.4,fill:'rgba(255,236,214,.42)'},inner);
  /* 상태 테두리 — 색·빛이 아닌 형태로 집음/옮김/힌트/포커스를 알린다 */
  mk('rect',{x:-25.5,y:-8.5,width:53,height:17,rx:8.5,fill:'none',stroke:'#3b2716',
    'stroke-width':2.2,'class':'ring'},g);
  mk('rect',{x:-28,y:-11,width:57,height:22,fill:'rgba(0,0,0,0)'},g);
  return g;
}
function slotTf(slotId,jm,lift){
  var g=SLOT_GEO[slotId],j=jm[slotId];
  var x=g.x+j.dx,y=g.y+j.dy-(lift?13:0);
  return 'translate('+x+'px, '+y+'px) rotate('+(g.ang+j.da)+'deg)'+(lift?' scale(1.07)':'');
}

/* build slot elements once */
var slotEls={};

  for(var i=0;i<ALLSLOTS.length;i++){
    var id=ALLSLOTS[i],geo=SLOT_GEO[id];
    var g=mk('g',{'class':'slot',role:'button',tabindex:'-1'},slotLayer);
    g.style.transform='translate('+geo.x+'px, '+geo.y+'px) rotate('+geo.ang+'deg)';
    /* 점선 대비가 2.5:1 이라 비텍스트 3:1 에 못 미쳤다 → 진한 색 + 불투명 */
    mk('rect',{x:-23,y:-5.4,width:46,height:10.8,rx:5.4,fill:'rgba(180,130,70,.09)',
      stroke:'#8a5c2a','stroke-width':2,'stroke-dasharray':'5 4','stroke-opacity':1,
      'class':'slot-dash'},g);
    mk('rect',{x:-27,y:-11,width:54,height:22,fill:'rgba(0,0,0,0)'},g);
    (function(sid,el){
      el.addEventListener('keydown',function(ev){
        if(ev.key!=='Enter'&&ev.key!==' '&&ev.key!=='Spacebar')return;
        ev.preventDefault();ensureAC();onSlotTap(sid);
      });
    })(id,g);
    slotEls[id]=g;
  }
})();

/* equals sign (fixed) */
var eqEls=[];
function eqRefuse(){
  if(locked)return;
  eqLayer.classList.remove('eqshake');
  void eqLayer.getBoundingClientRect();
  eqLayer.classList.add('eqshake');
  toast(T('eqFixed'));SND.ui();
}
var EQGEO=[{x:EQC,y:MIDY-8,ang:-1.1},{x:EQC,y:MIDY+8,ang:1.4}];
(function(){
  for(var i=0;i<2;i++){
    var g=mk('g',{'class':'stick static',role:'img',tabindex:'-1'},eqLayer);
    g.style.transform='translate('+EQGEO[i].x+'px, '+EQGEO[i].y+'px) rotate('+EQGEO[i].ang+'deg)';
    stickBody(g,i?-1:1);
    eqEls.push(g);
  }
  eqLayer.addEventListener('animationend',function(){eqLayer.classList.remove('eqshake')});

/* ============================== game state ============================== */
var pIdx=0,sticks=[],posMap={},lifted=null,locked=false,wrongCount=0,sols=[],jmap={};
var curL=1,curP=null,maxMove=1,movedQ=[];
var doneShown=false,doneAll=false;
var toastTimer=null,msgSticky=false;

/* ============================== 탭 판정 ==============================
   히트 사각형을 겹쳐 놓고 '위에 그려진 것이 이긴다'로 판정하면
   한 점에서 만나는 성냥들이 서로를 가린다. 실제로 막혀 있던 곳:
     · '+' 의 가로 성냥 — 세로 성냥과 중심이 같아 가운데가 늘 세로에 먹혔다
     · '−' → '+' 로 만들 때의 세로 빈자리 — 자리 레이어가 성냥 아래라
       한가운데를 누르면 들고 있던 성냥을 놓치고 '−' 를 집었다
     · 숫자 모서리 — 이웃 성냥끼리 히트 영역이 겹쳐 엉뚱한 쪽이 잡혔다
   그래서 좌표를 판 좌표로 바꾼 뒤 '성냥 선분까지의 거리'로 고른다.
   보이는 대로 가까운 쪽이 잡히고, 겹침이 있어도 판정이 뒤집히지 않는다. */
var HALF=20,HITR=23,SLOTBIAS=6;
function segDistAt(cx,cy,ang,px,py){
  var r=ang*Math.PI/180,hx=Math.cos(r)*HALF,hy=Math.sin(r)*HALF;
  var dx=px-cx,dy=py-cy,t=(dx*hx+dy*hy)/(HALF*HALF);
  if(t>1)t=1;else if(t<-1)t=-1;
  var qx=dx-t*hx,qy=dy-t*hy;
  return Math.sqrt(qx*qx+qy*qy);
}
/* 빈자리는 흔들림 없이 그려지고, 성냥은 jmap 만큼 흔들려 그려진다 */
function slotDist(id,px,py){var g=SLOT_GEO[id];return segDistAt(g.x,g.y,g.ang,px,py)}
function stickDist(st,px,py){
  var g=SLOT_GEO[st.slot],j=jmap[st.slot]||{dx:0,dy:0,da:0};
  return segDistAt(g.x+j.dx,g.y+j.dy,g.ang+j.da,px,py);
}
function boardPt(ev){
  var r=board.getBoundingClientRect();
  if(!r.width||!r.height)return null;
  return{x:(ev.clientX-r.left)*392/r.width,y:(ev.clientY-r.top)*176/r.height};
}
function onBoardDown(ev){
  if(locked)return;
  gaFirstTouch();
  var pt=boardPt(ev);if(!pt)return;
  var best=null,bd=HITR,i,d,id;
  /* 성냥을 들고 있으면 빈자리에 약간의 가산점을 준다 — 중심이 겹치는
     '−' 의 세로 빈자리를 놓을 수 있게. 성냥 몸통을 정확히 누르면
     거리 0 이라 여전히 성냥 바꿔 집기가 된다 */
  if(lifted){
    for(i=0;i<ALLSLOTS.length;i++){
      id=ALLSLOTS[i];
      if(posMap[id]&&id!==lifted.slot)continue;
      d=slotDist(id,pt.x,pt.y)-SLOTBIAS;
      if(d<bd){bd=d;best={kind:'slot',id:id}}
    }
  }
  for(i=0;i<sticks.length;i++){
    d=stickDist(sticks[i],pt.x,pt.y);
    if(d<bd){bd=d;best={kind:'stick',st:sticks[i]}}
  }
  for(i=0;i<2;i++){
    d=segDistAt(EQGEO[i].x,EQGEO[i].y,EQGEO[i].ang,pt.x,pt.y);
    if(d<bd){bd=d;best={kind:'eq'}}
  }
  if(!best)return;
  ev.preventDefault();
  ensureAC();
  if(best.kind==='slot')onSlotTap(best.id);
  else if(best.kind==='stick')onStickTap(best.st);
  else eqRefuse();
}

/* 자리를 벗어난 성냥 전부를 '옮긴 순서대로' 들고 있는다.
   5·6단계는 2개를 옮겨야 풀리므로 하나만 추적하면 아예 풀 수 없다. */
function displacedList(){return movedQ}
function qSync(st){
  var k=movedQ.indexOf(st);
  if(st.slot===st.origin){if(k>=0)movedQ.splice(k,1)}
  else if(k<0)movedQ.push(st);
}
/* 제자리로 돌려보낸다.
   2개 이동에서는 '사슬 이동'(a→x 다음 b→a)이 생겨 원래 자리를 다른 성냥이
   차지하고 있을 수 있다. 그대로 밀어넣으면 두 성냥이 한 자리에 겹쳐
   판이 깨지므로, 그럴 땐 자리를 맞바꾼다. 꽂힌 자리 집합은 그대로라
   식은 변하지 않고 '진짜 옮긴 개수'만 정확해진다. */
function sendHome(st){
  var other=posMap[st.origin],here;
  if(!other||other===st){moveTo(st,st.origin,false);return}
  here=st.slot;
  delete posMap[here];delete posMap[st.origin];
  st.slot=st.origin;posMap[st.origin]=st;
  other.slot=here;posMap[here]=other;
  st.el.classList.remove('lifted');other.el.classList.remove('lifted');
  st.el.style.transform=slotTf(st.slot,jmap,false);
  other.el.style.transform=slotTf(here,jmap,false);
  qSync(st);qSync(other);
}
function enforceLimit(){
  /* 허용 개수를 넘기면 가장 먼저 옮긴 것을 제자리로(FIFO).
     탭이 아무 반응 없이 씹히는 것보다 낫다.
     소리로만 알리면 소리 끔 + 모션 끔 환경에서 피드백이 0이라
     (카운터도 2/2 → 2/2 그대로) 토스트와 강조를 함께 준다 */
  var evicted=null;
  while(movedQ.length>maxMove){evicted=movedQ[0];sendHome(movedQ[0])}
  if(evicted){SND.cancel();toast(T('limitBack'));flashStick(evicted)}
}
function flashStick(st){
  if(!st||!st.el)return;
  st.el.classList.add('hintblink');
  setTimeout(function(){st.el.classList.remove('hintblink')},1400);
}
function setLift(st,on){
  st.el.style.transform=slotTf(st.slot,jmap,on);
  st.el.classList.toggle('lifted',on);
}
function moveTo(st,slot,snd){
  delete posMap[st.slot];
  st.slot=slot;posMap[slot]=st;
  st.el.classList.remove('lifted');
  st.el.style.transform=slotTf(slot,jmap,false);
  qSync(st);
  if(snd)SND.place();
}
function updateSlots(){
  /* 옮긴 성냥이 떠나온 빈자리는 흐리게 남긴다 — 색이 아닌 형태 단서 */
  var origins={},i,id;
  for(i=0;i<movedQ.length;i++)if(!posMap[movedQ[i].origin])origins[movedQ[i].origin]=1;
  for(i=0;i<ALLSLOTS.length;i++){
    id=ALLSLOTS[i];
    var show=!!lifted&&(!posMap[id]||lifted.slot===id);
    var el=slotEls[id];
    el.classList.toggle('show',show);
    el.classList.toggle('ghost',!show&&!!origins[id]);
    el.setAttribute('tabindex',show?'0':'-1');
    el.setAttribute('aria-label',T('aSlot').replace('{p}',slotName(id)));
  }
}
/* 스크린리더용 자리 이름: 'd0a' → '첫째 숫자 위' */
function slotName(id){
  if(id==='opH')return T('opN')[0];
  if(id==='opV')return T('opN')[1];
  return T('digN')[+id[1]]+' '+T('segN')[LET.indexOf(id[2])];
}
function updateMoveUI(){
  moveEl.textContent=T('moved').replace('{a}',movedQ.length).replace('{b}',maxMove);
  for(var i=0;i<sticks.length;i++)
    sticks[i].el.classList.toggle('moved',sticks[i].slot!==sticks[i].origin);
  syncBoardLabel();
}
/* 판 라벨은 loadProblem 에서 한 번만 세팅돼 성냥을 옮겨도 첫 식 그대로였다.
   role 도 img 라 자식이 통째로 접근성 트리에서 사라졌다 → group + 매번 갱신 */
function syncBoardLabel(){
  var e=parseCurrent();
  var s=e?(''+e.a+e.op+e.b+'='+e.c):T('aMid');
  var txt=T('aBoard').replace('{s}',s);
  board.setAttribute('aria-label',txt);
  $('eqLive').textContent=txt;
  for(var i=0;i<sticks.length;i++)
    sticks[i].el.setAttribute('aria-label',T('aStick').replace('{p}',slotName(sticks[i].slot)));
}
function onStickTap(st){
  if(locked)return;
  ensureAC();
  if(lifted===st){setLift(st,false);lifted=null;SND.cancel();updateSlots();return}
  if(lifted){setLift(lifted,false);lifted=null}
  /* 집는 것만으로는 되돌리지 않는다 — 실제로 놓을 때 개수를 센다 */
  lifted=st;setLift(st,true);SND.pick();updateSlots();
}
function onSlotTap(slotId){
  if(locked||!lifted)return;
  if(posMap[slotId]&&slotId!==lifted.slot)return;
  if(slotId===lifted.slot){setLift(lifted,false);lifted=null;SND.cancel();updateSlots();return}
  moveTo(lifted,slotId,true);lifted=null;
  enforceLimit();updateSlots();updateMoveUI();
}
function toast(txt,sticky){
  msgEl.textContent=txt;msgEl.classList.add('show');
  msgSticky=!!sticky;
  if(toastTimer)clearTimeout(toastTimer);
  if(!sticky)toastTimer=setTimeout(function(){msgEl.classList.remove('show')},2300);
}
function clearToast(){if(toastTimer)clearTimeout(toastTimer);msgEl.classList.remove('show');msgSticky=false}

/* ============================== problem lifecycle ============================== */
function buildJitter(p,pi){
  var rng=mulberry32((seedOf(p.str)+pi*131+7)>>>0),jm={},i;
  for(i=0;i<ALLSLOTS.length;i++)
    jm[ALLSLOTS[i]]={da:(rng()-.5)*4.6,dx:(rng()-.5)*1.8,dy:(rng()-.5)*1.8,flip:rng()<.5?1:-1};
  return jm;
}
function loadProblem(pi){
  pIdx=pi;
  var p=probByStr(state.cur.qs[pi]);
  curP=p;maxMove=p.m;
  sols=solveFor(p);
  jmap=buildJitter(p,pi);
  wrongCount=state.cur.wrong||0;
  lifted=null;locked=false;posMap={};sticks=[];movedQ=[];
  $('inst').innerHTML=T(p.m===2?'inst2':'inst1');
  /* 정답이 여럿인 문제는 미리 알려 준다 — 하나 찾고도 계속 헤매지 않게 */
  noteEl.textContent=p.ans.length>1?T('manyAns'):'';
  noteEl.classList.toggle('hidden',p.ans.length<=1);
  clearToast();
  stickLayer.innerHTML='';fxLayer.innerHTML='';
  bangEl.classList.remove('show');
  var f=filledOf(p),order=[],k;
  for(k in f)order.push(k);
  for(var i=0;i<order.length;i++){
    var sid=order[i];
    var g=mk('g',{'class':'stick',role:'button',tabindex:'0'});
    stickBody(g,jmap[sid].flip);
    g.style.transform=slotTf(sid,jmap,false);
    stickLayer.appendChild(g);
    var st={el:g,slot:sid,origin:sid,flip:jmap[sid].flip};
    posMap[sid]=st;sticks.push(st);
    /* 탭은 board 한 곳에서 거리로 판정한다(onBoardDown).
       여기서는 키보드만 듣는다 — 예전엔 성냥에 pointerdown 만 있어
       키보드로는 성냥을 집을 방법이 아예 없었다 */
    (function(s){
      g.addEventListener('keydown',function(ev){
        if(ev.key!=='Enter'&&ev.key!==' '&&ev.key!=='Spacebar')return;
        ev.preventDefault();ensureAC();gaFirstTouch();onStickTap(s);
      });
    })(st);
    if(!RM&&g.animate){
      g.animate([
        {transform:slotTf(sid,jmap,false).replace(/,\s*([\d.-]+)px\)/,function(m,y){return ', '+(parseFloat(y)-26)+'px)'}),opacity:0},
        {transform:slotTf(sid,jmap,false),opacity:1}
      ],{duration:380,delay:i*26,easing:'cubic-bezier(.34,1.4,.64,1)',fill:'backwards'});
    }
  }
  for(var q=0;q<eqEls.length;q++)eqEls[q].setAttribute('aria-label',T('aEq'));
  updateSlots();
  updateMoveUI();
  updateHintBtn();
  updateProgressUI();
}
function updateHintBtn(){
  /* invis 는 자리를 남긴 채 숨긴다 — display:none 이면 힌트가 나타나는 순간
     검사 버튼이 옆으로 밀려, 방금 검사를 누른 자리가 힌트 버튼이 된다 */
  var show=wrongCount>=3&&sols.length>0;
  if(show&&hintBtn.classList.contains('invis')){
    hintBtn.classList.remove('invis');hintBtn.classList.add('pop-in');
  }else if(!show){
    hintBtn.classList.add('invis');hintBtn.classList.remove('pop-in');
  }
}
function updateProgressUI(){
  var dots=$('dots').children,done=state.cur?state.cur.i:0,i,rn=roundOf(curL);
  for(i=0;i<dots.length;i++){
    dots[i].classList.toggle('off',i>=rn);
    dots[i].classList.toggle('lit',i<rn&&i<done);
    dots[i].classList.toggle('cur',i<rn&&i===pIdx&&i>=done);
  }
  var pl=$('probLabel');
  pl.textContent=T('prob').replace('{n}',pIdx+1).replace('{t}',rn);
  /* 보이는 글자는 짧게, 스크린리더에는 해결 수까지 — #dots 는 aria-hidden */
  pl.setAttribute('aria-label',T('probA').replace('{n}',pIdx+1).replace('{t}',rn).replace('{d}',done));
  $('stageName').textContent=T('stageN').replace('{n}',curL)+' · '+T('stN')[curL-1];
}
function parseCurrent(){
  var set={},k;
  for(k in posMap)set[k]=1;
  return parseSet(set);
}

/* ============================== check ============================== */
function onCheck(){
  if(locked)return;
  ensureAC();
  gaFirstTouch();
  if(lifted){setLift(lifted,false);lifted=null;updateSlots()}
  var e=parseCurrent();
  if(e&&eqTrue(e)){onCorrect();return}
  if(!displacedList().length){toast(T('needMove'));SND.ui();return}
  /* m=2 문제는 1개만 옮겨서는 절대 풀리지 않는다(검증됨) — 오답으로 세지 않고 안내만 */
  if(displacedList().length<maxMove){toast(T('needMore'));SND.ui();return}
  onWrong();
}
function onWrong(){
  wrongCount++;
  state.cur.wrong=wrongCount;
  state.cur.wt=(state.cur.wt||0)+1;
  saveState();
  SND.wrong();
  boardWrap.classList.remove('wiggle');
  void boardWrap.getBoundingClientRect();
  boardWrap.classList.add('wiggle');
  toast(T('wrong')[(wrongCount-1)%3]);
  updateHintBtn();
}
function onCorrect(){
  locked=true;lifted=null;updateSlots();
  markSeen(curL,curP.str);
  state.cur.i=pIdx+1;state.cur.wrong=0;saveState();
  clearToast();
  SND.correct();
  $('bangText').textContent=T('correct');
  bangEl.classList.remove('show');
  void bangEl.getBoundingClientRect();
  bangEl.classList.add('show');
  /* 배너는 aria-hidden 이라 정답을 한 번은 소리 내어 알려 준다 */
  var live=$('eqLive');
  live.setAttribute('aria-live','assertive');
  live.textContent=T('correct');
  setTimeout(function(){live.setAttribute('aria-live','polite')},1200);
  updateProgressUI();
  igniteFX();
  setTimeout(function(){
    if(state.cur.i>=roundOf(curL))finishStage();
    else loadProblem(state.cur.i);
  },1900);
}
/* 한 판(=한 단계 5문제) 완주 */
function finishStage(){
  var wasAll=allCleared(),wt=state.cur?(state.cur.wt||0):0;
  state.cleared[curL-1]=true;
  state.cur=null;
  saveState();
  gaStage(curL,wt);
  doneAll=!wasAll&&allCleared();
  if(doneAll)gaJourney();
  gaS.completed=true;
  gaVoteShow(doneAll?'journey':'stage');
  showDone(true);
}
function returnAll(snd){
  /* 옮긴 것을 전부 되돌린다 — sendHome 이 매번 큐를 줄이므로 루프가 끝난다 */
  while(movedQ.length)sendHome(movedQ[0]);
  if(snd)SND.place();
}
function onReset(){
  if(locked)return;
  ensureAC();
  if(lifted){setLift(lifted,false);lifted=null}
  returnAll(true);
  updateSlots();updateMoveUI();SND.ui();
}
function onHint(){
  if(locked||!sols.length)return;
  ensureAC();
  if(lifted){setLift(lifted,false);lifted=null}
  returnAll(false);
  updateSlots();updateMoveUI();
  /* m=1 이면 rm 이 문자열, m=2 면 배열 — 해당 성냥을 전부 반짝이게 한다 */
  var rm=sols[0].rm,ids=(typeof rm==='string')?[rm]:rm,i;
  for(i=0;i<ids.length;i++)blinkStick(posMap[ids[i]]);
  toast(T('hintOn'));SND.hint();
}
function blinkStick(st){
  if(!st)return;
  st.el.classList.remove('hintblink');
  void st.el.getBoundingClientRect();
  st.el.classList.add('hintblink');
  setTimeout(function(){st.el.classList.remove('hintblink')},2400);
}

/* ============================== fx: sparks + flames ============================== */
function headPos(st){
  var g=SLOT_GEO[st.slot],j=jmap[st.slot];
  var r=(g.ang+j.da)*Math.PI/180;
  return{x:g.x+j.dx+Math.cos(r)*17.5*st.flip,y:g.y+j.dy+Math.sin(r)*17.5*st.flip};
}
function igniteFX(){
  if(RM)return;
  var colors=['#ffdf8a','#ffb84d','#ff8a3d','#e2492f','#fff3c4'];
  var parts=[],i,k;
  for(i=0;i<sticks.length;i++){
    var hp=headPos(sticks[i]);
    var fd=mk('circle',{cx:hp.x,cy:hp.y,r:4.6,fill:'url(#flameG)','class':'flamedot'},fxLayer);
    (function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},1250)})(fd);
    for(k=0;k<3;k++){
      var a=Math.random()*Math.PI*2,sp=26+Math.random()*70;
      parts.push({x:hp.x,y:hp.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-34,
        life:.5+Math.random()*.45,age:0,r:.9+Math.random()*1.7,
        el:mk('circle',{cx:hp.x,cy:hp.y,r:1.5,fill:colors[(Math.random()*colors.length)|0]},fxLayer)});
    }
  }
  var last=performance.now();
  function step(t){
    var dt=Math.min(.05,(t-last)/1000);last=t;
    var alive=false;
    for(var n=0;n<parts.length;n++){
      var p=parts[n];
      if(p.age>=p.life){if(p.el){if(p.el.parentNode)p.el.parentNode.removeChild(p.el);p.el=null}continue}
      alive=true;
      p.age+=dt;p.vy+=170*dt;
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      var q=1-p.age/p.life;
      p.el.setAttribute('cx',p.x);p.el.setAttribute('cy',p.y);
      p.el.setAttribute('r',p.r*q+.3);p.el.setAttribute('opacity',q);
    }
    if(alive)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============================== done overlay ============================== */
function applyDoneText(){
  var nx=curL+1;
  if(doneAll){
    $('doneT').textContent=T('allT');
    $('doneS').textContent=T('allS');
  }else{
    $('doneT').textContent=T('doneT').replace('{n}',curL);
    $('doneS').textContent=nx>STAGES?T('allS'):T('doneS').replace('{s}',T('stN')[nx-1]);
  }
  nextBtn.classList.toggle('hidden',nx>STAGES);
}
/* 오버레이는 opacity:0 + pointer-events:none 로만 숨어 있어서, 게임 중에도
   탭 하면 보이지 않는 '다음 단계/다시 하기/…' 로 포커스가 들어가고
   <h2>1단계 클리어!</h2> 가 늘 스크린리더에 노출됐다 → 닫힐 땐 inert */
var doneBtns=[nextBtn,againBtn,selBtn,$('doneHomeBtn')];
/* 「또 할래?」 두 버튼도 카드 안의 컨트롤이다 — 떠 있을 때만 순환에 넣는다 */
function gaVoteBtns(){
  var el=document.getElementById('gaVote'),out=[],bs,i;
  if(!el||el.hidden||el.classList.contains('done'))return out;
  bs=el.querySelectorAll('[data-choice]');
  for(i=0;i<bs.length;i++)out.push(bs[i]);
  return out;
}
function setDoneReachable(on){
  doneOverlay.setAttribute('aria-hidden',on?'false':'true');
  try{doneOverlay.inert=!on}catch(e){}
  var i,vb=doneOverlay.querySelectorAll('.ga-vote [data-choice]');
  for(i=0;i<doneBtns.length;i++)doneBtns[i].setAttribute('tabindex',on?'0':'-1');
  for(i=0;i<vb.length;i++)vb[i].setAttribute('tabindex',on?'0':'-1');
}
/* 모달이 열린 동안 뒷배경도 막는다. 다만 포커스가 아직 뒤에 있는 사이에
   aria-hidden 을 걸면 '숨긴 영역 안에 포커스' 상태가 되므로,
   포커스를 카드로 옮기는 그 순간에만 켠다. */
var wrapEl=document.querySelector('.wrap');
function setBgInert(on){
  if(!wrapEl)return;
  if(on)wrapEl.setAttribute('aria-hidden','true');
  else wrapEl.removeAttribute('aria-hidden');
  try{wrapEl.inert=!!on}catch(e){}
}
function focusEl(el){
  if(!el)return;
  try{el.focus({preventScroll:true})}catch(e){try{el.focus()}catch(e2){}}
}
function firstDoneBtn(){
  for(var i=0;i<doneBtns.length;i++)
    if(!doneBtns[i].classList.contains('hidden'))return doneBtns[i];
  return null;
}
/* Tab 이 도는 고리 = 보이는 CTA + 떠 있는 투표 버튼 (DOM 순서 그대로) */
function doneFocusList(){
  var list=[],v,i;
  for(i=0;i<doneBtns.length;i++)
    if(!doneBtns[i].classList.contains('hidden'))list.push(doneBtns[i]);
  v=gaVoteBtns();
  for(i=0;i<v.length;i++)list.push(v[i]);
  return list;
}
function showDone(animate){
  doneShown=true;
  applyDoneText();
  scene.classList.remove('blown','instant');
  doneCard.classList.remove('reveal');
  doneOverlay.classList.add('show');
  setDoneReachable(true);
  if(!animate||RM){
    scene.classList.add('instant','blown');
    doneCard.classList.add('reveal');
    setBgInert(true);
    focusEl(firstDoneBtn());
    return;
  }
  SND.done();
  setTimeout(function(){scene.classList.add('blown');blowSound(0)},1150);
  setTimeout(function(){
    doneCard.classList.add('reveal');
    if(doneShown){setBgInert(true);focusEl(firstDoneBtn())}
  },1950);
}
function hideDone(){doneShown=false;doneOverlay.classList.remove('show');setDoneReachable(false);setBgInert(false)}
/* 모달인 동안 포커스를 카드 안에 가둔다 + ESC 로 빠져나갈 길을 준다 */
document.addEventListener('keydown',function(ev){
  if(!doneShown)return;
  if(ev.key==='Escape'){ev.preventDefault();SND.ui();showStageSelect();return}
  if(ev.key!=='Tab')return;
  var list=doneFocusList();
  if(!list.length)return;
  var at=list.indexOf(document.activeElement);
  ev.preventDefault();
  if(at<0)at=ev.shiftKey?0:-1;
  focusEl(list[(at+(ev.shiftKey?-1:1)+list.length)%list.length]);
});

/* ============================== 화면 전환 ============================== */
/* 화면을 바꾸면 포커스가 body 로 떨어져 스크린리더가 어디로 갔는지 알 수 없었다 */
function enterGame(focus){
  hideDone();
  stageView.classList.add('hidden');
  gameView.classList.remove('hidden');
  if(focus)focusEl($('inst'));
}
function startStage(lv,focus){
  curL=lv;
  state.cur={L:lv,i:0,wrong:0,wt:0,qs:pickRound(lv)};
  saveState();
  enterGame(focus);
  loadProblem(0);
  /* focus=false 는 부팅 진입 뿐이다 — 그 때는 첫 조작까지 미룬다 */
  if(focus)gaRoundStart('stage');else gaRoundArm('stage');
}
function resumeStage(focus){
  curL=state.cur.L;
  enterGame(focus);
  loadProblem(state.cur.i);
  if(focus)gaRoundStart('stage',true);else gaRoundArm('stage');
}
function showStageSelect(){
  hideDone();
  gameView.classList.add('hidden');
  stageView.classList.remove('hidden');
  buildStageList();
  focusEl($('selT'));
}
function buildStageList(){
  var host=$('stages'),open=maxOpen(),i;
  host.innerHTML='';
  for(i=1;i<=STAGES;i++)host.appendChild(stageBtn(i,i<=open));
}
function stageBtn(lv,unlocked){
  var cleared=!!state.cleared[lv-1];
  /* 풀던 판이 남아 있으면 새로 짜지 않고 이어서 — 4문제 풀고 나갔다 돌아오면
     startStage 가 state.cur 를 덮어써서 진행이 통째로 날아갔다 */
  var resume=unlocked&&!!state.cur&&state.cur.L===lv;
  var desc=unlocked?(resume?T('resumeT'):T('stD')[lv-1]):T('lockT');
  var b=document.createElement('button');
  b.className='stage-btn'+(unlocked?'':' locked')+(cleared?' done':'');
  b.innerHTML='<span class="st-no"></span><span class="st-txt"><b></b><i></i></span>'+
    '<span class="st-mark" aria-hidden="true"></span>';
  b.querySelector('.st-no').textContent=lv;
  b.querySelector('.st-txt b').textContent=T('stN')[lv-1];
  /* 잠긴 단계도 목록에 남긴다 — 도감이 아니라 진행 사다리라 회색 자리가 있어도 된다 */
  b.querySelector('.st-txt i').textContent=desc;
  b.querySelector('.st-mark').textContent=resume?'▶':(cleared?'🔥':(unlocked?'':'🔒'));
  b.setAttribute('aria-label',T('aStage').replace('{n}',lv)
    .replace('{t}',T('stN')[lv-1]).replace('{d}',desc));
  if(unlocked){
    b.addEventListener('click',function(){
      ensureAC();SND.ui();
      if(resume)resumeStage(true);else startStage(lv,true);
    });
  }else{
    /* disabled 로 두면 키보드·스크린리더가 잠금 사유조차 읽지 못한다.
       사유 문구는 버튼 안에 이미 있으므로(#msg 는 게임 화면에 있어 여기선 안 보인다)
       누르면 흔들어서 '눌리지 않았다'만 알린다 */
    b.setAttribute('aria-disabled','true');
    b.addEventListener('click',function(){
      ensureAC();SND.ui();
      b.classList.remove('wiggle');void b.getBoundingClientRect();b.classList.add('wiggle');
    });
    b.addEventListener('animationend',function(){b.classList.remove('wiggle')});
  }
  return b;
}

/* ============================== i18n apply ============================== */
function applyLang(){
  document.documentElement.lang=lang;
  document.title=T('title');
  $('titleH').textContent=T('title');
  $('subH').textContent=T('sub');
  $('homeBtn').textContent=T('home');
  $('inst').innerHTML=T(maxMove===2?'inst2':'inst1');
  checkBtn.textContent=T('check');
  hintBtn.textContent=T('hint');
  resetBtn.textContent=T('reset');
  backSel.textContent=T('back');
  $('selT').textContent=T('selT');
  $('bangText').textContent=T('correct');
  $('foot').textContent=T('foot');
  if(curP)noteEl.textContent=curP.ans.length>1?T('manyAns'):'';
  applyDoneText();
  nextBtn.textContent=T('next');
  againBtn.textContent=T('again');
  selBtn.textContent=T('toSel');
  $('doneHomeBtn').textContent=T('toHome');
  $('blowX').textContent=T('blow');
  langBtn.textContent=FLAGS[lang];
  /* 라벨이 'language'/'sound' 로 고정이라 언어를 바꿔도 소리를 꺼도 그대로였다 */
  langBtn.setAttribute('aria-label',T('aLang').replace('{l}',LANGNAME[lang]));
  syncSndBtn();
  updateSlots();
  updateMoveUI();
  updateProgressUI();
  buildStageList();
  gaVoteLang();
  clearToast();
}
function syncSndBtn(){
  sndBtn.textContent=sndOn?'🔊':'🔇';
  sndBtn.setAttribute('aria-label',T('aSnd'));
  sndBtn.setAttribute('aria-pressed',sndOn?'true':'false');
}

/* ============================== wiring ============================== */
board.addEventListener('pointerdown',onBoardDown);
checkBtn.addEventListener('click',onCheck);
resetBtn.addEventListener('click',onReset);
hintBtn.addEventListener('click',onHint);
boardWrap.addEventListener('animationend',function(){boardWrap.classList.remove('wiggle')});
langBtn.addEventListener('click',function(){
  lang=LANGS[(LANGS.indexOf(lang)+1)%3];
  lsSet('in9-lang',lang);
  applyLang();SND.ui();
});
sndBtn.addEventListener('click',function(){
  sndOn=!sndOn;
  lsSet('in9-matchstick-snd',sndOn?'1':'0');
  syncSndBtn();
  if(sndOn){ensureAC();SND.ui()}
});
/* 같은 단계를 다시 — 판을 새로 짜므로 안 본 문제가 남아 있으면 새 문제가 나온다 */
againBtn.addEventListener('click',function(){
  ensureAC();SND.ui();
  hideDone();
  setTimeout(function(){startStage(curL,true)},120);
});
nextBtn.addEventListener('click',function(){
  ensureAC();SND.ui();
  var nx=curL+1;
  hideDone();
  if(nx>STAGES){showStageSelect();return}
  setTimeout(function(){startStage(nx,true)},120);
});
selBtn.addEventListener('click',function(){ensureAC();SND.ui();showStageSelect()});
backSel.addEventListener('click',function(){ensureAC();SND.ui();showStageSelect()});
document.addEventListener('pointerdown',function(){ensureAC()},{once:true,capture:true});

/* ============================== boot ============================== */
setDoneReachable(false);
applyLang();
/* 부팅에서는 포커스를 옮기지 않는다 — 사용자가 시작한 이동이 아니라서 */
if(state.cur){
  resumeStage(false);
}else if(!state.cleared[0]){
  /* 첫 방문이면 선택 화면에서 헤매지 않게 1단계를 바로 시작 */
  startStage(1,false);
}else{
  gameView.classList.add('hidden');
  stageView.classList.remove('hidden');
  buildStageList();
}
})();
</script>
