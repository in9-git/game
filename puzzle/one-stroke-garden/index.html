function distSeg(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y;
  const L2=dx*dx+dy*dy;
  if(L2===0)return Math.hypot(p.x-a.x,p.y-a.y);

  return Math.hypot(p.x-(a.x+dx*t),p.y-(a.y+dy*t));

/* ---------------- sound ---------------- */
const Snd=(function(){
  let ctx=null,master=null;
  let on=store.get('osg-sound')!=='0';
  function ensure(){
    try{
      if(!ctx){
        const AC=window.AudioContext||window.webkitAudioContext;
        if(!AC)return;
        ctx=new AC();
        master=ctx.createGain();
        master.gain.value=0.6;
        master.connect(ctx.destination);
      }
      if(ctx.state==='suspended')ctx.resume();
    }catch(e){}
  }
  function tone(f,opt){
    if(!on)return;
    ensure();
    if(!ctx)return;
    opt=opt||{};
    const type=opt.type||'sine',dur=opt.dur||0.35,vol=opt.vol||0.1,at=opt.at||0,slide=opt.slide||0;
    const t0=ctx.currentTime+at;
    const o=ctx.createOscillator();
    o.type=type;
    o.frequency.setValueAtTime(f,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t0+dur*0.9);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.018);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(master);
    o.start(t0);o.stop(t0+dur+0.06);
  }
  function shimmer(at,dur,vol){
    if(!on)return;
    ensure();
    if(!ctx)return;
    const t0=ctx.currentTime+(at||0);
    dur=dur||0.7;vol=vol||0.05;
    const len=Math.floor(ctx.sampleRate*dur);
    const buf=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
    const src=ctx.createBufferSource();
    src.buffer=buf;
    const bp=ctx.createBiquadFilter();
    bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=1.2;
    const g=ctx.createGain();g.gain.value=vol;
    src.connect(bp);bp.connect(g);g.connect(master);
    src.start(t0);
  }
  const SCALE=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98,1760,2093,2349.32,2637];
  return{
    ensure:ensure,
    get on(){return on},
    toggle(){on=!on;store.set('osg-sound',on?'1':'0');if(on){ensure();tone(660,{vol:0.06,dur:0.15})}return on},
    tap(){tone(660,{vol:0.05,dur:0.1});},
    step(i){
      const f=SCALE[clamp(i,0,SCALE.length-1)];
      tone(f,{vol:0.085,dur:0.42});
      tone(f*2,{vol:0.018,dur:0.24,type:'triangle'});
    },
    undo(){tone(392,{vol:0.045,dur:0.18,slide:-70,type:'triangle'})},
    nudge(){tone(255,{vol:0.035,dur:0.12,type:'triangle'})},
    dead(){
      tone(233,{vol:0.05,dur:0.16,type:'triangle'});
      tone(207,{vol:0.05,dur:0.22,at:0.14,type:'triangle'});
    },
    bloom(){
      const arp=[523.25,659.25,783.99,1046.5,1318.51];
      for(let i=0;i<arp.length;i++)tone(arp[i],{vol:0.075,dur:0.5,at:i*0.09});
      shimmer(0.18,0.8,0.045);
    },
    finale(){
      const chord=[349.23,440,523.25,698.46];
      for(let i=0;i<chord.length;i++)tone(chord[i],{vol:0.055,dur:1.6,at:i*0.05});
      const chime=[1318.51,1567.98,1760,2093];
      for(let i=0;i<chime.length;i++)tone(chime[i],{vol:0.04,dur:0.7,at:0.5+i*0.22,type:'triangle'});
      shimmer(0.4,1.4,0.05);
    }
  };
})();

/* ---------------- daily puzzle generation ---------------- */
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daySeed(){
  const d=new Date();
  return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function tryGen(rng,n,ch){
  const base=rng()*TAU;
  const nodes=[];
  for(let i=0;i<n;i++){
    const a=base+i*TAU/n+(rng()-0.5)*(TAU/n)*0.45;
    const r=0.355+rng()*0.1;
    nodes.push({x:0.5+Math.cos(a)*r,y:0.5+Math.sin(a)*r*0.97});
  }
  const edges=[];
  const eset=new Set();
  function has(a,b){return eset.has(ek(a,b))}
  function add(a,b){
    const k=ek(a,b);
    if(eset.has(k))return false;
    eset.add(k);edges.push([a,b]);return true;
  }
  function removeEdge(a,b){
    eset.delete(ek(a,b));
    for(let i=0;i<edges.length;i++){
      const e=edges[i];
      if((e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a)){edges.splice(i,1);return}
    }
  }
  function clearOf(a,b){
    for(let k=0;k<n;k++){
      if(k===a||k===b)continue;
      if(distSeg(nodes[k],nodes[a],nodes[b])<0.093)return false;
    }
    return true;
  }
  for(let i=0;i<n;i++)add(i,(i+1)%n);
  const cand=[];
  for(let i=0;i<n;i++)for(let j=i+2;j<n;j++){
    if(i===0&&j===n-1)continue;
    cand.push([i,j]);
  }
  shuffle(cand,rng);
  const chords=[];
  for(let c=0;c<cand.length&&chords.length<ch;c++){
    const a=cand[c][0],b=cand[c][1];
    if(has(a,b))continue;
    if(!clearOf(a,b))continue;
    add(a,b);chords.push([a,b]);
  }
  for(let guard=0;guard<24;guard++){
    const deg=new Array(n).fill(0);
    for(let i=0;i<edges.length;i++){deg[edges[i][0]]++;deg[edges[i][1]]++}
    const odd=[];
    for(let i=0;i<n;i++)if(deg[i]%2)odd.push(i);
    if(odd.length<=2)break;
    let added=false;
    shuffle(odd,rng);
    for(let i=0;i<odd.length&&!added;i++){
      for(let j=i+1;j<odd.length&&!added;j++){
        const a=odd[i],b=odd[j];
        if(has(a,b))continue;
        if(!clearOf(a,b))continue;
        add(a,b);chords.push([a,b]);added=true;
      }
    }
    if(!added){
      const c=chords.pop();
      if(!c)return null;
      removeEdge(c[0],c[1]);
    }
  }
  const deg=new Array(n).fill(0);
  for(let i=0;i<edges.length;i++){deg[edges[i][0]]++;deg[edges[i][1]]++}
  const odd=[];
  for(let i=0;i<n;i++)if(deg[i]%2)odd.push(i);
  if(odd.length!==0&&odd.length!==2)return null;
  const bow={};
  for(let i=0;i<edges.length;i++)bow[ek(edges[i][0],edges[i][1])]=(rng()-0.5)*0.16;
  return{n:n,nodes:nodes,edges:edges,bow:bow};
}
function genDaily(){
  const rng=mulberry32(daySeed());
  const cfgs=[
    [5,1],
    [6,1],
    [7,2],
    [8,2],
    [rng()<0.5?9:10,3]
  ];
  const out=[];
  for(let p=0;p<5;p++){
    let pz=null;
    for(let att=0;att<60&&!pz;att++)pz=tryGen(rng,cfgs[p][0],cfgs[p][1]);
    if(!pz)pz=tryGen(rng,cfgs[p][0],0);
    out.push(pz);
  }
  return out;
}

/* ---------------- game state ---------------- */
const cv=$('#cv');
const ctx=cv.getContext('2d');
const wrapEl=$('#boardWrap');
let W=320,H=320,DPR=1,nodeR=14,snapR=30;
let puzzles=[],idx=0,puzzle=null,adj=[],layout=[];
let paperCv=null;
let path=[],pathEdges=[],used=new Map(),visited=new Set();
let stateName='play'; // play | celebrate | banner | final
let dragging=false,activePtr=null,pointerPos=null;
let shakeAt=-1e9,headPulseAt=-1e9,completeFxAt=-1e9;
let deadToken=0,deadEndCount=0,stickyHint=false;
let toastTimer=0;
let done=[false,false,false,false,false],replay=false;
let particles=[],ambient=[];
const PETALS=['#f7b9c9','#f4a4b8','#f9cdd8','#ef93ab','#fce4ea'];

function buildAdj(){
  adj=[];
  for(let i=0;i<puzzle.n;i++)adj.push([]);
  for(let i=0;i<puzzle.edges.length;i++){
    const a=puzzle.edges[i][0],b=puzzle.edges[i][1],k=ek(a,b);
    adj[a].push({to:b,key:k});
    adj[b].push({to:a,key:k});
  }
}
function makePaper(){
  paperCv=document.createElement('canvas');
  paperCv.width=Math.max(2,Math.floor(W*DPR));
  paperCv.height=Math.max(2,Math.floor(H*DPR));
  const p=paperCv.getContext('2d');
  p.scale(DPR,DPR);
  const g=p.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#fbf6ea');
  g.addColorStop(0.6,'#f8f1e0');
  g.addColorStop(1,'#f3e9d3');
  p.fillStyle=g;
  p.fillRect(0,0,W,H);
  for(let i=0;i<4;i++){
    const x=Math.random()*W,y=Math.random()*H,r=40+Math.random()*90;
    const rg=p.createRadialGradient(x,y,0,x,y,r);
    const pinkish=Math.random()<0.5;
    rg.addColorStop(0,pinkish?'rgba(239,147,171,0.05)':'rgba(90,80,100,0.035)');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    p.fillStyle=rg;
    p.beginPath();p.arc(x,y,r,0,TAU);p.fill();
  }
  for(let i=0;i<130;i++){
    p.fillStyle=Math.random()<0.5?'rgba(70,60,80,0.03)':'rgba(255,255,255,0.05)';
    const s=Math.random()*2+0.5;
    p.fillRect(Math.random()*W,Math.random()*H,s,s);
  }
}
function fit(){
  if(!puzzle)return;
  const w=wrapEl.clientWidth;
  if(w<10)return;
  const h=Math.max(280,Math.min(Math.round(w*1.0),560,window.innerHeight-290));
  W=w;H=h;
  DPR=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.floor(W*DPR);
  cv.height=Math.floor(H*DPR);
  cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  nodeR=clamp(Math.min(W,H)*0.045,11,19);
  snapR=nodeR*2.2;
  const pad=nodeR*2.4+8;
  layout=[];
  for(let i=0;i<puzzle.n;i++){
    layout.push({
      x:pad+puzzle.nodes[i].x*(W-pad*2),
      y:pad+puzzle.nodes[i].y*(H-pad*2)
    });
  }
  makePaper();
  if(!RM&&ambient.length===0){
    for(let i=0;i<7;i++)ambient.push(newAmbient(true));
  }
}
function newAmbient(anyY){
  return{
    x:Math.random()*W,
    y:anyY?Math.random()*H:-12,
    vy:14+Math.random()*18,
    ph:Math.random()*TAU,
    sway:14+Math.random()*18,
    rot:Math.random()*TAU,
    vr:(Math.random()-0.5)*2,
    s:4.5+Math.random()*3.5,
    ci:Math.floor(Math.random()*PETALS.length),
    al:0.35+Math.random()*0.25
  };
}
function qpoint(a,b,key,t){
  const A=layout[a],B=layout[b];
  const bw=puzzle.bow[key]||0;
  const dx=B.x-A.x,dy=B.y-A.y;
  const cx=(A.x+B.x)/2-dy*bw;
  const cy=(A.y+B.y)/2+dx*bw;
  const u=1-t;
  return{
    x:u*u*A.x+2*u*t*cx+t*t*B.x,
    y:u*u*A.y+2*u*t*cy+t*t*B.y
  };
}
function edgeLen(a,b){
  const A=layout[a],B=layout[b];
  return Math.hypot(B.x-A.x,B.y-A.y);
}
function makeFlowers(a,b,key){
  const len=edgeLen(a,b);
  const count=clamp(Math.round(len/(nodeR*2.0)),2,5);
  const flowers=[];
  const now=performance.now();
  for(let i=0;i<count;i++){
    const t=0.16+(0.68*(i+0.5))/count+(Math.random()-0.5)*0.07;
    flowers.push({
      t:clamp(t,0.12,0.88),
      s:0.55+Math.random()*0.35,
      rot:Math.random()*TAU,
      ci:Math.floor(Math.random()*PETALS.length),
      born:now+i*70
    });
  }
  return{a:a,b:b,flowers:flowers};
}

/* ---------------- particles ---------------- */
function spawnPetal(x,y,opt){
  if(particles.length>230)return;
  opt=opt||{};
  particles.push({
    x:x,y:y,
    vx:(opt.vx!==undefined?opt.vx:(Math.random()-0.5)*40),
    vy:(opt.vy!==undefined?opt.vy:-20-Math.random()*30),
    rot:Math.random()*TAU,
    vr:(Math.random()-0.5)*6,
    s:opt.s||(4+Math.random()*4),
    life:0,
    ttl:opt.ttl||(1.2+Math.random()*0.8),
    c:opt.c||PETALS[Math.floor(Math.random()*PETALS.length)]
  });
}
function spawnEdgePetals(key){
  if(RM)return;
  const info=used.get(key);
  if(!info)return;
  const cnt=8+Math.floor(Math.random()*5);
  for(let i=0;i<cnt;i++){
    const p=qpoint(info.a,info.b,key,Math.random());
    spawnPetal(p.x,p.y);
  }
}
function scatterEdge(key){
  if(RM)return;
  const info=used.get(key);
  if(!info)return;
  for(let i=0;i<info.flowers.length;i++){
    const f=info.flowers[i];
    const p=qpoint(info.a,info.b,key,f.t);
    spawnPetal(p.x,p.y,{c:'#d9c3cc',vy:10+Math.random()*20,ttl:0.9});
  }
}
function burstAll(){
  if(RM)return;
  used.forEach(function(info,key){
    for(let i=0;i<info.flowers.length;i++){
      const f=info.flowers[i];
      const p=qpoint(info.a,info.b,key,f.t);
      spawnPetal(p.x,p.y,{vy:-40-Math.random()*50,vx:(Math.random()-0.5)*90,ttl:1.8});
      spawnPetal(p.x,p.y,{vy:-15-Math.random()*35,vx:(Math.random()-0.5)*70,ttl:2});
    }
  });
  for(let i=0;i<layout.length;i++){
    for(let j=0;j<3;j++)spawnPetal(layout[i].x,layout[i].y,{ttl:1.6});
  }
}

/* ---------------- drawing ---------------- */
function drawPetalShape(x,y,rot,s,color,alpha){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.ellipse(0,0,s*0.64,s*0.42,0,0,TAU);
  ctx.fill();
  ctx.globalAlpha=alpha*0.5;
  ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.ellipse(-s*0.16,-s*0.1,s*0.26,s*0.16,0,0,TAU);
  ctx.fill();
  ctx.restore();
}
function drawBlossom(x,y,r,rot,ci,scale){
  if(scale<=0.02)return;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.scale(scale,scale);
  ctx.fillStyle=PETALS[ci];
  for(let i=0;i<5;i++){
    ctx.rotate(TAU/5);
    ctx.beginPath();
    ctx.ellipse(0,-r*0.52,r*0.35,r*0.52,0,0,TAU);
    ctx.fill();
  }
  ctx.fillStyle='rgba(231,139,166,0.85)';
  ctx.beginPath();ctx.arc(0,0,r*0.24,0,TAU);ctx.fill();
  ctx.fillStyle='#e9bb55';
  ctx.beginPath();ctx.arc(0,0,r*0.13,0,TAU);ctx.fill();
  ctx.restore();
}
function drawEdgePath(a,b,key){
  const A=layout[a],B=layout[b];
  const bw=puzzle.bow[key]||0;
  const dx=B.x-A.x,dy=B.y-A.y;
  const cx=(A.x+B.x)/2-dy*bw;
  const cy=(A.y+B.y)/2+dx*bw;
  ctx.beginPath();
  ctx.moveTo(A.x,A.y);
  ctx.quadraticCurveTo(cx,cy,B.x,B.y);
}
function render(now){
  ctx.clearRect(0,0,W,H);
  if(paperCv)ctx.drawImage(paperCv,0,0,W,H);
  ctx.save();
  // shake
  const sh=now-shakeAt;
  if(sh>=0&&sh<450&&!RM){
    const k=1-sh/450;
    ctx.translate(Math.sin(sh*0.09)*5*k,Math.sin(sh*0.075)*2.5*k);
  }
  ctx.lineCap='round';
  ctx.lineJoin='round';
  // edges
  for(let i=0;i<puzzle.edges.length;i++){
    const a=puzzle.edges[i][0],b=puzzle.edges[i][1],key=ek(a,b);
    const info=used.get(key);
    if(!info){
      ctx.strokeStyle='rgba(53,47,63,0.16)';
      ctx.lineWidth=nodeR*0.5;
      drawEdgePath(a,b,key);ctx.stroke();
      ctx.strokeStyle='rgba(53,47,63,0.78)';
      ctx.lineWidth=nodeR*0.2;
      drawEdgePath(a,b,key);ctx.stroke();
    }else{
      ctx.strokeStyle='rgba(244,167,188,0.3)';
      ctx.lineWidth=nodeR*0.72;
      drawEdgePath(a,b,key);ctx.stroke();
      ctx.strokeStyle='rgba(233,140,167,0.55)';
      ctx.lineWidth=nodeR*0.22;
      drawEdgePath(a,b,key);ctx.stroke();
    }
  }
  // stroke preview
  if(dragging&&pointerPos&&path.length>0&&stateName==='play'){
    const hd=layout[path[path.length-1]];
    ctx.strokeStyle='rgba(53,47,63,0.22)';
    ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(hd.x,hd.y);
    ctx.lineTo(pointerPos.x,pointerPos.y);
    ctx.stroke();
    drawPetalShape(pointerPos.x,pointerPos.y,now*0.002,nodeR*0.42,PETALS[2],0.8);
  }
  // nodes
  const headIdx=path.length?path[path.length-1]:-1;
  for(let i=0;i<puzzle.n;i++){
    const P=layout[i];
    const isHead=i===headIdx;
    const isVis=visited.has(i);
    if(isHead&&stateName==='play'){
      const pr=nodeR*(1.5+(RM?0:0.14*Math.sin(now/280)));
      ctx.strokeStyle='rgba(233,140,167,0.55)';
      ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(P.x,P.y,pr,0,TAU);ctx.stroke();
    }
    ctx.fillStyle=isVis?'#fbdce6':'#fdfaf2';
    ctx.strokeStyle=isVis?'rgba(201,100,127,0.85)':'rgba(53,47,63,0.85)';
    ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(P.x,P.y,nodeR,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle=isVis?'rgba(201,100,127,0.9)':'rgba(53,47,63,0.8)';
    ctx.beginPath();ctx.arc(P.x,P.y,nodeR*0.28,0,TAU);ctx.fill();
  }
  // invalid tap flash on head
  const hp=now-headPulseAt;
  if(hp>=0&&hp<600&&headIdx>=0){
    const P=layout[headIdx];
    const k=hp/600;
    ctx.strokeStyle='rgba(233,140,167,'+(0.6*(1-k))+')';
    ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(P.x,P.y,nodeR*(1.4+k*1.6),0,TAU);ctx.stroke();
  }
  // flowers
  const fx=now-completeFxAt;
  used.forEach(function(info,key){
    for(let i=0;i<info.flowers.length;i++){
      const f=info.flowers[i];
      const p=qpoint(info.a,info.b,key,f.t);
      let sc=RM?1:easeOutBack((now-f.born)/500);
      if(f.born>now)sc=0;
      if(fx>=0&&fx<1300&&!RM){
        sc*=1+0.22*Math.sin(Math.min(fx/1300,1)*Math.PI)*Math.sin(now/140+i);
      }
      drawBlossom(p.x,p.y,nodeR*0.62*f.s,f.rot+(RM?0:now*0.00012),f.ci,sc);
    }
  });
  // start marker blossom
  if(path.length>0){
    const S=layout[path[0]];
    drawBlossom(S.x,S.y,nodeR*0.45,0,0,1);
  }
  // particles
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    const a=clamp(1-p.life/p.ttl,0,1);
    drawPetalShape(p.x,p.y,p.rot,p.s,p.c,a*0.9);
  }
  // ambient
  for(let i=0;i<ambient.length;i++){
    const p=ambient[i];
    drawPetalShape(p.x,p.y,p.rot,p.s,PETALS[p.ci],p.al);
  }
  // celebrate flash
  if(fx>=0&&fx<1300){
    const k=Math.sin(Math.min(fx/1300,1)*Math.PI);
    ctx.fillStyle='rgba(246,180,200,'+(k*0.16)+')';
    ctx.fillRect(-10,-10,W+20,H+20);
  }
  ctx.restore();
}
let lastT=0;
function tick(now){
  const dt=Math.min((now-lastT)/1000,0.05);
  lastT=now;
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life+=dt;
    if(p.life>=p.ttl){particles.splice(i,1);continue}
    p.vy+=55*dt;
    p.vx*=0.99;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.rot+=p.vr*dt;
  }
  if(!RM){
    for(let i=0;i<ambient.length;i++){
      const p=ambient[i];
      p.ph+=dt*0.9;
      p.y+=p.vy*dt;
      p.x+=Math.sin(p.ph)*p.sway*dt;
      p.rot+=p.vr*dt;
      if(p.y>H+14)ambient[i]=newAmbient(false);
    }
  }
  render(now);
  requestAnimationFrame(tick);
}

/* ---------------- interaction ---------------- */
function toLocal(e){
  const r=cv.getBoundingClientRect();
  return{x:e.clientX-r.left,y:e.clientY-r.top};
}
function nodeAt(p){
  let bi=-1,bd=1e9;
  for(let i=0;i<puzzle.n;i++){
    const d=Math.hypot(p.x-layout[i].x,p.y-layout[i].y);
    if(d<bd){bd=d;bi=i}
  }
  return bd<=snapR?bi:-1;
}
function startPath(i){
  path=[i];pathEdges=[];used=new Map();visited=new Set([i]);
  clearDead();
  Snd.tap();
  updateHint();
  /* 하루치 정원 한 판의 시작(첫 획)에서만 — 이후 획은 t0을 되감지 않는다 */
  if(!gaS.started||gaS.completed)gaRoundStart('daily');
}
function traverse(to){
  const head=path[path.length-1];
  const key=ek(head,to);
  used.set(key,makeFlowers(head,to,key));
  path.push(to);
  pathEdges.push(key);
  visited.add(to);
  spawnEdgePetals(key);
  Snd.step(path.length-2);
  updateHint();
  checkAfterMove();
}
function undoStep(){
  if(path.length<2)return;
  clearDead();
  const key=pathEdges.pop();
  scatterEdge(key);
  used.delete(key);
  const rem=path.pop();
  if(path.indexOf(rem)<0)visited.delete(rem);
  Snd.undo();
  updateHint();
}
function clearDead(){deadToken++}
function scheduleDead(){
  const token=++deadToken;
  setTimeout(function(){
    if(token!==deadToken||stateName!=='play')return;
    shakeAt=performance.now();
    Snd.dead();
    toast(L('deadEnd'));
    setTimeout(function(){
      if(token!==deadToken||stateName!=='play')return;
      undoStep();
      deadEndCount++;
      if(deadEndCount>=3)stickyHint=true;
      updateHint();
    },430);
  },330);
}
function checkAfterMove(){
  if(used.size===puzzle.edges.length){finishPuzzle();return}
  const head=path[path.length-1];
  let free=false;
  for(let i=0;i<adj[head].length;i++){
    if(!used.has(adj[head][i].key)){free=true;break}
  }
  if(!free)scheduleDead();
}
function handlePoint(p,isDown){
  const ni=nodeAt(p);
  if(path.length===0){
    if(ni>=0)startPath(ni);
    return;
  }
  if(ni<0)return;
  const head=path[path.length-1];
  if(ni===head)return;
  const prev=path.length>1?path[path.length-2]:-1;
  if(ni===prev&&pathEdges.length&&pathEdges[pathEdges.length-1]===ek(head,prev)){
    undoStep();
    return;
  }
  const key=ek(head,ni);
  let isAdj=false;
  for(let i=0;i<adj[head].length;i++){
    if(adj[head][i].to===ni){isAdj=true;break}
  }
  if(isAdj&&!used.has(key)){
    traverse(ni);
    return;
  }
  if(isDown){
    if(path.length===1){startPath(ni)}
    else{headPulseAt=performance.now();Snd.nudge()}
  }
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  Snd.ensure();
  if(stateName!=='play')return;
  if(activePtr!==null)return;
  activePtr=e.pointerId;
  dragging=true;
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  const p=toLocal(e);
  pointerPos=p;
  handlePoint(p,true);
});
cv.addEventListener('pointermove',function(e){
  if(e.pointerId!==activePtr||!dragging)return;
  e.preventDefault();
  if(stateName!=='play')return;
  const p=toLocal(e);
  pointerPos=p;
  handlePoint(p,false);
});
function endPtr(e){
  if(e.pointerId!==activePtr)return;
  activePtr=null;dragging=false;pointerPos=null;
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('contextmenu',function(e){e.preventDefault()});

/* ---------------- flow ---------------- */
const progEl=$('#progress'),hintEl=$('#hint'),pnameEl=$('#pname');
const bannerEl=$('#banner'),bannerName=$('#bannerName');
const finalEl=$('#final'),finNote=$('#finNote');
let finVariant='done';
function toast(msg){
  clearTimeout(toastTimer);
  hintEl.textContent=msg;
  hintEl.classList.remove('toast');
  void hintEl.offsetWidth;
  hintEl.classList.add('toast');
  toastTimer=setTimeout(function(){
    hintEl.classList.remove('toast');
    updateHint();
  },1700);
}
function updateHint(){
  if(hintEl.classList.contains('toast'))return;
  if(stickyHint&&path.length===0)hintEl.textContent=L('tryOtherStart');
  else if(path.length===0)hintEl.textContent=L('tapToStart');
  else hintEl.textContent=L('keepGoing');
}
function renderProgress(){
  progEl.innerHTML='';
  for(let i=0;i<5;i++){
    const d=document.createElement('div');
    d.className='slot'+(done[i]?' done':'')+(i===idx&&!done[i]&&stateName!=='final'?' active':'');
    d.textContent=done[i]?'🌸':'·';
    progEl.appendChild(d);
  }
}
const NAMES={ko:'한 붓 정원',ja:'一筆の庭',en:'One-Stroke Garden'};
function refreshTexts(){
  document.documentElement.lang=lang;
  $('#titleMain').textContent=NAMES[lang];
  $('#titleSub').textContent=['ko','ja','en'].filter(l=>l!==lang).map(l=>NAMES[l]).join(' · ');
  $$('[data-i]').forEach(function(el){el.textContent=L(el.dataset.i)});
  $('#langBtn').textContent=LANG_FLAG[lang];
  $('#langBtn').setAttribute('aria-label',L('langAria'));
  $('#sndBtn').setAttribute('aria-label',Snd.on?L('soundOn'):L('soundOff'));
  const loc={ko:'ko-KR',ja:'ja-JP',en:'en-US'}[lang];
  let ds='';
  try{ds=new Intl.DateTimeFormat(loc,{month:'long',day:'numeric'}).format(new Date())}catch(e){ds=todayStr()}
  $('#dateLab').textContent=L('dateLabel').replace('{date}',ds);
  if(puzzle){
    pnameEl.innerHTML='';
    const lab=document.createTextNode(L('gardenLabel').replace('{n}',idx+1).replace('{m}',5)+' · ');
    const b=document.createElement('b');
    b.textContent=L('names')[idx];
    pnameEl.appendChild(lab);pnameEl.appendChild(b);
    bannerName.textContent=L('names')[idx];
  }
  finNote.textContent=finVariant==='already'?L('finalAlready'):L('finalDone');
  hintEl.classList.remove('toast');
  updateHint();
  if(typeof gaS!=='undefined'&&gaS&&gaS.voteShown&&!gaS.voted)gaVoteShow(gaS.voteScene);
}
function loadPuzzle(){
  puzzle=puzzles[idx];
  buildAdj();
  path=[];pathEdges=[];used=new Map();visited=new Set();
  particles=[];
  deadEndCount=0;stickyHint=false;
  clearDead();
  completeFxAt=-1e9;shakeAt=-1e9;headPulseAt=-1e9;
  dragging=false;activePtr=null;pointerPos=null;
  bannerEl.classList.remove('show');
  fit();
  refreshTexts();
  renderProgress();
}
function saveProgress(){
  store.set('osg-daily',JSON.stringify({v:1,d:todayStr(),done:done}));
}
function loadProgress(){
  try{
    const raw=store.get('osg-daily');
    if(!raw)return;
    const o=JSON.parse(raw);
    if(o&&o.d===todayStr()&&Array.isArray(o.done)&&o.done.length===5){
      done=o.done.map(function(x){return!!x});
    }
  }catch(e){}
}
/* ---- GA4 portal standard v1 (2026-08-19) ---- */
var GA_GAME='one-stroke-garden';
var gaS={started:false,completed:false,voted:false,voteShown:false,voteScene:'main',t0:0};
function gaLang(){ try{ return lang||'ko'; }catch(e){ return 'ko'; } }
function gaSend(name,p){ try{ if(typeof gtag!=='function')return; p=p||{}; p.game_id=GA_GAME; if(!p.lang)p.lang=gaLang(); gtag('event',name,p);}catch(e){} }
function gaRoundStart(scene){
  gaS.t0=Date.now();
  if(gaS.completed){ gaS.completed=false; gaSend('game_step',{step:'replay',scene:scene||'main'}); return; }
  if(gaS.started)return; gaS.started=true; gaSend('game_step',{step:'start',scene:scene||'main'});
}
function gaRoundComplete(scene,result,extra){
  if(gaS.completed)return; gaS.completed=true;
  var p={scene:scene||'main',result:result||'clear',play_sec:gaS.t0?Math.round((Date.now()-gaS.t0)/1000):0};
  if(extra){ for(var k in extra){ if(extra.hasOwnProperty(k))p[k]=extra[k]; } }
  gaSend('game_complete',p);
  gaVoteShow(p.scene);
}
var GA_VOTE_COPY={ko:{q:'또 할래?',yes:'응',no:'글쎄',thx:'고마워요!'},ja:{q:'また あそぶ？',yes:'うん',no:'うーん',thx:'ありがとう！'},en:{q:'Want another go?',yes:'Yes',no:'Not sure',thx:'Thanks!'}};
function gaVoteShow(scene){
  var el=document.getElementById('gaVote'); if(!el||gaS.voted)return;
  var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
  el.querySelector('.ga-vote-q').textContent=c.q;
  el.querySelector('[data-choice="yes"]').textContent=c.yes;
  el.querySelector('[data-choice="unsure"]').textContent=c.no;
  gaS.voteScene=scene||'main'; gaS.voteShown=true; el.hidden=false; el.classList.remove('done');
}
(function(){ var el=document.getElementById('gaVote'); if(!el)return;
  el.addEventListener('click',function(e){
    var b=e.target; while(b&&b!==el&&!(b.getAttribute&&b.getAttribute('data-choice')))b=b.parentNode;
    if(!b||b===el||gaS.voted)return; gaS.voted=true;
    gaSend('game_vote',{scene:gaS.voteScene,choice:b.getAttribute('data-choice')});
    var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
    el.classList.add('done'); el.querySelector('.ga-vote-q').textContent=c.thx;
    setTimeout(function(){ el.hidden=true; },1200);
  });
})();

function finishPuzzle(){
  stateName='celebrate';
  clearDead();
  dragging=false;pointerPos=null;
  completeFxAt=performance.now();
  Snd.bloom();
  burstAll();
  setTimeout(function(){
    done[idx]=true;
    if(!replay)saveProgress();
    renderProgress();
    if(idx===4){
      gaRoundComplete('daily','clear',{gardens:5});
      setTimeout(function(){showFinal(false)},350);
    }else{
      stateName='banner';
      bannerEl.classList.add('show');
    }
  },1500);
}
function nextPuzzle(){
  bannerEl.classList.remove('show');
  idx++;
  stateName='play';
  loadPuzzle();
}
function spawnFinalPetals(){
  const box=$('#finPetals');
  box.innerHTML='';
  if(RM)return;
  for(let i=0;i<16;i++){
    const s=document.createElement('span');
    s.className='fpetal';
    const sc=0.7+Math.random()*0.9;
    s.style.left=(Math.random()*100)+'%';
    s.style.animationDuration=(6.5+Math.random()*5)+'s';
    s.style.animationDelay=(Math.random()*7)+'s';
    s.style.transform='scale('+sc+')';
    box.appendChild(s);
  }
}
function showFinal(already){
  stateName='final';
  finVariant=already?'already':'done';
  refreshTexts();
  renderProgress();
  spawnFinalPetals();
  finalEl.setAttribute('aria-hidden','false');
  requestAnimationFrame(function(){
    finalEl.classList.add('in');
  });
  if(already||RM){
    finalEl.classList.add('closed','sealed');
  }else{
    Snd.finale();
    setTimeout(function(){finalEl.classList.add('closed')},1700);
    setTimeout(function(){finalEl.classList.add('sealed')},3200);
  }
}

/* ---------------- buttons ---------------- */
$('#restartBtn').addEventListener('click',function(){
  Snd.ensure();
  if(stateName!=='play')return;
  if(path.length===0)return;
  const keys=pathEdges.slice();
  for(let i=0;i<keys.length;i++)scatterEdge(keys[i]);
  path=[];pathEdges=[];used=new Map();visited=new Set();
  clearDead();
  dragging=false;pointerPos=null;
  Snd.undo();
  updateHint();
});
$('#nextBtn').addEventListener('click',function(){
  Snd.ensure();
  if(stateName!=='banner')return;
  Snd.tap();
  nextPuzzle();
});
$('#replayBtn').addEventListener('click',function(){
  Snd.ensure();
  Snd.tap();
  finalEl.classList.remove('in','closed','sealed');
  finalEl.setAttribute('aria-hidden','true');
  replay=true;
  done=[false,false,false,false,false];
  idx=0;
  stateName='play';
  loadPuzzle();
});
$('#langBtn').addEventListener('click',function(){
  Snd.ensure();
  lang=LANGS[(LANGS.indexOf(lang)+1)%LANGS.length];
  store.set('in9-lang',lang);
  Snd.tap();
  refreshTexts();
});
$('#sndBtn').addEventListener('click',function(){
  const on=Snd.toggle();
  $('#sndBtn').textContent=on?'🔊':'🔇';
  $('#sndBtn').setAttribute('aria-label',on?L('soundOn'):L('soundOff'));
});
document.addEventListener('pointerdown',function(){Snd.ensure()},{passive:true});

/* ---------------- boot ---------------- */
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',function(){setTimeout(fit,200)});
$('#sndBtn').textContent=Snd.on?'🔊':'🔇';
puzzles=genDaily();
loadProgress();
let first=done.indexOf(false);
if(first<0){
  idx=4;
  loadPuzzle();
  stateName='final';
  showFinal(true);
}else{
  idx=first;
  loadPuzzle();
}
requestAnimationFrame(function(t){lastT=t;requestAnimationFrame(tick)});
</script>
