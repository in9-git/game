  /* 다른 게임의 훅 관례를 따른다 */
  window.LONGWINGS = {
    config: CFG,
    state: function(){ return R; },
    cam: function(){ return cam; },
    ga: function(){ return gaS; },
    mode: function(){ return modeNow(); },
    pure: { liftAt:liftAt, vertRate:vertRate, sinkOf:sinkOf, bandOf:bandOf,
            heatNow:heatNow, windNow:windNow, wrapDelta:wrapDelta,
            terrainAt:terrainAt, plateFit:plateFit },
    /* pump_net_max = 0 을 수치로 확인한다.
       최악의 연타 패턴들을 실제로 적분해 순 고도 변화가 0 을 넘지 않는지 본다. */
    selftest: function(){
      var out=[], dt=1/120;
      var lifts=[0,20,54,66,96,118,150];
      var periods=[0.02,0.05,0.1,0.25,0.5,1,2];
      var worst=-Infinity, worstAt=null;
      for(var li=0;li<lifts.length;li++){
        for(var pi=0;pi<periods.length;pi++){
          for(var duty=0.1; duty<=0.95; duty+=0.1){
            var v=CFG.v_spread, net=0, T=0, per=periods[pi];
            while(T<8){
              var folded=((T%per)/per) < duty;
              var rate=vertRate(lifts[li], folded, v);
              var rSp =vertRate(lifts[li], false, v);
              net += (rate-rSp)*dt;            /* '계속 펴고 있었을 때' 대비 순이득 */
              var vT=folded?CFG.v_fold:CFG.v_spread;
              v += (vT-v)*(1-Math.exp(-dt/CFG.v_tau));
              T+=dt;
            }
            if(net>worst){ worst=net; worstAt={lift:lifts[li],period:per,duty:Math.round(duty*10)/10}; }
          }
        }
      }
      out.push({ name:'pump_net_max', pass: worst<=CFG.pump_net_max,
                 worst_net_gain: Math.round(worst*1000)/1000, at: worstAt,
                 note:'접었다 펴는 어떤 주기·듀티에서도 계속 편 경우보다 고도를 더 벌 수 없다' });
      /* 같은 질문을 실제 적분기(stepBird)로 한 번 더 묻는다.
         위 검사는 vertRate 라는 부등식만 본다 — 게임이 실제로 도는 코드는
         stepBird 다. 여기서는 그 코드로 두 마리를 같은 자리·같은 고도에서
         출발시켜, 한 마리는 연타하고 한 마리는 계속 펴게 두고 끝 고도를 잰다.
         수평 이동은 매 스텝 되돌려 x 를 고정한다 — 자리를 옮겨 더 센 상승원을
         만나는 것은 펌핑이 아니라 항법이고, 그건 이 게임이 권하는 바다. */
      var wasOn=AudioSys.on; AudioSys.on=false;
      var wGain=-Infinity, wAt=null, edge=false;
      for(var xi=0; xi<24; xi++){
        var X=CFG.world_w*xi/24;
        for(var p2=0;p2<periods.length;p2++){
          for(var du=0.2; du<=0.9; du+=0.2){
            var bp=newBird(X,450,0), bs=newBird(X,450,0), T2=0, pr=periods[p2];
            while(T2<2){
              bp.folded=((T2%pr)/pr)<du; bs.folded=false;
              stepBird(bp,dt); stepBird(bs,dt);
              bp.x=X; bs.x=X;                 /* 항법 변수를 뺀다 */
              T2+=dt;
            }
            if(bp.alt<=0||bs.alt<=0||bp.alt>=CFG.alt_ceiling||bs.alt>=CFG.alt_ceiling) edge=true;
            var g=bp.alt-bs.alt;
            if(g>wGain){ wGain=g; wAt={x:Math.round(X),period:pr,duty:Math.round(du*10)/10}; }
          }
        }
      }
      AudioSys.on=wasOn;
      out.push({ name:'pump_net_max_integrator', pass: wGain<=CFG.pump_net_max && !edge,
                 worst_net_gain: Math.round(wGain*1000)/1000, at: wAt, hit_clamp: edge,
                 note:'실제 stepBird 로 2초를 돌려도 연타한 쪽이 계속 편 쪽보다 높을 수 없다' });
      /* 부등식 자체를 직접 확인 */
      var strict=true;
      for(var l2=0;l2<=CFG.lift_max;l2+=5){ for(var v2=0;v2<=CFG.v_fold;v2+=10){
        if(!(vertRate(l2,true,v2) < vertRate(l2,false,v2))) strict=false;
      }}
      out.push({ name:'fold_rate_strictly_below_spread', pass:strict });
      /* 물 복귀가 상승 수단이 아닌지 */
      out.push({ name:'relaunch_capped', pass: CFG.relaunch_alt < CFG.band_low,
                 note:'물에서 돌아오는 높이는 고정이라 반복해도 그 위로 못 올라간다' });
      /* 상승원 4종의 세기 순서 */
      var L=CFG.lift;
      out.push({ name:'source_order', pass: L.ridge.s>L.rock.s && L.rock.s>L.flock.s && L.flock.s>L.foam.s });
      /* 도판을 플레이 캔버스에 그리지 않는지 (정적 확인용 표시) */
      out.push({ name:'plate_never_on_play_canvas', pass:true,
                 note:'도판 2장은 DOM <img>(#dxPlate,#dxSkel) 로만 존재한다' });

      /* 얼린 그림을 옮길 때 목적지 크기를 명시하는지 — 화면이 돌아간 뒤에도
         빈 종이가 남지 않아야 한다. 순수 함수 plateFit 을 직접 잰다. */
      var dims=[[320,640],[640,320],[800,800],[1170,2532],[2532,1170],[1024,768]];
      var fitOk=true, fitBad=null, EPS=1e-6;
      for(var fi=0; fi<dims.length; fi++){ for(var di=0; di<dims.length; di++){
        var f0=dims[fi], d0=dims[di], rc=plateFit(f0[0],f0[1],d0[0],d0[1]);
        if(!rc){ fitOk=false; fitBad={from:f0,to:d0,rect:null}; continue; }
        var inside = rc.sx>=-EPS && rc.sy>=-EPS &&
                     rc.sx+rc.sw<=f0[0]+EPS && rc.sy+rc.sh<=f0[1]+EPS;
        var aspect = Math.abs((rc.sw/rc.sh)-(d0[0]/d0[1]))<1e-9;
        var maximal = Math.abs(rc.sw-f0[0])<EPS || Math.abs(rc.sh-f0[1])<EPS;
        if(!(inside&&aspect&&maximal)){ fitOk=false; fitBad={from:f0,to:d0,rect:rc}; }
      }}
      out.push({ name:'plate_fit_covers_new_size',
                 pass: fitOk && plateFit(0,0,10,10)===null, bad:fitBad,
                 note:'세로/가로/정사각 어느 조합에서도 비율을 지킨 채 목적지를 가득 덮는다' });

      /* §9 시연 억제의 계기가 '근처에 있었나'가 아니라 '실제로 떠올랐나'인지.
         상승대 안(lift>=lift_eps)이면서도 가라앉는 자리와, 실제로 오르는 자리를
         각각 찾아 1초씩 태워 본다. */
      var wasOn2=AudioSys.on; AudioSys.on=false;
      var weakP=null, strongP=null;
      for(var sx=0; sx<CFG.world_w && (!weakP||!strongP); sx+=20){
        for(var sa=60; sa<=CFG.alt_ceiling-60 && (!weakP||!strongP); sa+=20){
          var lf=liftAt(sx,sa);
          if(lf<CFG.lift_eps) continue;
          var rt=vertRate(lf,false,CFG.v_spread);
          if(rt<0 && !weakP) weakP={x:sx,alt:sa};
          if(rt>0 && !strongP) strongP={x:sx,alt:sa};
        }
      }
      var burn=function(pt){
        var bb=newBird(pt.x, pt.alt, 0), T3=0;
        while(T3<1){ stepBird(bb,dt); bb.x=pt.x; bb.alt=pt.alt; T3+=dt; }
        return bb;
      };
      var wB = weakP?burn(weakP):null, sB = strongP?burn(strongP):null;
      AudioSys.on=wasOn2;
      out.push({ name:'demo_gate_counts_rising_only',
                 pass: !!wB && !!sB && wB.liftS>0.9 && wB.liftWin===0 && sB.liftWin>0.9,
                 weak_liftS: wB?Math.round(wB.liftS*100)/100:null,
                 weak_liftWin: wB?Math.round(wB.liftWin*100)/100:null,
                 strong_liftWin: sB?Math.round(sB.liftWin*100)/100:null,
                 note:'상승대 안에서 가라앉는 1초는 시연 억제로 치지 않는다' });

      /* 파생값 옆에 원값이 함께 실리는지 */
      var rb=newBird(0,120,0), esrc=String(endRound);
      out.push({ name:'raw_values_in_game_complete',
                 pass: typeof rb.liftNet==='number' && typeof rb.altMax==='number' &&
                       esrc.indexOf('lift_gain')>0 && esrc.indexOf('lift_net')>0 &&
                       esrc.indexOf('alt_max')>0,
                 note:'result 는 파생값이다 — 원값 셋을 같이 실어야 컷을 나중에 다시 그을 수 있다' });

      /* 날씨 순환은 화면 전환이 아니라 완료된 판마다 넘어가는지.
         이 항은 newRound() 를 한 번 부르고 판 상태(R·cam)를 되돌린다. */
      var scKey='lw-scene', scWrites=0, realSet=store.set;
      var savedR=R, savedCam={x:cam.x,alt:cam.alt,zoom:cam.zoom}, savedScene=store.get(scKey);
      store.set=function(k,v){ if(k===scKey) scWrites++; return realSet.call(store,k,v); };
      try{ newRound(); }catch(e){}finally{ store.set=realSet; }
      R=savedR; cam.x=savedCam.x; cam.alt=savedCam.alt; cam.zoom=savedCam.zoom;
      if(savedScene!==null && store.get(scKey)!==savedScene) realSet.call(store,scKey,savedScene);
      out.push({ name:'newRound_never_advances_scene',
                 pass: scWrites===0 && CFG.scenes[0].id==='calm',
                 note:'제목 화면·Esc 왕복은 순환을 먹지 않는다 — 신규 방문자의 첫 판은 calm' });

      /* seen 은 개수로 접힌 파생값이다. seen_mask 하나로 9종 전부가 되살아나는지
         512가지 조합을 전수로 확인한다. R.seen 은 재웠다 그대로 돌려놓는다. */
      var savedSeen=R.seen, maskOk=true, maskBad=null, NS=CFG.sights.length;
      for(var mi=0; mi<(1<<NS); mi++){
        var fake={};
        for(var si=0; si<NS; si++){ if(mi&(1<<si)) fake[CFG.sights[si].id]=true; }
        R.seen=fake;
        var mm=seenMask(), cc=seenCount(), pop=0;
        for(var bi=0; bi<NS; bi++){ if(mm&(1<<bi)) pop++; }
        if(mm!==mi || cc!==pop){ maskOk=false; maskBad={want:mi,got:mm,seen:cc,pop:pop}; break; }
      }
      R.seen=savedSeen;
      out.push({ name:'seen_mask_recovers_every_id',
                 pass: maskOk && NS<=30, bad:maskBad, sights:NS,
                 note:'seen 개수는 seen_mask 의 팝카운트로 되나온다 — 어떤 대상을 봤는지가 남는다' });

      /* 설정 식별자와 숨김 시간이 원값으로 실리는지. game_vote 에는 붙이지 않는다. */
      var srcS=String(gaRoundStart), srcC=String(gaRoundComplete);
      out.push({ name:'cfg_ver_and_hidden_s_on_events',
                 pass: typeof CFG_VER==='string' && CFG_VER.length>0 &&
                       CFG_VER.indexOf(CFG.version)===0 &&
                       srcS.indexOf('cfg_ver')>0 && srcC.indexOf('cfg_ver')>0 &&
                       srcC.indexOf('hidden_s')>0 && typeof gaS.hiddenMs==='number' &&
                       typeof hiddenMsNow()==='number' && hiddenMsNow()>=0,
                 cfg_ver:CFG_VER,
                 note:'컷·계수를 만진 전후를 GA4 에서 가를 수 있고, 벽시계 play_sec 과 판 시계의 차도 설명된다' });
      out.push({ name:'test_round_is_marked',
                 pass: CFG_VER === CFG.version + (TB_ON ? CFG.test_suffix : '') &&
                       (!TB_ON || CFG_VER.indexOf(CFG.test_suffix) > 0),
                 tb:TB_ON, round_s:CFG.round_s,
                 note:'?tb= 로 줄인 판은 cfg_ver 꼬리로 실측에서 걸러낸다 — 계측을 끄지는 않는다' });

      /* prefers-reduced-motion 이 실제로 소비되는 곳들 */
      out.push({ name:'reduced_motion_consumed',
                 pass: String(drawMotes).indexOf('REDUCED')>0 &&
                       String(drawReadyHint).indexOf('REDUCED')>0 &&
                       String(loop).indexOf('REDUCED')>0 &&
                       CFG.plate_reduced_s===0 && CFG.reduced_ring_k>0 &&
                       CFG.reduced_ring_alpha>0 && CFG.reduced_ring_alpha<=1,
                 reduced:REDUCED,
                 note:'티끌·대기 링·엔딩 세피아 셋에서 소비된다. 파도·구름 그림자·아지랑이는 판 자체라 줄이지 않는다' });

      /* 투표를 키보드로 눌렀을 때 포커스가 <body> 로 떨어지지 않는지.
         이벤트는 쏘지 않는다 — 규칙 함수만 직접 잰다. 초점은 원래 자리로 돌려놓는다. */
      var beforeFocus=document.activeElement;
      var noKey=voteReturnFocus(false), yesKey=voteReturnFocus(true);
      var againEl=document.getElementById('againBtn');
      /* 카드 오버레이는 display 가 아니라 visibility 로 숨는다 — offsetParent 로는
         안 잡힌다. 실제로 초점을 받을 수 있는 상태일 때만 이동을 요구한다. */
      var reachable=false;
      try{
        var cs=window.getComputedStyle(againEl);
        reachable = !!againEl && againEl.getClientRects().length>0 &&
                    cs.visibility!=='hidden' && cs.display!=='none';
      }catch(e){}
      var moved = !reachable || document.activeElement===againEl;
      try{ if(beforeFocus && beforeFocus.focus) beforeFocus.focus({preventScroll:true}); }catch(e){}
      var vq=document.querySelector('#gaVote .ga-vote-q');
      out.push({ name:'vote_keyboard_keeps_focus',
                 pass: noKey===null && yesKey===againEl && !!againEl && moved &&
                       !!vq && vq.getAttribute('aria-live')==='polite',
                 card_shown:reachable,
                 note:'키보드 활성화(detail===0)면 다시 날기로 옮기고, 접수 문구는 live 로 읽힌다' });
      /* 지형 클램프는 바위를 뚫지 않게 밀어낼 뿐이지만, 사면이 솟는 곳에서는 발밑이
         올라오면서 공기 없이도 고도가 붙는다. 그래서 설계 문장은 '고도는 공기에서만'
         이 아니라 **'상공대는 공기에서만'** 이 참이다 — 지형에 얹혀 얻는 최대 고도가
         상공대 바닥보다 낮아야 한다. 계수를 만지면 여기서 가장 먼저 깨진다.
         (중간대는 지형만으로도 닿는다. 이것은 의도된 것이고 절벽이 상승원인 이유다.) */
      /* 화면이 세계보다 넓어지면 최고 고도에서 양끝이 빈다.
       sxOf 는 wrapDelta(±world_w/2) 를 쓰므로 한 바퀴 밖은 아예 그려지지 않는다.
       tv 모드에서 #app 를 넓힐 때 이 선을 넘었는지 판이 열린 상태에서 확인한다. */
    var paintW = CFG.world_w * CFG.zoom_high;
    out.push({ name:'no_blank_edge_at_top',
               pass: W <= paintW + 0.5,
               canvas_w: Math.round(W), paint_w: Math.round(paintW),
               note:'화면 폭 <= world_w x zoom_high (최고 고도에서 빈 띠 없음)' });

    var gmax=0;
      for(var gi=0; gi<4000; gi++){ var gv=terrainAt(gi/4000*CFG.world_w); if(gv>gmax) gmax=gv; }
      out.push({ name:'high_band_is_air_only',
                 pass: (gmax+CFG.terrain_clear) < CFG.band_high,
                 floor_max: Math.round(gmax+CFG.terrain_clear),
                 band_high: CFG.band_high,
                 note:'지형에 얹혀 얻는 최대 고도 < 상공대 바닥' });
      try{ console.table(out); }catch(e){}
      return out;
    },
    goto: function(id){
      if(id==='title') return toTitle();
      if(id==='ready') return startReady();
      if(id==='end'){ if(R.phase!=='play'){ startReady(); beginFlight(); } R.clock=CFG.round_s; return; }
      return null;
    }
  };

  boot();
})();
</script>
