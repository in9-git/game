<style>
  :root{
    --ink:#3a4a63;
    --ink-soft:#6b7d97;
    --glass:rgba(255,255,255,.38);
    --glass-line:rgba(255,255,255,.65);
    --accent1:#ffb26b;
    --accent2:#ff8fa0;
    --shadow:0 8px 28px rgba(70,100,150,.22);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Hiragino Kaku Gothic ProN","Segoe UI",sans-serif;
    background:linear-gradient(170deg,#cde9fa 0%,#e8f3fb 45%,#ffe6c8 100%);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    position:relative;
    width:100%;max-width:760px;
    height:100dvh;
    overflow:hidden;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  @media (min-width:800px){
    #app{
      height:min(100dvh - 32px, 920px);
      border-radius:24px;
      box-shadow:0 24px 70px rgba(60,90,140,.35);
    }
  }
  #skyWrap{position:absolute;inset:0;}
  #sky{
    position:absolute;inset:0;width:100%;height:100%;
    display:block;touch-action:none;cursor:crosshair;
  }
  /* 키보드로 초점을 받았을 때만 테두리 — 탭/클릭으로 들어온 초점에는 안 나온다.
     canvas 의 inset box-shadow 는 캔버스 그림 밑에 깔려 보이지 않고, 흰 outline 한 겹은
     밝은 하늘 위에서 1.1~1.8:1 밖에 안 나온다(WCAG 2.2 비텍스트 3:1 미달). 그래서 링을
     별도 레이어로 얹고 2색(바깥 흰 / 안쪽 짙은 남색)으로 만든다 — 낮 하늘에서는 안쪽,
     노을 하늘에서는 바깥이 3:1 을 넘긴다. */
  #sky:focus{outline:none;}
  #sky:focus-visible{outline:none;}
  #focusRing{
    position:absolute;inset:0;z-index:7;pointer-events:none;
    opacity:0;transition:opacity .12s ease;
    border:3px solid rgba(255,255,255,.97);
    box-shadow:inset 0 0 0 3px #0d1a29;
  }
  #sky:focus-visible ~ #focusRing{opacity:1;}
  @media (min-width:800px){ #focusRing{border-radius:24px;} }
  /* ---------- header ---------- */
  header{
    position:absolute;top:0;left:0;right:0;z-index:6;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
    pointer-events:none;
    background:linear-gradient(rgba(255,255,255,.30),rgba(255,255,255,0));
  }
  .hbtn{
    pointer-events:auto;
    display:inline-flex;align-items:center;gap:5px;
    background:var(--glass);
    border:1px solid var(--glass-line);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-radius:999px;
    padding:7px 13px;
    min-height:44px;min-width:44px;justify-content:center;  /* 탭 타깃 44×44 */
    font-size:.82rem;font-weight:700;color:var(--ink);
    text-decoration:none;cursor:pointer;
    box-shadow:0 3px 12px rgba(70,100,150,.15);
    transition:transform .18s ease, background .18s ease;
    font-family:inherit;
  }
  .hbtn:hover{transform:translateY(-1px);background:rgba(255,255,255,.55);}
  .hbtn:active{transform:scale(.95);}
  /* 제목은 좌우 버튼 사이의 남은 폭 안에서만 산다 — 페이지 정중앙에 절대배치하면
     좁은 화면에서 언어 버튼을 파고든다(375px ko 기준 9.9px 겹침). */
  .title-block{
    flex:1 1 auto;min-width:0;
    text-align:center;pointer-events:none;
    text-shadow:0 2px 10px rgba(255,255,255,.6);
  }
  .title-block h1{
    font-size:1.28rem;font-weight:800;letter-spacing:.06em;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .title-block p{
    font-size:.62rem;font-weight:600;letter-spacing:.14em;color:var(--ink-soft);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  @media (max-width:430px){
    .title-block h1{font-size:1.05rem;letter-spacing:.03em;}
    .title-block p{font-size:.55rem;letter-spacing:.07em;}
  }
  /* 360px 미만 — 남은 폭이 80px 까지 줄어 en 은 게임 이름 자체가 "Cloud …" 로 잘렸다.
     홈 버튼 글자를 시각적으로만 접고(스크린리더는 그대로 읽는다) 버튼 좌우 여백·제목
     글자를 한 단계 더 줄여, 320px 에서 ko·ja·en 세 언어가 모두 온전히 들어가게 한다. */
  @media (max-width:359px){
    .hbtn{padding:7px 9px;gap:0;}
    #homeTxt{
      position:absolute;width:1px;height:1px;margin:-1px;padding:0;
      overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;
    }
    .title-block h1{font-size:.98rem;letter-spacing:.01em;}
    .title-block p{font-size:.5rem;letter-spacing:.03em;}
  }
  #homeBtn,.hdr-right{flex:0 0 auto;}
  .hdr-right{display:flex;gap:7px;}
  /* ---------- counter chip / toast ---------- */
  #counter{
    /* 헤더 버튼이 44px 타깃이 되면서 헤더가 64px 까지 자란다 — 카운터를 그 아래로 */
    position:absolute;top:calc(74px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    z-index:5;
    background:var(--glass);border:1px solid var(--glass-line);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-radius:999px;padding:4px 14px;
    font-size:.8rem;font-weight:800;color:var(--ink);
    box-shadow:0 3px 10px rgba(70,100,150,.12);
    pointer-events:none;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  #counter.bump{transform:translateX(-50%) scale(1.25);}
  #toast{
    position:absolute;left:50%;bottom:132px;transform:translateX(-50%) translateY(8px);
    z-index:5;
    background:rgba(255,255,255,.6);border:1px solid var(--glass-line);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-radius:999px;padding:7px 16px;
    font-size:.82rem;font-weight:700;color:var(--ink);
    opacity:0;pointer-events:none;white-space:nowrap;
    transition:opacity .4s ease, transform .4s ease;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* ---------- flash ---------- */
  #flash{
    position:absolute;inset:0;z-index:7;background:#fff;
    opacity:0;pointer-events:none;
  }
  #flash.on{animation:flashA .3s ease-out;}
  @keyframes flashA{0%{opacity:.92;}100%{opacity:0;}}
  /* ---------- album strip ---------- */
  #album{
    position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    z-index:6;
    display:flex;gap:7px;align-items:center;
    background:rgba(255,255,255,.34);
    border:1px solid var(--glass-line);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:20px;padding:9px 10px;
    box-shadow:0 8px 24px rgba(70,100,150,.18);
    max-width:calc(100% - 20px);
  }
  .slot{
    --rot:0deg;
    position:relative;
    width:clamp(50px,15vw,64px);
    aspect-ratio:5/5.9;
    border-radius:7px;
    border:2px dashed rgba(255,255,255,.85);
    background:rgba(255,255,255,.28);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:1;min-width:0;
    transition:background .3s ease;
  }
  .slot-ph{
    font-size:1.35rem;filter:grayscale(1) opacity(.5);
    transform:translateY(-4px);
  }
  .slot.filled{
    border:none;background:#fff;
    padding:4px 4px 0;
    box-shadow:0 4px 12px rgba(60,80,120,.28);
    transform:rotate(var(--rot));
    animation:slotPop .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes slotPop{0%{transform:rotate(var(--rot)) scale(.4);}100%{transform:rotate(var(--rot)) scale(1);}}
  .slot.filled img{
    width:100%;aspect-ratio:5/4;object-fit:cover;border-radius:3px;display:block;
  }
  .slot-tag{
    position:absolute;left:0;right:0;bottom:1px;
    text-align:center;font-size:.72rem;line-height:1.2;
  }
  /* ---------- flying polaroid ---------- */
  .photo-fly{
    position:fixed;left:0;top:0;z-index:30;
    width:170px;pointer-events:none;
    transition:transform .65s cubic-bezier(.22,.9,.3,1), opacity .4s ease;
    will-change:transform;
  }
  .pframe{
    background:#fff;border-radius:8px;padding:9px 9px 8px;
    box-shadow:0 16px 44px rgba(50,70,110,.4);
  }
  .pframe img{width:100%;aspect-ratio:5/4;object-fit:cover;border-radius:4px;display:block;}
  .pcap{
    text-align:center;font-size:.86rem;font-weight:800;color:#54617a;
    padding-top:7px;letter-spacing:.03em;
  }
  /* ---------- overlays ---------- */
  .overlay{
    position:absolute;inset:0;z-index:20;
    display:flex;align-items:flex-start;justify-content:center;
    padding:20px;
    /* 카드가 뷰포트보다 길어지면(도감 줄이 붙은 320×568, 가로모드 667×375) 넘친 부분을
       스크롤해서 볼 수 있게 한다. 가운데 정렬은 align-items 가 아니라 카드의 margin:auto
       로 한다 — align-items:center 로 가운데 두면 위로 넘친 부분이 스크롤로 닿지 않는다
       (가로모드에서 카드 머리 38px 가 영영 안 보였다). */
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    opacity:0;pointer-events:none;
    /* visibility 까지 꺼야 숨은 오버레이의 버튼이 Tab 순서에서 빠진다.
       0s 지연으로 페이드아웃이 끝난 뒤에 사라지게 한다. */
    visibility:hidden;
    transition:opacity .5s ease, visibility 0s linear .5s;
  }
  .overlay.show{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .5s ease, visibility 0s;}
  #introOv{background:rgba(190,224,246,.45);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);}
  #doneOv{background:rgba(84,74,120,.42);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);}
  .card{
    background:rgba(255,255,255,.82);
    border:1px solid rgba(255,255,255,.9);
    border-radius:26px;
    padding:28px 24px 24px;
    max-width:330px;width:100%;
    margin:auto;   /* 남는 공간이 있으면 가운데, 모자라면 위부터 — 위쪽도 스크롤로 닿는다 */
    text-align:center;
    box-shadow:var(--shadow);
    transform:translateY(10px) scale(.97);
    transition:transform .5s cubic-bezier(.22,.9,.3,1);
  }
  .overlay.show .card{transform:translateY(0) scale(1);}
  .card .big-emoji{font-size:2.6rem;display:block;margin-bottom:6px;}
  .card h2{font-size:1.35rem;font-weight:800;letter-spacing:.04em;margin-bottom:10px;}
  .card .desc{
    font-size:.86rem;line-height:1.65;color:var(--ink-soft);font-weight:600;
    white-space:pre-line;margin-bottom:16px;
  }
  /* 문 앞의 기록 한 줄 — 도감이 비었으면 아예 안 뜬다 */
  #introDex{
    font-size:.8rem;font-weight:800;letter-spacing:.02em;color:var(--ink);
    opacity:.72;margin:-10px 0 16px;
  }
  #introDex[hidden]{display:none;}
  #kbdHint{
    font-size:.72rem;font-weight:600;line-height:1.5;color:var(--ink-soft);
    opacity:.85;margin-top:14px;
  }
  .today-label{
    font-size:.72rem;font-weight:800;letter-spacing:.18em;color:#9aa8bd;
    text-transform:uppercase;margin-bottom:8px;
  }
  .today-row{
    display:flex;justify-content:center;gap:8px;margin-bottom:20px;flex-wrap:wrap;
  }
  .today-row .chip{
    font-size:1.4rem;
    background:linear-gradient(150deg,#eaf5fd,#fdeee2);
    border:1px solid rgba(255,255,255,.9);
    border-radius:14px;width:48px;height:48px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(90,120,170,.14);
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    font-family:inherit;font-size:.95rem;font-weight:800;letter-spacing:.03em;
    color:#fff;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    border:none;border-radius:999px;
    padding:13px 30px;cursor:pointer;
    box-shadow:0 8px 20px rgba(255,145,130,.4);
    transition:transform .18s ease, box-shadow .18s ease;
    text-decoration:none;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(255,145,130,.5);}
  .btn:active{transform:scale(.96);}
  .btn.ghost{
    background:rgba(255,255,255,.7);color:var(--ink);
    box-shadow:0 4px 12px rgba(90,110,160,.18);
    border:1px solid rgba(255,255,255,.95);
  }
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  /* done overlay photo fan */
  #doneCard{max-width:360px;background:rgba(255,250,242,.9);}
  #doneFan{
    display:flex;justify-content:center;align-items:center;
    margin:6px 0 16px;height:130px;position:relative;
  }
  #doneFan .fan-p{
    background:#fff;border-radius:6px;padding:5px 5px 3px;
    box-shadow:0 8px 20px rgba(80,70,110,.3);
    width:86px;position:absolute;
    animation:fanIn .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  #doneFan .fan-p img{width:100%;aspect-ratio:5/4;object-fit:cover;border-radius:3px;display:block;}
  #doneFan .fan-p .fcap{text-align:center;font-size:.85rem;padding:3px 0 2px;}
  @keyframes fanIn{0%{transform:translateX(var(--fx)) rotate(var(--fr)) scale(.3);opacity:0;}
    100%{transform:translateX(var(--fx)) rotate(var(--fr)) scale(1);opacity:1;}}
  #doneStats{font-size:.78rem;font-weight:700;color:#a08d76;margin-bottom:5px;}
  #doneDex{font-size:.82rem;font-weight:800;color:var(--ink);letter-spacing:.02em;line-height:1.4;margin-bottom:14px;}
  #doneNext{font-size:.78rem;font-weight:700;color:var(--ink);opacity:.7;line-height:1.4;margin:-10px 0 14px;}
  #doneNext[hidden]{display:none;}
  #doneMsg{color:#8a7460;}
  /* GA vote row */
  .ga-vote{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 2px;font-size:14px;line-height:1.2;opacity:.92;color:var(--ink-soft)}
  .ga-vote[hidden]{display:none}
  .ga-vote-btn{font:inherit;font-size:14px;padding:6px 14px;min-height:44px;min-width:44px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.85;-webkit-tap-highlight-color:transparent}
  .ga-vote-btn:active{opacity:1}
  .ga-vote.done .ga-vote-btn{display:none}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="skyWrap">
    <canvas id="sky" tabindex="0" role="application" aria-label="하늘"></canvas>
    <div id="focusRing" aria-hidden="true"></div>
    <div id="flash"></div>
  </div>

  <header>
    <a class="hbtn" id="homeBtn" href="../../index.html">← <span id="homeTxt">홈</span></a>
    <div class="title-block">
      <h1 id="titleMain">구름 사진관</h1>
      <p id="titleSub">くも写真館 · Cloud Snap</p>
    </div>
    <div class="hdr-right">
      <button class="hbtn" id="langBtn" aria-label="language">🇰🇷 KO</button>
      <button class="hbtn" id="soundBtn" aria-label="sound">🔊</button>
    </div>
  </header>

  <div id="counter">☁️ 0/5</div>
  <div id="toast"></div>
  <div id="album" aria-label="album"></div>

  <div class="overlay" id="introOv">
    <div class="card">
      <span class="big-emoji">☁️📷</span>
      <h2 id="introTitle">구름 사진관</h2>
      <p class="desc" id="introDesc"></p>
      <p id="introDex" hidden></p>
      <div class="today-label" id="todayLabel"></div>
      <div class="today-row" id="todayRow"></div>
      <button class="btn" id="startBtn"></button>
      <p id="kbdHint"></p>
    </div>
  </div>

  <div class="overlay" id="doneOv">
    <div class="card" id="doneCard" tabindex="-1">
      <span class="big-emoji">🌇</span>
      <h2 id="doneTitle"></h2>
      <div id="doneFan"></div>
      <p class="desc" id="doneMsg"></p>
      <div id="doneStats"></div>
      <div id="doneDex"></div>
      <div id="doneNext" hidden></div>
      <div class="ga-vote" id="gaVote" hidden>
        <span class="ga-vote-q">또 할래?</span>
        <button type="button" class="ga-vote-btn" data-choice="yes">응</button>
        <button type="button" class="ga-vote-btn" data-choice="unsure">글쎄</button>
      </div>
      <div class="btn-row">
        <button class="btn" id="againBtn"></button>
        <a class="btn ghost" id="doneHomeBtn" href="../../index.html"></a>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
(function(){
  /* ============================== i18n ============================== */
  var I18N = {
    ko:{
      home:'홈',
      introTitle:'구름 사진관',
      introDesc:'하늘 어딘가에 모양을 닮은 구름이 떠다녀요.\n뷰파인더를 움직여 특별한 구름을 찾고,\n탭해서 찰칵! 📷',
      introDex:'🌤 도감 {n}/{t}칸',
      kbdHint:'키보드도 돼요 — 방향키로 뷰파인더, Enter나 Space로 찰칵',
      skyAria:'하늘. 방향키로 뷰파인더를 움직이고 Enter 또는 Space로 사진을 찍어요.',
      today:'오늘의 목록',
      start:'카메라 들기',

    for(i=0;i<blobs.length;i++){
      b=blobs[i];
      minX=Math.min(minX,b[0]-b[2]); maxX=Math.max(maxX,b[0]+b[2]);
      minY=Math.min(minY,b[1]-b[2]); maxY=Math.max(maxY,b[1]+b[2]);
    }
    var pad=unit*0.4;
    var w=Math.ceil((maxX-minX)*unit+pad*2);
    var h=Math.ceil((maxY-minY)*unit+pad*2);
    var s=document.createElement('canvas');
    s.width=Math.max(2,Math.round(w*DPR)); s.height=Math.max(2,Math.round(h*DPR));
    var sc=s.getContext('2d');
    sc.scale(DPR,DPR);
    var a1=dense?0.98:0.92;
    for(i=0;i<blobs.length;i++){
      b=blobs[i];
      var bx=(b[0]-minX)*unit+pad, by=(b[1]-minY)*unit+pad, br=Math.max(2,b[2]*unit*1.12);
      var g=sc.createRadialGradient(bx,by,br*0.15,bx,by,br);
      g.addColorStop(0,'rgba(255,255,255,'+a1+')');
      g.addColorStop(0.62,'rgba(255,255,255,'+(a1*0.92)+')');
      g.addColorStop(1,'rgba(255,255,255,0)');
      sc.fillStyle=g;
      sc.beginPath(); sc.arc(bx,by,br,0,Math.PI*2); sc.fill();
    }
    /* soft underside shading */
    sc.globalCompositeOperation='source-atop';
    for(i=0;i<blobs.length;i++){
      b=blobs[i];
      var bx2=(b[0]-minX)*unit+pad, by2=(b[1]-minY)*unit+pad+b[2]*unit*0.3, br2=Math.max(2,b[2]*unit);
      var g2=sc.createRadialGradient(bx2,by2,br2*0.1,bx2,by2,br2);
      g2.addColorStop(0,'rgba(168,192,224,0.16)');
      g2.addColorStop(1,'rgba(168,192,224,0)');
      sc.fillStyle=g2;
      sc.beginPath(); sc.arc(bx2,by2,br2,0,Math.PI*2); sc.fill();
    }
    return {cv:s,w:w,h:h,ox:(0-minX)*unit+pad,oy:(0-minY)*unit+pad};
  }

  function normalBlobs(){
    var n=6+Math.floor(Math.random()*4);
    var blobs=[];
    for(var i=0;i<n;i++){
      var f=n===1?0.5:i/(n-1);
      var x=(f-0.5)*rnd(1.5,1.9)+rnd(-0.08,0.08);
      var y=rnd(-0.12,0.14)-Math.sin(f*Math.PI)*rnd(0.15,0.3);
      var r=rnd(0.26,0.44)+Math.sin(f*Math.PI)*0.14;
      blobs.push([x,y,r]);
    }
    blobs.push([rnd(-0.3,0.3),rnd(0.14,0.24),rnd(0.3,0.42)]);
    return blobs;
  }

  var LAYERS=[
    {sc:0.5,alpha:0.72,spd:5,amp:1.4},
    {sc:0.78,alpha:0.86,spd:9,amp:2.4},
    {sc:1.05,alpha:1,spd:14,amp:3.4}
  ];

  function spawnNormal(layer,anywhere){
    var L=LAYERS[layer];
    var unit=rnd(26,40)*L.sc;
    var sp=makeSprite(normalBlobs(),unit,false);
    clouds.push({
      x:anywhere?rnd(-40,W+40):-sp.w*0.6-rnd(0,120),
      y:rnd(H*0.05,H*(layer===0?0.5:layer===1?0.62:0.72)),
      spd:L.spd*rnd(0.8,1.25),
      amp:RM?0:L.amp, phase:rnd(0,6.28),
      layer:layer, sprite:sp, shape:null, found:false, foundAt:0, unit:unit
    });
  }

  function spawnSpecial(shapeId,xPos){
    var layer=Math.random()<0.35?1:2;
    var L=LAYERS[layer];
    var unit=rnd(50,64)*(layer===1?0.85:1);
    var sp=makeSprite(SHAPES[shapeId].blobs,unit,true);
    var yMax=Math.min(H*0.66,H-190);
    clouds.push({
      x:(typeof xPos==='number')?xPos:-sp.w*0.6-rnd(0,60),
      y:rnd(H*0.16,Math.max(H*0.3,yMax)),
      spd:L.spd*rnd(0.75,1.1),
      amp:RM?0:L.amp*0.8, phase:rnd(0,6.28),
      layer:layer, sprite:sp, shape:shapeId, found:false, foundAt:0, unit:unit
    });
  }

  function activeSpecialIds(){
    var ids={};
    for(var i=0;i<clouds.length;i++){
      if(clouds[i].shape && !clouds[i].found) ids[clouds[i].shape]=true;
    }
    return ids;
  }

  /* ============================== session ============================== */
  function startSession(){
    clouds=[]; effects=[];
    session.targets=pickTargets();
    session.foundSet={}; session.foundCount=0;
    session.shots=0; session.album=[]; session.skyPhase=0; session.complete=false;
    session.active=false;
    var perLayer=Math.max(3,Math.round(W/170));
    for(var l=0;l<3;l++){
      var n=l===0?perLayer:l===1?perLayer-1:perLayer-2;
      for(var i=0;i<n;i++) spawnNormal(l,true);
    }
    /* first specials: two visible, one entering */
    spawnSpecial(session.targets[0],W*rnd(0.2,0.35));
    spawnSpecial(session.targets[1],W*rnd(0.55,0.75));
    spawnSpecial(session.targets[2]);
    nextSpecialAt=now+8;
    lastFindOrHint=now;
    buildAlbum();
    updateCounter(false);
    /* remove leftover flying photos */
    var flies=document.querySelectorAll('.photo-fly');
    for(var f=0;f<flies.length;f++) flies[f].remove();
  }

  function buildAlbum(){
    albumEl.innerHTML='';
    for(var i=0;i<session.targets.length;i++){
      var id=session.targets[i];
      var slot=document.createElement('div');
      slot.className='slot';
      slot.dataset.shape=id;
      slot.innerHTML='<span class="slot-ph">'+SHAPES[id].emoji+'</span>';
      albumEl.appendChild(slot);
    }
  }

  function fillSlot(id,url){
    var slot=albumEl.querySelector('.slot[data-shape="'+id+'"]');
    if(!slot) return;
    slot.classList.add('filled');
    slot.style.setProperty('--rot',rnd(-4,4).toFixed(1)+'deg');
    slot.innerHTML='<img src="'+url+'" alt=""><span class="slot-tag">'+SHAPES[id].emoji+'</span>';
  }

  function updateCounter(bump){
    counterEl.textContent='☁️ '+session.foundCount+'/5';
    if(bump && !RM){
      counterEl.classList.remove('bump');
      void counterEl.offsetWidth;
      counterEl.classList.add('bump');
      setTimeout(function(){counterEl.classList.remove('bump');},350);
    }
  }

  var toastTimer=null;
  function showToast(msg,dur){
    toastEl.textContent=msg;
    toastEl.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toastEl.classList.remove('show');},dur||2200);
  }

  /* ============================== shutter ============================== */
  function shutter(){
    if(!session.active||session.complete) return;
    if(now-lastShotAt<0.24) return;
    lastShotAt=now;
    session.shots++;
    /* commit viewfinder to its aim target: vf.x/y is a render-smoothed value and
       may still be easing when the shutter fires (esp. taps, which have no hover
       tracking). judge + crop from where the player actually aimed. */
    vf.x=vf.tx; vf.y=vf.ty;
    /* find hit BEFORE flash so snapshot is clean */
    var hit=null,bestD=1e9;
    for(var i=0;i<clouds.length;i++){
      var c=clouds[i];
      if(!c.shape||c.found) continue;
      var dx=Math.abs(c.x-vf.x), dy=Math.abs(c.y-vf.y);
      if(dx<vf.w/2 && dy<vf.h/2){
        var d=dx*dx+dy*dy;
        if(d<bestD){bestD=d;hit=c;}
      }
    }
    var url=null;
    if(hit) url=capturePhoto();
    /* flash + sound */
    flashEl.classList.remove('on');
    void flashEl.offsetWidth;
    flashEl.classList.add('on');
    AudioSys.shutter();
    if(hit){
      onFound(hit,url);
    }else{
      if(now-lastToastAt>2.6){
        lastToastAt=now;
        var m=T().miss;
        showToast('📷 '+m[missIdx%m.length],1800);
        missIdx++;
      }
    }
  }

  function capturePhoto(){
    var capW=164,capH=131;
    var sx=clamp(vf.x-capW/2,0,Math.max(0,W-capW));
    var sy=clamp(vf.y-capH/2,0,Math.max(0,H-capH));
    var out=document.createElement('canvas');
    out.width=328; out.height=262;
    var oc=out.getContext('2d');
    try{
      oc.drawImage(cv,sx*DPR,sy*DPR,capW*DPR,capH*DPR,0,0,out.width,out.height);
    }catch(e){}
    return out.toDataURL('image/png');
  }

  function onFound(c,url){
    c.found=true; c.foundAt=now;
    session.foundSet[c.shape]=true;
    session.foundCount++;
    dexAdd(c.shape);
    session.album.push({id:c.shape,url:url});
    lastFindOrHint=now;
    nextSpecialAt=now+rnd(2.5,4.5);
    updateCounter(true);
    AudioSys.chime();
    /* sparkle + ghost effect on the cloud */
    var parts=[],n=RM?6:20;
    for(var i=0;i<n;i++){
      parts.push({a:rnd(0,6.28),d:rnd(14,c.unit*1.3),spd:rnd(12,34),s:rnd(2.6,6),ph:rnd(0,6.28)});
    }
    effects.push({kind:'found',c:c,t:0,dur:2.7,parts:parts});
    showToast('✨ '+T().found+' '+SHAPES[c.shape].emoji+' '+T().shapes[c.shape],2400);
    flyPhoto(url,c.shape);
  }

  /* ============================== flying polaroid ============================== */
  function flyPhoto(url,id){
    if(RM){
      fillSlot(id,url);
      checkDone();
      return;
    }
    var el=document.createElement('div');
    el.className='photo-fly';
    el.innerHTML='<div class="pframe"><img src="'+url+'" alt=""><div class="pcap">'+
      SHAPES[id].emoji+' '+T().shapes[id]+'</div></div>';
    document.body.appendChild(el);
    var rect=cv.getBoundingClientRect();
    var fw=170,fh=190;
    var sx0=rect.left+vf.x-fw/2, sy0=rect.top+vf.y-fh/2;
    var cx=rect.left+rect.width/2-fw/2, cy=rect.top+rect.height*0.4-fh/2;
    el.style.transform='translate('+sx0+'px,'+sy0+'px) scale(.45) rotate(-4deg)';
    el.style.opacity='0';
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      el.style.opacity='1';
      el.style.transform='translate('+cx+'px,'+cy+'px) scale(1) rotate(2deg)';
    });});
    setTimeout(function(){
      var slot=albumEl.querySelector('.slot[data-shape="'+id+'"]');
      if(slot){
        var sr=slot.getBoundingClientRect();
        var s=sr.width/fw;
        el.style.opacity='.95';
        el.style.transform='translate('+(sr.left+sr.width/2-fw/2)+'px,'+
          (sr.top+sr.height/2-fh/2)+'px) scale('+s+') rotate(0deg)';
      }
      setTimeout(function(){
        el.remove();
        fillSlot(id,url);
        checkDone();
      },680);
    },1150);
  }

  function checkDone(){
    if(session.foundCount>=5 && !session.complete){
      session.complete=true;
      setTimeout(showDone,750);
    }
  }

  function showDone(){
    var t=T();
    $('doneTitle').textContent=t.doneTitle;
    $('doneMsg').textContent=t.doneMsg;
    $('doneStats').textContent=t.shots.replace('{n}',session.shots);
    $('doneDex').textContent=dexLine();
    renderDexNext();
    $('againBtn').textContent='📷 '+t.again;
    $('doneHomeBtn').textContent=t.goHome;
    var fan=$('doneFan');
    fan.innerHTML='';
    var rots=[-9,-4,1,5,-6];
    for(var i=0;i<session.album.length;i++){
      var p=session.album[i];
      var d=document.createElement('div');
      d.className='fan-p';
      d.style.setProperty('--fx',((i-2)*52)+'px');
      d.style.setProperty('--fr',rots[i%rots.length]+'deg');
      d.style.zIndex=i;
      d.style.animationDelay=(0.15+i*0.13)+'s';
      d.innerHTML='<img src="'+p.url+'" alt=""><div class="fcap">'+SHAPES[p.id].emoji+'</div>';
      fan.appendChild(d);
    }
    doneOv.classList.add('show');
    cv.setAttribute('tabindex','-1');
    AudioSys.fanfare();
    gaRoundComplete('main','clear',{shots:session.shots});
    kbReset();
    /* 초점은 버튼이 아니라 결과 카드 자체로 옮긴다. 버튼으로 옮기면, 셔터로 쓰던
       Space 가 그대로 「또 찍기」를 눌러 결과 화면이 키 한 번에 사라진다
       (키보드로만 한 판을 끝내면 앨범을 아예 못 봤다). 카드는 눌리지 않으므로
       Tab 으로 투표·버튼까지 그대로 내려갈 수 있다. */
    focusIfIdle($('doneCard'));
  }

  /* ============================== update / draw ============================== */
  function resize(){
    var r=cv.parentElement.getBoundingClientRect();
    W=Math.max(1,Math.round(r.width));
    H=Math.max(1,Math.round(r.height));
    cv.width=Math.round(W*DPR);
    cv.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    vf.x=clamp(vf.x||W/2,0,W); vf.y=clamp(vf.y||H/2,0,H);
    vf.tx=clamp(vf.tx||W/2,0,W); vf.ty=clamp(vf.ty||H/2,0,H);
    for(var i=0;i<clouds.length;i++){
      clouds[i].y=clamp(clouds[i].y,10,H*0.8);
    }
  }

  function update(dt){
    /* sky phase toward foundCount/5 */
    var target=session.foundCount/5;
    var ds=target-session.skyPhase;
    session.skyPhase+=clamp(ds,-dt*0.09,dt*0.09);
    /* keyboard aim (스스로 vf.x/y 까지 맞춘다 — 아래 easing 은 그대로 통과) */
    kbStep(dt);
    /* viewfinder easing */
    var k=Math.min(1,dt*(pressed?16:10));
    vf.x+=(vf.tx-vf.x)*k;
    vf.y+=(vf.ty-vf.y)*k;
    /* clouds drift */
    for(var i=clouds.length-1;i>=0;i--){
      var c=clouds[i];
      c.x+=c.spd*dt;
      var sp=c.sprite;
      if(c.x-sp.ox>W+60){
        if(c.shape && !c.found){
          c.x=-sp.w*0.6-rnd(0,80);
          c.y=rnd(H*0.16,Math.max(H*0.3,Math.min(H*0.66,H-190)));
        }else if(c.found){
          clouds.splice(i,1);
          continue;
        }else{
          c.x=-sp.w*0.6-rnd(0,140);
          c.y=rnd(H*0.05,H*(c.layer===0?0.5:c.layer===1?0.62:0.72));
        }
      }
      /* found cloud fade-out & removal */
      if(c.found && now-c.foundAt>2.8){
        clouds.splice(i,1);
        spawnNormal(c.layer,false);
      }
    }
    /* special spawn manager */
    if(session.active && !session.complete){
      var actIds=activeSpecialIds();
      var actN=0,id;
      for(id in actIds) actN++;
      var remain=[];
      for(var j=0;j<session.targets.length;j++){
        id=session.targets[j];
        if(!session.foundSet[id] && !actIds[id]) remain.push(id);
      }
      var want=Math.min(3,(5-session.foundCount));
      if(actN<want && remain.length>0 && now>nextSpecialAt){
        spawnSpecial(remain[0]);
        nextSpecialAt=now+rnd(3,6);
      }
      /* gentle hint if stuck */
      if(now-lastFindOrHint>22){
        var specials=[];
        for(var s=0;s<clouds.length;s++){
          var cc=clouds[s];
          if(cc.shape&&!cc.found&&cc.x>60&&cc.x<W-60) specials.push(cc);
        }
        if(specials.length){
          var hc=specials[Math.floor(Math.random()*specials.length)];
          var hp=[];
          for(var hi=0;hi<(RM?3:7);hi++){
            hp.push({a:rnd(0,6.28),d:rnd(10,hc.unit),spd:rnd(6,16),s:rnd(2,4.5),ph:rnd(0,6.28)});
          }
          effects.push({kind:'hint',c:hc,t:0,dur:1.4,parts:hp});
        }
        lastFindOrHint=now;
      }
      /* rare soft bird chirp */
      if(now>nextChirpAt){
        if(AudioSys.on) AudioSys.chirp();
        nextChirpAt=now+rnd(18,42);
      }
    }
    /* effects */
    for(var e=effects.length-1;e>=0;e--){
      effects[e].t+=dt;
      if(effects[e].t>effects[e].dur) effects.splice(e,1);
    }
  }

  function drawSpark(x,y,s,a,rot){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.globalAlpha=a;
    ctx.fillStyle='#fff';
    ctx.shadowColor='rgba(255,255,240,.9)';
    ctx.shadowBlur=6;
    ctx.beginPath();
    ctx.moveTo(0,-s);
    ctx.quadraticCurveTo(s*0.22,-s*0.22,s,0);
    ctx.quadraticCurveTo(s*0.22,s*0.22,0,s);
    ctx.quadraticCurveTo(-s*0.22,s*0.22,-s,0);
    ctx.quadraticCurveTo(-s*0.22,-s*0.22,0,-s);
    ctx.fill();
    ctx.restore();
  }

  function draw(){
    var ph=session.skyPhase;
    /* sky gradient */
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,lerpC(DAY[0],SET[0],ph));
    g.addColorStop(0.55,lerpC(DAY[1],SET[1],ph));
    g.addColorStop(1,lerpC(DAY[2],SET[2],ph));
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
    /* sun */
    var sunX=W*0.76, sunY=lerp(H*0.14,H*0.64,ph), sunR=lerp(30,58,ph);
    var sg=ctx.createRadialGradient(sunX,sunY,2,sunX,sunY,sunR*4);
    var sunA=lerp(0.3,0.55,ph);
    sg.addColorStop(0,'rgba(255,'+Math.round(lerp(250,196,ph))+','+Math.round(lerp(225,120,ph))+','+sunA+')');
    sg.addColorStop(0.25,'rgba(255,'+Math.round(lerp(248,185,ph))+','+Math.round(lerp(215,110,ph))+','+(sunA*0.5)+')');
    sg.addColorStop(1,'rgba(255,220,160,0)');
    ctx.fillStyle=sg;
    ctx.fillRect(0,0,W,H);
    ctx.beginPath();
    ctx.fillStyle='rgba(255,'+Math.round(lerp(252,214,ph))+','+Math.round(lerp(235,150,ph))+','+lerp(0.75,0.9,ph)+')';
    ctx.arc(sunX,sunY,sunR*0.5,0,Math.PI*2);
    ctx.fill();
    /* clouds by layer */
    for(var l=0;l<3;l++){
      var la=LAYERS[l].alpha;
      for(var i=0;i<clouds.length;i++){
        var c=clouds[i];
        if(c.layer!==l) continue;
        var bob=c.amp?Math.sin(now*0.5+c.phase)*c.amp:0;
        var a=la;
        if(c.found){
          var ft=now-c.foundAt;
          if(ft>1.5) a*=clamp(1-(ft-1.5)/1.2,0,1);
        }
        ctx.globalAlpha=a;
        ctx.drawImage(c.sprite.cv,c.x-c.sprite.ox,c.y-c.sprite.oy+bob,c.sprite.w,c.sprite.h);
      }
    }
    ctx.globalAlpha=1;
    /* effects: sparkles + emoji ghost */
    for(var e=0;e<effects.length;e++){
      var ef=effects[e], c2=ef.c, t=ef.t;
      var prog=clamp(t/ef.dur,0,1);
      var envA=Math.sin(Math.PI*Math.min(prog*1.15,1));
      for(var p=0;p<ef.parts.length;p++){
        var pt=ef.parts[p];
        var dd=pt.d+pt.spd*t;
        var px=c2.x+Math.cos(pt.a)*dd;
        var py=c2.y+Math.sin(pt.a)*dd*0.75;
        var tw=0.5+0.5*Math.sin(t*8+pt.ph);
        drawSpark(px,py,pt.s,envA*tw*(ef.kind==='hint'?0.6:0.95),pt.ph+t*1.5);
      }
      if(ef.kind==='found' && t<2){
        var ga=Math.sin(Math.PI*Math.min(t/1.9,1))*0.6;
        ctx.save();
        ctx.globalAlpha=ga;
        ctx.font=Math.round(c2.unit*2.1)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.shadowColor='rgba(255,255,255,.95)';
        ctx.shadowBlur=26;
        ctx.fillText(SHAPES[c2.shape].emoji,c2.x,c2.y-t*6);
        ctx.restore();
      }
    }
    /* sunset warm wash */
    if(ph>0.01){
      var wg=ctx.createLinearGradient(0,0,0,H);
      wg.addColorStop(0,'rgba(96,74,158,'+(ph*0.14)+')');
      wg.addColorStop(0.6,'rgba(255,140,90,'+(ph*0.10)+')');
      wg.addColorStop(1,'rgba(255,150,70,'+(ph*0.22)+')');
      ctx.fillStyle=wg;
      ctx.fillRect(0,0,W,H);
    }
    /* viewfinder */
    if(session.active && !session.complete){
      var x=vf.x-vf.w/2, y=vf.y-vf.h/2, w=vf.w, h=vf.h, r=16;
      ctx.save();
      ctx.strokeStyle='rgba(255,255,255,.85)';
      ctx.lineWidth=1.6;
      ctx.shadowColor='rgba(80,110,160,.5)';
      ctx.shadowBlur=8;
      roundRect(x,y,w,h,r);
      ctx.stroke();
      /* corner brackets */
      ctx.lineWidth=4;
      ctx.lineCap='round';
      ctx.strokeStyle='#fff';
      var bl=20;
      ctx.beginPath();
      ctx.moveTo(x+bl,y); ctx.lineTo(x+r,y); ctx.quadraticCurveTo(x,y,x,y+r); ctx.lineTo(x,y+bl);
      ctx.moveTo(x+w-bl,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+bl);
      ctx.moveTo(x+bl,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+h-bl);
      ctx.moveTo(x+w-bl,y+h); ctx.lineTo(x+w-r,y+h); ctx.quadraticCurveTo(x+w,y+h,x+w,y+h-r); ctx.lineTo(x+w,y+h-bl);
      ctx.stroke();
      /* center dot */
      ctx.beginPath();
      ctx.fillStyle='rgba(255,255,255,.75)';
      ctx.arc(vf.x,vf.y,2.2,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  var lastT=0;
  function loop(ts){
    var t=ts/1000;
    var dt=Math.min(0.05,t-lastT||0.016);
    lastT=t; now=t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  /* ============================== input ============================== */
  function ptPos(ev){
    var r=cv.getBoundingClientRect();
    return {x:clamp(ev.clientX-r.left,0,W),y:clamp(ev.clientY-r.top,0,H)};
  }
  cv.addEventListener('pointerdown',function(ev){
    ev.preventDefault();
    /* preventDefault 가 호환 mousedown 을 막는 바람에 tabindex=0 캔버스가 클릭으로는
       초점을 못 받았다 — 헤더 버튼을 한 번 누르면 키보드 조작이 죽고 하늘을 눌러도
       안 돌아왔다. 명시적으로 준다. 포인터 조작이라 :focus-visible 링은 안 뜬다. */
    focusSky();
    AudioSys.init();
    pressed=true;
    var p=ptPos(ev);
    vf.tx=p.x; vf.ty=p.y;
    /* touch/pen have no hover phase, so a tap is the whole aim gesture — put the
       viewfinder on the tap point at once instead of easing in from the last tap. */
    if(ev.pointerType!=='mouse'){ vf.x=p.x; vf.y=p.y; }
    try{cv.setPointerCapture(ev.pointerId);}catch(e){}
  });
  cv.addEventListener('pointermove',function(ev){
    var p=ptPos(ev);
    vf.tx=p.x; vf.ty=p.y;
  });
  cv.addEventListener('pointerup',function(ev){
    if(pressed){
      pressed=false;
      shutter();
    }
  });
  cv.addEventListener('pointercancel',function(){pressed=false;});
  cv.addEventListener('contextmenu',function(ev){ev.preventDefault();});

  /* ---------- keyboard aiming (마우스·터치 경로와 병렬. 한 판을 키보드만으로 끝낼 수 있다) ---------- */
  var KEY_NUDGE=14;      /* 화살표 한 번 톡 = 14px */
  var KEY_SPD=380;       /* 누르고 있을 때 px/초 */
  var KEY_SPD_FINE=120;  /* Shift 를 같이 누르면 미세조정 */
  var keyHeld={}, keyHeldN=0, kbShift=false;
  function kbPlayable(){
    return session.active && !session.complete &&
      !introOv.classList.contains('show') && !doneOv.classList.contains('show');
  }
  function keyDir(k){
    if(k==='ArrowLeft'||k==='Left') return [-1,0];
    if(k==='ArrowRight'||k==='Right') return [1,0];
    if(k==='ArrowUp'||k==='Up') return [0,-1];
    if(k==='ArrowDown'||k==='Down') return [0,1];
    return null;
  }
  function kbSnap(){ vf.tx=clamp(vf.tx,0,W); vf.ty=clamp(vf.ty,0,H); vf.x=vf.tx; vf.y=vf.ty; }
  function onKeyDown(ev){
    if(ev.defaultPrevented||ev.ctrlKey||ev.metaKey||ev.altKey) return;
    var k=ev.key, d=keyDir(k);
    var shoot=(k==='Enter'||k===' '||k==='Spacebar');
    if(!d&&!shoot) return;
    if(!kbPlayable()) return;
    ev.preventDefault();
    AudioSys.init();
    kbShift=!!ev.shiftKey;
    if(d){
      if(!keyHeld[k]){ keyHeld[k]=d; keyHeldN++; }
      if(!ev.repeat){
        var st=ev.shiftKey?5:KEY_NUDGE;
        vf.tx+=d[0]*st; vf.ty+=d[1]*st; kbSnap();
      }
    }else{
      shutter();
    }
  }
  function onKeyUp(ev){
    if(keyHeld[ev.key]){ delete keyHeld[ev.key]; keyHeldN--; if(keyHeldN<0) keyHeldN=0; }
    kbShift=!!ev.shiftKey;
  }
  function kbReset(){ keyHeld={}; keyHeldN=0; kbShift=false; }
  function kbStep(dt){
    /* 누르고 있는 방향키를 프레임마다 반영. 대각선도 같은 속도로 움직인다. */
    if(!keyHeldN||!kbPlayable()) return;
    var kx=0,ky=0,kk;
    for(kk in keyHeld){ if(keyHeld.hasOwnProperty(kk)){ kx+=keyHeld[kk][0]; ky+=keyHeld[kk][1]; } }
    if(!kx&&!ky) return;
    var len=Math.sqrt(kx*kx+ky*ky)||1;
    var spd=kbShift?KEY_SPD_FINE:KEY_SPD;
    vf.tx+=(kx/len)*spd*dt; vf.ty+=(ky/len)*spd*dt;
    kbSnap();
  }
  cv.addEventListener('keydown',onKeyDown);
  cv.addEventListener('keyup',onKeyUp);
  cv.addEventListener('blur',kbReset);
  /* 초점이 body 로 떨어져 있어도 (예: 시작 버튼이 사라진 직후) 키가 먹게 한다 */
  document.addEventListener('keydown',function(ev){
    if(ev.target===cv||document.activeElement!==document.body) return;
    onKeyDown(ev);
  });
  document.addEventListener('keyup',function(ev){ if(ev.target!==cv) onKeyUp(ev); });
  window.addEventListener('blur',kbReset);
  function focusSky(){ try{ cv.focus({preventScroll:true}); }catch(e){ try{cv.focus();}catch(e2){} } }
  function focusIfIdle(el){
    /* 헤더 버튼 등 사용자가 직접 잡고 있는 초점은 뺏지 않는다.
       preventScroll — 가로모드처럼 카드가 화면보다 길면 브라우저가 초점을 화면에
       맞추려고 오버레이를 38px 내려버려서 카드 머리가 잘린 채로 뜬다. */
    try{ var a=document.activeElement; if(el&&(!a||a===document.body||a===cv)){
      try{ el.focus({preventScroll:true}); }catch(e2){ el.focus(); }
    } }catch(e){}
  }
  function returnFocusAfterTap(ev){
    /* 플레이 중 헤더 버튼을 손가락·마우스로 눌렀으면 초점을 하늘로 돌려준다.
       키보드로 활성화한 경우(detail===0)는 사용자가 잡고 있는 초점이므로 건드리지 않는다. */
    if(ev&&ev.detail>0&&kbPlayable()) focusSky();
  }

  /* ============================== i18n render ============================== */
  var NAMES={ ko:'구름 사진관', ja:'くも写真館', en:'Cloud Snap' };
  function otherNames(){
    return ['ko','ja','en'].filter(function(l){return l!==lang;})
      .map(function(l){return NAMES[l];}).join(' · ');
  }
  function applyLang(){
    var t=T();
    document.documentElement.lang=lang;
    $('titleMain').textContent=NAMES[lang];
    $('titleSub').textContent=otherNames();
    $('homeTxt').textContent=t.home;
    $('langBtn').textContent=LANG_BTN[lang];
    $('introTitle').textContent=t.introTitle;
    $('introDesc').textContent=t.introDesc;
    renderIntroDex();
    $('kbdHint').textContent='⌨️ '+t.kbdHint;
    cv.setAttribute('aria-label',t.skyAria);
    $('todayLabel').textContent=t.today;
    $('startBtn').textContent='📷 '+t.start;
    if(doneOv.classList.contains('show')){
      $('doneTitle').textContent=t.doneTitle;
      $('doneMsg').textContent=t.doneMsg;
      $('doneStats').textContent=t.shots.replace('{n}',session.shots);
      $('doneDex').textContent=dexLine();
      renderDexNext();
      $('againBtn').textContent='📷 '+t.again;
      $('doneHomeBtn').textContent=t.goHome;
      if(gaS.voteShown&&!gaS.voted) gaVoteShow(gaS.voteScene);
    }
  }
  $('langBtn').addEventListener('click',function(ev){
    lang=LANGS[(LANGS.indexOf(lang)+1)%LANGS.length];
    try{localStorage.setItem('in9-lang',lang);}catch(e){}
    applyLang();
    returnFocusAfterTap(ev);
  });

  /* ============================== sound toggle ============================== */
  function renderSoundBtn(){
    $('soundBtn').textContent=AudioSys.on?'🔊':'🔇';
  }
  $('soundBtn').addEventListener('click',function(ev){
    AudioSys.init();
    AudioSys.setOn(!AudioSys.on);
    try{localStorage.setItem('cloudsnap-sound',AudioSys.on?'1':'0');}catch(e){}
    renderSoundBtn();
    returnFocusAfterTap(ev);
  });

  /* ---- GA4 portal standard v1 (2026-08-19) ---- */
  var GA_GAME='cloud-snap';
  var gaS={started:false,completed:false,voted:false,voteShown:false,voteScene:'main',t0:0};
  function gaLang(){ try{ return lang||'ko'; }catch(e){ return 'ko'; } }
  function gaSend(name,p){ try{ if(typeof gtag!=='function')return; p=p||{}; p.game_id=GA_GAME; if(!p.lang)p.lang=gaLang(); gtag('event',name,p);}catch(e){} }
  function gaRoundStart(scene){ /* 판 시작마다 호출 */
    gaS.t0=Date.now();
    if(gaS.completed){ gaS.completed=false; gaSend('game_step',{step:'replay',scene:scene||'main'}); return; }
    if(gaS.started)return; gaS.started=true; gaSend('game_step',{step:'start',scene:scene||'main'});
  }
  function gaRoundComplete(scene,result,extra){ /* 판 완결마다 호출 (내부에서 판당 1회 보장) */
    if(gaS.completed)return; gaS.completed=true;
    var p={scene:scene||'main',result:result||'clear',play_sec:gaS.t0?Math.round((Date.now()-gaS.t0)/1000):0};
    if(extra){ for(var k in extra){ if(extra.hasOwnProperty(k))p[k]=extra[k]; } }
    gaSend('game_complete',p);
    gaVoteShow(p.scene);
  }
  var GA_VOTE_COPY={ko:{q:'또 할래?',yes:'응',no:'글쎄',thx:'고마워요!'},ja:{q:'また あそぶ？',yes:'うん',no:'うーん',thx:'ありがとう！'},en:{q:'Want another go?',yes:'Yes',no:'Not sure',thx:'Thanks!'}};
  function gaVoteShow(scene){
    var el=document.getElementById('gaVote'); if(!el||gaS.voted)return;
    var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
    el.querySelector('.ga-vote-q').textContent=c.q;
    el.querySelector('[data-choice="yes"]').textContent=c.yes;
    el.querySelector('[data-choice="unsure"]').textContent=c.no;
    gaS.voteScene=scene||'main'; gaS.voteShown=true; el.hidden=false; el.classList.remove('done');
  }
  (function(){ var el=document.getElementById('gaVote'); if(!el)return;
    el.addEventListener('click',function(e){
      var b=e.target; while(b&&b!==el&&!(b.getAttribute&&b.getAttribute('data-choice')))b=b.parentNode;
      if(!b||b===el||gaS.voted)return; gaS.voted=true;
      gaSend('game_vote',{scene:gaS.voteScene,choice:b.getAttribute('data-choice')});
      var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
      el.classList.add('done'); el.querySelector('.ga-vote-q').textContent=c.thx;
      setTimeout(function(){ el.hidden=true; },1200);
    });
  })();

  /* ============================== intro / restart ============================== */
  function showIntro(){
    var row=$('todayRow');
    row.innerHTML='';
    for(var i=0;i<session.targets.length;i++){
      var chip=document.createElement('div');
      chip.className='chip';
      chip.textContent=SHAPES[session.targets[i]].emoji;
      row.appendChild(chip);
    }
    renderIntroDex();
    introOv.classList.add('show');
    /* 인트로 동안 캔버스는 아무 동작도 안 한다 — 첫 Tab 이 빈 칸에 떨어지지 않게 뺀다 */
    cv.setAttribute('tabindex','-1');
  }
  $('startBtn').addEventListener('click',function(){
    AudioSys.init();
    introOv.classList.remove('show');
    session.active=true;
    lastFindOrHint=now;
    dexTouch();
    gaRoundStart('main');
    showToast('🔍 '+T().aim,3200);
    /* 시작 버튼이 사라지므로 초점을 하늘로 넘긴다 — 키보드만으로 이어서 플레이 */
    kbReset();
    cv.setAttribute('tabindex','0');
    focusSky();
  });
  $('againBtn').addEventListener('click',function(){
    doneOv.classList.remove('show');
    startSession();
    showIntro();
    kbReset();
    try{$('startBtn').focus();}catch(e){}
  });

  document.addEventListener('visibilitychange',function(){
    if(!AudioSys.ctx) return;
    if(document.hidden){
      AudioSys.ctx.suspend().catch(function(){});
    }else if(AudioSys.on||true){
      AudioSys.resume();
    }
  });

  /* ============================== boot ============================== */
  window.addEventListener('resize',resize);
  resize();
  vf.x=vf.tx=W/2; vf.y=vf.ty=H/2;
  renderSoundBtn();
  startSession();
  applyLang();
  showIntro();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
