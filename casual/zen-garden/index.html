<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2117">
<title>모래정원 빗질 · Zen Rake Garden</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🪷</text></svg>">
<style>
:root{
  --sand:#E8DCC8; --sand-hi:#F5ECD9; --sand-lo:#D8C8AC;
  --wood:#5d4630; --wood-hi:#77593c; --wood-lo:#3a2c1d;
  --moss:#6b7f4f; --moss-hi:#84996a; --moss-lo:#4d6136;
  --ink:#efe6d2; --ink-dim:#c4b394; --paper:#f6eedb;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Apple SD Gothic Neo','Noto Serif KR','Hiragino Mincho ProN',Georgia,'Malgun Gothic',serif;
  background:
    radial-gradient(140% 90% at 50% -20%, #4a3a26 0%, #33271a 45%, #1e1710 100%);
  color:var(--ink);
  overflow-x:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
#app{
  min-height:100vh;      /* dvh 미지원(iOS 15.3 이하) 폴백 */
  min-height:100dvh;
  display:flex;flex-direction:column;
  max-width:720px;margin:0 auto;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  gap:8px;
}
/* ---------- header ---------- */
header{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:4px 2px;
}
.home{
  color:var(--ink-dim);text-decoration:none;font-size:.85rem;white-space:nowrap;
  padding:7px 12px;border-radius:999px;
  background:rgba(255,244,220,.07);border:1px solid rgba(255,244,220,.12);
  transition:background .25s,color .25s;
}
.home:hover{background:rgba(255,244,220,.14);color:var(--ink)}
.titles{text-align:center;flex:1;min-width:0}
.titles h1{
  font-size:clamp(1.12rem,4.6vw,1.55rem);font-weight:700;letter-spacing:.06em;
  color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.4);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.titles .sub{
  font-size:.66rem;color:var(--ink-dim);letter-spacing:.08em;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbtns{display:flex;gap:6px}
.chip{
  position:relative;
  border:1px solid rgba(255,244,220,.14);background:rgba(255,244,220,.07);
  color:var(--ink);border-radius:999px;padding:7px 10px;font-size:.8rem;
  cursor:pointer;white-space:nowrap;transition:background .25s,transform .15s;
  font-family:inherit;
}
/* 칩은 37px 로 보이지만 손가락은 44x44 를 잡는다. 세로 패딩을 키우면 헤더가 커진 만큼
   모래밭이 깎이므로 보이는 크기는 두고 히트 영역만 넓힌다(칩 사이 gap 6px 안에서 겹치지 않음). */
.chip::after{
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:max(100%,44px);height:44px;border-radius:999px;
}
.chip:hover{background:rgba(255,244,220,.15)}
.chip:active{transform:scale(.94)}
/* ---------- garden frame ---------- */
#frame{
  position:relative;flex:1;min-height:300px;
  /* #app 은 min-height 만 있어 높이가 '불확정' — 그래서 예전 #stage{height:100%} 가
     해소되지 않고 캔버스가 기본 300×150 비율로 무너져 트레이에 죽은 나무판이 생겼다.
     프레임→스테이지→캔버스를 전부 flex stretch 로 이어 백분율 의존을 없앤다. */
  display:flex;
  border-radius:22px;padding:13px;
  background:
    linear-gradient(160deg, rgba(255,235,200,.10), rgba(0,0,0,.22)),
    repeating-linear-gradient(93deg,#6a5138 0 15px,#5c452e 15px 27px,#664d33 27px 44px),
    var(--wood);
  box-shadow:
    0 18px 44px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,240,210,.18),
    inset 0 -3px 8px rgba(0,0,0,.35);
}
#stage{position:relative;display:flex;flex:1 1 0;min-width:0;border-radius:12px;overflow:hidden;background:var(--sand)}
#garden{display:block;flex:1 1 0;min-width:0;height:auto;touch-action:none;cursor:crosshair}
#stage::after{
  content:'';position:absolute;inset:0;border-radius:12px;pointer-events:none;
  box-shadow:inset 0 6px 20px rgba(92,64,32,.38), inset 0 -3px 10px rgba(92,64,32,.18), inset 0 0 2px rgba(60,40,20,.5);
}
#veil{
  position:absolute;inset:0;border-radius:12px;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,var(--sand-hi),var(--sand) 55%,var(--sand-lo));
  transition:opacity .6s ease;z-index:3;
}
#veil.show{opacity:1}
/* ---------- hint ---------- */
/* 투표 알약이 이 줄 위에 겹쳐 뜬다. 알약 높이(실측 46.8px)에서 위아래 flex gap(8+8)을 뺀
   만큼 최소 높이를 미리 잡아 두면, 알약이 나타나도 트레이 높이가 변하지 않는다
   (= 리플로우로 그린 그림이 다시 스케일되는 일이 없다).
   38px = 46.8 − 16 + 위아래 여유 3.6px씩. */
#hintRow{
  position:relative;min-height:38px;
  display:flex;align-items:center;justify-content:center;
}
#hint{
  text-align:center;font-size:.7rem;color:var(--ink-dim);letter-spacing:.03em;
  line-height:1.5;padding:0 6px;
}
/* 1줄(오늘의 과제) + 1줄(조작 안내) = 33.6px < 예약된 38px. 두 줄을 넘기면 모래밭이 깎이므로
   문구는 375px 폭에서 각각 한 줄 안에 들어가야 한다(3개 국어 실측 완료). */
#hintTask{display:block;color:var(--paper);opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hintTask:empty{display:none}
#hintBase{display:block}
/* ---------- controls ---------- */
#controls{display:flex;flex-direction:column;gap:8px}
#tray{
  /* gap 6 이면 7칸이 341px 안으로 눌려 도구 하나가 43.3px(44 미달)이 된다. 5 로 줄이면 44.4px. */
  display:flex;gap:5px;justify-content:center;flex-wrap:nowrap;
  padding:7px;border-radius:18px;
  background:linear-gradient(180deg,rgba(255,240,210,.08),rgba(0,0,0,.16));
  border:1px solid rgba(255,240,210,.1);
}
.tool{
  position:relative;
  width:48px;height:48px;flex:0 1 48px;border-radius:14px;cursor:pointer;
  background:linear-gradient(180deg,#f7efdd,#e5d6ba);
  border:1px solid #b9a47f;
  box-shadow:0 3px 6px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
  padding:0;
}
.tool canvas{width:40px;height:40px;display:block;pointer-events:none}
/* 좁은 폭(320px)에서 도구가 42px 로 눌려도 손가락은 44px 를 잡는다. gap 5px 안이라 이웃과 겹치지 않는다. */
.tool::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100%,44px);height:max(100%,44px);border-radius:14px}
.tool:active{transform:scale(.9)}
.tool.sel{
  background:linear-gradient(180deg,#e9f0d8,#cdd9b2);
  border-color:var(--moss);
  box-shadow:0 0 0 2px var(--moss), 0 4px 10px rgba(77,97,54,.45), inset 0 1px 0 rgba(255,255,255,.6);
  transform:translateY(-2px);
}
#row2{display:flex;gap:8px;align-items:stretch;justify-content:center;flex-wrap:wrap}
#tineWrap{
  /* 44px 갈퀴 버튼을 담고도 줄 높이를 44 로 유지: 세로 패딩 0 + 테두리는 inset shadow.
     border 1px 를 쓰면 46px 이 되어 #row2 가 2px 자라고 그만큼 모래밭(346px)이 깎인다. */
  display:flex;align-items:center;gap:5px;padding:0 9px;border-radius:14px;
  background:rgba(255,240,210,.06);border:none;
  box-shadow:inset 0 0 0 1px rgba(255,240,210,.09);
}
#tineWrap .lbl{font-size:.64rem;color:var(--ink-dim);margin-right:2px;letter-spacing:.03em}
.tine{
  width:44px;height:44px;border-radius:12px;cursor:pointer;border:1px solid rgba(255,240,210,.14);
  background:rgba(255,240,210,.06);color:var(--ink-dim);
  display:flex;align-items:center;justify-content:center;gap:2.5px;
  transition:transform .15s, background .2s;padding:0;
}
.tine i{display:block;width:2px;height:17px;background:currentColor;border-radius:1px}
.tine:active{transform:scale(.92)}
.tine.sel{background:var(--moss-lo);color:#e8f0d8;border-color:var(--moss-hi);box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.act{
  border-radius:14px;padding:10px 16px;font-size:.85rem;cursor:pointer;font-family:inherit;
  letter-spacing:.03em;transition:transform .15s, filter .2s;border:1px solid transparent;
  display:flex;align-items:center;gap:6px;
}
.act:active{transform:scale(.95)}
#resetBtn{
  background:linear-gradient(180deg,rgba(255,240,210,.1),rgba(255,240,210,.03));
  border-color:rgba(255,240,210,.16);color:var(--ink);
}
#resetBtn:hover{filter:brightness(1.15)}
#saveBtn{
  background:linear-gradient(180deg,var(--moss-hi),var(--moss-lo));
  color:#f3f7e8;box-shadow:0 4px 12px rgba(60,80,40,.45), inset 0 1px 0 rgba(255,255,255,.25);
}
#saveBtn:hover{filter:brightness(1.08)}
/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
  background:rgba(38,30,20,.92);color:var(--paper);border:1px solid rgba(255,240,210,.2);
  padding:10px 20px;border-radius:999px;font-size:.83rem;letter-spacing:.02em;
  opacity:0;pointer-events:none;transition:opacity .4s ease, transform .4s ease;
  box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap;z-index:40;max-width:92vw;
  overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- confirm ---------- */
#confirm{
  position:fixed;inset:0;background:rgba(18,13,8,.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:50;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
#confirm.show{opacity:1;pointer-events:auto}
.card{
  background:linear-gradient(180deg,var(--paper),#eadfc4);color:#4a3a25;
  border-radius:20px;padding:26px 28px;max-width:300px;width:86vw;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.8);
  transform:translateY(8px) scale(.97);transition:transform .3s cubic-bezier(.34,1.4,.64,1);
}
#confirm.show .card{transform:none}
.card h2{font-size:1.05rem;margin-bottom:8px;letter-spacing:.04em}
.card p{font-size:.8rem;color:#7c6b4e;margin-bottom:18px;line-height:1.5}
.card .btns{display:flex;gap:8px;justify-content:center}
.card button{
  flex:1;border-radius:12px;padding:10px 8px;font-size:.85rem;cursor:pointer;font-family:inherit;
  border:1px solid #c5b28c;transition:transform .15s,filter .2s;
}
.card button:active{transform:scale(.95)}
#cfYes{background:linear-gradient(180deg,var(--moss-hi),var(--moss-lo));border-color:var(--moss-lo);color:#f3f7e8}
#cfNo{background:#fbf5e6;color:#6a5738}
/* ---------- responsive ---------- */
@media (min-width:600px){
  #app{padding:16px 18px}
  .tool{width:54px;height:54px;flex-basis:54px}
  #hint{font-size:.76rem}
}
@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01s !important;animation:none !important}
  #veil{transition-duration:.01s}
}
/* ---------- focus (키보드 병렬 경로) ---------- */
#garden:focus-visible{outline:3px solid var(--moss-hi);outline-offset:-3px}
.home:focus-visible,.chip:focus-visible,.tool:focus-visible,.tine:focus-visible,
.act:focus-visible,.card button:focus-visible,.ga-vote-btn:focus-visible{
  outline:3px solid var(--moss-hi);outline-offset:2px;
}
/* ---------- ga vote ---------- */
/* 트레이(#frame) 바깥, 도구줄 바로 위 힌트 줄에 겹쳐 띄운다.
   모래 위에 두면 방금 「사진 저장」으로 담은 정원을 정확히 덮는다(실측 46.8px 전부 겹침).
   알약이 떠 있는 동안에는 힌트 문구를 숨겨(아래 형제 선택자) 글자가 옆으로 삐져나오지 않게 한다.
   래퍼는 pointer-events:none — 버튼 두 개만 입력을 받는다. */
.ga-vote{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;gap:8px;z-index:6;max-width:calc(100% - 16px);
  background:rgba(38,30,20,.92);border:1px solid rgba(255,240,210,.2);color:var(--paper);
  padding:7px 9px 7px 15px;border-radius:999px;font-size:14px;line-height:1.2;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;
}
.ga-vote[hidden]{display:none}
.ga-vote:not([hidden]) ~ #hint{visibility:hidden}
.ga-vote-btn{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.85;-webkit-tap-highlight-color:transparent;pointer-events:auto}
.ga-vote-btn:active{opacity:1}
.ga-vote.done .ga-vote-btn{display:none}
.ga-vote.done{padding:7px 15px}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="home" href="../../index.html">← <span id="homeTxt">홈</span></a>
    <div class="titles">
      <h1 id="titleMain">모래정원 빗질</h1>
      <div class="sub" id="titleSub">枯山水にわ · Zen Rake Garden</div>
    </div>
    <div class="topbtns">
      <button class="chip" id="soundBtn" aria-label="sound">🔊</button>
      <button class="chip" id="langBtn" aria-label="language">🇰🇷 KO</button>
    </div>
  </header>

  <div id="frame">
    <div id="stage">
      <canvas id="garden" tabindex="0" role="application" aria-describedby="hint"></canvas>
      <div id="veil"></div>
    </div>
  </div>

  <div id="hintRow">
    <div class="ga-vote" id="gaVote" hidden>
      <span class="ga-vote-q">또 할래?</span>
      <button type="button" class="ga-vote-btn" data-choice="yes">응</button>
      <button type="button" class="ga-vote-btn" data-choice="unsure">글쎄</button>
    </div>
    <div id="hint"><span id="hintTask"></span><span id="hintBase"></span></div>
  </div>

  <div id="controls">
    <div id="tray">
      <button class="tool sel" data-tool="rake"><canvas data-icon="rake"></canvas></button>
      <button class="tool" data-tool="stone0"><canvas data-icon="stone0"></canvas></button>
      <button class="tool" data-tool="stone1"><canvas data-icon="stone1"></canvas></button>
      <button class="tool" data-tool="stone2"><canvas data-icon="stone2"></canvas></button>
      <button class="tool" data-tool="moss"><canvas data-icon="moss"></canvas></button>
      <button class="tool" data-tool="leaf"><canvas data-icon="leaf"></canvas></button>
      <button class="tool" data-tool="lantern"><canvas data-icon="lantern"></canvas></button>
    </div>
    <div id="row2">
      <div id="tineWrap">
        <span class="lbl" id="tineLbl">갈퀴 굵기</span>
        <button class="tine" data-n="2"><i></i><i></i></button>
        <button class="tine sel" data-n="3"><i></i><i></i><i></i></button>
        <button class="tine" data-n="4"><i></i><i></i><i></i><i></i></button>
        <button class="tine" data-n="5"><i></i><i></i><i></i><i></i><i></i></button>
      </div>
      <button class="act" id="resetBtn">〰 <span id="resetTxt">모래 고르기</span></button>
      <button class="act" id="saveBtn">📷 <span id="saveTxt">사진 저장</span></button>
    </div>
  </div>
</div>

<div id="toast"></div>

<div id="confirm">
  <div class="card">
    <h2 id="cfTitle">모래를 고를까요?</h2>
    <p id="cfBody">정원이 처음처럼 비워져요.</p>
    <div class="btns">
      <button id="cfNo">그대로 두기</button>
      <button id="cfYes">고르기</button>
    </div>
  </div>
</div>

/* ---------------- utils ---------------- */
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let z = Math.imul(a ^ a>>>15, 1 | a);
    z = z + Math.imul(z ^ z>>>7, 61 | z) ^ z;
    return ((z ^ z>>>14)>>>0)/4294967296;
  };
}
/* 사용자 활성화가 살아 있을 때만 진동 — 없으면 Chrome 이 콘솔에 intervention 로그를 남긴다.
   userActivation 미지원 브라우저에서는 그대로 호출(구형 안드로이드). */
function buzz(ms){
  try{
    if(!navigator.vibrate) return;
    if(navigator.userActivation && !navigator.userActivation.isActive) return;
    navigator.vibrate(ms);
  }catch(e){}
}
function rr(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}

/* ---------------- canvas setup ---------------- */
const stage  = $('#stage');
const canvas = $('#garden');
const ctx    = canvas.getContext('2d');
const sandC  = document.createElement('canvas');
const sc     = sandC.getContext('2d');
const vignC  = document.createElement('canvas');
const dpr    = clamp(window.devicePixelRatio||1, 1, 2.5);
let W=0, H=0;

const SAND = {
  top:'#F0E5D0', mid:'#E8DCC8', bot:'#DECFB2',
  base:'rgba(233,221,199,0.55)',
  dark:'rgba(128,106,79,0.5)',
  core:'rgba(108,88,64,0.45)',
  light:'rgba(255,249,232,0.8)'
};
const TINE_SP = 9;

/* ---------------- state ---------------- */
let marks   = [];   // timeline: {k:'s',n,pts:[x,y,...]} | {k:'r',x,y,r0,c}
let objects = [];   // {t,v,x,y,seed,r,rot,s,ci,born}

let tines   = 3;
let dirty   = true;

/* 키보드 병렬 경로 커서. on=포커스 중, pen=갈퀴를 모래에 대고 있는 상태. */
let kb = {on:false, pen:false, hide:false, x:0, y:0};
let kbStroke = null;
let dailyS = {d:'', c:0, done:false};

/* ---------------- sand base ---------------- */
function initSand(){
  const g = sc;
  g.setTransform(dpr,0,0,dpr,0,0);
  const grd = g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0, SAND.top);
  grd.addColorStop(.55, SAND.mid);
  grd.addColorStop(1, SAND.bot);
  g.fillStyle = grd;
  g.fillRect(0,0,W,H);
  // soft organic blotches
  const rnd = mulberry32(20260720);
  for(let i=0;i<14;i++){
    const x=rnd()*W, y=rnd()*H, r=40+rnd()*110;
    const bg = g.createRadialGradient(x,y,0,x,y,r);
    const dark = rnd()<.5;
    bg.addColorStop(0, dark?'rgba(150,128,100,0.05)':'rgba(255,248,230,0.06)');
    bg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=bg; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  }
  // grain speckles
  const n = Math.floor(W*H/150);
  for(let i=0;i<n;i++){
    const x=rnd()*W, y=rnd()*H;
    g.fillStyle = rnd()<.5 ? 'rgba(140,118,90,0.06)' : 'rgba(255,250,235,0.07)';
    g.fillRect(x,y, .7+rnd()*.9, .7+rnd()*.9);
  }
}

function renderVignette(){
  vignC.width = Math.round(W*dpr); vignC.height = Math.round(H*dpr);
  const g = vignC.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  const rad = g.createRadialGradient(W/2,H/2, Math.min(W,H)*.42, W/2,H/2, Math.max(W,H)*.78);
  rad.addColorStop(0,'rgba(0,0,0,0)');
  rad.addColorStop(1,'rgba(88,62,32,0.2)');
  g.fillStyle=rad; g.fillRect(0,0,W,H);
  const topl = g.createLinearGradient(0,0,0,70);
  topl.addColorStop(0,'rgba(255,250,235,0.12)');
  topl.addColorStop(1,'rgba(255,250,235,0)');
  g.fillStyle=topl; g.fillRect(0,0,W,70);
}

/* ---------------- rake strokes ---------------- */
function line(g,x0,y0,x1,y1){ g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke(); }

function rakeSeg(x0,y0,x1,y1,n){
  const dx=x1-x0, dy=y1-y0;
  const len=Math.hypot(dx,dy); if(len<0.4) return;
  const nx=-dy/len, ny=dx/len;
  const g=sc;
  g.lineCap='round'; g.lineJoin='round';
  // base swath — the rake's flat body smooths older marks
  g.strokeStyle=SAND.base;
  g.lineWidth=TINE_SP*n+5;
  line(g,x0,y0,x1,y1);
  const half=(n-1)/2;
  for(let i=0;i<n;i++){
    const o=(i-half)*TINE_SP, ox=nx*o, oy=ny*o;
    g.lineWidth=3.1; g.strokeStyle=SAND.dark;
    line(g, x0+ox, y0+oy+1.4, x1+ox, y1+oy+1.4);
    g.lineWidth=1.7; g.strokeStyle=SAND.core;
    line(g, x0+ox, y0+oy+0.4, x1+ox, y1+oy+0.4);
    g.lineWidth=2.1; g.strokeStyle=SAND.light;
    line(g, x0+ox, y0+oy-1.2, x1+ox, y1+oy-1.2);
  }
  dirty=true;
}

function ringMark(m){
  const g=sc;
  g.lineCap='round';
  for(let i=0;i<m.c;i++){
    const r=m.r0+i*12;
    g.strokeStyle=SAND.base; g.lineWidth=9;
    g.beginPath(); g.arc(m.x,m.y,r,0,Math.PI*2); g.stroke();
    g.strokeStyle=SAND.dark; g.lineWidth=2.6;
    g.beginPath(); g.arc(m.x,m.y+1.3,r,0,Math.PI*2); g.stroke();
    g.strokeStyle=SAND.light; g.lineWidth=2;
    g.beginPath(); g.arc(m.x,m.y-1.1,r,0,Math.PI*2); g.stroke();
  }
  dirty=true;
}

function replay(){
  initSand();
  for(const m of marks){
    if(m.k==='s'){
      const p=m.pts;
      if(p.length===2) rakeSeg(p[0],p[1],p[0]+2,p[1]+1,m.n);
      for(let i=2;i<p.length;i+=2) rakeSeg(p[i-2],p[i-1],p[i],p[i+1],m.n);
    }else if(m.k==='r'){
      ringMark(m);
    }
  }
  dirty=true;
}

/* ---------------- object drawing ---------------- */
function blobPath(g, rx, ry, seed){
  const rnd=mulberry32(seed);
  const ph1=rnd()*Math.PI*2, ph2=rnd()*Math.PI*2;
  const a1=.09+rnd()*.07, a2=.04+rnd()*.05;
  const K=16, pts=[];
  for(let i=0;i<K;i++){
    const a=i/K*Math.PI*2;
    const f=1 + a1*Math.sin(3*a+ph1) + a2*Math.sin(5*a+ph2);
    pts.push([Math.cos(a)*rx*f, Math.sin(a)*ry*f]);
  }
  g.beginPath();
  let mx=(pts[K-1][0]+pts[0][0])/2, my=(pts[K-1][1]+pts[0][1])/2;
  g.moveTo(mx,my);
  for(let i=0;i<K;i++){
    const p=pts[i], q=pts[(i+1)%K];
    g.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2);
  }
  g.closePath();
}

function softShadow(g, x, y, rx, ry, a){
  const sh=g.createRadialGradient(x,y,0,x,y,rx);
  sh.addColorStop(0,'rgba(86,64,38,'+a+')');
  sh.addColorStop(1,'rgba(86,64,38,0)');
  g.save();
  g.translate(x,y); g.scale(1, ry/rx); g.translate(-x,-y);
  g.fillStyle=sh; g.beginPath(); g.arc(x,y,rx,0,Math.PI*2); g.fill();
  g.restore();
}

function drawStone(g,o){
  const dims=[[1,.82],[.6,1.3],[1.45,.58]][o.v];
  const rx=o.r*dims[0], ry=o.r*dims[1];
  g.save();
  g.translate(o.x,o.y);
  softShadow(g, 2, ry*.78, rx*1.15, ry*.42, .3);
  g.rotate(o.rot);
  blobPath(g, rx, ry, o.seed);
  const body=g.createRadialGradient(-rx*.35,-ry*.5, o.r*.15, 0,0, Math.max(rx,ry)*1.35);
  body.addColorStop(0,'#aba295');
  body.addColorStop(.55,'#837b6e');
  body.addColorStop(1,'#575147');
  g.fillStyle=body; g.fill();
  g.save();
  g.clip();
  const hl=g.createRadialGradient(-rx*.4,-ry*.55,0,-rx*.4,-ry*.55,Math.max(rx,ry)*.9);
  hl.addColorStop(0,'rgba(255,250,238,0.3)');
  hl.addColorStop(1,'rgba(255,250,238,0)');
  g.fillStyle=hl; g.fillRect(-rx*1.6,-ry*1.6,rx*3.2,ry*3.2);
  const rnd=mulberry32(o.seed+7);
  for(let i=0;i<9;i++){
    g.fillStyle = rnd()<.5?'rgba(40,34,28,0.12)':'rgba(240,235,225,0.12)';
    g.beginPath();
    g.arc((rnd()-.5)*rx*1.6,(rnd()-.5)*ry*1.6, .8+rnd()*1.6, 0, Math.PI*2);
    g.fill();
  }
  g.restore();
  g.restore();
}

function drawMoss(g,o){
  const rnd=mulberry32(o.seed);
  g.save();
  g.translate(o.x,o.y);
  softShadow(g, 1, o.r*.5, o.r*1.2, o.r*.5, .24);
  for(let i=0;i<7;i++){
    const dx=(rnd()-.5)*o.r*1.25, dy=(rnd()-.5)*o.r*.85, cr=o.r*(.36+rnd()*.3);
    const mg=g.createRadialGradient(dx-cr*.35,dy-cr*.4,cr*.1,dx,dy,cr);
    mg.addColorStop(0,'#97ab66');
    mg.addColorStop(.6,'#617546');
    mg.addColorStop(1,'#47572e');
    g.fillStyle=mg;
    g.beginPath(); g.arc(dx,dy,cr,0,Math.PI*2); g.fill();
  }
  for(let i=0;i<12;i++){
    g.fillStyle='rgba(190,208,130,0.5)';
    g.beginPath();
    g.arc((rnd()-.5)*o.r*1.4,(rnd()-.5)*o.r, .7+rnd()*.9, 0, Math.PI*2);
    g.fill();
  }
  g.restore();
}

const LEAF_ANG=[-170,-150,-130,-110,-90,-70,-50,-30,-10].map(d=>d*Math.PI/180);
const LEAF_F  =[.72,.42,.9,.46,1,.46,.9,.42,.72];
const LEAF_COL=[['#cf6a33','#9d3a1c'],['#c14e28','#87301a'],['#d98a3a','#aa561f']];

function drawLeaf(g,o){
  g.save();
  g.translate(o.x,o.y);
  softShadow(g, 2, 4, o.r*.95, o.r*.45, .18);
  g.rotate(o.rot);
  const r=o.r, col=LEAF_COL[o.ci];
  const lg=g.createLinearGradient(0,-r,0,r*.6);
  lg.addColorStop(0,col[0]); lg.addColorStop(1,col[1]);
  g.fillStyle=lg;
  g.beginPath();
  g.moveTo(0,r*.55);
  for(let i=0;i<LEAF_ANG.length;i++){
    const f=r*LEAF_F[i];
    g.lineTo(Math.cos(LEAF_ANG[i])*f, Math.sin(LEAF_ANG[i])*f);
  }
  g.closePath();
  g.fill();
  g.strokeStyle='rgba(122,42,16,0.35)';
  g.lineWidth=1;
  for(let i=0;i<LEAF_ANG.length;i+=2){
    const f=r*LEAF_F[i]*.78;
    line(g, 0, r*.18, Math.cos(LEAF_ANG[i])*f, Math.sin(LEAF_ANG[i])*f);
  }
  g.strokeStyle='#7c3c1c'; g.lineWidth=1.8; g.lineCap='round';
  line(g, 0, r*.5, 0, r*.95);
  g.restore();
}

function drawLantern(g,o){
  const s=o.s||1;
  g.save();
  g.translate(o.x,o.y);
  g.scale(s,s);
  softShadow(g, 2, 3, 30, 11, .3);
  const grad=(y0,y1,l,m,d)=>{
    const gr=g.createLinearGradient(-20,y0,20,y1);
    gr.addColorStop(0,l); gr.addColorStop(.5,m); gr.addColorStop(1,d);
    return gr;
  };
  const L='#aca69b', M='#847d72', D='#5a544b';
  // base slab
  rr(g,-19,-10,38,10,3); g.fillStyle=grad(-10,0,L,M,D); g.fill();
  // pedestal
  rr(g,-7,-31,14,22,2); g.fillStyle=grad(-31,-9,M,'#767065',D); g.fill();
  // middle slab
  rr(g,-14,-37,28,7,3); g.fillStyle=grad(-37,-30,L,M,D); g.fill();
  // firebox
  rr(g,-11,-57,22,21,2); g.fillStyle=grad(-57,-36,L,M,D); g.fill();
  // window glow
  const glow=g.createRadialGradient(0,-47,1,0,-47,15);
  glow.addColorStop(0,'rgba(255,206,128,0.85)');
  glow.addColorStop(.5,'rgba(255,190,110,0.25)');
  glow.addColorStop(1,'rgba(255,190,110,0)');
  g.fillStyle=glow; g.beginPath(); g.arc(0,-47,15,0,Math.PI*2); g.fill();
  rr(g,-5,-54,10,15,1.5);
  const wg=g.createLinearGradient(0,-54,0,-39);
  wg.addColorStop(0,'#ffdfa6'); wg.addColorStop(.5,'#f7bd6b'); wg.addColorStop(1,'#c88a45');
  g.fillStyle=wg; g.fill();
  // roof
  g.beginPath();
  g.moveTo(-26,-56);
  g.quadraticCurveTo(-13,-59,-3,-72);
  g.lineTo(3,-72);
  g.quadraticCurveTo(13,-59,26,-56);
  g.quadraticCurveTo(0,-62,-26,-56);
  g.closePath();
  const rg=g.createLinearGradient(0,-72,0,-55);
  rg.addColorStop(0,'#938d82'); rg.addColorStop(1,'#4d483f');
  g.fillStyle=rg; g.fill();
  g.strokeStyle='rgba(255,252,240,0.18)'; g.lineWidth=1;
  g.beginPath();
  g.moveTo(-25,-56.5);
  g.quadraticCurveTo(-13,-59.5,-3,-72);
  g.stroke();
  // finial
  g.fillStyle=M;
  g.fillRect(-1.5,-75,3,4);
  g.beginPath(); g.arc(0,-77.5,3.4,0,Math.PI*2);
  g.fillStyle=grad(-81,-74,L,M,D); g.fill();
  g.restore();
}

function drawObject(g,o){
  let k=1;
  if(o.born && !RM){
    k=clamp((performance.now()-o.born)/280, 0, 1);
    if(k<1){
      const c=1.70158, kk=k-1;
      k=1+(kk*kk*((c+1)*kk+c)); // easeOutBack
      k=.6+.4*clamp(k,0,1.25);
    }
  }
  /* 짧은 탭의 튕김. 등장 이징(0.6배 출발)을 재사용하면 '눌렀더니 작아졌다'로 읽히므로
     1 → 1.13 → 1 로만 부풀린다. 배치 직후 등장 이징이 우선. */
  if(k===1 && o.nudge && !RM){
    const q=clamp((performance.now()-o.nudge)/260, 0, 1);
    if(q<1) k=1+.13*Math.sin(Math.PI*q);
  }
  if(k!==1){
    g.save();
    g.translate(o.x,o.y); g.scale(k,k); g.translate(-o.x,-o.y);
  }
  if(o.t==='stone') drawStone(g,o);
  else if(o.t==='moss') drawMoss(g,o);
  else if(o.t==='leaf') drawLeaf(g,o);
  else if(o.t==='lantern') drawLantern(g,o);
  if(k!==1) g.restore();
}

/* ---------------- render loop ---------------- */
let lpTimer=0, lpStart=0, lpTarget=null;

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.drawImage(sandC,0,0,W,H);
  const sorted=[...objects].sort((a,b)=>a.y-b.y);
  for(const o of sorted) drawObject(ctx,o);
  const now=performance.now();
  for(const p of parts){
    ctx.globalAlpha=clamp(1-p.age/p.life,0,1)*.85;
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  if(lpTimer && lpTarget && now-lpStart>140){
    const prog=clamp((now-lpStart)/560,0,1);
    const cy=lpTarget.y+(lpTarget.hy||0);
    ctx.strokeStyle='rgba(255,252,240,0.75)';
    ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath();
    ctx.arc(lpTarget.x, cy, (lpTarget.hr||30)+8, -Math.PI/2, -Math.PI/2+prog*Math.PI*2);
    ctx.stroke();
  }
  if(kb.on && !kb.hide){
    ctx.save();
    ctx.lineCap='round';
    ctx.strokeStyle = kb.pen ? 'rgba(70,92,48,0.95)' : 'rgba(72,54,32,0.6)';
    ctx.lineWidth = kb.pen ? 3 : 2;
    ctx.beginPath(); ctx.arc(kb.x,kb.y,11,0,Math.PI*2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(kb.x-18,kb.y); ctx.lineTo(kb.x-6,kb.y);
    ctx.moveTo(kb.x+6,kb.y);  ctx.lineTo(kb.x+18,kb.y);
    ctx.moveTo(kb.x,kb.y-18); ctx.lineTo(kb.x,kb.y-6);
    ctx.moveTo(kb.x,kb.y+6);  ctx.lineTo(kb.x,kb.y+18);
    ctx.stroke();
    ctx.strokeStyle='rgba(255,252,240,0.85)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(kb.x,kb.y,11,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  ctx.drawImage(vignC,0,0,W,H);
  dirty=false;
}

let lastTick=0;
function tick(ts){
  const dt=Math.min(.05,(ts-lastTick)/1000||0.016);
  lastTick=ts;
  if(parts.length){
    for(const p of parts){
      p.age+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=170*dt;
    }
    parts=parts.filter(p=>p.age<p.life);
    dirty=true;
  }
  const now=performance.now();
  if(objects.some(o=>(o.born && now-o.born<300) || (o.nudge && now-o.nudge<280))) dirty=true;
  if(lpTimer) dirty=true;
  if(SFX.raking && now-SFX.lastMove>150) SFX.rakeQuiet();
  if(dirty) render();
  requestAnimationFrame(tick);
}

function puffAt(x,y,n,col){
  if(RM) return;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=30+Math.random()*80;
    parts.push({
      x:x+(Math.random()-.5)*8, y:y+(Math.random()-.5)*8,
      vx:Math.cos(a)*v, vy:Math.sin(a)*v-40,
      r:1.2+Math.random()*2.2, age:0, life:.5+Math.random()*.4,
      col: col||'rgba(214,196,164,1)'
    });
  }
}

/* ---------------- audio ---------------- */
const SFX={
  ac:null, master:null, rakeGain:null, rakeBP:null,
  on:true, raking:false, lastMove:0,
  ensure(){
    if(this.ac){ if(this.ac.state==='suspended') this.ac.resume().catch(()=>{}); return; }
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    try{
      this.ac=new AC();
      this.master=this.ac.createGain();
      this.master.gain.value=this.on?0.9:0;
      this.master.connect(this.ac.destination);
      const len=this.ac.sampleRate*1.5;
      const buf=this.ac.createBuffer(1,len,this.ac.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      const src=this.ac.createBufferSource();
      src.buffer=buf; src.loop=true;
      this.rakeBP=this.ac.createBiquadFilter();
      this.rakeBP.type='bandpass'; this.rakeBP.frequency.value=1500; this.rakeBP.Q.value=.8;
      const lp=this.ac.createBiquadFilter();
      lp.type='lowpass'; lp.frequency.value=5200;
      this.rakeGain=this.ac.createGain(); this.rakeGain.gain.value=0;
      src.connect(this.rakeBP); this.rakeBP.connect(lp); lp.connect(this.rakeGain); this.rakeGain.connect(this.master);
      src.start();
    }catch(e){ this.ac=null; }
  },
  rake(speed){
    if(!this.ac||!this.rakeGain) return;
    this.raking=true; this.lastMove=performance.now();
    const tN=this.ac.currentTime;
    const amp=clamp(.02+speed*.00009, 0, .14);
    this.rakeGain.gain.setTargetAtTime(amp, tN, .05);
    this.rakeBP.frequency.setTargetAtTime(clamp(1000+speed*1.3, 1000, 2600), tN, .07);
  },
  rakeQuiet(){
    if(!this.ac||!this.rakeGain) return;
    this.rakeGain.gain.setTargetAtTime(0, this.ac.currentTime, .09);
  },
  rakeStop(){
    this.raking=false;
    this.rakeQuiet();
  },
  bell(f,vol){
    if(!this.ac||!this.on) return;
    const tN=this.ac.currentTime, v=vol||.2;
    const mk=(freq,amp,dur)=>{
      const o=this.ac.createOscillator(), gn=this.ac.createGain();
      o.type='sine'; o.frequency.value=freq;
      gn.gain.setValueAtTime(.0001,tN);
      gn.gain.exponentialRampToValueAtTime(amp,tN+.008);
      gn.gain.exponentialRampToValueAtTime(.0001,tN+dur);
      o.connect(gn); gn.connect(this.master);
      o.start(tN); o.stop(tN+dur+.05);
    };
    mk(f, v, 1.7);
    mk(f*2.756, v*.28, .6);
    mk(f*5.4, v*.08, .25);
  },
  puffS(){
    if(!this.ac||!this.on) return;
    const tN=this.ac.currentTime;
    const len=this.ac.sampleRate*.16;
    const buf=this.ac.createBuffer(1,len,this.ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ac.createBufferSource(); src.buffer=buf;
    const lp=this.ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520;
    const gn=this.ac.createGain(); gn.gain.value=.14;
    src.connect(lp); lp.connect(gn); gn.connect(this.master);
    src.start(tN);
  },
  sweep(){
    if(!this.ac||!this.on) return;
    const tN=this.ac.currentTime;
    const len=this.ac.sampleRate*.9;
    const buf=this.ac.createBuffer(1,len,this.ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ac.createBufferSource(); src.buffer=buf;
    const lp=this.ac.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(2000,tN);
    lp.frequency.exponentialRampToValueAtTime(240,tN+.85);
    const gn=this.ac.createGain();
    gn.gain.setValueAtTime(.07,tN);
    gn.gain.exponentialRampToValueAtTime(.0001,tN+.9);
    src.connect(lp); lp.connect(gn); gn.connect(this.master);
    src.start(tN);
  },
  chime(){
    if(!this.ac||!this.on) return;
    this.bell(659.25,.16);
    setTimeout(()=>this.bell(987.77,.12), 160);
  },
  setOn(b){
    this.on=b;
    if(this.master) this.master.gain.value=b?0.9:0;
    try{ localStorage.setItem('zen-garden-sound', b?'1':'0'); }catch(e){}
  }
};
try{ SFX.on = localStorage.getItem('zen-garden-sound')!=='0'; }catch(e){}
$('#soundBtn').textContent = SFX.on?'🔊':'🔇';
$('#soundBtn').addEventListener('click',()=>{
  SFX.ensure();
  SFX.setOn(!SFX.on);
  $('#soundBtn').textContent = SFX.on?'🔊':'🔇';
  if(SFX.on) SFX.bell(880,.1);
});

/* ---------------- persistence ---------------- */
let saveTimer=0;
function saveState(){
  try{
    const objs=objects.map(o=>{
      const c={...o}; delete c.born; delete c.nudge; return c;
    });
    localStorage.setItem(SAVE_KEY, JSON.stringify({w:W,h:H,marks,objects:objs}));
  }catch(e){}
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveState, 800);
}
function loadState(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ return false; }
  if(!s || !Array.isArray(s.marks) || !Array.isArray(s.objects)) return false;
  const sx=s.w? W/s.w : 1, sy=s.h? H/s.h : 1;
  const sk=clamp(Math.min(sx,sy), .4, 2.2);
  marks=[]; objects=[];
  for(const m of s.marks){
    if(m.k==='s' && Array.isArray(m.pts)){
      const pts=m.pts.map((v,i)=> i%2===0 ? v*sx : v*sy);
      marks.push({k:'s', n:clamp(m.n|0,2,5), pts});
    }else if(m.k==='r'){
      marks.push({k:'r', x:m.x*sx, y:m.y*sy, r0:m.r0*sk, c:clamp(m.c|0,1,4)});
    }
  }
  for(const o of s.objects){
    if(!o || !o.t) continue;
    const c={...o, x:o.x*sx, y:o.y*sy};
    if(c.r) c.r*=sk;
    if(c.s) c.s*=sk;
    if(c.hr) c.hr*=sk;
    if(c.hy) c.hy*=sk;
    objects.push(c);
  }
  replay();
  return marks.length>0 || objects.length>0;
}

/* ---------------- resize ---------------- */
function resize(){
  const rect=stage.getBoundingClientRect();
  const nW=Math.max(120,Math.round(rect.width));
  const nH=Math.max(120,Math.round(rect.height));
  if(nW===W && nH===H) return;
  if(W && H){
    const sx=nW/W, sy=nH/H, sk=clamp(Math.min(sx,sy),.4,2.2);
    for(const m of marks){
      if(m.k==='s'){ for(let i=0;i<m.pts.length;i+=2){ m.pts[i]*=sx; m.pts[i+1]*=sy; } }
      else{ m.x*=sx; m.y*=sy; m.r0*=sk; }
    }
    for(const o of objects){
      o.x*=sx; o.y*=sy;
      if(o.r) o.r*=sk;
      if(o.s) o.s*=sk;
      if(o.hr) o.hr*=sk;
      if(o.hy) o.hy*=sk;
    }
  }
  if(W && H){ kb.x*=nW/W; kb.y*=nH/H; }
  W=nW; H=nH;
  kb.x=clamp(kb.x,0,W); kb.y=clamp(kb.y,0,H);
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  sandC.width=canvas.width; sandC.height=canvas.height;
  renderVignette();
  replay();
}
let rsTimer=0;
function scheduleResize(delay){
  clearTimeout(rsTimer);
  rsTimer=setTimeout(resize,delay);
}
window.addEventListener('resize',()=>scheduleResize(150));
/* 폰트 로드·레이아웃 리플로우 등 window resize 없이 #stage 만 변하는 경우 대응 */
if(window.ResizeObserver){
  new ResizeObserver(()=>scheduleResize(60)).observe(stage);
}

/* ---------------- placement ---------------- */
const PENTA=[523.25,587.33,659.25,783.99,880];

function makeObject(toolName,x,y){
  const seed=(Math.random()*1e9)|0;
  if(toolName.startsWith('stone')){
    const v=+toolName.slice(5);
    const r=24+Math.random()*9;
    return {t:'stone',v,x,y,seed,r,rot:(Math.random()-.5)*.5,hr:r*1.35,hy:0};
  }
  if(toolName==='moss'){
    const r=19+Math.random()*7;
    return {t:'moss',x,y,seed,r,hr:r*1.2,hy:0};
  }
  if(toolName==='leaf'){
    const r=15+Math.random()*5;
    return {t:'leaf',x,y,seed,r,rot:Math.random()*Math.PI*2,ci:(Math.random()*3)|0,hr:r+8,hy:0};
  }
  if(toolName==='lantern'){
    const s=.95+Math.random()*.15;
    return {t:'lantern',x,y,seed,s,hr:42*s,hy:-36*s};
  }
  return null;
}

function ringRadiusFor(o){
  if(o.t==='stone') return o.r*1.25+8;
  if(o.t==='moss')  return o.r*1.2+8;
  if(o.t==='leaf')  return o.r+9;
  return 34*(o.s||1);
}

/* 석등은 drawLantern 기준점 위로 지붕(-72)·보주(-80.9)까지 솟는다.
   다른 소품용 상단 여백 26 으로는 지붕이 트레이 밖으로 잘리므로 배율만큼 더 내려 놓는다. */
const LANTERN_TOP=84;

function placeObject(toolName,x,y){
  x=clamp(x,18,W-18); y=clamp(y,26,H-14);
  const o=makeObject(toolName,x,y);
  if(!o) return;
  if(o.t==='lantern'){
    const top=Math.min(LANTERN_TOP*(o.s||1), Math.max(26,H-14));
    if(o.y<top){ o.y=top; y=top; }
  }
  o.born=performance.now();
  const rings={k:'r',x,y,r0:ringRadiusFor(o),c:o.t==='leaf'?2:3};
  marks.push(rings);
  if(marks.length>260) marks.splice(0, marks.length-260);
  ringMark(rings);
  objects.push(o);
  if(objects.length>80) objects.shift();
  /* --- 오늘의 정원 진행 기록 (소품 배치) --- */
  dailyCheck(o.t);
  puffAt(x,y,8);
  SFX.bell(PENTA[(Math.random()*PENTA.length)|0]);
  buzz(8);
  scheduleSave();
  dirty=true;
}

function findObjectAt(x,y){
  const sorted=[...objects].sort((a,b)=>b.y-a.y);
  for(const o of sorted){
    const dx=x-o.x, dy=y-(o.y+(o.hy||0));
    if(Math.hypot(dx,dy) <= (o.hr||30)) return o;
  }
  return null;
}

function removeObject(o){
  const i=objects.indexOf(o);
  if(i<0) return;
  objects.splice(i,1);
  puffAt(o.x, o.y+(o.hy||0), 12, 'rgba(196,178,146,1)');
  SFX.puffS();
  buzz(14);
  toast(t('removeToast'));
  refreshHint();
  scheduleSave();
  dirty=true;
}

/* 소품을 짧게 탭했을 때의 반응 — 예전에는 아무 일도 없었다(objects 1→1, 무피드백).
   튕겨 오르는 애니메이션 + 모래 먼지 + 낮은 종소리로 「눌렸다」를 알리고,
   길게 누르면 치워진다는 것을 페이지당 한 번만 토스트로 알려 준다. */
let tapHinted=false;
function nudgeObject(o){
  o.nudge=performance.now();
  puffAt(o.x, o.y+(o.hy||0), 5, 'rgba(226,212,184,1)');
  SFX.bell(PENTA[0]*0.5, .09);
  buzz(6);
  if(!tapHinted){ tapHinted=true; toast(t('tapHint')); }
  dirty=true;
}

/* ---------------- pointer input ---------------- */
/* 탭 슬롭: iOS ~10px, Android 8~16dp. 손가락으로 툭 놓을 때의 흔들림을 탭으로 인정. */
const TAP_SLOP=14;
let pid=null, downPt=null, moved=false, consumed=false;
let stroke=null, lastAp=null, lastMv=null, lastMvT=0;

function posOf(e){
  const rect=canvas.getBoundingClientRect();
  return {x:e.clientX-rect.left, y:e.clientY-rect.top};
}
function cancelLP(){
  if(lpTimer){ clearTimeout(lpTimer); lpTimer=0; }
  lpTarget=null;
  dirty=true;
}

canvas.addEventListener('pointerdown',e=>{
  if(pid!==null) return;
  e.preventDefault();
  pid=e.pointerId;
  try{ canvas.setPointerCapture(pid); }catch(err){}
  SFX.ensure();
  gaRoundStart('main');
  const p=posOf(e);
  downPt=p; lastMv=p; lastMvT=performance.now();
  moved=false; consumed=false; stroke=null; lastAp=null;
  const hit=findObjectAt(p.x,p.y);
  if(hit){
    lpTarget=hit; lpStart=performance.now();
    lpTimer=setTimeout(()=>{
      lpTimer=0;
      removeObject(hit);
      lpTarget=null;
      consumed=true;
    },560);
  }
});

canvas.addEventListener('pointermove',e=>{
  if(e.pointerId!==pid) return;
  e.preventDefault();
  const p=posOf(e);
  const now=performance.now();
  if(!moved && Math.hypot(p.x-downPt.x,p.y-downPt.y)>TAP_SLOP){
    moved=true;
    cancelLP();
  }
  if(tool==='rake' && !consumed && moved){
    if(!stroke){
      stroke={k:'s',n:tines,pts:[downPt.x,downPt.y]};
      lastAp=downPt;
    }
    if(Math.hypot(p.x-lastAp.x,p.y-lastAp.y)>=4){
      rakeSeg(lastAp.x,lastAp.y,p.x,p.y,tines);
      stroke.pts.push(Math.round(p.x*10)/10, Math.round(p.y*10)/10);
      lastAp=p;
    }
    const dt=now-lastMvT;
    if(dt>0){
      const speed=Math.hypot(p.x-lastMv.x,p.y-lastMv.y)/dt*1000;
      SFX.rake(speed);
    }
  }
  lastMv=p; lastMvT=now;
});

function endPointer(e){
  if(e.pointerId!==pid) return;
  const p=posOf(e);
  cancelLP();
  SFX.rakeStop();
  if(stroke){
    if(stroke.pts.length>=4){
      marks.push(stroke);
      if(marks.length>260) marks.splice(0, marks.length-260);
      gaStroke();
      scheduleSave();
      dailyCheck('rake');
    }
  }else if(!consumed && e.type==='pointerup'){
    const hitObj=findObjectAt(p.x,p.y);
    if(hitObj){
      /* 소품 위 짧은 탭 — 길게 누르기(제거)와 구분되는 가벼운 반응. */
      nudgeObject(hitObj);
    }else if(tool==='rake'){
      /* 갈퀴는 움직였다면 이미 stroke 로 처리됨. 제자리 탭만 점 자국. */
      if(!moved){
        const dab={k:'s',n:tines,pts:[p.x,p.y]};
        rakeSeg(p.x,p.y,p.x+2,p.y+1,tines);
        marks.push(dab);
        gaStroke();
        scheduleSave();
        dailyCheck('rake');
      }
    }else{
      /* 배치 도구는 이산 동작 — 끄는 동안 아무 피드백도 없으므로
         손가락이 흔들렸는지와 무관하게 뗀 자리에 놓는다. */
      placeObject(tool,p.x,p.y);
    }
  }
  stroke=null; pid=null;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------------- keyboard (병렬 경로) ----------------
   포인터 없이도 모래를 긋고 소품을 놓고 저장까지 갈 수 있다.
   Tab 순서: 홈 → 소리 → 언어 → 모래밭 → 도구 7 → 갈퀴 굵기 4 → 모래 고르기 → 사진 저장. */
canvas.addEventListener('focus',()=>{
  if(!kb.on){ kb.on=true; kb.x=W/2; kb.y=H/2; }
  refreshHint(); dirty=true;
});
canvas.addEventListener('blur',()=>{
  kbLift();
  kb.on=false; kb.pen=false;
  SFX.rakeStop();
  refreshHint(); dirty=true;
});

function kbLift(){
  if(!kb.pen) return;
  kb.pen=false;
  SFX.rakeStop();
  if(kbStroke && kbStroke.pts.length>=4){
    marks.push(kbStroke);
  }else{
    /* 움직이지 않고 뗀 경우 = 제자리 점 자국 (포인터 탭과 같은 결과). */
    rakeSeg(kb.x,kb.y,kb.x+2,kb.y+1,tines);
    marks.push({k:'s',n:tines,pts:[kb.x,kb.y]});
  }
  if(marks.length>260) marks.splice(0, marks.length-260);
  kbStroke=null;
  gaStroke(); scheduleSave(); dailyCheck('rake');
  dirty=true;
}

canvas.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  let dx=0, dy=0;
  const step = e.shiftKey ? 30 : 9;
  const k=e.key;
  if(k==='ArrowLeft')       dx=-step;
  else if(k==='ArrowRight') dx=step;
  else if(k==='ArrowUp')    dy=-step;
  else if(k==='ArrowDown')  dy=step;
  else if(k===' '||k==='Spacebar'||k==='Enter'){
    e.preventDefault();
    if(e.repeat) return;
    SFX.ensure(); gaRoundStart('main');
    if(tool==='rake'){
      if(kb.pen) kbLift();
      else{ kb.pen=true; kbStroke={k:'s',n:tines,pts:[kb.x,kb.y]}; SFX.rake(120); }
    }else{
      const hit=findObjectAt(kb.x,kb.y);
      if(hit) nudgeObject(hit);
      else placeObject(tool,kb.x,kb.y);
      kb.x=clamp(kb.x,0,W); kb.y=clamp(kb.y,0,H);
    }
    dirty=true;
    return;
  }
  else if(k==='Backspace'||k==='Delete'){
    e.preventDefault();
    SFX.ensure();
    const hit=findObjectAt(kb.x,kb.y);
    if(hit){ gaRoundStart('main'); removeObject(hit); }
    else SFX.puffS();
    dirty=true;
    return;
  }
  else return;
  e.preventDefault();
  const nx=clamp(kb.x+dx,0,W), ny=clamp(kb.y+dy,0,H);
  if(kb.pen && tool==='rake'){
    rakeSeg(kb.x,kb.y,nx,ny,tines);
    if(kbStroke) kbStroke.pts.push(Math.round(nx*10)/10, Math.round(ny*10)/10);
    SFX.rake(step*22);
  }
  kb.x=nx; kb.y=ny;
  dirty=true;
});

/* ---------------- toolbar ---------------- */
document.querySelectorAll('.tool').forEach(b=>{
  b.addEventListener('click',()=>{
    tool=b.dataset.tool;
    document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('sel',x===b));
    canvas.style.cursor = tool==='rake' ? 'crosshair' : 'copy';

document.querySelectorAll('.tine').forEach(b=>{

    document.querySelectorAll('.tine').forEach(x=>x.classList.toggle('sel',x===b));
    tool='rake';
    document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('sel',x.dataset.tool==='rake'));
    canvas.style.cursor='crosshair';
  });
});

/* ---------------- tray icons ---------------- */
function buildTrayIcons(){
  document.querySelectorAll('[data-icon]').forEach(cv=>{
    const kind=cv.dataset.icon;
    cv.width=40*dpr; cv.height=40*dpr;
    const g=cv.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    if(kind==='rake'){
      g.save();
      g.translate(20,20); g.rotate(-.72);
      g.strokeStyle='#8a6b45'; g.lineWidth=3.6; g.lineCap='round';
      line(g,0,-14,0,9);
      g.fillStyle='#6f5333';
      rr(g,-10,9,20,4.5,2); g.fill();
      g.strokeStyle='#5d4428'; g.lineWidth=2;
      for(let i=0;i<4;i++) line(g,-7.5+i*5,13.5,-7.5+i*5,18.5);
      g.restore();
    }else if(kind.startsWith('stone')){
      drawStone(g,{t:'stone',v:+kind.slice(5),x:20,y:21,seed:11+(+kind.slice(5))*37,r:12,rot:.1});
    }else if(kind==='moss'){
      drawMoss(g,{t:'moss',x:20,y:21,seed:99,r:12});
    }else if(kind==='leaf'){
      drawLeaf(g,{t:'leaf',x:20,y:21,seed:5,r:13,rot:.5,ci:0});
    }else if(kind==='lantern'){
      drawLantern(g,{t:'lantern',x:20,y:37,seed:1,s:.42});
    }
  });
}

/* ---------------- 오늘의 정원 ----------------
   같은 날 재방문하면 같은 과제가 나오도록 날짜 문자열만으로 결정한다(난수·저장값 없음).
   진행도는 정원에 남은 개수가 아니라 '오늘 실제로 한 행동'을 세는 카운터다 —
   어제 두고 간 정원이 오늘의 과제를 공짜로 채워 주지 않고,
   저장 상한(획 260·소품 80)에 눌린 정원에서도 오늘 그은 획·놓은 소품이 그대로 셈에 들어간다.
   (남은 개수를 세던 방식은 상한에 닿는 순간 영구히 0 에 멈췄다.)
   달성은 판의 완결이 아니다 — 이 게임의 완결은 '사진 저장' 하나뿐이므로
   여기서는 game_complete 도 game_vote 도 보내지 않고 화면 연출로만 축하한다. */
function dayKey(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
}
function todayTask(){
  const s=dayKey();
  let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return DAILY[((h>>>0)%DAILY.length)];
}
/* kind: 'rake' | 소품 종류('stone'·'moss'·'leaf'·'lantern'). 오늘 과제에 해당하는 행동만 센다. */
function dailyHits(task,kind){ return task.k===kind || (task.k==='any' && kind!=='rake'); }
function dailySave(){ try{ localStorage.setItem(DAILY_KEY, JSON.stringify(dailyS)); }catch(e){} }
function dailyLoad(){
  const k=dayKey();
  let st=null;
  try{ st=JSON.parse(localStorage.getItem(DAILY_KEY)); }catch(e){}
  if(st && st.d===k){
    dailyS={d:k, c:st.c|0, done:!!st.done};
    /* 저장값이 목표를 넘겼는데 done 이 아니면 그 자리에서 닫는다 —
       '3/2 인데 아직 안 끝남' 같은 상태가 화면에 남지 않게. */
    if(!dailyS.done && dailyS.c>=todayTask().n){ dailyS.done=true; dailySave(); }
  }
  else{ dailyS={d:k, c:0, done:false}; dailySave(); }
}
function refreshHint(){
  const et=$('#hintTask'), eb=$('#hintBase');
  if(!et||!eb) return;
  if(dailyS.done) et.textContent=t('dailyDone');
  else{
    const task=todayTask();
    et.textContent = t(task.k==='rake'?'dailyRake':'dailyPlace')
      .replace('{i}',task.ic)
      .replace('{c}',Math.min(dailyS.c,task.n))
      .replace('{n}',task.n);
  }
  eb.textContent = kb.on ? t('kbdHint') : t('hint');
}
/* 행동 1건 기록 → 문구 갱신 → 방금 목표에 닿았으면 그 순간 1회만 축하한다.
   계측은 손대지 않는다: 여기서 판을 닫으면 끊김 없는 한 판이 둘로 쪼개진다. */
function dailyCheck(kind){
  if(dailyS.d!==dayKey()) dailyLoad();          /* 탭을 켜 둔 채 자정을 넘긴 경우 */
  if(dailyS.done){ refreshHint(); return; }
  const task=todayTask();
  if(kind && dailyHits(task,kind)){ dailyS.c++; dailySave(); }
  if(dailyS.c < task.n){ refreshHint(); return; }
  dailyS.done=true; dailySave();
  refreshHint();
  toast(t('dailyDone'));
  SFX.chime();
}

function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
}
$('#saveBtn').addEventListener('click',()=>{
  SFX.ensure();
  try{
    kb.hide=true; render(); kb.hide=false; dirty=true;   /* 사진에 키보드 커서가 찍히지 않게 */
    const pad=Math.round(26*dpr);
    const ec=document.createElement('canvas');
    ec.width=canvas.width+pad*2; ec.height=canvas.height+pad*2;
    const g=ec.getContext('2d');
    const wgr=g.createLinearGradient(0,0,ec.width,ec.height);
    wgr.addColorStop(0,'#6d5439'); wgr.addColorStop(.5,'#553f2a'); wgr.addColorStop(1,'#3a2b1b');
    g.fillStyle=wgr; g.fillRect(0,0,ec.width,ec.height);
    for(let i=0;i<46;i++){
      const x=Math.random()*ec.width;
      g.fillStyle=Math.random()<.5?'rgba(0,0,0,0.05)':'rgba(255,230,190,0.04)';
      g.fillRect(x,0,1+Math.random()*4,ec.height);
    }
    g.strokeStyle='rgba(255,240,210,0.22)'; g.lineWidth=2;
    g.strokeRect(pad-4,pad-4,canvas.width+8,canvas.height+8);
    g.strokeStyle='rgba(0,0,0,0.35)'; g.lineWidth=2;
    g.strokeRect(pad-8,pad-8,canvas.width+16,canvas.height+16);
    g.drawImage(canvas,pad,pad);
    const a=document.createElement('a');
    a.href=ec.toDataURL('image/png');
    a.download='zen-garden-'+stamp()+'.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    SFX.chime();
    toast(t('savedToast'));
    try{
      /* 빈 정원(획 0·소품 0)을 저장한 것은 완결이 아니다 — 아무것도 보내지 않는다.
         result:'fail' 로 보내면 판 수 자체가 부풀고, start 까지 지어내면 시작 수도 오염된다.
         '모래 고르기' 버튼이 비었다고 판단하는 조건(marks·objects 둘 다 0)과 같은 기준. */
      if(marks.length>0 || objects.length>0){
        if(!gaS.started) gaRoundStart('main');  /* 복원된 정원을 손대지 않고 저장한 경우 start 선행 보장 */
        gaRoundComplete('main','clear',{strokes:gaS.strokes||0,objects:objects.length});
      }
    }catch(gaErr){}
  }catch(err){
    toast(t('saveFail'));
  }
});

/* ---- GA4 portal standard v1 (2026-08-19) ---- */
var GA_GAME='zen-garden';
var gaS={started:false,completed:false,voted:false,voteShown:false,voteScene:'main',t0:0,strokes:0};
function gaLang(){ try{ return lang||'ko'; }catch(e){ return 'ko'; } }
function gaStroke(){ try{ gaS.strokes++; }catch(e){} }   /* 판 단위 획 수 — 판 경계(gaRoundStart)에서만 리셋 */
function gaVoteHide(){ try{ var el=document.getElementById('gaVote'); if(el) el.hidden=true; }catch(e){} }
function gaSend(name,p){ try{ if(typeof gtag!=='function')return; p=p||{}; p.game_id=GA_GAME; if(!p.lang)p.lang=gaLang(); gtag('event',name,p);}catch(e){} }
function gaRoundStart(scene){
  if(gaS.completed){ gaS.t0=Date.now(); gaS.strokes=0; gaS.completed=false; gaVoteHide(); gaSend('game_step',{step:'replay',scene:scene||'main'}); return; }
  if(gaS.started)return; gaS.started=true; gaS.t0=Date.now(); gaS.strokes=0; gaSend('game_step',{step:'start',scene:scene||'main'});
}
function gaRoundComplete(scene,result,extra){
  if(gaS.completed)return; gaS.completed=true;
  var p={scene:scene||'main',result:result||'clear',play_sec:gaS.t0?Math.round((Date.now()-gaS.t0)/1000):0};
  if(extra){ for(var k in extra){ if(extra.hasOwnProperty(k))p[k]=extra[k]; } }
  gaSend('game_complete',p);
  gaVoteShow(p.scene);
}
var GA_VOTE_COPY={ko:{q:'또 할래?',yes:'응',no:'글쎄',thx:'고마워요!'},ja:{q:'また あそぶ？',yes:'うん',no:'うーん',thx:'ありがとう！'},en:{q:'Want another go?',yes:'Yes',no:'Not sure',thx:'Thanks!'}};
function gaVoteShow(scene){
  var el=document.getElementById('gaVote'); if(!el||gaS.voted)return;
  var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
  el.querySelector('.ga-vote-q').textContent=c.q;
  el.querySelector('[data-choice="yes"]').textContent=c.yes;
  el.querySelector('[data-choice="unsure"]').textContent=c.no;
  gaS.voteScene=scene||'main'; gaS.voteShown=true; el.hidden=false; el.classList.remove('done');
}
function gaVoteRelang(){
  try{
    var el=document.getElementById('gaVote'); if(!el||el.hidden)return;
    var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
    if(el.classList.contains('done')){ el.querySelector('.ga-vote-q').textContent=c.thx; return; }
    if(gaS.voted)return;
    el.querySelector('.ga-vote-q').textContent=c.q;
    el.querySelector('[data-choice="yes"]').textContent=c.yes;
    el.querySelector('[data-choice="unsure"]').textContent=c.no;
  }catch(e){}
}
(function(){ var el=document.getElementById('gaVote'); if(!el)return;
  el.addEventListener('click',function(e){
    var b=e.target; while(b&&b!==el&&!(b.getAttribute&&b.getAttribute('data-choice')))b=b.parentNode;
    if(!b||b===el||gaS.voted)return; gaS.voted=true;
    gaSend('game_vote',{scene:gaS.voteScene,choice:b.getAttribute('data-choice')});
    var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
    el.classList.add('done'); el.querySelector('.ga-vote-q').textContent=c.thx;
    setTimeout(function(){ el.hidden=true; },1200);
  });
})();
