<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1233">
<title>밤곤충 손전등 · 夜のむし探し · Night Bug Hunt</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔦</text></svg>">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SF7BJ4211L"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-SF7BJ4211L');</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:#070d24;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  button { font-family:inherit; }

  #app { position:fixed; inset:0; }

  /* ============ STAGE (night scene) ============ */
  #stage {
    position:absolute; inset:0;
    touch-action:none;
    overflow:hidden;
    --lx:50%; --ly:55%; --r:140px;
    background:linear-gradient(180deg, #0a1130 0%, #0e1a42 42%, #14254e 68%, #182a52 100%);
  }
  @media (pointer:fine) { #stage { cursor:none; } }
  #stage > * { pointer-events:none; }

  .horizon-glow {
    position:absolute; left:-20%; right:-20%; bottom:26%; height:30%;
    background:radial-gradient(ellipse 60% 100% at 50% 100%, rgba(90,120,190,.28), transparent 70%);
  }

  .moon {
    position:absolute; top:8%; left:11%;
    width:58px; height:58px; border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #fdf8e6, #efe3bb 62%, #d9caa0);
    box-shadow:0 0 34px 10px rgba(255,244,204,.28), 0 0 90px 30px rgba(255,244,204,.12);
  }
  .moon::after {
    content:""; position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle 7px at 62% 30%, rgba(190,175,135,.5), transparent 70%),
      radial-gradient(circle 5px at 34% 58%, rgba(190,175,135,.45), transparent 70%),
      radial-gradient(circle 4px at 66% 66%, rgba(190,175,135,.4), transparent 70%);
  }

  .star {
    position:absolute; border-radius:50%;
    background:#fff;
    animation:twinkle var(--tw,3s) ease-in-out var(--td,0s) infinite alternate;
  }
  @keyframes twinkle { from { opacity:.15; } to { opacity:.95; } }

  .backdrop-svg { position:absolute; left:0; right:0; bottom:0; width:100%; }
  #hills   { height:36%; }
  #foliage { position:absolute; top:-2%; right:-4%; left:auto; bottom:auto; width:52%; height:34%; }
  #grassBack  { height:32%; }
  #grassMid   { height:24%; }
  #grassFront { height:15%; }
  #water { display:none; }

  /* ---- night 2: pond side ---- */
  #stage.n2 { background:linear-gradient(180deg, #06101f 0%, #0a1c36 40%, #0d2a44 64%, #0a2236 100%); }
  #stage.n2 .horizon-glow { bottom:20%; background:radial-gradient(ellipse 62% 100% at 58% 100%, rgba(80,150,170,.26), transparent 70%); }
  #stage.n2 .moon { left:auto; right:12%; top:9%; width:66px; height:66px; }
  #stage.n2 #foliage { right:auto; left:-4%; transform:scaleX(-1); }
  #stage.n2 #foliage ellipse, #stage.n2 #foliage path { fill:#0a1428; }
  #stage.n2 #hills { height:30%; }
  #stage.n2 #hills path { fill:#0a1a2e; }
  #stage.n2 #grassBack { height:36%; }
  #stage.n2 #grassMid  { height:30%; }
  #stage.n2 #grassFront{ height:17%; }
  #stage.n2 #water {
    display:block;
    position:absolute; left:0; right:0; bottom:0; height:21%;
    background:linear-gradient(180deg, rgba(24,74,110,.95), #0b2540 55%, #071a30);
  }
  #stage.n2 #water::before {
    content:""; position:absolute; top:0; bottom:0; right:9%; width:78px;
    background:repeating-linear-gradient(180deg, rgba(255,240,200,.15) 0 3px, transparent 3px 10px);
    -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent);
    mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent);
  }
  #stage.n2 #water::after {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(ellipse 34px 11px at 22% 46%, #0d3a3a 96%, transparent 100%),
      radial-gradient(ellipse 27px 9px at 43% 74%, #0c3436 96%, transparent 100%),
      radial-gradient(ellipse 30px 10px at 70% 58%, #0d3a3a 96%, transparent 100%);
  }

  /* ============ BUGS ============ */
  #bugLayer { position:absolute; inset:0; }
  .bug {
    position:absolute;
    transform:translate(-50%,-50%);
    line-height:1;
  }
  .bug-emoji {
    display:block;
    animation:bob var(--bob,3.4s) ease-in-out var(--bobd,0s) infinite alternate;
  }
  @keyframes bob { from { transform:translateY(0) rotate(-2deg); } to { transform:translateY(-5px) rotate(2deg); } }
  .bug.caught { visibility:hidden; }

  .f-firefly  { filter:sepia(.35) saturate(1.3) brightness(1.08) drop-shadow(0 0 5px rgba(255,214,96,.85)); }
  .f-stag     { filter:grayscale(.55) brightness(.8) contrast(1.15); }
  .f-rhino    { filter:sepia(.55) hue-rotate(-24deg) saturate(1.5) brightness(.85); }
  .f-moth     { filter:grayscale(.8) sepia(.55) brightness(.98); }
  .f-cricket  { filter:sepia(.6) hue-rotate(-26deg) saturate(1.1) brightness(.9); }
  .f-mantis   { filter:saturate(1.4) hue-rotate(10deg) brightness(1.02); }
  .f-butterfly{ filter:saturate(1.15); }
  .f-snail    { filter:saturate(1.05); }
  .f-lady     { filter:saturate(1.2); }
  .f-spider   { filter:brightness(1.05); }
  /* night 2 palette */
  .f-bat      { filter:brightness(.9); }
  .f-longhorn { filter:sepia(1) hue-rotate(-30deg) saturate(.7) brightness(.72); }
  .f-crane    { filter:sepia(.7) brightness(1.08); }
  .f-mayfly   { filter:sepia(1) hue-rotate(20deg) saturate(.7) brightness(1.18); }
  .f-katydid  { filter:saturate(1.5) hue-rotate(-6deg) brightness(1.05); }
  .f-bell     { filter:grayscale(.7) brightness(.55) contrast(1.25); }
  .f-frog     { filter:saturate(1.3) brightness(1.05); }
  .f-waterbug { filter:sepia(.6) hue-rotate(50deg) saturate(.8) brightness(.8); }
  .f-diving   { filter:sepia(1) hue-rotate(150deg) saturate(1.4) brightness(.8); }
  .f-whirligig{ filter:grayscale(1) brightness(.6) contrast(1.3); }

  /* shy bugs (night 2): fade in only while the light rests on them */
  .bug.shy { opacity:0; transition:filter .3s; }
  .bug.shy.shown { filter:drop-shadow(0 0 6px rgba(255,230,160,.7)); }

  .spider-thread {
    position:absolute; bottom:92%; left:50%;
    width:1px; height:110px;
    background:linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.34));
  }
  .spider-web {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-52%);
    width:84px; height:84px; opacity:.55;
  }

  /* ============ LIGHT ============ */
  #beam {
    position:absolute; inset:0;
    mix-blend-mode:screen;
    background:radial-gradient(circle calc(var(--r) * 1.18) at var(--lx) var(--ly),
      rgba(255,201,122,.32), rgba(255,182,92,.15) 52%, transparent 78%);
  }
  #dark {
    position:absolute; inset:0;
    background:linear-gradient(180deg,
      rgba(4,8,24,.42) 0%,
      rgba(4,8,24,.6) 24%,
      rgba(3,6,18,.9) 40%,
      rgba(2,5,15,.965) 56%,
      rgba(2,5,15,.975) 100%);
    -webkit-mask-image:radial-gradient(circle calc(var(--r) * 1.3) at var(--lx) var(--ly),
      transparent 0%, transparent 50%, rgba(0,0,0,.4) 72%, #000 96%);
    mask-image:radial-gradient(circle calc(var(--r) * 1.3) at var(--lx) var(--ly),
      transparent 0%, transparent 50%, rgba(0,0,0,.4) 72%, #000 96%);
  }

  /* ============ FX (above darkness) ============ */
  #fxLayer { position:absolute; inset:0; }

  .fglow {
    position:absolute;
    width:10px; height:10px; border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, #fff3c0, #ffd965 60%, rgba(255,200,80,0) 100%);
    box-shadow:0 0 16px 7px rgba(255,214,90,.4);
    animation:ffblink 1.7s ease-in-out infinite;
  }
  @keyframes ffblink {
    0%, 100% { opacity:.06; }
    18% { opacity:1; }
    38% { opacity:.5; }
    52% { opacity:.9; }
  }

  .afly {
    position:absolute;
    animation:driftA var(--dd,20s) ease-in-out infinite;
  }
  .afly.b { animation-name:driftB; }
  .afly-dot {
    width:5px; height:5px; border-radius:50%;
    background:radial-gradient(circle, #ffefad, rgba(255,209,84,0) 72%);
    box-shadow:0 0 9px 3px rgba(255,214,90,.3);
    animation:ffblink var(--bd,2.3s) ease-in-out var(--bdd,0s) infinite;
  }
  @keyframes driftA {
    0%,100% { transform:translate(0,0); }
    25% { transform:translate(34px,-26px); }
    50% { transform:translate(10px,-52px); }
    75% { transform:translate(-28px,-20px); }
  }
  @keyframes driftB {
    0%,100% { transform:translate(0,0); }
    30% { transform:translate(-30px,-30px); }
    55% { transform:translate(18px,-58px); }
    80% { transform:translate(30px,-14px); }
  }

  .glint {
    position:absolute;
    transform:translate(-50%,-50%);
    font-size:20px;
    color:#ffe9a8;
    text-shadow:0 0 8px rgba(255,222,120,.95), 0 0 22px rgba(255,200,90,.6);
    animation:glintPop 1.15s ease-out forwards;
  }
  @keyframes glintPop {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(0deg); }
    28%  { opacity:1; transform:translate(-50%,-50%) scale(1.25) rotate(40deg); }
    60%  { opacity:.9; transform:translate(-50%,-50%) scale(.9) rotate(80deg); }
    100% { opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(120deg); }
  }

  .particle {
    position:absolute;
    transform:translate(-50%,-50%);
    color:#ffe9a8;
    text-shadow:0 0 8px rgba(255,222,120,.9);
    will-change:transform, opacity;
  }

  /* ============ UI CHROME ============ */
  header {
    position:absolute; left:0; right:0; top:0;
    display:grid; grid-template-columns:auto 1fr auto;
    align-items:center; gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 12px 8px;
    z-index:10;
    pointer-events:none;
  }
  header > * { pointer-events:auto; }

  .pill {
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    padding:8px 13px;
    border-radius:999px;
    background:rgba(12,18,44,.58);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14);
    color:#ffe9bd;
    font-size:13px; font-weight:600;
    text-decoration:none;
    cursor:pointer;
    transition:background .25s, transform .15s;
  }
  .pill:active { transform:scale(.94); background:rgba(30,40,80,.7); }

  /* Title is decoration, not a control. It spans the whole centre column, so
     leaving it interactive would swallow pointerdown/pointermove meant for the
     stage underneath (flashlight aiming + bug taps near the top of the scene). */
  .title-box { text-align:center; min-width:0; pointer-events:none; }
  .title-box h1 {
    font-size:clamp(17px, 4.6vw, 22px);
    font-weight:800;
    color:#ffe3a1;
    text-shadow:0 0 14px rgba(255,190,90,.45), 0 2px 8px rgba(0,0,0,.6);
    letter-spacing:.02em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .title-box .sub {
    font-size:10px;
    color:rgba(255,236,190,.62);
    letter-spacing:.06em;
    margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .hdr-right { display:flex; gap:7px; justify-content:flex-end; }

  #progress {
    position:absolute; left:50%; bottom:calc(12px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    display:flex; align-items:center; gap:9px;
    padding:9px 15px;
    border-radius:999px;
    background:rgba(10,15,38,.62);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.13);
    z-index:10;
    box-shadow:0 6px 24px rgba(0,0,0,.4);
  }
  #pCount { font-size:13px; font-weight:700; color:#ffe3a1; white-space:nowrap; }
  #pSlots { display:flex; gap:5px; }
  .slot {
    width:21px; height:21px; border-radius:50%;
    border:1.5px dashed rgba(255,255,255,.24);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; line-height:1;
  }
  .slot.filled {
    border:1.5px solid rgba(255,210,110,.75);
    background:rgba(255,190,90,.13);
    box-shadow:0 0 8px rgba(255,200,100,.35);
    animation:slotPop .45s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes slotPop { 0% { transform:scale(0); } 70% { transform:scale(1.35); } 100% { transform:scale(1); } }

  #hintToast {
    position:absolute; left:50%; top:calc(74px + env(safe-area-inset-top));
    transform:translateX(-50%);
    padding:9px 18px;
    border-radius:999px;
    background:rgba(12,18,44,.68);
    border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    color:#ffedc4; font-size:13px;
    z-index:9;
    opacity:0;
    transition:opacity .8s;
    pointer-events:none;
    white-space:normal;
    max-width:calc(100% - 32px);
    text-align:center;
    line-height:1.35;
  }
  #hintToast.show { opacity:1; }

  /* ============ OVERLAYS ============ */
  .overlay {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:20;
    opacity:0; visibility:hidden;
    transition:opacity .45s, visibility .45s;
  }
  .overlay.active { opacity:1; visibility:visible; }
  #introOverlay { background:radial-gradient(circle at 50% 40%, rgba(10,16,40,.55), rgba(4,7,20,.88)); }
  #cardOverlay  { background:rgba(4,7,20,.55); z-index:22; }
  #endOverlay   { background:transparent; z-index:24; }
  #endOverlay.dimmed { background:rgba(4,7,20,.66); transition:background 1.2s, opacity .45s, visibility .45s; }

  .panel {
    background:linear-gradient(180deg, rgba(24,32,68,.94), rgba(13,19,44,.96));
    border:1px solid rgba(255,255,255,.13);
    border-radius:26px;
    padding:30px 26px 26px;
    max-width:350px; width:100%;
    max-height:calc(100% - 8px); overflow-y:auto; -webkit-overflow-scrolling:touch;
    text-align:center;
    box-shadow:0 24px 70px rgba(0,0,0,.55);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    transform:scale(.88) translateY(12px);
    transition:transform .45s cubic-bezier(.2,1.3,.4,1);
  }
  .overlay.active .panel { transform:scale(1) translateY(0); }

  .panel .big-ico { font-size:52px; line-height:1.1; filter:drop-shadow(0 0 18px rgba(255,200,100,.5)); }
  .panel h2 {
    margin-top:12px;
    font-size:23px; font-weight:800; color:#ffe3a1;
    text-shadow:0 0 16px rgba(255,190,90,.35);
  }
  .panel .sub2 { margin-top:3px; font-size:11.5px; color:rgba(255,236,190,.55); letter-spacing:.05em; }
  .intro-lines { margin:18px 0 6px; text-align:left; display:flex; flex-direction:column; gap:10px; }
  .intro-lines p { font-size:13.5px; color:#e8e2d2; line-height:1.5; }
  .intro-lines p:empty { display:none; }
  .intro-note { margin-top:12px; font-size:12px; color:rgba(255,236,190,.6); }
  #endMsg { white-space:pre-line; }

  /* night picker */
  .night-tabs { display:flex; gap:8px; justify-content:center; margin-top:14px; }
  .ntab {
    flex:1 1 0; min-width:0;
    padding:9px 6px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05);
    color:#e8e2d2; font-size:12.5px; font-weight:700;
    cursor:pointer;
    transition:background .25s, border-color .25s, transform .15s;
  }
  .ntab.on { background:rgba(255,190,90,.16); border-color:rgba(255,210,110,.7); color:#ffe3a1; }
  .ntab:disabled { opacity:.5; cursor:default; }
  .ntab:active:not(:disabled) { transform:scale(.96); }
  .lock-note { margin-top:8px; font-size:11.5px; color:rgba(255,236,190,.55); min-height:1em; }

  /* field-notes collection */
  .notes-toggle {
    margin-top:14px;
    padding:6px 12px;
    border:1px solid rgba(255,255,255,.14); border-radius:999px;
    background:transparent; color:rgba(255,236,190,.75);
    font-size:12px; font-weight:600; cursor:pointer;
  }
  .notes-grid {
    display:none; grid-template-columns:repeat(10, 1fr); gap:5px;
    margin-top:10px; padding:10px 8px;
    border-radius:14px; background:rgba(0,0,0,.22);
  }
  .notes-grid.open { display:grid; }
  .ncell {
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-size:15px; line-height:1; border-radius:8px;
    background:rgba(255,255,255,.04);
  }
  .ncell.unmet { color:rgba(255,236,190,.28); font-size:11px; }

  .btn-warm {
    margin-top:20px;
    padding:14px 38px;
    border:none; border-radius:999px;
    background:linear-gradient(135deg, #ffc266, #ff8f3f);
    color:#3d2410; font-size:16px; font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(255,150,60,.4), inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .15s, box-shadow .25s;
  }
  .btn-warm:active { transform:scale(.95); box-shadow:0 4px 12px rgba(255,150,60,.3); }
  .btn-ghost {
    margin-top:20px;
    padding:14px 26px;
    border:1px solid rgba(255,255,255,.22); border-radius:999px;
    background:rgba(255,255,255,.06);
    color:#ffe9bd; font-size:15px; font-weight:700;
    cursor:pointer; text-decoration:none;
    display:inline-block;
    transition:transform .15s, background .25s;
  }
  .btn-ghost:active { transform:scale(.95); background:rgba(255,255,255,.12); }
  .btn-row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

  /* observation card */
  .card {
    background:linear-gradient(180deg, #fff9ea, #ffefd3);
    border:2px solid #eccf9c;
    border-radius:24px;
    padding:26px 24px 22px;
    max-width:330px; width:100%;
    text-align:center;
    color:#4a3320;
    box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.8);
    transform:scale(.8) translateY(16px);
    transition:transform .4s cubic-bezier(.2,1.5,.4,1);
    position:relative;
  }
  #cardOverlay.active .card { transform:scale(1) translateY(0); }
  .card-label {
    display:inline-block;
    font-size:11px; font-weight:800; letter-spacing:.1em;
    color:#a4753a;
    background:rgba(211,161,90,.16);
    border:1px solid rgba(180,130,60,.3);
    padding:4px 12px; border-radius:999px;
  }
  .card-emoji { font-size:78px; line-height:1.25; margin-top:10px; }
  .card-name { font-size:24px; font-weight:800; margin-top:4px; color:#3d2a12; }
  .card-fact { font-size:14.5px; line-height:1.6; margin-top:8px; color:#6d5335; }
  .card-btn {
    margin-top:18px;
    padding:12px 30px;
    border:none; border-radius:999px;
    background:linear-gradient(135deg, #ffc266, #ff9445);
    color:#3d2410; font-size:15px; font-weight:800;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(230,140,50,.35);
    transition:transform .15s;
  }
  .card-btn:active { transform:scale(.95); }

  .release-bug {
    position:fixed;
    transform:translate(-50%,-50%);
    z-index:23;
    will-change:transform, opacity;
    filter:drop-shadow(0 0 8px rgba(255,220,140,.6));
  }

  @media (max-height:560px) {
    .panel { padding:20px 22px 18px; }
    .panel .big-ico { font-size:40px; }
    .card-emoji { font-size:62px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
    .fglow, .afly-dot { opacity:.85 !important; }
  }
  /* ---- GA4 portal standard v1 (2026-08-19) : ending vote row ---- */
  .ga-vote{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 2px;font-size:14px;line-height:1.2;opacity:.92;color:rgba(255,236,190,.78)}
  .ga-vote[hidden]{display:none}
  .ga-vote-btn{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.85;-webkit-tap-highlight-color:transparent}
  .ga-vote-btn:active{opacity:1}
  .ga-vote.done .ga-vote-btn{display:none}
</style>
</head>
<body>
<div id="app">

      <ellipse cx="86" cy="6" rx="30" ry="17" fill="#0c1531"/>
      <ellipse cx="62" cy="0" rx="22" ry="12" fill="#0c1531"/>

      <path d="M100 0 L100 30 Q88 26 78 16 Q90 20 100 14 Z" fill="#0c1531"/>
    </svg>
    <svg id="hills" class="backdrop-svg" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 30 L0 17 Q10 11 22 15 Q31 18 40 14 Q52 9 63 14 Q75 19 85 13 Q93 9 100 14 L100 30 Z" fill="#0e1a3c"/>
    </svg>
    <svg id="grassBack" class="backdrop-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div id="water"></div>
    <svg id="grassMid" class="backdrop-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div id="bugLayer"></div>
    <svg id="grassFront" class="backdrop-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div id="beam"></div>
    <div id="dark"></div>
    <div id="fxLayer"></div>
  </div>

  <header>
    <a class="pill" id="homeLink" href="../../index.html">← 홈</a>
    <div class="title-box">
      <h1 id="titleMain">밤곤충 손전등</h1>
      <div class="sub" id="titleSub">夜のむし探し · Night Bug Hunt</div>
    </div>
    <div class="hdr-right">
      <button class="pill" id="soundBtn" aria-label="sound toggle">🔊</button>
      <button class="pill" id="langBtn" aria-label="language">🇰🇷</button>
    </div>
  </header>

  <div id="progress">
    <span id="pCount">0/10</span>
    <div id="pSlots"></div>
  </div>

  <div id="hintToast"></div>

  <div class="overlay" id="cardOverlay">
    <div class="card">
      <span class="card-label" id="cardLabel"></span>
      <div class="card-emoji"><span id="cardEmoji"></span></div>
      <div class="card-name" id="cardName"></div>
      <div class="card-fact" id="cardFact"></div>
      <button class="card-btn" id="cardBtn"></button>
    </div>
  </div>

  <div class="overlay active" id="introOverlay">
    <div class="panel">
      <div class="big-ico">🔦</div>
      <h2 id="introTitle"></h2>
      <div class="sub2" id="introSub"></div>
      <div class="night-tabs" id="nightTabs"></div>
      <div class="lock-note" id="lockNote"></div>
      <div class="intro-lines">
        <p id="introL1"></p>
        <p id="introL2"></p>
        <p id="introL3"></p>
        <p id="introL4"></p>
      </div>
      <div class="intro-note" id="introNote"></div>
      <button class="btn-warm" id="startBtn"></button>
      <div>
        <button class="notes-toggle" id="notesBtn" aria-expanded="false"></button>
        <div class="notes-grid" id="notesGrid"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="endOverlay">
    <div class="panel" id="endPanel" style="visibility:hidden;">
      <div class="big-ico">🌙</div>
      <h2 id="endTitle"></h2>
      <div class="intro-lines" style="text-align:center;">
        <p id="endMsg" style="text-align:center;"></p>
      </div>
      <div class="intro-note" id="endSub"></div>
      <div class="ga-vote" id="gaVote" hidden>
        <span class="ga-vote-q">또 할래?</span>
        <button type="button" class="ga-vote-btn" data-choice="yes">응</button>
        <button type="button" class="ga-vote-btn" data-choice="unsure">글쎄</button>
      </div>
      <div class="btn-row">
        <button class="btn-warm" id="nextBtn"></button>
        <button class="btn-warm" id="replayBtn"></button>
        <button class="btn-ghost" id="prevBtn"></button>
        <a class="btn-ghost" id="endHomeBtn" href="../../index.html"></a>
      </div>
    </div>
  </div>

</div>

  var progress = { v: 1, cleared: {}, met: [] };
  function loadProgress() {
    try {
      var raw = localStorage.getItem('nb-progress');
      if (!raw) return;
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return;
      if (o.cleared && typeof o.cleared === 'object') progress.cleared = o.cleared;
      if (Object.prototype.toString.call(o.met) === '[object Array]') progress.met = o.met.slice(0, 200);
    } catch (e) {}
  }
  function saveProgress() {
    try { localStorage.setItem('nb-progress', JSON.stringify(progress)); } catch (e) {}
  }
  function markMet(id) {
    if (progress.met.indexOf(id) >= 0) return;
    progress.met.push(id);
    saveProgress();
  }
  function markCleared(nightId) {
    progress.cleared[nightId] = true;
    saveProgress();
  }
  function isUnlocked(idx) {
    if (idx === 0 || forceUnlock) return true;
    return !!progress.cleared[NIGHTS[idx - 1].id];
  }
  function allBugs() {
    var out = [], i, j;
    for (i = 0; i < NIGHTS.length; i++) for (j = 0; j < NIGHTS[i].bugs.length; j++) out.push(NIGHTS[i].bugs[j]);
    return out;
  }

  /* ================= GA4 (best-effort, never blocks the game) =================
     game_complete: once per night run (a replay re-arms it). All calls triple-guarded.
     화면 추적용 옛 gaStep() 은 걷어냈다 — 포탈 계측 표준 v1 이 game_step 의 step 값을
     'start'|'replay' 로 못 박았는데 그 함수는 'intro'·밤 id 를 같은 이벤트에 섞어
     step 차원을 오염시켰다. 인트로 노출은 page_view 가, 밤 구분은 표준 쪽
     game_step 의 scene 이 이미 담는다. */
  var completeSent = false;
  function gaComplete(nightId) {
    if (completeSent) return;
    completeSent = true;
    try {
      if (typeof gtag === 'function') {
        gtag('event', 'game_complete', {
          game_id: 'night-bugs', scene: nightId, result: 'clear', lang: lang,
          play_sec: Math.max(0, Math.round((Date.now() - playStart) / 1000)), bugs: BUGS.length
        });
      }
    } catch (e) {}
    gaS.completed = true;
    gaVoteShow(nightId);
  }

  /* ---- GA4 portal standard v1 (2026-08-19) ----
     Adds step:'start'/'replay' and the ending 「또 할래?」 vote on top of the
     night-scoped gaComplete above. Same 3-guard rules. */
  var gaS = { started:false, completed:false, voted:false, voteShown:false, voteScene:'main' };
  function gaLang() { try { return lang || 'ko'; } catch (e) { return 'ko'; } }
  function gaSend(name, p) {
    try {
      if (typeof gtag !== 'function') return;
      p = p || {};
      p.game_id = 'night-bugs';
      if (!p.lang) p.lang = gaLang();
      gtag('event', name, p);
    } catch (e) {}
  }
  function gaRoundStart(scene) {
    if (gaS.completed) {
      gaS.completed = false;
      gaSend('game_step', { step:'replay', scene: scene || 'main' });
      return;
    }
    if (gaS.started) return;
    gaS.started = true;
    gaSend('game_step', { step:'start', scene: scene || 'main' });
  }
  var GA_VOTE_COPY = {
    ko: { q:'또 할래?', yes:'응', no:'글쎄', thx:'고마워요!' },
    ja: { q:'また あそぶ？', yes:'うん', no:'うーん', thx:'ありがとう！' },
    en: { q:'Want another go?', yes:'Yes', no:'Not sure', thx:'Thanks!' }
  };
  function gaVoteShow(scene) {
    var el = document.getElementById('gaVote');
    if (!el || gaS.voted) return;
    var c = GA_VOTE_COPY[gaLang()] || GA_VOTE_COPY.ko;
    el.querySelector('.ga-vote-q').textContent = c.q;
    el.querySelector('[data-choice="yes"]').textContent = c.yes;
    el.querySelector('[data-choice="unsure"]').textContent = c.no;
    gaS.voteScene = scene || 'main';
    gaS.voteShown = true;
    el.hidden = false;
    el.classList.remove('done');
  }
  (function () {
    var el = document.getElementById('gaVote');
    if (!el) return;
    el.addEventListener('click', function (e) {
      var b = e.target;
      while (b && b !== el && !(b.getAttribute && b.getAttribute('data-choice'))) b = b.parentNode;
      if (!b || b === el || gaS.voted) return;
      gaS.voted = true;
      gaSend('game_vote', { scene: gaS.voteScene, choice: b.getAttribute('data-choice') });
      var c = GA_VOTE_COPY[gaLang()] || GA_VOTE_COPY.ko;
      el.classList.add('done');
      el.querySelector('.ga-vote-q').textContent = c.thx;
      window.setTimeout(function () { el.hidden = true; }, 1200);
    });
  })();

  /* ================= language ================= */
  function detectLang() {
    var s = null;
    try { s = localStorage.getItem('in9-lang'); } catch (e) {}
    if (s && LANGS.indexOf(s) >= 0) return s;
    var n = (navigator.language || 'ko').toLowerCase();
    if (n.indexOf('ja') === 0) return 'ja';
    if (n.indexOf('en') === 0) return 'en';
    return 'ko';
  }
  function T() { return I18N[lang]; }
  function NC(idx) { return NIGHTS[idx == null ? curNight : idx].copy[lang]; }
  var NAMES = { ko:'밤곤충 손전등', ja:'夜のむし探し', en:'Night Bug Hunt' };
  function otherNames() {
    return ['ko','ja','en'].filter(function(l){ return l !== lang; })
      .map(function(l){ return NAMES[l]; }).join(' · ');
  }
  function renderNightTabs() {
    var wrap = $('nightTabs');
    wrap.innerHTML = '';
    var i;
    for (i = 0; i < NIGHTS.length; i++) {

  }
  function renderNotes() {
    var all = allBugs(), grid = $('notesGrid'), n = 0, i, c;

    $('soundBtn').setAttribute('aria-label', muted ? t.soundOff : t.soundOn);
    renderNightTabs();

    var i;

      if (BUGS[i].slotEl && BUGS[i].caught) BUGS[i].slotEl.title = BUGS[i].name[lang];
    }
  }
  $('langBtn').addEventListener('click', function () {
    lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
    try { localStorage.setItem('in9-lang', lang); } catch (e) {}

  });
  $('notesBtn').addEventListener('click', function () {
    var g = $('notesGrid');
    var open = !g.classList.contains('open');
    g.classList.toggle('open', open);
    this.setAttribute('aria-expanded', open ? 'true' : 'false');

  /* ================= scene build ================= */
  function buildStars() {
    starField.innerHTML = '';
    var i, s;
    for (i = 0; i < 64; i++) {
      s = document.createElement('div');
      s.className = 'star';
      var sz = Math.random() < 0.2 ? 3 : 2;
      s.style.width = sz + 'px';
      s.style.height = sz + 'px';
      s.style.left = (Math.random() * 98 + 1) + '%';
      s.style.top = (Math.random() * 38 + 1.5) + '%';
      s.style.setProperty('--tw', (2 + Math.random() * 3.5).toFixed(2) + 's');
      s.style.setProperty('--td', (Math.random() * 4).toFixed(2) + 's');
      s.style.opacity = (0.4 + Math.random() * 0.6).toFixed(2);
      starField.appendChild(s);
    }
  }

  function buildGrass(svg, color, count, hMin, hMax, wMin) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var NS = 'http://www.w3.org/2000/svg';
    var base = document.createElementNS(NS, 'rect');
    base.setAttribute('x', '0'); base.setAttribute('y', '96');
    base.setAttribute('width', '100'); base.setAttribute('height', '4');
    base.setAttribute('fill', color);
    svg.appendChild(base);
    var i;
    for (i = 0; i < count; i++) {
      var x = Math.random() * 102 - 1;
      var h = hMin + Math.random() * (hMax - hMin);
      var lean = (Math.random() * 8 - 4);
      var w = wMin + Math.random() * 1.1;
      var tipX = x + lean, tipY = 100 - h;
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d',
        'M' + x.toFixed(1) + ' 100 ' +
        'Q' + (x + lean * 0.25).toFixed(1) + ' ' + (100 - h * 0.62).toFixed(1) + ' ' + tipX.toFixed(1) + ' ' + tipY.toFixed(1) + ' ' +
        'Q' + (x + lean * 0.68 + w * 0.5).toFixed(1) + ' ' + (100 - h * 0.5).toFixed(1) + ' ' + (x + w).toFixed(1) + ' 100 Z');
      p.setAttribute('fill', color);
      svg.appendChild(p);
    }
  }

  function buildAmbientFireflies() {
    var spots = NIGHTS[curNight].aflies;
    var i;
    for (i = 0; i < spots.length; i++) {
      var a = document.createElement('div');
      a.className = 'afly' + (i % 2 ? ' b' : '');
      a.style.left = spots[i][0] + '%';
      a.style.top = spots[i][1] + '%';
      a.style.setProperty('--dd', (15 + Math.random() * 12).toFixed(1) + 's');
      var d = document.createElement('div');
      d.className = 'afly-dot';
      d.style.setProperty('--bd', (1.8 + Math.random() * 1.6).toFixed(2) + 's');
      d.style.setProperty('--bdd', (Math.random() * 2).toFixed(2) + 's');
      a.appendChild(d);
      fxLayer.appendChild(a);
    }
  }

  var WEB_SVG =
    '<svg class="spider-web" viewBox="0 0 84 84" aria-hidden="true">' +
    '<g stroke="rgba(255,255,255,.34)" stroke-width="0.8" fill="none">' +
    '<line x1="42" y1="42" x2="42" y2="2"/><line x1="42" y1="42" x2="42" y2="82"/>' +
    '<line x1="42" y1="42" x2="2" y2="42"/><line x1="42" y1="42" x2="82" y2="42"/>' +
    '<line x1="42" y1="42" x2="14" y2="14"/><line x1="42" y1="42" x2="70" y2="14"/>' +
    '<line x1="42" y1="42" x2="14" y2="70"/><line x1="42" y1="42" x2="70" y2="70"/>' +
    '<circle cx="42" cy="42" r="12"/><circle cx="42" cy="42" r="24"/><circle cx="42" cy="42" r="36"/>' +
    '</g></svg>';

  function buildBugs() {
    bugLayer.innerHTML = '';
    pSlots.innerHTML = '';
    var i;
    for (i = 0; i < BUGS.length; i++) {
      (function (b) {
        b.px = b.x; b.py = b.y;
        b.caught = false;
        b.reveal = b.shy ? 0 : 1;
        b.wt = Math.random() * 6.28;
        var el = document.createElement('div');
        el.className = 'bug' + (b.shy ? ' shy' : '');
        var inner = '';
        if (b.id === 'spider') inner += '<div class="spider-thread"></div>' + WEB_SVG;
        inner += '<span class="bug-emoji ' + b.cls + '" style="font-size:' + b.size +
          'px; --bob:' + (2.6 + Math.random() * 1.8).toFixed(2) + 's; --bobd:' +
          (Math.random() * 2).toFixed(2) + 's;">' + b.emoji + '</span>';
        el.innerHTML = inner;
        el.style.left = b.px + '%';
        el.style.top = b.py + '%';
        bugLayer.appendChild(el);
        b.el = el;
        b.glowEl = null;
        if (b.glow) {
          var g = document.createElement('div');
          g.className = 'fglow';
          fxLayer.appendChild(g);
          b.glowEl = g;
        }
        var slot = document.createElement('div');
        slot.className = 'slot';
        pSlots.appendChild(slot);
        b.slotEl = slot;
      })(BUGS[i]);
    }
    pCount.textContent = '0/' + BUGS.length;
  }

  /* Swap the whole scene to NIGHTS[idx]: palette class, grass/reeds, ambient
     fireflies, bugs, progress slots. Clears fx + timers so nothing from the
     previous night leaks over. */
  function loadNight(idx) {
    curNight = idx;
    BUGS = NIGHTS[idx].bugs;
    caughtCount = 0;
    currentCard = null;
    completeSent = false;
    if (cardTimer) { window.clearTimeout(cardTimer); cardTimer = null; }
    if (endTimer) { window.clearTimeout(endTimer); endTimer = null; }
    if (toastTimer) { window.clearTimeout(toastTimer); toastTimer = null; }
    toastKey = 'toast';
    hintToast.classList.remove('show');
    cardOverlay.classList.remove('active');
    fxLayer.innerHTML = '';
    // released-bug emojis live on <body> (they float above the end panel) — clear
    // any still in flight so they do not drift over the next night's scene
    var rb = document.querySelectorAll('.release-bug');
    var i, cls = NIGHTS[idx].cls;
    for (i = 0; i < rb.length; i++) if (rb[i].parentNode) rb[i].parentNode.removeChild(rb[i]);
    for (i = 0; i < NIGHTS.length; i++) if (NIGHTS[i].cls) stage.classList.remove(NIGHTS[i].cls);
    if (cls) stage.classList.add(cls);
    var g = NIGHTS[idx].grass;
    buildGrass($('grassBack'),  g[0][0], g[0][1], g[0][2], g[0][3], g[0][4]);
    buildGrass($('grassMid'),   g[1][0], g[1][1], g[1][2], g[1][3], g[1][4]);
    buildGrass($('grassFront'), g[2][0], g[2][1], g[2][2], g[2][3], g[2][4]);
    buildAmbientFireflies();
    buildBugs();
    measure();
  }

  /* ================= geometry ================= */
  // Roaming bugs must stay clear of the header UI band. The header overlays the
  // top of the stage, so a bug whose ceiling sits inside that band gets hidden
  // behind the chrome. A fixed % ceiling cannot express this: the header is a
  // near-constant pixel height while the stage height swings with orientation
  // (7% of a 390px-tall landscape viewport is well inside the header). So derive
  // the ceiling from the measured header height each time the viewport changes.
  //
  // The same applies at the bottom: the progress pill (#progress) floats over
  // the stage above the safe-area inset, and it swallows pointer events. Any
  // bug centred under it (roaming or fixed) would be hidden and untappable —
  // shy bugs worst of all, since the beam must rest on them. So also derive a
  // floor from the pill's measured rect: roaming bounds get their y1 lowered,
  // fixed bugs that sit horizontally under the pill get lifted just above it.
  function clampRoamBounds() {
    var hh = headerEl ? headerEl.offsetHeight : 0;
    var i, b, half, minY, maxY, target, sr, pr;
    var pillTop = 0, pillL = 0, pillR = 0, hasPill = false;
    if (SW && SH && progressEl) {
      sr = stage.getBoundingClientRect();
      pr = progressEl.getBoundingClientRect();
      if (pr.height > 0) {
        hasPill = true;
        pillTop = pr.top - sr.top; pillL = pr.left - sr.left; pillR = pr.right - sr.left;
      }
    }
    for (i = 0; i < BUGS.length; i++) {
      b = BUGS[i];
      half = b.size * 0.5;
      if (b.bounds) {
        if (b.bounds.baseY0 == null) b.bounds.baseY0 = b.bounds.y0;
        if (b.bounds.baseY1 == null) b.bounds.baseY1 = b.bounds.y1;
        // emoji is centred on (px,py), so clear half its height plus a margin
        minY = SH ? (hh + half + 8) / SH * 100 : b.bounds.baseY0;
        maxY = hasPill ? (pillTop - half - 8) / SH * 100 : b.bounds.baseY1;
        b.bounds.y1 = Math.min(b.bounds.baseY1, maxY);
        b.bounds.y0 = Math.min(b.bounds.y1 - 4, Math.max(b.bounds.baseY0, minY));
        if (b.bounds.y1 < b.bounds.y0 + 4) b.bounds.y1 = b.bounds.y0 + 4;
        target = Math.max(b.bounds.y0, Math.min(b.bounds.y1, b.py));
      } else {
        // fixed bug: start from its authored spot so a rotate back un-clamps it
        target = b.y;
        if (hasPill) {
          var bx = b.x / 100 * SW;
          if (bx + half + 8 > pillL && bx - half - 8 < pillR) {
            maxY = (pillTop - half - 8) / SH * 100;
            if (target > maxY) target = maxY;
          }
        }
      }
      if (target !== b.py) {
        b.py = target;
        if (b.el) b.el.style.top = b.py.toFixed(2) + '%';
      }
    }
  }

  function measure() {
    SW = stage.clientWidth || window.innerWidth;
    SH = stage.clientHeight || window.innerHeight;
    R = Math.max(105, Math.min(Math.min(SW, SH) * 0.26, 175));
    clampRoamBounds();
    if (state === 'intro') {
      lx = tx = SW / 2;
      ly = ty = SH * 0.55;
    } else {
      // orientation change mid-play: keep the beam inside the (new) stage
      tx = Math.max(0, Math.min(SW, tx)); ty = Math.max(0, Math.min(SH, ty));
      lx = Math.max(0, Math.min(SW, lx)); ly = Math.max(0, Math.min(SH, ly));
    }
    plx = lx; ply = ly;
  }
  function bugPx(b) { return { x: b.px / 100 * SW, y: b.py / 100 * SH }; }
  function dist(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

  /* ================= main loop ================= */
  var lastT = 0;
  function frame(now) {
    if (!lastT) lastT = now;
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    var k = Math.min(1, dt * 11);
    lx += (tx - lx) * k;
    ly += (ty - ly) * k;
    // beam speed (px/s) — shy bugs only surface while the light rests
    lspd = dt > 0 ? dist(lx, ly, plx, ply) / dt : 0;
    plx = lx; ply = ly;

    var r = R;
    if (!RM) {
      var tsec = now / 1000;
      r = R * (1 + 0.016 * Math.sin(tsec * 3.1) + 0.009 * Math.sin(tsec * 7.7));
    }
    stage.style.setProperty('--lx', lx.toFixed(1) + 'px');
    stage.style.setProperty('--ly', ly.toFixed(1) + 'px');
    stage.style.setProperty('--r', r.toFixed(1) + 'px');

    var i;
    if (!SW || !SH) measure();   // zero-size stage (hidden tab at boot) → wait for real metrics
    for (i = 0; i < BUGS.length && SW && SH; i++) {
      var b = BUGS[i];
      if (b.caught) continue;
      if (b.avoid && state === 'play') {
        var p = bugPx(b);
        var d = dist(p.x, p.y, lx, ly);
        var range = R * 1.55;
        var mvx = 0, mvy = 0;
        if (d < range && d > 1) {
          var sp = 46 * (1 - d / range);          // px/s away from light
          mvx += (p.x - lx) / d * sp;
          mvy += (p.y - ly) / d * sp;
        }
        b.wt += dt;
        mvx += Math.sin(b.wt * 0.7) * 7;          // gentle wander
        mvy += Math.cos(b.wt * 0.53) * 5;
        b.px += mvx * dt / SW * 100;
        b.py += mvy * dt / SH * 100;
        var bd = b.bounds;
        if (b.px < bd.x0) b.px = bd.x0; if (b.px > bd.x1) b.px = bd.x1;
        if (b.py < bd.y0) b.py = bd.y0; if (b.py > bd.y1) b.py = bd.y1;
        b.el.style.left = b.px.toFixed(2) + '%';
        b.el.style.top = b.py.toFixed(2) + '%';
      }
      if (b.shy) {
        var sq = bugPx(b);
        var resting = state === 'play' && lspd < 70 && dist(sq.x, sq.y, lx, ly) < R * 0.95;
        var rv = b.reveal + (resting ? dt / 1.0 : -dt * 1.6);
        rv = rv < 0 ? 0 : (rv > 1 ? 1 : rv);
        if (rv !== b.reveal) {
          b.reveal = rv;
          b.el.style.opacity = (rv * rv).toFixed(2);   // eased: stays faint until it is nearly out (tappable at 0.9)
          if (rv >= 0.9) b.el.classList.add('shown');
          else if (rv < 0.6) b.el.classList.remove('shown');
        }
      }
      if (b.glowEl) {
        var gp = bugPx(b);
        b.glowEl.style.left = gp.x.toFixed(1) + 'px';
        b.glowEl.style.top = (gp.y + 4).toFixed(1) + 'px';
      }
    }
    window.requestAnimationFrame(frame);
  }

  /* ================= pointer ================= */
  function toStageXY(e) {
    var rect = stage.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  stage.addEventListener('pointermove', function (e) {
    var p = toStageXY(e);
    tx = p.x; ty = p.y;
  });
  stage.addEventListener('pointerdown', function (e) {
    resumeAudio();
    if (state !== 'play') return;
    var p = toStageXY(e);
    var hit = tryCapture(p.x, p.y);
    tx = p.x; ty = p.y;
    if (!hit) e.preventDefault();
  });

  /* ================= capture ================= */
  function tryCapture(x, y) {
    var i;
    for (i = 0; i < BUGS.length; i++) {
      var b = BUGS[i];
      if (b.caught) continue;
      if (b.shy && b.reveal < 0.9) continue;   // not surfaced yet — hold the light still
      var p = bugPx(b);
      var dLight = dist(p.x, p.y, lx, ly);
      var dTap = dist(p.x, p.y, x, y);
      if (dLight < R * 1.05 && dTap < Math.max(48, b.size * 1.1)) {
        capture(b);
        return true;
      }
    }
    return false;
  }

  function capture(b) {
    state = 'card';
    b.caught = true;
    caughtCount++;
    currentCard = b;
    sndCapture();

    var p = bugPx(b);
    burst(p.x, p.y);
    flash(p.x, p.y);

    if (!RM && b.el.animate) {
      b.el.animate(
        [{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
         { transform: 'translate(-50%,-58%) scale(1.55)', opacity: 0 }],
        { duration: 480, easing: 'cubic-bezier(.2,.8,.4,1)', fill: 'forwards' }
      ).onfinish = (function (el) { return function () { el.classList.add('caught'); }; })(b.el);
    } else {
      b.el.classList.add('caught');
    }
    if (b.glowEl) b.glowEl.style.display = 'none';

    b.slotEl.classList.add('filled');
    b.slotEl.innerHTML = '<span class="' + b.cls + '" style="font-size:12px;">' + b.emoji + '</span>';
    b.slotEl.title = b.name[lang];
    pCount.textContent = caughtCount + '/' + BUGS.length;
    markMet(b.id);

    cardTimer = window.setTimeout(function () { cardTimer = null; showCard(b); }, 500);
  }

  function burst(x, y) {
    if (RM) return;
    var chars = ['✦', '✧', '·', '✦', '•'];
    var i;
    for (i = 0; i < 10; i++) {
      var sp = document.createElement('span');
      sp.className = 'particle';
      sp.textContent = chars[i % chars.length];
      sp.style.left = x + 'px';
      sp.style.top = y + 'px';
      sp.style.fontSize = (9 + Math.random() * 12) + 'px';
      fxLayer.appendChild(sp);
      var ang = Math.random() * Math.PI * 2;
      var d = 38 + Math.random() * 52;
      if (sp.animate) {
        var an = sp.animate(
          [{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
           { transform: 'translate(calc(-50% + ' + (Math.cos(ang) * d).toFixed(0) + 'px), calc(-50% + ' +
             (Math.sin(ang) * d - 16).toFixed(0) + 'px)) scale(.25)', opacity: 0 }],
          { duration: 620 + Math.random() * 250, easing: 'cubic-bezier(.15,.7,.4,1)', fill: 'forwards' });
        (function (el) { an.onfinish = function () { if (el.parentNode) el.parentNode.removeChild(el); }; })(sp);
      } else {
        (function (el) { window.setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 700); })(sp);
      }
    }
  }

  function flash(x, y) {
    if (RM) return;
    var f = document.createElement('div');
    f.style.cssText = 'position:absolute; left:' + x + 'px; top:' + y +
      'px; width:180px; height:180px; border-radius:50%; transform:translate(-50%,-50%);' +
      'background:radial-gradient(circle, rgba(255,236,170,.55), rgba(255,210,110,0) 70%); mix-blend-mode:screen;';
    fxLayer.appendChild(f);
    if (f.animate) {
      f.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 420, fill: 'forwards' })
        .onfinish = function () { if (f.parentNode) f.parentNode.removeChild(f); };
    } else {
      window.setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 450);
    }
  }

  /* ================= observation card ================= */
  function renderCard(b) {
    var t = T();
    $('cardLabel').textContent = t.cardLabel + ' · ' + caughtCount + '/' + BUGS.length;
    $('cardEmoji').className = b.cls;
    $('cardEmoji').textContent = b.emoji;
    $('cardName').textContent = b.name[lang];
    $('cardFact').textContent = b.fact[lang];
    $('cardBtn').textContent = (caughtCount >= BUGS.length) ? t.cardBtnLast : t.cardBtn;
  }
  function showCard(b) {
    renderCard(b);
    cardOverlay.classList.add('active');
  }
  function closeCard() {
    if (state !== 'card') return;
    cardOverlay.classList.remove('active');
    currentCard = null;
    sndPop();
    if (caughtCount >= BUGS.length) {
      state = 'end';
      endTimer = window.setTimeout(function () { endTimer = null; startEnding(); }, 420);
    } else {
      state = 'play';
    }
  }
  $('cardBtn').addEventListener('click', closeCard);
  cardOverlay.addEventListener('click', function (e) {
    if (e.target === cardOverlay) closeCard();
  });

  /* ================= ending ================= */
  function startEnding() {
    var night = NIGHTS[curNight];
    markCleared(night.id);
    gaComplete(night.id);
    // end-panel buttons depend on which night just finished
    var hasNext = curNight < NIGHTS.length - 1;
    $('nextBtn').style.display = hasNext ? '' : 'none';
    $('prevBtn').style.display = curNight > 0 ? '' : 'none';
    $('replayBtn').className = hasNext ? 'btn-ghost' : 'btn-warm';
    applyI18n();   // refresh tabs/lock note + notes count now that this night is cleared
    endOverlay.classList.add('active');
    endOverlay.classList.add('dimmed');
    sndEnding();
    var delay = RM ? 60 : 1650;
    if (!RM) releaseBugs();
    endTimer = window.setTimeout(function () {
      endTimer = null;
      endPanel.style.visibility = 'visible';
    }, delay);
  }

  function releaseBugs() {
    var i;
    for (i = 0; i < BUGS.length; i++) {
      (function (b, idx) {
        var rect = b.slotEl.getBoundingClientRect();
        var sp = document.createElement('span');
        sp.className = 'release-bug ' + b.cls;
        sp.textContent = b.emoji;
        sp.style.fontSize = '26px';
        sp.style.left = (rect.left + rect.width / 2) + 'px';
        sp.style.top = (rect.top + rect.height / 2) + 'px';
        document.body.appendChild(sp);
        var dx = (Math.random() * 160 - 80).toFixed(0);
        var rise = (window.innerHeight * (0.5 + Math.random() * 0.25)).toFixed(0);
        if (sp.animate) {
          sp.animate(
            [{ transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', opacity: 1 },
             { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% - ' + rise +
               'px)) scale(.5) rotate(' + (Math.random() * 60 - 30).toFixed(0) + 'deg)', opacity: 0 }],
            { duration: 1900 + Math.random() * 700, delay: idx * 110,
              easing: 'cubic-bezier(.3,.1,.3,1)', fill: 'forwards' }
          ).onfinish = function () { if (sp.parentNode) sp.parentNode.removeChild(sp); };
        } else {
          window.setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 2600);
        }
      })(BUGS[i], i);
    }
  }

  /* Begin (or restart) a night: full scene rebuild via loadNight, then play. */
  function startNight(idx) {
    endOverlay.classList.remove('active');
    endOverlay.classList.remove('dimmed');
    endPanel.style.visibility = 'hidden';
    introOverlay.classList.remove('active');
    loadNight(idx);
    selNight = idx;
    applyI18n();
    state = 'play';
    playStart = Date.now();
    gaRoundStart(NIGHTS[idx].id);
    sndPop();
    showNightToasts();
    window.setTimeout(function () {
      if (state === 'play' && curNight === idx) {
        var alive = [];
        for (var i = 0; i < BUGS.length; i++) if (!BUGS[i].caught) alive.push(BUGS[i]);
        if (alive.length) doGlint(alive[Math.floor(Math.random() * alive.length)]);
      }
    }, 1400);
  }
  /* Hint toast chain: the night's opening line, then (if the night has one) its
     rule — e.g. "hold the light still" — so a child arriving via "Next Night"
     without revisiting the intro panel still hears the rule once. Every step is
     tracked in toastTimer, so loadNight() cancels the whole chain. */
  function showNightToasts() {
    var pc = NC(curNight);
    toastKey = 'toast';
    hintToast.textContent = pc.toast;
    hintToast.classList.add('show');
    toastTimer = window.setTimeout(function () {
      hintToast.classList.remove('show');
      if (!pc.rule) { toastTimer = null; return; }
      toastTimer = window.setTimeout(function () {          // wait for the fade-out
        toastKey = 'rule';
        hintToast.textContent = NC(curNight).rule;
        hintToast.classList.add('show');
        toastTimer = window.setTimeout(function () {
          toastTimer = null;
          hintToast.classList.remove('show');
        }, 4500);
      }, 900);
    }, 4200);
  }

  function reset() { startNight(curNight); }
  $('replayBtn').addEventListener('click', reset);
  $('nextBtn').addEventListener('click', function () {
    if (curNight < NIGHTS.length - 1) startNight(curNight + 1);
  });
  $('prevBtn').addEventListener('click', function () { startNight(0); });

  /* ================= hints (glints) ================= */
  function scheduleGlint() {
    glintTimer = window.setTimeout(function () {
      if (state === 'play') {
        var alive = [];
        var i;
        for (i = 0; i < BUGS.length; i++) if (!BUGS[i].caught) alive.push(BUGS[i]);
        if (alive.length) doGlint(alive[Math.floor(Math.random() * alive.length)]);
      }
      scheduleGlint();
    }, 2100 + Math.random() * 2400);
  }

  function doGlint(b) {
    var p = bugPx(b);
    var g = document.createElement('span');
    g.className = 'glint';
    g.textContent = '✦';
    g.style.left = p.x + 'px';
    g.style.top = p.y + 'px';
    fxLayer.appendChild(g);
    window.setTimeout(function () { if (g.parentNode) g.parentNode.removeChild(g); }, RM ? 900 : 1250);
    var pan = Math.max(-0.85, Math.min(0.85, (p.x / SW) * 2 - 1));
    playHint(b.snd, pan);
  }

  /* ================= audio ================= */
  var AC = null, master = null, noiseBuffer = null;

  function initAudio() {
    if (AC) return;
    try {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return;
      AC = new Ctor();
      master = AC.createGain();
      master.gain.value = muted ? 0 : 0.85;
      master.connect(AC.destination);
      ambLoop();
    } catch (e) { AC = null; }
  }
  function resumeAudio() {
    if (AC && AC.state === 'suspended') { AC.resume().catch(function () {}); }
  }
  function getNoise() {
    if (noiseBuffer) return noiseBuffer;
    var len = AC.sampleRate;
    noiseBuffer = AC.createBuffer(1, len, AC.sampleRate);
    var d = noiseBuffer.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuffer;
  }
  function outNode(pan) {
    if (AC.createStereoPanner && typeof pan === 'number') {
      var p = AC.createStereoPanner();
      p.pan.value = pan;
      p.connect(master);
      return p;
    }
    return master;
  }
  function ping(freq0, freq1, dur, gain, pan, type, when) {
    if (!AC || muted) return;
    try {
      var t0 = AC.currentTime + (when || 0);
      var o = AC.createOscillator();
      var g = AC.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq0, t0);
      if (freq1 && freq1 !== freq0) o.frequency.exponentialRampToValueAtTime(freq1, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(outNode(pan));
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  }
  function noiseHit(filterFreq, q, dur, gain, pan, when, ftype) {
    if (!AC || muted) return;
    try {
      var t0 = AC.currentTime + (when || 0);
      var src = AC.createBufferSource();
      src.buffer = getNoise();
      var f = AC.createBiquadFilter();
      f.type = ftype || 'bandpass';
      f.frequency.value = filterFreq;
      f.Q.value = q;
      var g = AC.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(outNode(pan));
      src.start(t0); src.stop(t0 + dur + 0.05);
    } catch (e) {}
  }

  function cricketChirp(pan, vol) {
    var i;
    for (i = 0; i < 3; i++) {
      ping(4250 + Math.random() * 180, 4100, 0.035, 0.045 * vol, pan, 'sine', i * 0.072);
    }
  }
  function playHint(kind, pan) {
    if (!AC || muted) return;
    if (kind === 'chirp') {
      cricketChirp(pan, 1.6);
      cricketChirp(pan, 1.3);
    } else if (kind === 'flutter') {
      var i;
      for (i = 0; i < 4; i++) noiseHit(280, 1.2, 0.07, 0.05, pan, i * 0.085);
    } else if (kind === 'shimmer') {
      ping(1900, 2100, 0.09, 0.04, pan, 'sine', 0);
      ping(2550, 2700, 0.09, 0.032, pan, 'sine', 0.11);
      ping(3150, 3300, 0.1, 0.026, pan, 'sine', 0.22);
    } else if (kind === 'buzz') {
      noiseHit(160, 2.5, 0.16, 0.055, pan, 0, 'lowpass');
      ping(105, 92, 0.17, 0.05, pan, 'sawtooth', 0);
    } else if (kind === 'plop') {
      // water drop: quick downward blip + tiny splash
      ping(880, 330, 0.11, 0.06, pan, 'sine', 0);
      noiseHit(2400, 0.9, 0.09, 0.025, pan, 0.03, 'bandpass');
      ping(1320, 990, 0.07, 0.022, pan, 'sine', 0.13);
    } else {
      ping(1550, 2300, 0.28, 0.05, pan, 'sine', 0);
      ping(2350, 3100, 0.2, 0.028, pan, 'sine', 0.07);
    }
  }
  function sndCapture() {
    ping(523, 523, 0.22, 0.1, 0, 'triangle', 0);
    ping(784, 784, 0.3, 0.09, 0, 'triangle', 0.09);
    ping(1046, 1046, 0.34, 0.05, 0, 'sine', 0.18);
    noiseHit(5200, 1.5, 0.25, 0.03, 0, 0.05, 'highpass');
  }
  function sndPop() { ping(300, 240, 0.08, 0.05, 0, 'sine', 0); }
  function sndEnding() {
    var notes = [523.25, 659.25, 783.99, 1046.5];
    var i;
    for (i = 0; i < notes.length; i++) {
      ping(notes[i], notes[i], 0.55, 0.06, (i - 1.5) * 0.25, 'sine', i * 0.16);
      ping(notes[i] * 2, notes[i] * 2, 0.4, 0.018, 0, 'sine', i * 0.16 + 0.02);
    }
  }

  function ambLoop() {
    if (!AC) return;
    var delay = 1300 + Math.random() * 2300;
    ambTimer = window.setTimeout(function () {
      if (!muted && !document.hidden && state !== 'intro') {
        var pan = Math.random() * 1.4 - 0.7;
        var vol = 0.45 + Math.random() * 0.5;
        var extra = NIGHTS[curNight].amb;   // per-night extra ambience (e.g. pond ripple)
        if (extra && Math.random() < 0.3) {
          playHint(extra, pan);
        } else {
          cricketChirp(pan, vol);
        }
        if (Math.random() < 0.4) {
          window.setTimeout(function () {
            if (!muted) cricketChirp(pan, vol * 0.8);
          }, 340);
        }
      }
      ambLoop();
    }, delay);
  }

  /* ================= sound toggle ================= */
  function setMuted(m) {
    muted = m;
    $('soundBtn').textContent = muted ? '🔇' : '🔊';
    $('soundBtn').setAttribute('aria-label', muted ? T().soundOff : T().soundOn);
    if (master) master.gain.value = muted ? 0 : 0.85;
    try { localStorage.setItem('nb-sound', muted ? 'off' : 'on'); } catch (e) {}
  }
  $('soundBtn').addEventListener('click', function () {
    initAudio();
    resumeAudio();
    setMuted(!muted);
    if (!muted) sndPop();
  });

  /* ================= start / init ================= */
  $('startBtn').addEventListener('click', function () {
    initAudio();
    resumeAudio();
    startNight(selNight);
  });

  document.addEventListener('visibilitychange', function () {
    if (!AC) return;
    if (document.hidden) { AC.suspend().catch(function () {}); }
    else if (!muted) { AC.resume().catch(function () {}); }
  });

  // Stars/bugs are positioned in %, so a resize only needs re-measuring —
  // rebuilding the star field here made the sky visibly reshuffle on rotate.
  window.addEventListener('resize', measure);

  /* boot */
  lang = detectLang();
  loadProgress();
  try { if (localStorage.getItem('nb-sound') === 'off') muted = true; } catch (e) {}
  $('soundBtn').textContent = muted ? '🔇' : '🔊';
  // ?night=2 : direct test entry into a later night (lock ignored)
  try {
    var m = /[?&]night=(\d+)/.exec(window.location.search);
    if (m) {
      var qn = parseInt(m[1], 10) - 1;
      if (qn > 0 && qn < NIGHTS.length) { selNight = qn; forceUnlock = true; }
    }
  } catch (e) {}
  buildStars();
  loadNight(selNight);
  applyI18n();
  scheduleGlint();
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
