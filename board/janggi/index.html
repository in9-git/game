function selectPiece(col, row) {
  if (state.gameOver) return;
  // 진행 중인 애니메이션이 있으면 즉시 마무리 (callback 이 board/turn 을 갱신할 수 있음)
  finishCurrentAnim();
  if (state.gameOver || state.aiThinking) return;
  // 인터럽트 결과로 턴이 상대(AI)로 넘어갔다면, 같은 클릭으로 또 다른 동작이 일어나면 안 됨
  if (state.mode === 'ai' && state.turn === HAN) return;
  // 온라인: 대국 중이고 내 차례일 때만 입력 허용 (상대 말/상대 차례 차단)
  if (state.mode === 'online' && (state.onlinePhase !== 'playing' || state.turn !== state.mySide)) return;
  tryStartBGM();
  // finishCurrentAnim 으로 board 가 변경됐을 수 있으니 piece 는 그 후에 읽음
  const piece = state.board[row][col];

  if (state.selected) {
    const [sc, sr] = state.selected;
    const selPiece = state.board[sr]?.[sc];
    // 선택해 둔 말이 사라졌거나(이미 이동/캡처됨) 내 말이 아니면 선택 무효화
    if (!selPiece || selPiece.team !== state.turn) {
      state.selected = null;
      state.legalMoves = [];
    } else {
      // 인터럽트로 보드가 바뀌었을 수 있으니 legalMoves 를 항상 현재 보드 기준으로 재계산
      state.legalMoves = playableMoves(state.board, sc, sr);
      if (state.legalMoves.some(([mc, mr]) => mc === col && mr === row)) {
        executeMove(sc, sr, col, row);
        return;
      }
      // 원래는 갈 수 있는 칸인데 반복 금지로 막힌 경우 — 왜 안 되는지 알려준다
      if (isRepeatBanned(selPiece.team, sc, sr, col, row)) {
        flashNotice(LANG[state.lang].repeatBlocked);
        return;
      }
    }
  }

  if (piece && piece.team === state.turn) {
    state.selected = [col, row];
    state.legalMoves = playableMoves(state.board, col, row);
  } else {
    state.selected = null;
    state.legalMoves = [];
  }
  state.lastMoveGhost = null;
  // 선택만 바뀔 땐 부분 DOM 업데이트로 즉각 반응 (전체 innerHTML 재빌드 회피)
  applySelectionDOM();
}

// 반응형 셀/기물 크기 헬퍼 — render 와 applySelectionDOM 모두에서 사용
function getCellSize() {
  let s = 48;
  if (window.innerWidth <= 480) s = 36;
  if (window.innerWidth <= 380) s = 30;
  return s;
}
function getPieceSize(pieceType) {
  const base = getCellSize() * 0.917;
  const mult = PIECE_SIZES[pieceType] || 0.85;
  return base * mult;
}
function getPieceHeight(pieceType) {
  const base = getCellSize() * 0.8125;
  const mult = PIECE_SIZES[pieceType] || 0.85;
  return base * mult;
}
// 기물 내부 마크업 — 이미지말 또는 팬시 한글말(state.koreanPieces). 보드/포획/고스트 공용
function pieceMarkup(team, type, w, h) {
  if (state.koreanPieces) {
    const box = Math.round(h);            // 정사각 토큰 (이미지 세로폭에 맞춰 안 붐비게)
    const fs = Math.round(box * 0.62);
    return `<span class="pc-han ${team}" style="width:${box}px;height:${box}px;font-size:${fs}px;"><i>${PIECE_HANGUL[team][type]}</i></span>`;
  }
  return `<img src="${PIECE_IMAGES[team][type]}" alt="${PIECE_NAMES[team][type]}" style="width:${w}px;height:${h}px;">`;
}

// 선택 상태 변경을 기존 DOM에 직접 반영해 click→paint 지연 최소화
function applySelectionDOM() {
  // Clear previous selection visuals
  document.querySelectorAll('.piece.selected').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.cell .move-dot, .cell .recommend-ghost').forEach(el => el.remove());
  // 배려: 부분 갱신 경로에서도 aria-pressed 를 render() 와 같은 상태로 맞춘다
  document.querySelectorAll('.cell[aria-pressed]').forEach(el => el.removeAttribute('aria-pressed'));

  if (!state.selected) return;
  const [sc, sr] = state.selected;
  const selectedPiece = state.board[sr][sc];
  if (!selectedPiece) return;

  // Highlight selected piece
  const selCell = document.querySelector(`.cell[data-col="${sc}"][data-row="${sr}"]`);
  selCell?.querySelector('.piece')?.classList.add('selected');
  selCell?.setAttribute('aria-pressed', 'true');

  // Build recommended-to lookup for ghost rendering
  const recToMap = {};
  if (state.showRecommend && state.recommended.length > 0) {
    for (const m of state.recommended) {
      const fromKey = `${m.from[0]},${m.from[1]}`;
      const selKey = `${sc},${sr}`;
      if (fromKey === selKey) recToMap[`${m.to[0]},${m.to[1]}`] = m;
    }
  }

  // Legal-move dots and recommend ghosts
  for (const [mc, mr] of state.legalMoves) {
    const cell = document.querySelector(`.cell[data-col="${mc}"][data-row="${mr}"]`);
    if (!cell) continue;
    const hasPiece = !!cell.querySelector('.piece');
    const recTo = recToMap[`${mc},${mr}`];
    if (recTo) {
      const gW = getPieceSize(selectedPiece.type);
      const gH = getPieceHeight(selectedPiece.type);
      const ghost = document.createElement('div');
      ghost.className = 'recommend-ghost';
      ghost.innerHTML = pieceMarkup(selectedPiece.team, selectedPiece.type, gW, gH);
      cell.appendChild(ghost);
    } else if (state.beginnerMode && !hasPiece) {
      const dot = document.createElement('div');
      dot.className = 'move-dot';
      cell.appendChild(dot);
    }
  }
}

// 추천 계산은 무거우니(minimax depth=2) 클릭 응답을 막지 않도록 비동기로 미룸
let recommendToken = 0;
function scheduleRecommend(team) {
  if (state.gameMode === 'challenge') return; // 도전 모드는 훈수 없이 둔다
  const myToken = ++recommendToken;
  setTimeout(() => {
    if (myToken !== recommendToken) return; // 더 새로운 요청이 들어왔으면 폐기
    if (state.gameOver) return;
    if (!state.showRecommend) return;
    if (state.turn !== team) return;
    state.recommended = getRecommendedMoves(state.board, team);
    // 선택 중이 아닐 때만 렌더(선택 중에는 추천이 다음 차례에 다시 계산됨)
    if (!state.selected) render();
  }, 0);
}

// 왕(장수)을 잡는 수가 적용되려 하면 — 보드에서 왕을 지우지 말고 즉시 그 수를 둔 쪽 승리로 종료.
// 정상 플레이라면 체크메이트가 먼저 감지되므로 평소엔 호출되지 않는 안전망(데싱크 등 대비).
function endIfKingCapture(board, toC, toR, moverTeam) {
  const target = board[toR] && board[toR][toC];
  if (!target || target.type !== TYPES.KING) return false;
  state.gameOver = true;
  state.winner = moverTeam;
  state.selected = null;
  state.legalMoves = [];
  state.recommended = [];
  state.aiThinking = false;
  playWinSound(moverTeam);
  render();
  return true;
}

// 수 제한에 닿았다 — 남은 말값으로 판을 닫는다(한 덤 1.5점).
function teamScore(board, team) {
  let sum = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const p = board[r][c];
      if (p && p.team === team) sum += PIECE_VALUES[p.type];
    }
  return sum;
}

// 이 판이 수 제한에 닿았으면 점수로 끝내고 true. 온라인은 양쪽이 따로 끝내면 어긋나므로 제외.
function checkMoveLimit() {
  if (state.gameOver) return false;
  if (state.mode !== 'ai') return false;
  if (state.moveHistory.length < MOVE_LIMIT) return false;
  const cho = teamScore(state.board, CHO);
  const han = teamScore(state.board, HAN) + HAN_BONUS;
  state.gameOver = true;
  state.winner = cho > han ? CHO : HAN;
  state.byPoints = { cho: cho, han: han };
  state.selected = null;
  state.legalMoves = [];
  state.recommended = [];
  state.aiThinking = false;
  playWinSound(state.winner);
  render();
  return true;
}

function executeMove(fromC, fromR, toC, toR) {
  const piece = state.board[fromR][fromC];
  // 안전장치: 잘못된 호출(턴 불일치/빈 칸/적 말)은 무시
  if (!piece || piece.team !== state.turn) return;
  // 반복수는 UI에서 이미 빠져 있지만, 다른 경로로 들어와도 판에 올라가지 않게 한 번 더 막는다
  if (isRepeatBanned(piece.team, fromC, fromR, toC, toR)) {
    flashNotice(LANG[state.lang].repeatBlocked);
    return;
  }
  // GA: 실제로 첫 수가 놓이는 순간이 판 시작
  if (!gaRoundActive) { gaRoundActive = true; gaRoundStart(gaScene()); }
  // 적 왕(장수)을 잡는 수 — 왕을 사라지게 두지 말고 즉시 둔 쪽 승리로 종료(장기: 장수 잡으면 승).
  if (endIfKingCapture(state.board, toC, toR, state.turn)) return;
  const isCapture = state.board[toR][toC] !== null;

  const executeMoveFinal = () => {
    const { board: newBoard, captured } = makeMove(state.board, fromC, fromR, toC, toR);
    if (captured) {
      state.captured[captured.team].push(captured);
      playCaptureSound();
    } else {
      playMoveSound();
    }
    state.board = newBoard;
    state.lastMove = { from: [fromC, fromR], to: [toC, toR] };
    state.moveHistory.push(state.lastMove);
    // Track move in UCI history for WASM engine
    const uciMoveStr = boardToMoveStr(fromC, fromR, toC, toR);
    wasmMoveHistory.push(uciMoveStr);
    state.selected = null;
    state.legalMoves = [];

    // 온라인: 내 수를 상대에게 전송 (체크메이트로 끝나는 수도 반드시 전송돼야 하므로 여기서)
    if (state.mode === 'online') {
      onlineSend({ type: 'move', from: [fromC, fromR], to: [toC, toR] });
    }

    const enemy = state.turn === CHO ? HAN : CHO;

    // Check for checkmate
    if (isCheckmate(state.board, enemy)) {
      state.gameOver = true;
      state.winner = state.turn;
      state.recommended = [];
      playWinSound(state.turn);
      render();
      return;
    }

    // 수 제한 — 여기서 판을 닫지 않으면 반복금지에 갇힌 국면이 영영 안 끝난다
    if (checkMoveLimit()) return;

    // 장군 → 음성만 재생, 시각적 하이라이트/상태바 표시 없음
    if (isInCheck(state.board, enemy)) {
      playJanggunSound(state.turn);
    }
    state.inCheck = null;

    state.turn = enemy;

    // 추천은 무거우니 우선 비워서 즉시 렌더하고, 계산은 비동기로 이후 보강
    state.recommended = [];
    render();
    if (state.showRecommend && !(state.mode === 'ai' && state.turn === HAN)) {
      scheduleRecommend(state.turn);
    }

    // AI move
    if (state.mode === 'ai' && state.turn === HAN && !state.gameOver) {
      state.aiThinking = true;
      render();
      const myAiToken = aiToken; // 이 판의 세대 — 깨어났을 때 달라졌으면 그 수는 버린다
      setTimeout(async () => {
        if (myAiToken !== aiToken) return;                       // 생각을 시작하기도 전에 새 판이 열렸다
        let aiMove = await getAIMove(state.board, HAN, state.difficulty);
        if (myAiToken !== aiToken) return;                       // 생각하는 동안 새 판이 열렸다 — 폐기
        // 방어: 엔진(WASM) 데싱크로 '초(내 편)' 말이나 비합법 수가 와도 그대로 두지 않는다.
        aiMove = ensureLegalAIMove(aiMove, HAN);
        if (aiMove) {
          state.aiThinking = false;
          pushUndoSnapshot(); // AI 수 직전 스냅샷 (turn === HAN)
          const aiPiece = state.board[aiMove.from[1]][aiMove.from[0]];

          // Record move in UCI history for WASM engine
          const uciMove = boardToMoveStr(aiMove.from[0], aiMove.from[1], aiMove.to[0], aiMove.to[1]);
          wasmMoveHistory.push(uciMove);

          // Hide the original piece during animation (no ghost)
          state.board[aiMove.from[1]][aiMove.from[0]] = null;
          render();

          const executeAIMoveFinal = () => {
            // Restore piece at original position before makeMove (makeMove needs it)
            state.board[aiMove.from[1]][aiMove.from[0]] = aiPiece;
            // 안전망: AI 수가 왕을 잡는 모양이면(데싱크 등) 왕을 지우지 말고 즉시 종료
            if (endIfKingCapture(state.board, aiMove.to[0], aiMove.to[1], HAN)) return;
            const { board: nb, captured: cap } = makeMove(state.board, aiMove.from[0], aiMove.from[1], aiMove.to[0], aiMove.to[1]);
            if (cap) {
              state.captured[cap.team].push(cap);
              playCaptureSound();
            } else {
              playMoveSound();
            }
            state.board = nb;
            // 보드가 바뀌었으므로 이전 선택/합법수는 무효
            state.selected = null;
            state.legalMoves = [];
            state.lastMove = { from: aiMove.from, to: aiMove.to };
            state.moveHistory.push(state.lastMove);

            if (isCheckmate(state.board, CHO)) {
              state.gameOver = true;
              state.winner = HAN;
              state.recommended = [];
              playWinSound(HAN);
            } else if (checkMoveLimit()) {
              return; // 수 제한 도달 — checkMoveLimit 안에서 렌더까지 끝냈다
            } else {
              // 장군 → 음성만 재생
              if (isInCheck(state.board, CHO)) {
                playJanggunSound(HAN);
              }
              state.inCheck = null;
              state.turn = CHO;
              state.recommended = [];
            }
            render();
            if (!state.gameOver && state.showRecommend) {
              scheduleRecommend(CHO);
            }
          };

          animateMove(aiMove.from[0], aiMove.from[1], aiMove.to[0], aiMove.to[1], aiPiece.type, aiPiece.team, executeAIMoveFinal);
        } else {
          state.aiThinking = false;
          state.gameOver = true;
          state.winner = CHO;
          state.lastMoveGhost = null;
          playWinSound(CHO);
          render();
        }
      }, 50);
    }
  };

  if (state.mode === 'ai') pushUndoSnapshot(); // 내 수 직전 스냅샷 (무르기용)
  animateMove(fromC, fromR, toC, toR, piece.type, piece.team, executeMoveFinal);
}

// ============================================
// RENDERING
// ============================================
function render() {
  const app = document.getElementById('app');
  // 셀 크기는 모듈 스코프 헬퍼가 사용

  // 도전 모드: 판이 끝나면 연승 기록을 반영한다 — 내부에서 판당 1회 보장
  if (state.gameOver && state.gameMode === 'challenge' && state.mode === 'ai') recordStreak();
  // GA: 판 완결(장군/기권 등 모든 종료 경로가 render 를 거친다) — 내부에서 판당 1회 보장
  if (state.gameOver && gaRoundActive) gaRoundComplete(gaScene(), gaResult());

  // Status text
  const L = LANG[state.lang];
  applyDocLang(); // J2: documentElement.lang / document.title 을 항상 현재 언어에 맞춘다
  // 배려: 모달(로비·대기·종료)이 떠 있는 동안 반상은 탭 순서에서 빠진다.
  //       아래 overlayHtml 분기와 같은 조건이라 한쪽만 바꾸면 안 된다.
  const hasOverlay = (state.mode === 'online' && state.onlinePhase !== 'playing') || state.gameOver;
  let statusText, statusClass;
  if (state.gameOver) {
    const winnerName = state.winner === CHO ? L.cho : L.han;
    statusText = L.win(winnerName);
    statusClass = 'game-over';
  } else if (state.aiThinking) {
    statusText = `<span class="thinking">${L.aiThinking}</span>`;
    statusClass = 'han-turn';
  } else {
    const turnName = state.turn === CHO ? L.cho : L.han;
    statusText = L.turn(turnName);
    statusClass = state.turn === CHO ? 'cho-turn' : 'han-turn';
  }

  // Build recommended move lookup
  const recFromMap = {};
  const recToMap = {};
  if (state.showRecommend && state.recommended.length > 0) {
    if (!state.selected) {
      // Phase 1: 선택 전 — 추천 기물 강조
      state.recommended.forEach((rec, i) => {
        const fk = `${rec.from[0]},${rec.from[1]}`;
        if (!recFromMap[fk]) recFromMap[fk] = { rank: i + 1 };
      });
    } else {
      // Phase 2: 선택 후 — 선택된 기물의 추천 목적지에 고스트 표시
      const selKey = `${state.selected[0]},${state.selected[1]}`;
      state.recommended.forEach((rec, i) => {
        if (`${rec.from[0]},${rec.from[1]}` === selKey) {
          const tk = `${rec.to[0]},${rec.to[1]}`;
          if (!recToMap[tk]) recToMap[tk] = { rank: i + 1 };
        }
      });
    }
  }

  // Board cells
  let boardCells = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const piece = state.board[r][c];
      const isSelected = state.selected && state.selected[0] === c && state.selected[1] === r;
      const isLegal = state.legalMoves.some(([mc, mr]) => mc === c && mr === r);
      const isLastFrom = state.lastMove && state.lastMove.from[0] === c && state.lastMove.from[1] === r;
      const isLastTo = state.lastMove && state.lastMove.to[0] === c && state.lastMove.to[1] === r;
      const key = `${c},${r}`;
      const recFrom = recFromMap[key];
      const recTo = recToMap[key];

      let cellContent = '';

      // last-move 링 제거 — 기물에 직접 클래스로 표시

      // Legal move dot — 빈 칸에만, 고스트가 있는 칸은 제외
      if (state.beginnerMode && isLegal && !piece && !recTo) {
        cellContent += `<div class="move-dot"></div>`;
      }
      // capture ring 제거 — 상대 기물 위에 동그라미 표시 없음

      // Piece
      if (piece) {
        const selClass = isSelected ? ' selected' : '';
        const recClass = recFrom && !state.selected ? ' recommended' : '';
        const lastClass = isLastTo && !isSelected ? ' last-moved' : '';
        const chkClass = (state.inCheck && piece.type === TYPES.KING && piece.team === state.inCheck) ? ' in-check' : '';
        const pW = getPieceSize(piece.type);
        const pH = getPieceHeight(piece.type);
        cellContent += `<div class="piece ${piece.team}${selClass}${recClass}${lastClass}${chkClass}">${pieceMarkup(piece.team, piece.type, pW, pH)}</div>`;
      }

      // Recommended destination ghost pieces (Phase 2 - when a piece is selected)
      if (state.selected && recTo && isLegal) {
        const selectedPiece = state.board[state.selected[1]][state.selected[0]];
        const gW = getPieceSize(selectedPiece.type);
        const gH = getPieceHeight(selectedPiece.type);
        cellContent += `<div class="recommend-ghost">${pieceMarkup(selectedPiece.team, selectedPiece.type, gW, gH)}</div>`;
      }

      const lastCls = isLastFrom ? ' last-from' : (isLastTo ? ' last-to' : '');
      // 배려: 스크린리더용 라벨 = "열-행, 진영 기물" / 빈 칸은 "열-행, 빈 칸". 언어 전환 시 render 로 따라간다.
      const ariaLabel = `${c + 1}-${r + 1}, ` + (piece ? `${L.ariaSide[piece.team]} ${L.ariaPieces[piece.type]}` : L.ariaEmpty);
      // 배려: roving tabindex — 반상 전체가 90개 탭 정거장이 되면 아래 버튼들이 파묻힌다.
      //       Tab 한 번으로 반상에 들어오고, 그 안에서는 화살표로 옮긴다.
      const isKbStop = !hasOverlay && (kbFocus ? (kbFocus[0] === c && kbFocus[1] === r) : (c === 0 && r === 0));
      boardCells += `<div class="cell${lastCls}" data-col="${c}" data-row="${r}" tabindex="${isKbStop ? 0 : -1}" role="button" aria-label="${ariaLabel}"${isSelected ? ' aria-pressed="true"' : ''}>${cellContent}</div>`;
    }
  }

  // Captured pieces display — 중요도 내림차순 정렬
  const sortByValue = arr => [...arr].sort((a, b) => PIECE_VALUES[b.type] - PIECE_VALUES[a.type]);

  // ---- 온라인 대전 UI 조각 ----
  const isOnline = state.mode === 'online';
  // 도전 모드 — 가장 센 AI 를 도움 없이 상대한다(훈수·무르기 없음, 초보 모드는 남긴다)
  const isChallenge = !isOnline && state.gameMode === 'challenge';
  const O = LANG[state.lang].online;
  const flippedClass = (isOnline && state.mySide === HAN) ? ' flipped' : '';
  let onlineBar = '';
  if (isOnline && onlineConn && (state.onlinePhase === 'waiting' || state.onlinePhase === 'playing')) {
    const sideName = state.mySide === CHO ? L.cho : L.han;
    const sideCls = state.mySide === CHO ? 'cho' : 'han';
    let turnTag = '';
    if (state.onlinePhase === 'playing' && !state.gameOver) {
      const mine = state.turn === state.mySide;
      turnTag = `<span class="ot-turn ${mine ? 'mine' : 'opp'}">${mine ? O.myturn : O.oppturn}</span>`;
    }
    onlineBar = `<div class="online-bar">`
      + `<span class="ot-code" onclick="copyRoomCode()" title="${O.copy}">${O.share(onlineConn.code)} ⧉</span>`
      + `<span class="ot-side ${sideCls}">${O.side(sideName)}</span>`
      + turnTag + `</div>`;
  }
  // 도전 모드 상태 줄 — 저장돼 있는 원값 두 정수를 그때그때 문구로 만든다
  const streakBar = isChallenge
    ? `<div class="streak-bar"><span class="sk-cur">${L.streakCur(streak.cur)}</span><span class="sk-best">${L.streakBest(streak.best)}</span></div>`
    : '';

  const onlineToast = (isOnline && state.onlineMsg)
    ? `<div class="online-toast">${state.onlineMsg}</div>`
    : (state.notice ? `<div class="online-toast rule">${state.notice}</div>` : '');

  // 컨트롤 버튼 — 온라인/AI 분기
  let controlsHtml = '';
  if (isOnline) {
    if (state.onlinePhase === 'playing' || state.onlinePhase === 'waiting') {
      controlsHtml = `<div class="controls"><div class="controls-row">`
        + (state.gameOver ? `<button class="btn-start" onclick="onlineRematch()">${O.rematch}</button>` : '')
        + (!state.gameOver && state.onlinePhase === 'playing' ? `<button class="btn-stop" onclick="onlineResign()">${O.resign}</button>` : '')
        + `<button class="btn-stop" onclick="onlineLeave(false)">${O.leave}</button>`
        + `<button class="btn-toggle ${state.beginnerMode ? 'active' : ''}" onclick="toggleBeginnerMode()">${L.beginner}</button>`
        + `<button class="btn-toggle ${state.showRecommend ? 'active' : ''}" onclick="toggleRecommend()">${L.hint}</button>`
        + `<button class="btn-toggle ${state.koreanPieces ? 'active' : ''}" onclick="toggleKorean()">${L.korean}</button>`
        + `<button class="btn-toggle ${state.bgmOn ? 'active' : ''}" onclick="toggleBgm()">${L.bgm}</button>`
        + `</div></div>`;
    }
  } else {
    controlsHtml = `<div class="controls"><div class="controls-row">`
      + `<button class="btn-start" onclick="resetGame()">${L.newGame}</button>`
      + (state.gameOver ? `<button class="btn-stop" onclick="quitGame()">${L.quit}</button>` : '')
      // 도전 모드에서는 무르기·훈수 버튼을 내린다. 초보(합법수 점)는 규칙을 보여 주는 장치라 남긴다.
      + (isChallenge ? '' : `<button class="btn-toggle" onclick="undoMove()"${canUndo() ? '' : ' disabled'}>${L.undo}</button>`)
      + `<button class="btn-toggle ${state.beginnerMode ? 'active' : ''}" onclick="toggleBeginnerMode()">${L.beginner}</button>`
      + (isChallenge ? '' : `<button class="btn-toggle ${state.showRecommend ? 'active' : ''}" onclick="toggleRecommend()">${L.hint}</button>`)
      + `<button class="btn-toggle ${state.koreanPieces ? 'active' : ''}" onclick="toggleKorean()">${L.korean}</button>`
      + `<button class="btn-toggle ${state.bgmOn ? 'active' : ''}" onclick="toggleBgm()">${L.bgm}</button>`
      + `</div></div>`;
  }

  // 오버레이 — 온라인 로비/대기/만석/끊김/종료
  // 배려: 모달은 스크린리더에 dialog 로 알린다. 제목 h2#modalTitle 이 이름이 되고,
  //       restoreKbFocus 가 컨테이너(tabindex=-1)를 짚으면 제목과 본문(연승 줄)이 함께 읽힌다.
  //       한 번에 하나만 뜨므로 id 는 고정값으로 충분하다.
  const MODAL_A11Y = ' role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="modalTitle"';
  let overlayHtml = '';
  if (isOnline && state.onlinePhase === 'lobby') {
    overlayHtml = `<div class="modal-overlay"><div class="modal online-lobby"${MODAL_A11Y} onclick="event.stopPropagation()">`
      + `<h2 id="modalTitle">${O.title}</h2><p>${O.desc}</p>`
      + `<button class="btn-start" style="display:block;width:100%;margin:0 0 14px;" onclick="onlineCreate()">${O.create}</button>`
      + `<div class="lobby-join"><input id="roomCodeInput" maxlength="6" placeholder="${O.codePh}" autocomplete="off" autocapitalize="characters" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')onlineJoinFromInput()">`
      + `<button class="btn-toggle" onclick="onlineJoinFromInput()">${O.enter}</button></div>`
      + `<button onclick="onlineLeave(false)" style="background:#555;margin-top:16px;">${O.leave}</button>`
      + `</div></div>`;
  } else if (isOnline && state.onlinePhase === 'connecting') {
    overlayHtml = `<div class="modal-overlay"><div class="modal"${MODAL_A11Y} onclick="event.stopPropagation()"><h2 class="thinking" id="modalTitle">${O.connecting}</h2></div></div>`;
  } else if (isOnline && state.onlinePhase === 'waiting') {
    overlayHtml = `<div class="modal-overlay"><div class="modal"${MODAL_A11Y} onclick="event.stopPropagation()">`
      + `<h2 id="modalTitle">${O.waiting}</h2>`
      + `<div class="room-code-big" onclick="copyRoomCode()" title="${O.copy}">${onlineConn ? onlineConn.code : ''}</div>`
      + `<p>${O.hint}</p>`
      + `<button class="btn-toggle" onclick="copyRoomCode()">${O.copy}</button>`
      + `<button onclick="onlineLeave(false)" style="background:#555;margin-left:8px;">${O.leave}</button>`
      + `</div></div>`;
  } else if (isOnline && state.onlinePhase === 'full') {
    overlayHtml = `<div class="modal-overlay"><div class="modal"${MODAL_A11Y} onclick="event.stopPropagation()">`
      + `<h2 id="modalTitle">${O.full}</h2>`
      + `<button onclick="openOnlineLobby()">${O.retry}</button>`
      + `<button onclick="onlineLeave(false)" style="background:#555;margin-left:8px;">${O.leave}</button>`
      + `</div></div>`;
  } else if (isOnline && state.onlinePhase === 'lost') {
    overlayHtml = `<div class="modal-overlay"><div class="modal"${MODAL_A11Y} onclick="event.stopPropagation()">`
      + `<h2 id="modalTitle">${O.lost}</h2>`
      + `<button onclick="onlineReconnect()">${O.retry}</button>`
      + `<button onclick="onlineLeave(false)" style="background:#555;margin-left:8px;">${O.leave}</button>`
      + `</div></div>`;
  } else if (state.gameOver && isOnline) {
    const iWon = state.winner === state.mySide;
    overlayHtml = `<div class="modal-overlay"><div class="modal"${MODAL_A11Y} onclick="event.stopPropagation()">`
      + `<h2 id="modalTitle">${iWon ? O.win : O.lose}</h2>`
      + (state.onlineMsg ? `<p>${state.onlineMsg}</p>` : '')
      + gaVoteHtml()
      + `<button onclick="onlineRematch()">${O.rematch}</button>`
      + `<button onclick="onlineLeave(false)" style="background:#555;margin-left:8px;">${O.leave}</button>`
      + `</div></div>`;
  } else if (state.gameOver) {
    overlayHtml = `<div class="modal-overlay" onclick="resetGame()"><div class="modal"${MODAL_A11Y} onclick="event.stopPropagation()">`
      + `<h2 id="modalTitle">${L.win(state.winner === CHO ? L.cho : L.han)}</h2>`
      + `<p>${state.winner === CHO ? (state.mode === 'ai' ? L.winAI : L.winP(L.cho)) : (state.mode === 'ai' ? L.loseAI : L.winP(L.han))}</p>`
      + (state.byPoints ? `<p class="pt-line">${L.byPoints(MOVE_LIMIT, state.byPoints.cho, state.byPoints.han)}</p>` : '')
      + streakModalHtml(isChallenge, L)
      + gaVoteHtml()
      + `<button onclick="resetGame()">${L.retry}</button>`
      + `<button onclick="quitGame()" style="background:#555;margin-left:8px;">${L.quit}</button>`
      + `</div></div>`;
  }

  const kbSnap = captureFocus(app); // 교체 직전의 포커스 — 아래 restoreKbFocus 가 같은 자리로 되돌린다
  app.innerHTML = `
    <div class="nav-bar">
      <a href="../../index.html" class="home-btn">${L.home}</a>
      <h1 translate="no" style="font-size:20px;letter-spacing:3px;">${L.title}</h1>
      <button class="lang-btn" onclick="cycleLang()">${state.lang === 'ko' ? '🇰🇷 KO' : state.lang === 'ja' ? '🇯🇵 JP' : '🇬🇧 EN'}</button>
    </div>
    <div class="mode-tabs">
      ${['practice','match','challenge'].map(m =>
        // HIDDEN_MODES 에 든 모드만 hidden 으로 내린다 (마크업·번역은 그대로 보존)
        // 배려: 선택 상태가 .active 색으로만 전해지면 스크린리더가 세 탭을 구별하지 못한다.
        //       토글 버튼 묶음이므로 aria-pressed 로 알린다(role=tab/tablist 는 과한 구조).
        `<button class="mode-tab ${state.gameMode === m ? 'active' : ''}" aria-pressed="${state.gameMode === m}"${HIDDEN_MODES.indexOf(m) >= 0 ? ' hidden' : ''} onclick="changeGameMode('${m}')">${L.gameModes[m]}</button>`
      ).join('')}
    </div>
    ${onlineBar}
    ${streakBar}
    <div class="game-layout">
      <div class="board-stack">
        <div class="trophy-bar top han ${!state.gameOver && state.turn === HAN ? 'active' : ''}">${sortByValue(state.captured.cho).map(p => {
            const capW = getPieceSize(p.type) * 0.7;
            const capH = getPieceHeight(p.type) * 0.7;
            return `<div class="captured-piece cho">${pieceMarkup('cho', p.type, capW, capH)}</div>`;
          }).join('')}</div>
      <div class="board-container${flippedClass}">
      <svg class="board-lines" viewBox="0 0 432 480" xmlns="http://www.w3.org/2000/svg">
        ${(() => {
          let lines = '';
          const cx = c => c * 48 + 24;
          const cy = r => r * 48 + 24;
          const S = '#6B4E10';
          // Horizontal lines
          for (let r = 0; r < ROWS; r++) {
            lines += `<line x1="${cx(0)}" y1="${cy(r)}" x2="${cx(8)}" y2="${cy(r)}" stroke="${S}" stroke-width="${(r===0||r===9)?2:1.2}"/>`;
          }
          // Vertical lines — continuous top to bottom
          for (let c = 0; c < COLS; c++) {
            lines += `<line x1="${cx(c)}" y1="${cy(0)}" x2="${cx(c)}" y2="${cy(9)}" stroke="${S}" stroke-width="${(c===0||c===8)?2:1.2}"/>`;
          }
          // Palace diagonals
          lines += `<line x1="${cx(3)}" y1="${cy(0)}" x2="${cx(5)}" y2="${cy(2)}" stroke="${S}" stroke-width="1.5"/>`;
          lines += `<line x1="${cx(5)}" y1="${cy(0)}" x2="${cx(3)}" y2="${cy(2)}" stroke="${S}" stroke-width="1.5"/>`;
          lines += `<line x1="${cx(3)}" y1="${cy(7)}" x2="${cx(5)}" y2="${cy(9)}" stroke="${S}" stroke-width="1.5"/>`;
          lines += `<line x1="${cx(5)}" y1="${cy(7)}" x2="${cx(3)}" y2="${cy(9)}" stroke="${S}" stroke-width="1.5"/>`;
          return lines;
        })()}
      </svg>
      <div class="board">${boardCells}</div>
      <!-- ghost removed -->
    </div>
        <div class="trophy-bar bottom cho ${!state.gameOver && state.turn === CHO && !state.aiThinking ? 'active' : ''}">${sortByValue(state.captured.han).map(p => {
            const capW = getPieceSize(p.type) * 0.7;
            const capH = getPieceHeight(p.type) * 0.7;
            return `<div class="captured-piece han">${pieceMarkup('han', p.type, capW, capH)}</div>`;
          }).join('')}</div>
      </div>
    </div>
    ${controlsHtml}
    ${overlayHtml}
    ${onlineToast}
  `;

  restoreKbFocus(kbSnap, hasOverlay); // 배려: innerHTML 교체로 날아간 포커스를 같은 자리로 되돌린다
}

// 셀 클릭은 #app에 위임된 pointerdown 한 번만 부착해 매 렌더마다 재부착 비용 제거 + 터치 지연 제거
// 배려: 키보드 포커스 상태. render()가 innerHTML을 통째로 갈아끼우므로 직접 복원해야 한다.
let kbFocus = null;   // [col, row] — 키보드로 마지막에 짚은 칸
let kbActive = false; // 키보드로 조작 중일 때만 렌더 후 포커스를 되돌린다
function focusCell(c, r, quiet) {
  const el = document.querySelector(`.cell[data-col="${c}"][data-row="${r}"]`);
  if (!el) return;
  // roving tabindex 를 이 칸으로 옮긴다 (다음 렌더 전에 Tab 으로 돌아와도 같은 칸)
  document.querySelectorAll('.cell[tabindex="0"]').forEach(x => { if (x !== el) x.setAttribute('tabindex', '-1'); });
  el.setAttribute('tabindex', '0');
  // 복원(quiet)은 스크롤을 건드리지 않는다 — 렌더마다 화면이 튀지 않게
  try { el.focus(quiet ? { preventScroll: true } : undefined); } catch (e) { el.focus(); }
}
// 배려: render() 는 #app 을 통째로 갈아끼우므로 포커스가 매번 날아간다.
//       "키보드로 조작 중이면 무조건 반상으로" 는 틀렸다 — 그러면 AI 응수·알림 렌더마다
//       반상 밖 버튼(새 게임·무르기…)에서 포커스를 빼앗아 키보드 사용자가 버튼을 못 누른다.
//       교체 직전에 어디에 있었는지를 찍어 두고, 그 자리로만 되돌린다.
function captureFocus(app) {
  const el = document.activeElement;
  if (!el || !app || !app.contains(el)) return null;
  const cell = el.closest && el.closest('.cell');
  if (cell) return { kind: 'cell', col: +cell.dataset.col, row: +cell.dataset.row };
  const oc = el.getAttribute && el.getAttribute('onclick');
  if (oc) return { kind: 'click', oc: oc }; // 컨트롤 버튼은 인라인 onclick 문자열이 서로 다르다
  if (el.id) return { kind: 'id', id: el.id };
  return null;
}
function focusEl(el) {
  if (!el || el.disabled) return false;
  try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  return document.activeElement === el;
}
function restoreKbFocus(snap, hasOverlay) {
  if (hasOverlay) {
    // 모달이 새로 떴다 — 반상 뒤가 아니라 모달 안으로 데려간다(엔딩의 투표·다시하기가 여기 있다).
    // 컨테이너(role=dialog)를 먼저 짚어야 제목과 본문이 함께 낭독된다. 못 받으면 예전처럼 첫 버튼으로.
    if (snap) {
      if (!focusEl(document.querySelector('.modal'))) focusEl(document.querySelector('.modal button, .modal input'));
    }
    return;
  }
  if (!snap) return;
  if (snap.kind === 'cell') {
    if (!kbActive) return; // 포인터로 짚은 칸에는 포커스 링을 따라붙이지 않는다
    kbFocus = [snap.col, snap.row];
    focusCell(snap.col, snap.row, true);
    return;
  }
  if (snap.kind === 'id') { focusEl(document.getElementById(snap.id)); return; }
  const all = document.querySelectorAll('#app [onclick]');
  for (let i = 0; i < all.length; i++) {
    if (all[i].getAttribute('onclick') === snap.oc) { focusEl(all[i]); return; }
  }
}

(function attachCellDelegate() {
  const app = document.getElementById('app');
  if (!app || app.dataset.cellDelegate) return;
  app.dataset.cellDelegate = '1';
  app.addEventListener('pointerdown', (e) => {
    const cell = e.target.closest && e.target.closest('.cell');
    if (!cell) return;
    const col = parseInt(cell.dataset.col);
    const row = parseInt(cell.dataset.row);
    if (Number.isNaN(col) || Number.isNaN(row)) return;
    kbActive = false; // 포인터로 짚었으면 렌더 후 포커스를 되돌리지 않는다
    selectPiece(col, row);
  });
  // 배려: 키보드 착수 — Tab/화살표로 칸을 옮기고 Enter/Space 로 둔다. 착수는 포인터와 같은 selectPiece.
  app.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const cell = e.target.closest && e.target.closest('.cell');
    if (!cell) return;
    const col = parseInt(cell.dataset.col);
    const row = parseInt(cell.dataset.row);
    if (Number.isNaN(col) || Number.isNaN(row)) return;
    const k = e.key;
    if (k === 'Enter' || k === ' ' || k === 'Spacebar') {
      e.preventDefault();
      kbActive = true; kbFocus = [col, row];
      selectPiece(col, row);
      return;
    }
    let dc = 0, dr = 0;
    if (k === 'ArrowLeft') dc = -1;
    else if (k === 'ArrowRight') dc = 1;
    else if (k === 'ArrowUp') dr = -1;
    else if (k === 'ArrowDown') dr = 1;
    else return;
    e.preventDefault();
    // 온라인 한(漢) 시점은 반상이 180° 뒤집혀 보이므로 화살표 방향도 뒤집는다
    if (state.mode === 'online' && state.mySide === HAN) { dc = -dc; dr = -dr; }
    kbActive = true;
    kbFocus = [Math.max(0, Math.min(COLS - 1, col + dc)), Math.max(0, Math.min(ROWS - 1, row + dr))];
    focusCell(kbFocus[0], kbFocus[1]);
  });
})();

// J2: 언어 계약 — 문서 속성(lang/title)을 현재 언어에 맞춘다. render() 첫머리와 부팅에서 호출.
function applyDocLang() {

// J2: 전환한 언어를 in9-lang 에 기록한다(포탈 24종 공통 계약). 저장 실패는 무시하고 화면만 바꾼다.

// 도전에 들어가기 직전의 훈수 설정. 도전 중에는 바꿀 수 없으니 단순 저장·복원으로 충분하다.
// (온라인은 onlineLeave(false) 에서 되돌리는 것과 같은 대칭)
let hintBeforeChallenge = null;

function changeGameMode(newMode) {
  // HIDDEN_MODES 에 담긴 모드는 탭도 없고 직접 호출도 조용히 무시한다(지금은 비어 있음).
  if (HIDDEN_MODES.indexOf(newMode) >= 0) return;
  if (newMode === 'match') {
    openOnlineLobby();
    return;
  }
  const prevMode = state.gameMode;
  // practice · challenge — 온라인 연결 중이면 조용히 정리
  if (state.mode === 'online') onlineLeave(true);
  state.gameMode = newMode;
  state.mode = 'ai';
  state.onlinePhase = null;
  state.mySide = null;
  if (newMode === 'challenge') {
    // 도전: 사다리 칸(연승만큼 센 프로필) + 도움 없이. 훈수는 끄고 버튼도 내린다(무르기도 함께).
    state.difficulty = challengeDifficulty();
    if (prevMode !== 'challenge') hintBeforeChallenge = state.showRecommend; // 돌아올 때 되돌릴 값
    state.showRecommend = false;
    state.recommended = [];
  } else {
    // 도전에서 돌아왔다 — 껐던 훈수를 원래대로 (도전에 들른 적 없으면 건드리지 않는다)
    if (prevMode === 'challenge' && hintBeforeChallenge !== null) {
      state.showRecommend = hintBeforeChallenge;
      hintBeforeChallenge = null;
    }
    // Practice mode uses index 0 (강한 AI)
    state.difficulty = 0;
  }
  resetGame();
}

// 온라인 대전 (방 코드 · WebSocket)
// ============================================
const ROOM_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // 0/O/1/I/L 제외
function genRoomCode() {
  let c = '';
  for (let i = 0; i < 4; i++) c += ROOM_ALPHABET[Math.floor(Math.random() * ROOM_ALPHABET.length)];
  return c;
}
function getOrCreatePlayerId() {
  let id = localStorage.getItem('in9-janggi-pid');
  if (!id) {
    id = 'p-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    localStorage.setItem('in9-janggi-pid', id);
  }
  return id;
}
// 규칙 안내용 짧은 토스트 (온라인 메시지와 별개 — AI/2인 대전에서도 뜬다)
function flashNotice(text, ms = 2400) {
  if (!text) return;
  state.notice = text;
  render();
  if (noticeTimer) clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { state.notice = ''; render(); }, ms);
}

function flashOnlineMsg(text, ms = 2600) {
  state.onlineMsg = text;
  render();
  if (onlineMsgTimer) clearTimeout(onlineMsgTimer);
  onlineMsgTimer = setTimeout(() => { state.onlineMsg = ''; render(); }, ms);
}

// 빈 보드로 초기화 (온라인 진입/리셋 공용)
function clearOnlineBoard() {
  aiToken++; // AI 판에서 곧장 넘어와도 생각 중이던 응수가 온라인 판에 떨어지지 않는다
  state.board = createInitialBoard();
  state.turn = CHO;
  state.selected = null;
  state.legalMoves = [];
  state.captured = { cho: [], han: [] };
  state.gameOver = false;
  state.winner = null;
  state.aiThinking = false;
  state.lastMove = null;
  state.moveHistory = [];
  state.recommended = [];
  state.inCheck = null;
  state.lastMoveGhost = null;
  state.notice = '';
  state.byPoints = null;
  repeatCache = { sig: null, set: null };
  wasmMoveHistory = [];
  undoStack = [];
  gaRoundActive = false;
}

function openOnlineLobby() {
  onlineLeave(true);           // 기존 연결 정리(조용히)
  state.mode = 'online';
  state.gameMode = 'match';
  state.onlinePhase = 'lobby';
  state.mySide = null;
  state.onlineMsg = '';
  state.showRecommend = false; // 사람 상대 — 훈수 기본 off
  clearOnlineBoard();
  render();
}

function onlineCreate() { onlineConnect(genRoomCode()); }
function onlineJoinFromInput() {
  const el = document.getElementById('roomCodeInput');
  const code = ((el && el.value) || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length < 1) { if (el) el.focus(); return; }
  onlineConnect(code);
}
function onlineReconnect() {
  const code = onlineConn && onlineConn.code;
  if (!code) { openOnlineLobby(); return; }
  onlineConnect(code);
}

function onlineConnect(code) {
  const playerId = getOrCreatePlayerId();
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/api/room/${encodeURIComponent(code)}?playerId=${encodeURIComponent(playerId)}`;
  let ws;
  try { ws = new WebSocket(url); }
  catch (e) { state.onlinePhase = 'lost'; render(); return; }
  onlineConn = { ws, code, playerId, side: null, opponentConnected: false };
  state.mode = 'online';
  state.gameMode = 'match';
  state.onlinePhase = 'connecting';
  render();

  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    handleServerMsg(msg);
  };
  ws.onclose = () => {
    if (!onlineConn || onlineConn.ws !== ws) return;     // 교체/의도적 종료는 무시
    if (state.mode === 'online' && state.onlinePhase !== 'full') {
      state.onlinePhase = 'lost';
      render();
    }
  };
  ws.onerror = () => {
    if (!onlineConn || onlineConn.ws !== ws) return;
    if (state.mode === 'online' && state.onlinePhase !== 'full') {
      state.onlinePhase = 'lost';
      render();
    }
  };
}

function onlineSend(obj) {
  if (onlineConn && onlineConn.ws && onlineConn.ws.readyState === WebSocket.OPEN) {
    try { onlineConn.ws.send(JSON.stringify(obj)); } catch {}
  }
}

function handleServerMsg(msg) {
  switch (msg.type) {
    case 'welcome': {
      if (!onlineConn) return;
      onlineConn.side = msg.side;
      onlineConn.opponentConnected = !!msg.opponentConnected;
      state.mySide = msg.side === 'cho' ? CHO : HAN;
      replayOnlineMoves(msg.moves || []);
      state.onlinePhase = onlineConn.opponentConnected ? 'playing' : 'waiting';
      render();
      break;
    }
    case 'full':
      state.onlinePhase = 'full';
      render();
      break;
    case 'opponentJoined': {
      if (onlineConn) onlineConn.opponentConnected = true;
      const wasWaiting = state.onlinePhase !== 'playing';
      state.onlinePhase = 'playing';
      if (wasWaiting) flashOnlineMsg(OL().joined); else render();
      break;
    }
    case 'opponentLeft':
      if (onlineConn) onlineConn.opponentConnected = false;
      flashOnlineMsg(OL().left, 4000);
      break;
    case 'move':
      applyOpponentMove(msg.from, msg.to);
      break;
    case 'reset':
      clearOnlineBoard();
      state.onlinePhase = 'playing';
      render();
      break;
    case 'resign':
      state.gameOver = true;
      state.winner = state.mySide;
      state.onlineMsg = OL().resigned;
      playWinSound(state.mySide);
      render();
      break;
  }
}

// 서버가 보낸 전체 수 목록으로 보드 재구성 (재접속/새로고침 동기화)
function replayOnlineMoves(moves) {
  clearOnlineBoard();
  for (const mv of moves) {
    if (!mv || !mv.from || !mv.to) continue;
    const [fc, fr] = mv.from, [tc, tr] = mv.to;
    const piece = state.board[fr] && state.board[fr][fc];
    if (!piece) continue;
    const { board: nb, captured } = makeMove(state.board, fc, fr, tc, tr);
    if (captured) state.captured[captured.team].push(captured);
    state.board = nb;
    state.lastMove = { from: [fc, fr], to: [tc, tr] };
    state.moveHistory.push(state.lastMove);
    wasmMoveHistory.push(boardToMoveStr(fc, fr, tc, tr));
    state.turn = state.turn === CHO ? HAN : CHO;
  }
  if (isCheckmate(state.board, state.turn)) {
    state.gameOver = true;
    state.winner = state.turn === CHO ? HAN : CHO;
  }
}

// 상대 수 적용 (애니 + 커밋, 재전송 없음) — AI 경로 미러
function applyOpponentMove(from, to) {
  finishCurrentAnim();
  if (!from || !to) return;
  const [fc, fr] = from, [tc, tr] = to;
  const piece = state.board[fr] && state.board[fr][fc];
  if (!piece) { console.warn('[online] 상대 수가 빈 칸에서 시작 — 무시', from, to); return; }
  wasmMoveHistory.push(boardToMoveStr(fc, fr, tc, tr));
  state.board[fr][fc] = null;   // 애니 동안 원위치 기물 숨김
  render();
  const finalize = () => {
    state.board[fr][fc] = piece; // makeMove 전에 복원
    // 안전망: 상대 수가 왕을 잡는 모양이면 왕을 지우지 말고 즉시 종료(둔 쪽 승)
    if (endIfKingCapture(state.board, tc, tr, piece.team)) return;
    const { board: nb, captured } = makeMove(state.board, fc, fr, tc, tr);
    if (captured) { state.captured[captured.team].push(captured); playCaptureSound(); }
    else playMoveSound();
    state.board = nb;
    state.selected = null;
    state.legalMoves = [];
    state.lastMove = { from: [fc, fr], to: [tc, tr] };
    state.moveHistory.push(state.lastMove);
    const mover = piece.team;
    const next = mover === CHO ? HAN : CHO;
    if (isCheckmate(state.board, next)) {
      state.gameOver = true;
      state.winner = mover;
      playWinSound(mover);
    } else {
      if (isInCheck(state.board, next)) playJanggunSound(mover);
      state.inCheck = null;
      state.turn = next;
    }
    render();
    if (!state.gameOver && state.showRecommend && state.turn === state.mySide) {
      scheduleRecommend(state.turn);
    }
  };
  animateMove(fc, fr, tc, tr, piece.type, piece.team, finalize);
}

function onlineRematch() {
  onlineSend({ type: 'reset' });
  clearOnlineBoard();
  state.onlinePhase = 'playing';
  render();
}
function onlineResign() {
  if (state.gameOver) return;
  onlineSend({ type: 'resign' });
  state.gameOver = true;
  state.winner = state.mySide === CHO ? HAN : CHO;
  playWinSound(state.winner);
  render();
}

function onlineLeave(silent) {
  if (onlineMsgTimer) { clearTimeout(onlineMsgTimer); onlineMsgTimer = null; }
  if (onlineConn && onlineConn.ws) {
    const ws = onlineConn.ws;
    try { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'leave' })); } catch {}
    onlineConn = null;          // onclose 가 'lost' 처리하지 않도록 먼저 끊음
    try { ws.close(1000, 'leave'); } catch {}
  } else {
    onlineConn = null;
  }
  if (!silent) {
    state.mode = 'ai';
    state.gameMode = 'practice';
    state.onlinePhase = null;
    state.mySide = null;
    state.onlineMsg = '';
    state.showRecommend = true;
    state.difficulty = 0;
    resetGame();
  }
}

function copyRoomCode() {
  if (!onlineConn) return;
  const done = () => flashOnlineMsg(OL().copied, 1500);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(onlineConn.code).then(done).catch(done);
  } else { done(); }
}

function changeDifficulty(val) {
  state.difficulty = parseInt(val);
  state.recommended = [];
  render();
  if (state.showRecommend && !state.gameOver) scheduleRecommend(state.turn);
}

function toggleRecommend() {
  if (state.gameMode === 'challenge') return; // 도전 모드는 훈수가 없다 — 조용히 무시
  state.showRecommend = !state.showRecommend;
  state.recommended = [];
  render();
  if (state.showRecommend && !state.gameOver) scheduleRecommend(state.turn);
}

function toggleBeginnerMode() {
  state.beginnerMode = !state.beginnerMode;
  render();
}

function toggleKorean() {
  state.koreanPieces = !state.koreanPieces;
  render();
}

// ===== 무르기(undo) — AI 연습 모드 전용. 매 ply 직전 스냅샷을 쌓고, 내 차례로 되감는다 =====
function snapshotForUndo() {
  return {
    board: state.board.map(row => row.map(c => c ? { team: c.team, type: c.type } : null)),
    turn: state.turn,
    captured: { cho: state.captured.cho.map(p => ({ ...p })), han: state.captured.han.map(p => ({ ...p })) },
    lastMove: state.lastMove ? { from: [...state.lastMove.from], to: [...state.lastMove.to] } : null,
    moveHistoryLen: state.moveHistory.length,
    wasmLen: wasmMoveHistory.length,
    inCheck: state.inCheck
  };
}
function pushUndoSnapshot() {
  undoStack.push(snapshotForUndo());
  if (undoStack.length > 120) undoStack.shift();
}
function canUndo() {
  // 도전 모드는 무르기가 없다 — 버튼도 없고 undoMove() 직접 호출도 여기서 조용히 막힌다
  if (state.gameMode === 'challenge') return false;
  return state.mode === 'ai' && !state.aiThinking && undoStack.length > 0;
}
function undoMove() {
  if (!canUndo()) return;
  // GA: 끝난 판을 되감으면 다음 수가 새 판의 시작(replay)으로 잡히게 한다
  if (state.gameOver) gaRoundActive = false;
  // 내 차례(초)로 돌아갈 때까지 되감는다 — 보통 [AI 한 수 + 내 한 수] 2 ply
  let snap = undoStack.pop();
  while (undoStack.length > 0 && snap.turn !== CHO) snap = undoStack.pop();
  state.board = snap.board.map(row => row.map(c => c ? { team: c.team, type: c.type } : null));
  state.turn = snap.turn;
  state.captured = { cho: snap.captured.cho.map(p => ({ ...p })), han: snap.captured.han.map(p => ({ ...p })) };
  state.lastMove = snap.lastMove;
  state.moveHistory.length = snap.moveHistoryLen;
  wasmMoveHistory.length = snap.wasmLen;
  state.inCheck = snap.inCheck;
  state.selected = null;
  state.legalMoves = [];
  state.recommended = [];
  state.gameOver = false;
  state.winner = null;
  state.aiThinking = false;
  state.lastMoveGhost = null;
  render();
  if (state.showRecommend) scheduleRecommend(state.turn);
}

// ============================================
// 연승 기록 (도전 모드 전용)
// ============================================
// 저장은 원값 두 정수(cur·best)만. "연승 3 · 최고 5" 같은 문구는 render 에서 그때 만든다.
const STREAK_KEY = 'in9-janggi-streak';
// NaN·음수·문자열뿐 아니라 Infinity 도 막는다(1e400 같은 값이 상태줄에 그대로 찍히면 안 된다)
function saneCount(v) {
  const n = Math.floor(Number(v));
  return Number.isFinite(n) ? Math.max(0, n) : 0;
}
function loadStreak() {
  try {
    const o = JSON.parse(localStorage.getItem(STREAK_KEY));
    if (o && typeof o === 'object') {
      const cur = saneCount(o.cur);
      const best = saneCount(o.best);
      return { cur: cur, best: Math.max(best, cur) }; // best < cur 인 낡은 값도 말이 되게 올린다
    }
  } catch (e) {}
  return { cur: 0, best: 0 }; // 깨진 값·구버전·저장 불가 — 모두 여기로 떨어진다
}
function saveStreak() {
  try { localStorage.setItem(STREAK_KEY, JSON.stringify({ cur: streak.cur, best: streak.best })); } catch (e) {}
}
let streak = loadStreak();
let streakScored = false;   // 판당 1회 보장 (render 는 종료 후에도 여러 번 돈다)
let streakResult = null;    // 이번 판 표기용 파생값 — 저장하지 않는다

// 지금 연승으로 결정되는 도전 사다리 칸 → DIFFICULTIES 인덱스
function challengeLevel() {
  const n = (streak && Number.isFinite(streak.cur)) ? streak.cur : 0;
  return Math.min(Math.max(n, 0), CHALLENGE_LADDER.length - 1);
}
function challengeDifficulty() {
  return CHALLENGE_LADDER[challengeLevel()];
}

// 도전 모드에서 판이 끝났을 때만 부른다. 연습·온라인은 기록에 영향이 없다.
function recordStreak() {
  if (streakScored) return;
  streakScored = true;
  const won = state.winner === CHO;   // 초(내 편) 승리만 연승. 패·무는 끊긴다.
  const prevBest = streak.best;
  if (won) {
    streak.cur += 1;
    if (streak.cur > streak.best) streak.best = streak.cur;
  } else {
    streak.cur = 0;
  }
  // 경신 문구는 세워 둔 기록이 있을 때만 — 첫 승(최고 0→1)은 경신할 기록이 없던 판이다
  streakResult = { cur: streak.cur, best: streak.best, newBest: won && prevBest >= 1 && streak.best > prevBest };
  saveStreak();
}

// 종료 모달의 연승 한 줄 — 이번 판 기록과, 경신했으면 그 표시까지
function streakModalHtml(isChallenge, L) {
  if (!isChallenge || !streakResult) return '';
  return `<p class="streak-line">${L.streakCur(streakResult.cur)} · ${L.streakBest(streakResult.best)}`
    + (streakResult.newBest ? ` <span class="sk-new">${L.streakNew}</span>` : '')
    + `</p>`;
}

/* ---- GA4 portal standard v1 (2026-08-19) ---- */
var GA_GAME='janggi';
var gaS={started:false,completed:false,voted:false,voteShown:false,voteScene:'main',t0:0};
var gaRoundActive=false;
function gaLang(){ try{ return state.lang || 'ko'; }catch(e){ return 'ko'; } }
function gaScene(){ try{ if(state.mode==='online')return 'online'; return state.gameMode==='challenge' ? 'challenge' : 'practice'; }catch(e){ return 'main'; } }
function gaResult(){
  try{
    if(state.mode==='online') return state.winner===state.mySide ? 'clear' : 'fail';
    return state.winner===CHO ? 'clear' : 'fail';
  }catch(e){ return 'clear'; }
}
function gaSend(name,p){ try{ if(typeof gtag!=='function')return; p=p||{}; p.game_id=GA_GAME; if(!p.lang)p.lang=gaLang(); gtag('event',name,p);}catch(e){} }
function gaRoundStart(scene){
  var sc=scene||'main';
  gaS.t0=Date.now();
  /* 표준 v1: 페이지의 첫 판만 start, 그 뒤 모든 판은 replay. scene 은 그때의 gaScene() 값 그대로 둔다.
     executeMove 의 gaRoundActive 가 판당 gaRoundStart 1회를 보장하므로 판 수(start+replay)는 실제 판 수와 맞고,
     모드를 갈아탄 뒤 중도 포기해도 다음 판의 step 이 빠지지 않는다.
     completed 는 판마다 새로 여는 '이 판 완결 보고함' 래치 — 여기서만 내린다. */
  gaS.completed=false;
  if(!gaS.started){ gaS.started=true; gaSend('game_step',{step:'start',scene:sc}); return; }
  gaSend('game_step',{step:'replay',scene:sc});
}
function gaRoundComplete(scene,result,extra){
  if(gaS.completed)return; gaS.completed=true;
  var p={scene:scene||'main',result:result||'clear',play_sec:gaS.t0?Math.round((Date.now()-gaS.t0)/1000):0};
  if(extra){ for(var k in extra){ if(extra.hasOwnProperty(k))p[k]=extra[k]; } }
  gaSend('game_complete',p);
  gaVoteShow(p.scene);
}
var GA_VOTE_COPY={ko:{q:'또 할래?',yes:'응',no:'글쎄',thx:'고마워요!'},ja:{q:'また あそぶ？',yes:'うん',no:'うーん',thx:'ありがとう！'},en:{q:'Want another go?',yes:'Yes',no:'Not sure',thx:'Thanks!'}};
function gaVoteShow(scene){
  if(gaS.voted)return;
  gaS.voteScene=scene||'main'; gaS.voteShown=true;
}
/* 엔딩 오버레이는 매 render 마다 innerHTML 로 다시 그려지므로 마크업도 그때 함께 만든다 */
function gaVoteHtml(){
  if(!gaS.voteShown||gaS.voted)return '';
  var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
  return '<div class="ga-vote" id="gaVote">'
    + '<span class="ga-vote-q">'+c.q+'</span>'
    + '<button type="button" class="ga-vote-btn" data-choice="yes" onclick="gaVote(\'yes\')">'+c.yes+'</button>'
    + '<button type="button" class="ga-vote-btn" data-choice="unsure" onclick="gaVote(\'unsure\')">'+c.no+'</button>'
    + '</div>';
}
function gaVote(choice){
  if(gaS.voted)return; gaS.voted=true;
  gaSend('game_vote',{scene:gaS.voteScene,choice:choice});
  var c=GA_VOTE_COPY[gaLang()]||GA_VOTE_COPY.ko;
  var el=document.getElementById('gaVote');
  if(el){ el.classList.add('done'); var q=el.querySelector('.ga-vote-q'); if(q)q.textContent=c.thx; }
  setTimeout(function(){ var e2=document.getElementById('gaVote'); if(e2)e2.hidden=true; },1200);
}

// Initialize
state.recommended = [];
render();
if (state.showRecommend) scheduleRecommend(state.turn);
// J5: 첫 방문의 최초 로드는 아직 crossOriginIsolated 가 아니다(coi-serviceworker 가 곧 새로고침한다).
// 그 버려질 로드에서 엔진을 열면 'SharedArrayBuffer is not defined' 경고와 stockfish.js 헛짐만 남으므로
// 격리된 다음 로드에서만 연다. 격리가 끝내 안 되는 환경(SW 불가)에서는 기존대로 내장 AI 로 간다.
if (window.crossOriginIsolated) initWasmEngine();
</script>
