<title>애기바둑 이음 - Baby Baduk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚫%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#19120d;
  --panel:#2a2018;
  --panel2:#33261a;
  --line:#473627;
  --gold:#c99a3e;
  --gold-lite:#e8c168;
  --gold-bright:#f3cf5e;
  --text:#efe6d6;
  --muted:#b09a78;
  --green:#7fc98a;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Hiragino Sans',sans-serif;
  background:
    radial-gradient(ellipse 120% 90% at 50% -10%, #33241556 0%, transparent 55%),
    radial-gradient(ellipse 100% 80% at 50% 108%, #241a1066 0%, transparent 60%),
    repeating-linear-gradient(91deg, rgba(74,52,28,.085) 0px, rgba(74,52,28,.085) 2px, transparent 2px, transparent 8px),
    repeating-linear-gradient(89deg, rgba(16,11,7,.15) 0px, rgba(16,11,7,.15) 1px, transparent 1px, transparent 13px),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  min-height:100%;
  display:flex;justify-content:center;align-items:flex-start;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overscroll-behavior:none;
}
#app{
  width:100%;max-width:480px;
  padding:12px 14px 26px;
  display:flex;flex-direction:column;align-items:center;gap:13px;
}
/* ---------- top bar ---------- */
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.tb-right{display:flex;gap:7px;}
.chip{
  background:linear-gradient(180deg,#33261a,#241a12);
  color:var(--muted);
  border:1px solid var(--line);
  padding:7px 12px;border-radius:10px;
  font-size:12.5px;font-weight:600;letter-spacing:.3px;
  cursor:pointer;text-decoration:none;line-height:1;
  display:inline-flex;align-items:center;gap:5px;
  transition:background .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease),transform .12s var(--ease);
  box-shadow:0 2px 5px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);
}
.chip:hover{background:linear-gradient(180deg,#42311e,#2b2014);border-color:var(--gold);color:var(--text);}
.chip:active{transform:translateY(1px) scale(.97);}
.chip.off{opacity:.45;}
/* ---------- header ---------- */
header{text-align:center;margin-top:2px;}
h1{
  font-family:'Nanum Myeongjo','AppleMyungjo','Hiragino Mincho ProN','Batang',serif;
  font-size:29px;font-weight:700;letter-spacing:2.5px;
  color:var(--gold-lite);
  text-shadow:0 1px 1px rgba(0,0,0,.5), 0 0 22px rgba(201,154,62,.22);
  display:inline-flex;align-items:center;gap:13px;white-space:nowrap;
}
h1::before,h1::after{content:"";width:24px;height:1px;flex:none;background:linear-gradient(90deg,transparent,var(--gold) 85%);}
h1::after{background:linear-gradient(90deg,var(--gold) 15%,transparent);}
.subtitle{margin-top:6px;font-size:11.5px;letter-spacing:2.6px;color:#8d7a5c;text-transform:uppercase;}
/* ---------- scoreboard ---------- */
.scoreboard{
  width:100%;display:flex;align-items:stretch;gap:9px;
}
.score-card{
  flex:1;position:relative;
  background:linear-gradient(180deg,#2e2318,#211810);
  border:1px solid var(--line);border-radius:14px;
  padding:9px 11px;
  display:flex;flex-direction:column;gap:7px;
  box-shadow:0 3px 10px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.04);
  transition:border-color .35s var(--ease),box-shadow .35s var(--ease),transform .35s var(--ease);
}
.score-card.active{border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,154,62,.35),0 5px 16px rgba(201,154,62,.16), inset 0 1px 0 rgba(255,255,255,.06);transform:translateY(-2px);}
.sc-head{display:flex;align-items:center;gap:7px;}
.sc-stone{width:19px;height:19px;border-radius:50%;flex:none;}
.sc-stone.b{background:radial-gradient(circle at 33% 28%, #7b7b83 0%, #2c2c31 42%, #08080a 100%);box-shadow:0 1px 3px rgba(0,0,0,.6), inset 0 -1px 2px rgba(255,255,255,.06);}
.sc-stone.w{background:radial-gradient(circle at 33% 28%, #ffffff 0%, #f0ebe0 40%, #bdb3a1 100%);box-shadow:0 1px 3px rgba(0,0,0,.5);}
.sc-name{font-size:12.5px;font-weight:700;color:var(--text);letter-spacing:.4px;}
.sc-label{font-size:10px;color:#8d7a5c;letter-spacing:.6px;margin-left:auto;}
.pips{display:flex;gap:6px;}
.pip{
  flex:1;height:9px;border-radius:5px;
  background:#1a130d;border:1px solid #3d2e1e;
  position:relative;overflow:hidden;
  transition:border-color .3s var(--ease);
}
.pip::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,var(--gold-bright),#b07f25);
  transform:scaleX(0);transform-origin:left;
  transition:transform .45s var(--ease);
}
.pip.on{border-color:var(--gold);}
.pip.on::after{transform:scaleX(1);}
.pip.on{box-shadow:0 0 9px rgba(243,207,94,.35);}
/* ---------- board ---------- */
#boardWrap{
  width:100%;display:flex;justify-content:center;position:relative;
}
canvas{
  touch-action:none;display:block;
  border-radius:16px;
  box-shadow:0 14px 34px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.05), 0 0 0 1px rgba(90,64,32,.9);
  cursor:pointer;
}
/* ---------- status ---------- */
.status{
  width:100%;min-height:42px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:14px;font-weight:600;letter-spacing:.2px;
  padding:10px 14px;border-radius:12px;
  background:linear-gradient(180deg,#2b2018,#221810);
  border:1px solid var(--line);
  text-align:center;
  transition:color .3s var(--ease),border-color .3s var(--ease);
}
.status.you{color:var(--gold-bright);border-color:rgba(201,154,62,.45);}
.status.ai{color:#9fb8c9;border-color:rgba(120,150,175,.28);}
.status.warn{color:#e8916b;border-color:rgba(232,145,107,.4);}
.status.done{color:var(--green);border-color:rgba(127,201,138,.4);}
.dots{display:inline-flex;gap:3px;}
.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.35;animation:blip 1.15s infinite;}
.dots i:nth-child(2){animation-delay:.16s}
.dots i:nth-child(3){animation-delay:.32s}
@keyframes blip{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
/* ---------- controls ---------- */
.controls{width:100%;display:flex;gap:9px;}
.btn{
  flex:1;
  background:linear-gradient(180deg,#33261a,#241a12);
  color:var(--text);border:1px solid var(--line);
  padding:12px 10px;border-radius:12px;
  font-size:13.5px;font-weight:700;letter-spacing:.4px;
  cursor:pointer;font-family:inherit;
  transition:background .25s var(--ease),border-color .25s var(--ease),transform .12s var(--ease),opacity .25s;
  box-shadow:0 3px 9px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.05);
}
.btn:hover:not(:disabled){background:linear-gradient(180deg,#453320,#2c2014);border-color:var(--gold);}
.btn:active:not(:disabled){transform:translateY(1px) scale(.985);}
.btn:disabled{opacity:.33;cursor:default;}
.btn.gold{
  background:linear-gradient(180deg,#dcae4a,#ab7d27);
  color:#241a0d;border-color:#e8c168;text-shadow:0 1px 0 rgba(255,255,255,.24);
}
.btn.gold:hover{background:linear-gradient(180deg,#ecbe58,#bb8a2d);border-color:#f3cf5e;}
.hint{font-size:11.5px;color:#7f6f56;letter-spacing:.5px;text-align:center;line-height:1.6;}
/* ---------- overlays ---------- */
.overlay{
  position:fixed;inset:0;z-index:50;
  display:none;align-items:center;justify-content:center;
  padding:20px;
  background:radial-gradient(ellipse at 50% 40%, rgba(38,27,16,.78), rgba(10,7,4,.93));
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
}
.overlay.show{display:flex;animation:fadeIn .3s var(--ease);}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{
  width:100%;max-width:352px;
  background:linear-gradient(180deg,#302418,#1e160f);
  border:1px solid var(--gold);border-radius:20px;
  padding:24px 22px 20px;text-align:center;
  box-shadow:0 22px 60px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.07);
  animation:pop .42s var(--ease);
}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.card h2{
  font-family:'Nanum Myeongjo','AppleMyungjo','Hiragino Mincho ProN',serif;
  font-size:23px;letter-spacing:1.4px;color:var(--gold-bright);margin-bottom:8px;
}
.card p{font-size:13.5px;color:#c9b797;line-height:1.75;}
.card .lead{font-size:14.5px;color:var(--text);margin-bottom:4px;}
.tut-art{
  margin:14px auto 12px;width:100%;max-width:250px;
  border-radius:14px;overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}
.tut-art svg{display:block;width:100%;height:auto;}
.tut-dots{display:flex;justify-content:center;gap:7px;margin:14px 0 16px;}
.tut-dots span{width:7px;height:7px;border-radius:50%;background:#4a3823;transition:all .3s var(--ease);}
.tut-dots span.on{background:var(--gold-bright);width:19px;box-shadow:0 0 8px rgba(243,207,94,.5);}
.card-btns{display:flex;gap:9px;margin-top:16px;}
.link-btn{
  background:none;border:none;color:#8d7a5c;font-size:12px;font-family:inherit;
  cursor:pointer;padding:9px;margin-top:2px;letter-spacing:.4px;
  transition:color .25s var(--ease);
}
.link-btn:hover{color:var(--gold-lite);}
.result-stones{display:flex;justify-content:center;gap:9px;margin-bottom:12px;}
.result-stones .rs{
  width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 33% 28%, #7b7b83 0%, #2c2c31 42%, #08080a 100%);
  box-shadow:0 3px 7px rgba(0,0,0,.55);
  animation:drop .5s var(--ease) backwards;
}
.result-stones .rs.w{background:radial-gradient(circle at 33% 28%, #fff 0%, #f0ebe0 40%, #bdb3a1 100%);}
.result-stones .rs:nth-child(2){animation-delay:.09s}
.result-stones .rs:nth-child(3){animation-delay:.18s}
@keyframes drop{from{opacity:0;transform:translateY(-16px) scale(.5)}to{opacity:1;transform:none}}
/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);
  background:rgba(46,34,21,.97);color:var(--gold-lite);
  border:1px solid var(--gold);border-radius:11px;
  padding:10px 17px;font-size:12.5px;font-weight:600;letter-spacing:.3px;
  opacity:0;pointer-events:none;z-index:60;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
  transition:opacity .3s var(--ease),transform .3s var(--ease);
  max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0);}
@media (max-width:380px){
  h1{font-size:25px;letter-spacing:1.6px;}
  h1::before,h1::after{width:16px;}
  #app{padding:10px 11px 22px;gap:11px;}
  .sc-label{display:none;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}
/* ---------- GA vote row ---------- */
.ga-vote{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 2px;font-size:14px;line-height:1.2;opacity:.92;color:#c9b797;}
.ga-vote[hidden]{display:none}
.ga-vote .ga-vote-btn{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.85;-webkit-tap-highlight-color:transparent}
.ga-vote .ga-vote-btn:active{opacity:1}
.ga-vote.done .ga-vote-btn{display:none}
</style>

<script>
/*==RULES_START==*/
/* ------------------------------------------------------------------
   순수 규칙 엔진 (DOM 의존 없음) — node 유닛 테스트 대상
   board: Uint8Array(36), 0=빈점 1=흑 2=백
------------------------------------------------------------------- */
var BN = 6;
function IDX(x, y) { return y * BN + x; }
function XOF(i) { return i % BN; }
function YOF(i) { return (i / BN) | 0; }

var NEI = (function () {
  var a = [];
  for (var y = 0; y < BN; y++) {
    for (var x = 0; x < BN; x++) {
      var l = [];
      if (x > 0) l.push(IDX(x - 1, y));
      if (x < BN - 1) l.push(IDX(x + 1, y));
      if (y > 0) l.push(IDX(x, y - 1));
      if (y < BN - 1) l.push(IDX(x, y + 1));
      a[IDX(x, y)] = l;
    }
  }
  return a;
})();

function newBoard() { return new Uint8Array(BN * BN); }

/* 연결군 flood fill: 같은 색으로 이어진 돌 전체 + 활로(빈 이웃점) */
function groupAt(board, start) {
  var color = board[start];
  var stones = [], libs = [];
  if (color === 0) return { color: 0, stones: stones, libs: libs };
  var seen = new Uint8Array(BN * BN), libSeen = new Uint8Array(BN * BN);
  var stack = [start];
  seen[start] = 1;
  while (stack.length) {
    var p = stack.pop();
    stones.push(p);
    var ns = NEI[p];
    for (var k = 0; k < ns.length; k++) {
      var q = ns[k];
      if (board[q] === 0) {
        if (!libSeen[q]) { libSeen[q] = 1; libs.push(q); }
      } else if (board[q] === color && !seen[q]) {
        seen[q] = 1; stack.push(q);
      }
    }
  }
  return { color: color, stones: stones, libs: libs };
}

/* 착수 시도. ko = 이번 차례에 금지된 점(없으면 -1)
   반환 ok:true → { board(신규), captured[], ko(다음 차례 금지점) } */
function tryMove(board, i, color, ko) {
  if (i < 0 || i >= BN * BN) return { ok: false, reason: 'range' };
  if (board[i] !== 0) return { ok: false, reason: 'occupied' };
  if (ko === i) return { ok: false, reason: 'ko' };
  var nb = new Uint8Array(board);
  nb[i] = color;
  var opp = 3 - color;
  var captured = [];
  var ns = NEI[i];
  for (var k = 0; k < ns.length; k++) {
    var q = ns[k];
    if (nb[q] === opp) {
      var g = groupAt(nb, q);
      if (g.libs.length === 0) {
        for (var m = 0; m < g.stones.length; m++) {
          if (nb[g.stones[m]] !== 0) { nb[g.stones[m]] = 0; captured.push(g.stones[m]); }
        }
      }
    }
  }
  var mine = groupAt(nb, i);
  if (mine.libs.length === 0) return { ok: false, reason: 'suicide' };
  /* 단수패(simple ko): 딱 한 점 따냈고 내 돌도 홀로 활로 1개 → 되따기 금지 */
  var nko = -1;
  if (captured.length === 1 && mine.stones.length === 1 && mine.libs.length === 1) nko = captured[0];
  return { ok: true, board: nb, captured: captured, ko: nko };
}

function legalMoves(board, color, ko) {
  var out = [];
  for (var i = 0; i < BN * BN; i++) {
    if (board[i] !== 0) continue;
    var r = tryMove(board, i, color, ko);
    if (r.ok) out.push({ i: i, res: r });
  }
  return out;
}

/* 정적 평가 (me 관점) */
function staticEval(board, me, myCap, oppCap) {
  var opp = 3 - me;
  var s = (myCap - oppCap) * 1200;
  if (myCap >= 3) return 900000;
  if (oppCap >= 3) return -900000;
  var seen = new Uint8Array(BN * BN);
  for (var i = 0; i < BN * BN; i++) {
    if (board[i] === 0 || seen[i]) continue;
    var g = groupAt(board, i);
    for (var m = 0; m < g.stones.length; m++) seen[g.stones[m]] = 1;
    var libs = g.libs.length, n = g.stones.length;
    if (g.color === me) {
      s += Math.min(libs, 4) * 7;
      if (libs === 1) s -= 60 * n;
      else if (libs === 2) s -= 11 * n;
    } else {
      s -= Math.min(libs, 4) * 7;
      if (libs === 1) s += 54 * n;
      else if (libs === 2) s += 10 * n;
    }
  }
  /* 중앙 선호 */
  for (var j = 0; j < BN * BN; j++) {
    if (board[j] === 0) continue;
    var c = 2.5 - (Math.abs(XOF(j) - 2.5) + Math.abs(YOF(j) - 2.5)) / 2;
    s += (board[j] === me ? 1 : -1) * c * 3.4;
  }
  return s;
}

/* 후보수 평가 + 2수 앞보기 + 랜덤성(temp) */
function aiChoose(board, me, ko, myCap, oppCap, temp, rnd) {
  rnd = rnd || Math.random;
  var moves = legalMoves(board, me, ko);
  if (!moves.length) return null;
  var opp = 3 - me;
  var best = null, bestScore = -Infinity;
  for (var a = 0; a < moves.length; a++) {
    var mv = moves[a];
    var cap1 = myCap + mv.res.captured.length;
    var score;
    if (cap1 >= 3) {
      score = 900000;
    } else {
      var rep = legalMoves(mv.res.board, opp, mv.res.ko);
      if (!rep.length) {

      ctx.beginPath();
      ctx.arc(cx, cy, RAD * 1.22, 0, 6.284);
      ctx.strokeStyle = 'rgba(255,214,102,0.85)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.lineDashOffset = -(now / 55) % 8;
      ctx.stroke();
      ctx.setLineDash([]);
      /* 따낼 돌 예고 */
      for (var k = 0; k < pr.captured.length; k++) {
        var ci = pr.captured[k];
        ctx.beginPath();
        ctx.arc(px(XOF(ci)), px(YOF(ci)), RAD * 1.16, 0, 6.284);
        ctx.strokeStyle = 'rgba(255,120,80,0.9)';
        ctx.lineWidth = 2.4;
        ctx.stroke();
      }
    } else {
      ctx.beginPath();
      ctx.arc(cx, cy, RAD * 0.78, 0, 6.284);
      ctx.strokeStyle = 'rgba(210,70,50,0.85)';
      ctx.lineWidth = 2.6;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - RAD * 0.42, cy - RAD * 0.42);
      ctx.lineTo(cx + RAD * 0.42, cy + RAD * 0.42);
      ctx.moveTo(cx + RAD * 0.42, cy - RAD * 0.42);
      ctx.lineTo(cx - RAD * 0.42, cy + RAD * 0.42);
      ctx.stroke();
    }
    ctx.restore();
  }
}

var rafId = null;
function loop(now) {
  anims = anims.filter(function (a) { return now - a.t0 < a.dur; });
  parts = parts.filter(function (p) { return now - p.t0 < p.dur; });
  render(now);
  rafId = requestAnimationFrame(loop);
}

function burst(i, color) {
  if (reduceMotion) return;
  var cx = px(XOF(i)), cy = px(YOF(i));
  var n = 9;
  for (var k = 0; k < n; k++) {
    var ang = (k / n) * 6.284 + Math.random() * 0.5;
    parts.push({
      x: cx, y: cy,
      vx: Math.cos(ang) * (0.6 + Math.random() * 0.7),
      vy: Math.sin(ang) * (0.6 + Math.random() * 0.7) - 0.4,
      r: 2 + Math.random() * 2.6,
      c: color === 1 ? 'rgba(255,222,150,0.95)' : 'rgba(255,246,220,0.95)',
      t0: performance.now(), dur: 620 + Math.random() * 260
    });
  }
}

function snapshot() {
  return {
    board: new Uint8Array(S.board), ko: S.ko,

    last: S.last, passes: S.passes

}
function restore(sn) {
  S.board = new Uint8Array(sn.board);
  S.ko = sn.ko; S.capHuman = sn.capHuman; S.capAi = sn.capAi;
  S.last = sn.last; S.passes = sn.passes;
}

function cancelAi() {
  if (S.aiTimer) { clearTimeout(S.aiTimer); S.aiTimer = 0; }
}

function newGame() {
  cancelAi();
  S.board = newBoard();
  S.turn = HUMAN; S.ko = -1;
  S.capHuman = 0; S.capAi = 0;
  S.last = -1; S.over = false; S.passes = 0;
  S.undoLeft = 1; S.snap = null; S.busy = false;

  gaRoundActive = false;

function setStatus(key, cls, repl) {
  var el = document.getElementById('status');
  var txt = T(key);
  if (repl) { for (var k in repl) txt = txt.replace('{' + k + '}', repl[k]); }
  el.className = 'status ' + (cls || '');
  el.textContent = txt;
  if (key === 'turnAi') {
    var d = document.createElement('span');
    d.className = 'dots';
    d.innerHTML = '<i></i><i></i><i></i>';
    el.appendChild(d);
  }
  el.dataset.key = key;
  el.dataset.cls = cls || '';
  el.dataset.repl = repl ? JSON.stringify(repl) : '';
}

function toast(key, repl) {
  var el = document.getElementById('toast');
  var txt = T(key);
  if (repl) { for (var k in repl) txt = txt.replace('{' + k + '}', repl[k]); }
  el.textContent = txt;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.remove('show'); }, 1900);
}

function syncUI() {
  buildPips('pipsYou', S.capHuman);
  buildPips('pipsAi', S.capAi);
  document.getElementById('cardYou').classList.toggle('active', !S.over && S.turn === HUMAN);
  document.getElementById('cardAi').classList.toggle('active', !S.over && S.turn === AI);
  var ub = document.getElementById('undoBtn');
  ub.textContent = T('undo') + ' (' + S.undoLeft + ')';
  ub.disabled = !(S.undoLeft > 0 && S.snap && !S.over && S.turn === HUMAN && !S.busy);
}
function buildPips(id, n) {
  var el = document.getElementById(id);
  if (el.children.length !== 3) {
    el.innerHTML = '';
    for (var i = 0; i < 3; i++) { var s = document.createElement('span'); s.className = 'pip'; el.appendChild(s); }
  }
  for (var j = 0; j < 3; j++) el.children[j].classList.toggle('on', j < n);
}

function applyMove(i, color) {
  var r = tryMove(S.board, i, color, S.ko);
  if (!r.ok) return r;
  S.board = r.board;
  S.ko = r.ko;
  S.last = i;
  S.passes = 0;
  anims.push({ kind: 'place', i: i, t0: performance.now(), dur: reduceMotion ? 1 : 220 });
  sndPlace(color === AI);
  if (r.captured.length) {
    var oppColor = 3 - color;
    for (var k = 0; k < r.captured.length; k++) {
      anims.push({ kind: 'cap', i: r.captured[k], color: oppColor, t0: performance.now() + 60, dur: reduceMotion ? 1 : 420 });
      burst(r.captured[k], oppColor);
    }
    if (color === HUMAN) S.capHuman += r.captured.length; else S.capAi += r.captured.length;
    setTimeout(function () { sndCapture(r.captured.length); }, 70);
  }
  return r;
}

function checkEnd() {
  if (S.capHuman >= 3) { finish('win'); return true; }
  if (S.capAi >= 3) { finish('lose'); return true; }
  if (S.passes >= 2) { finish('draw'); return true; }
  return false;
}

function humanPlay(i) {
  if (S.over || S.busy || S.turn !== HUMAN) return;
  var probe = tryMove(S.board, i, HUMAN, S.ko);
  if (!probe.ok) {
    sndDeny();
    if (probe.reason === 'ko') toast('errKo');
    else if (probe.reason === 'suicide') toast('errSuicide');
    else if (probe.reason === 'occupied') toast('errOccupied');
    return;
  }
  if (!gaRoundActive) { gaRoundActive = true; gaRoundStart('main'); }
  S.snap = snapshot();
  var r = applyMove(i, HUMAN);
  preview = -1;
  if (r.captured.length) {
    toast(r.captured.length === 1 ? 'captured1' : 'capturedN', { n: r.captured.length });
  }
  if (checkEnd()) { syncUI(); return; }
  S.turn = AI;
  setStatus('turnAi', 'ai');
  syncUI();
  scheduleAi();
}

function scheduleAi() {
  cancelAi();
  S.busy = true;
  var delay = 420 + Math.random() * 340;
  S.aiTimer = setTimeout(function () {
    S.aiTimer = 0;
    /* 새 판 등으로 상황이 바뀌었으면 이 콜백은 무효 */
    if (S.over || S.turn !== AI) { S.busy = false; return; }
    var mv = aiChoose(S.board, AI, S.ko, S.capAi, S.capHuman, 72);
    if (!mv) {
      S.passes++;
      S.ko = -1;
      toast('aiPass');
      if (checkEnd()) { S.busy = false; syncUI(); return; }
      S.turn = HUMAN;
      S.busy = false;
      afterAi();
      return;
    }
    var before = S.capAi;
    applyMove(mv.i, AI);
    var gained = S.capAi - before;
    if (gained > 0) toast('lostStones', { n: gained });
    if (checkEnd()) { S.busy = false; syncUI(); return; }
    S.turn = HUMAN;
    S.busy = false;
    afterAi();
  }, delay);
}

function afterAi() {
  /* 사람이 둘 곳이 아예 없으면 자동 패스 */
  if (legalMoves(S.board, HUMAN, S.ko).length === 0) {
    S.passes++;
    S.ko = -1;
    toast('youPass');
    if (checkEnd()) { syncUI(); return; }
    S.turn = AI;
    setStatus('turnAi', 'ai');
    syncUI();
    scheduleAi();
    return;
  }
  setStatus('turnYou', 'you');
  syncUI();
}

function finish(kind) {
  cancelAi();
  S.over = true;
  S.busy = false;
  syncUI();
  var L = LANG[lang];
  setStatus(kind === 'win' ? 'winTitle' : kind === 'lose' ? 'loseTitle' : 'drawTitle', 'done');
  if (kind === 'win') sndWin(); else if (kind === 'lose') sndLose(); else sndTap();
  var stonesEl = document.getElementById('resStones');
  stonesEl.innerHTML = '';
  var n = kind === 'win' ? S.capHuman : kind === 'lose' ? S.capAi : 2;
  for (var i = 0; i < Math.min(3, Math.max(1, n)); i++) {
    var d = document.createElement('div');
    d.className = 'rs' + (kind === 'lose' ? ' w' : '');
    stonesEl.appendChild(d);
  }
  document.getElementById('resTitle').textContent = L[kind === 'win' ? 'winTitle' : kind === 'lose' ? 'loseTitle' : 'drawTitle'];
  document.getElementById('resBody').textContent = L[kind === 'win' ? 'winBody' : kind === 'lose' ? 'loseBody' : 'drawBody'];
  document.getElementById('resAgain').textContent = L.again;
  document.getElementById('resNew').textContent = L.resNew;
  document.getElementById('resHome').textContent = L.resHome;
  S._endKind = kind;
  gaRoundComplete('main', kind === 'win' ? 'clear' : kind === 'lose' ? 'fail' : 'draw', { caps_you: S.capHuman, caps_ai: S.capAi });
  setTimeout(function () { document.getElementById('resOverlay').classList.add('show'); }, 780);
}

function doUndo() {
  if (!(S.undoLeft > 0 && S.snap && !S.over && S.turn === HUMAN && !S.busy)) {
    if (S.undoLeft <= 0) { sndDeny(); toast('undoNone'); }
    return;
  }
  restore(S.snap);
  S.snap = null;
  S.undoLeft = 0;
  S.turn = HUMAN;
  anims = []; parts = []; preview = -1;
  sndTap();
  toast('undoDone');
  setStatus('turnYou', 'you');
  syncUI();
}

function pointToIdx(ev) {
  var rect = cv.getBoundingClientRect();
  var mx = (ev.clientX - rect.left) * (SZ / rect.width);
  var my = (ev.clientY - rect.top) * (SZ / rect.height);
  var gx = Math.round((mx - PAD) / CELL);
  var gy = Math.round((my - PAD) / CELL);
  if (gx < 0 || gy < 0 || gx >= BN || gy >= BN) return -1;
  var dx = mx - px(gx), dy = my - px(gy);
  if (Math.sqrt(dx * dx + dy * dy) > CELL * 0.82) return -1;
  return IDX(gx, gy);
}
cv.addEventListener('pointerdown', function (e) {
  ac();
  if (S.over || S.busy || S.turn !== HUMAN) return;
  pointerDown = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  preview = pointToIdx(e);
  e.preventDefault();
}, { passive: false });
cv.addEventListener('pointermove', function (e) {
  if (!pointerDown) {
    if (e.pointerType === 'mouse' && !S.over && !S.busy && S.turn === HUMAN) preview = pointToIdx(e);
    return;
  }
  preview = pointToIdx(e);
  e.preventDefault();
}, { passive: false });
cv.addEventListener('pointerup', function (e) {
  if (!pointerDown) return;
  pointerDown = false;
  var i = pointToIdx(e);
  preview = -1;
  if (i >= 0) humanPlay(i);
  e.preventDefault();
}, { passive: false });
cv.addEventListener('pointercancel', function () { pointerDown = false; preview = -1; });
cv.addEventListener('pointerleave', function () { if (!pointerDown) preview = -1; });
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

var tutPage = 0;
function tutSvg(page) {
  var wood = '<defs><linearGradient id="wg" x1="0" y1="0" x2="0.6" y2="1">' +
    '<stop offset="0" stop-color="#eec97a"/><stop offset="0.5" stop-color="#dcae4a"/><stop offset="1" stop-color="#c8952a"/></linearGradient>' +
    '<radialGradient id="bs" cx="0.34" cy="0.3" r="0.78"><stop offset="0" stop-color="#8b8b95"/><stop offset="0.35" stop-color="#3a3a42"/><stop offset="1" stop-color="#08080a"/></radialGradient>' +
    '<radialGradient id="ws" cx="0.34" cy="0.3" r="0.78"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#f2ede2"/><stop offset="1" stop-color="#b7ac98"/></radialGradient></defs>';
  var frame = '<rect x="0" y="0" width="220" height="160" rx="12" fill="url(#wg)"/>';
  var grid = '';
  var gx = [55, 110, 165], gy = [40, 80, 120];
  for (var i = 0; i < 3; i++) {
    grid += '<line x1="55" y1="' + gy[i] + '" x2="165" y2="' + gy[i] + '" stroke="#4a3010" stroke-width="1.6" stroke-linecap="round"/>';
    grid += '<line x1="' + gx[i] + '" y1="40" x2="' + gx[i] + '" y2="120" stroke="#4a3010" stroke-width="1.6" stroke-linecap="round"/>';
  }
  function stone(cx, cy, w, r, op) {
    return '<ellipse cx="' + (cx + 2) + '" cy="' + (cy + 3) + '" rx="' + (r || 17) + '" ry="' + ((r || 17) * 0.92) + '" fill="rgba(70,44,12,0.3)"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r || 17) + '" fill="url(#' + (w ? 'ws' : 'bs') + ')" opacity="' + (op === undefined ? 1 : op) + '"/>' +
      '<ellipse cx="' + (cx - 5) + '" cy="' + (cy - 6) + '" rx="5.5" ry="3.4" fill="rgba(255,255,255,' + (w ? 0.8 : 0.26) + ')" opacity="' + (op === undefined ? 1 : op) + '" transform="rotate(-28 ' + (cx - 5) + ' ' + (cy - 6) + ')"/>';
  }
  var body = '';
  if (page === 0) {
    body = stone(110, 80, false);
    var libs = [[55, 80], [165, 80], [110, 40], [110, 120]];
    for (var l = 0; l < libs.length; l++) {
      body += '<circle cx="' + libs[l][0] + '" cy="' + libs[l][1] + '" r="9" fill="none" stroke="#3fbf78" stroke-width="3" stroke-dasharray="4 3.4"/>';
      body += '<circle cx="' + libs[l][0] + '" cy="' + libs[l][1] + '" r="3.2" fill="#3fbf78" opacity="0.55"/>';
    }
    body += '<text x="110" y="150" text-anchor="middle" font-size="12" fill="#5a3a12" font-weight="700">' + T('tutCap0') + '</text>';
  } else if (page === 1) {
    body += stone(55, 80, true) + stone(165, 80, true) + stone(110, 40, true);
    body += stone(110, 80, false, 17, 0.34);
    body += '<circle cx="110" cy="80" r="20" fill="none" stroke="#e0603c" stroke-width="2.6" stroke-dasharray="5 4"/>';
    body += stone(110, 120, true);
    body += '<circle cx="110" cy="120" r="23" fill="none" stroke="#f3cf5e" stroke-width="3"/>';
    body += '<text x="110" y="150" text-anchor="middle" font-size="12" fill="#5a3a12" font-weight="700">' + T('tutCap1') + '</text>';
  } else {
    body += '<rect x="34" y="52" width="152" height="56" rx="16" fill="rgba(60,38,12,0.16)"/>';
    body += stone(74, 80, false, 16) + stone(110, 80, false, 16) + stone(146, 80, false, 16);
    body += '<text x="110" y="36" text-anchor="middle" font-size="22">🏆</text>';
    body += '<text x="110" y="134" text-anchor="middle" font-size="14" fill="#5a3a12" font-weight="800">3</text>';
  }
  return '<svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg">' + wood + frame + grid + body + '</svg>';
}
